# cicd / secrets-management
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: cicd-secrets-management-001
  domain: cicd
  subtopic: secrets-management
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему секреты хранят в хранилище платформы, а не в переменных workflow?
  answer: |
    Переменные видны всем, кто читает репозиторий, и попадают в логи. Секреты
    хранятся зашифрованными, доступны только запускам и **маскируются** в выводе.
  explanation: |
    Маскирование не абсолютно: оно заменяет точное совпадение строки, поэтому
    секрет, преобразованный в base64 или разбитый на части, в логе окажется
    открытым. Отсюда правило — не полагаться на маскирование как на защиту,
    а не печатать секреты вовсе.
  ref: "https://docs.github.com/actions/security-guides/using-secrets-in-github-actions"

- id: cicd-secrets-management-002
  domain: cicd
  subtopic: secrets-management
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему секреты недоступны сборке из форка?
  answer: |
    Потому что автор pull request может изменить сам workflow и вывести секрет
    в лог. Платформа отдаёт форкам урезанные права и не передаёт секреты —
    иначе любой посторонний получал бы доступ к ключам проекта.
  explanation: |
    Это объясняет, почему часть проверок для внешних вкладов приходится строить
    иначе: без публикации артефактов и без доступа к окружениям. Попытки обойти
    ограничение через `pull_request_target` и checkout чужого кода — известный
    способ отдать секреты добровольно.
  ref: "https://docs.github.com/actions/security-guides/using-secrets-in-github-actions"

- id: cicd-secrets-management-003
  domain: cicd
  subtopic: secrets-management
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Чем OIDC лучше статического ключа облака в секретах?
  answer: |
    Ключа нет вовсе: запуск получает короткоживущий токен, который облако меняет
    на временные права. Нечего ротировать, нечему утекать надолго, и доступ
    можно ограничить конкретной веткой или окружением.
  explanation: |
    Долгоживущий ключ плох не тем, что может утечь, а тем, что утечка бессрочна
    и незаметна: он работает, пока его не отозвали, а отзыв ломает конвейер.
    OIDC переносит доверие с секрета на **факт запуска в известном контексте** —
    та же идея, что токен ServiceAccount вместо пароля в Kubernetes.
  ref: "https://docs.github.com/actions/deployment/security-hardening-your-deployments/about-security-hardening-with-openid-connect"

- id: cicd-secrets-management-004
  domain: cicd
  subtopic: secrets-management
  difficulty: middle
  source: core
  type: mcq
  verified: false
  prompt: |
    Секрет случайно попал в лог сборки. Достаточно ли удалить запуск?
  options:
    a: "Нет: секрет надо считать скомпрометированным и ротировать"
    b: "Да, удаление запуска стирает все следы"
    c: "Достаточно включить маскирование и перезапустить сборку"
    d: "Достаточно сделать репозиторий приватным"
  answer: a
  explanation: |
    Лог мог быть прочитан, выгружен в систему хранения логов, попасть в уведомление
    или в кеш браузера — контроль над копиями утрачен в момент публикации.
    Это тот же вывод, что с секретом в истории git: удаление источника не отменяет
    распространение, поэтому единственная надёжная реакция — смена значения.
  ref: "https://docs.github.com/actions/security-guides/using-secrets-in-github-actions"

- id: cicd-secrets-management-005
  domain: cicd
  subtopic: secrets-management
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Как ограничить, какие workflow видят прод-секреты?
  answer: |
    Секретами окружения: они доступны только job'у, который объявил это окружение,
    а само окружение защищено правилами — одобрение, разрешённые ветки. Сборка
    и тесты их не видят.
  explanation: |
    Разделение по уровням — репозиторий, окружение, организация — это применение
    наименьших привилегий к конвейеру: большинство job'ов не должны иметь ничего,
    кроме права читать код. Секрет уровня репозитория, наоборот, доступен любому
    workflow в нём, включая тот, который завтра добавит кто-то другой.
  ref: "https://docs.github.com/actions/deployment/targeting-different-environments"

- id: cicd-secrets-management-006
  domain: cicd
  subtopic: secrets-management
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем конвейеру внешний менеджер секретов, если платформа их уже хранит?
  answer: |
    Ради общего источника для всех потребителей, ротации и аудита: кто и когда читал
    значение. Хранилище платформы умеет только хранить и отдавать — истории доступа
    и автоматической смены значений там нет.
  explanation: |
    Второй аргумент — единственность: один и тот же пароль базы нужен конвейеру,
    кластеру и людям, и три копии в трёх местах расходятся при первой же ротации.
    Плата — внешний менеджер становится зависимостью запуска: он недоступен,
    и выкат невозможен, поэтому его доступность приходится обеспечивать всерьёз.
  ref: "https://docs.github.com/actions/security-guides/using-secrets-in-github-actions"

- id: cicd-secrets-management-007
  domain: cicd
  subtopic: secrets-management
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Как поймать секрет до того, как он попадёт в репозиторий?
  answer: |
    Сканером секретов на трёх рубежах: локальный хук перед коммитом, проверка
    в конвейере на pull request и сканирование самой платформой по всей истории.
  explanation: |
    Три рубежа нужны, потому что каждый пропускает своё: хук легко обойти,
    проверка pull request не видит того, что уже слито, а платформенное
    сканирование срабатывает постфактум. И ни один не отменяет ротации:
    обнаружение означает, что секрет уже был записан на диск.
  ref: "https://docs.github.com/code-security/secret-scanning/about-secret-scanning"

- id: cicd-secrets-management-008
  domain: cicd
  subtopic: secrets-management
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему секреты не стоит передавать в аргументах командной строки?
  answer: |
    Аргументы видны в списке процессов на машине и часто попадают в отладочный вывод
    конвейера. Передавать надо переменной окружения или файлом с ограниченными
    правами.
  explanation: |
    На одноразовом раннере риск меньше, но не нулевой: в job'е могут выполняться
    сторонние действия, читающие окружение и процессы. Тот же принцип действует
    в Ansible (`no_log`) и в Docker (`--build-arg` остаётся в истории образа):
    секрет опасен ровно там, где он проходит через наблюдаемый интерфейс.
  ref: "https://docs.github.com/actions/security-guides/using-secrets-in-github-actions"

- id: cicd-secrets-management-009
  domain: cicd
  subtopic: secrets-management
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Можно ли посмотреть значение секрета после сохранения?
  answer: |
    Нет: платформа хранит его зашифрованным и позволяет только перезаписать.
    Прочитать значение обратно нельзя ни через интерфейс, ни через API.
  explanation: |
    Из этого следует практическое требование — иметь источник правды снаружи:
    если единственная копия пароля лежит в секретах конвейера, восстановить её
    некому. Именно поэтому секреты платформы разумно считать **кешем** значения
    из менеджера секретов, а не местом его хранения.
  ref: "https://docs.github.com/actions/security-guides/using-secrets-in-github-actions"

- id: cicd-secrets-management-010
  domain: cicd
  subtopic: secrets-management
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Стороннее действие в workflow имеет доступ к секретам?
  answer: |
    К тем, что явно переданы ему через `with` или доступны в окружении job.
    Но исполняется оно с теми же правами, что и весь job, — включая токен
    и файловую систему раннера.
  explanation: |
    Отсюда серьёзность выбора зависимостей конвейера: чужое действие — это чужой
    код, выполняющийся рядом с секретами. Меры те же, что в цепочке поставок
    вообще: пиннинг по SHA, минимальные права job'а и передача секретов только
    тем шагам, которым они нужны, а не всему job целиком.
  ref: "https://docs.github.com/actions/security-guides/security-hardening-for-github-actions"
