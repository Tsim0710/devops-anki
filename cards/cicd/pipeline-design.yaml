- id: cicd-pipeline-design-001
  domain: cicd
  subtopic: pipeline-design
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем CI отличается от CD?
  answer: |
    CI — непрерывная интеграция: собрать, проверить, получить артефакт из каждого
    изменения. CD — доставка этого артефакта в окружения. Граница проходит
    по артефакту: до него CI, после него CD.
  explanation: |
    Разделение практично, потому что задаёт правило: **артефакт собирается один раз**
    и дальше только переезжает по окружениям. Пересборка перед продом означает,
    что в прод едет не то, что тестировали, — пусть даже из того же коммита:
    зависимости и базовый образ успели измениться.
  ref: "https://docs.github.com/actions/deployment/about-deployments"

- id: cicd-pipeline-design-002
  domain: cicd
  subtopic: pipeline-design
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    В каком порядке ставят проверки в конвейере и почему?
  answer: |
    От быстрых и дешёвых к медленным: линтеры и формат, юнит-тесты, сборка,
    интеграционные тесты, сканеры, деплой в стенд. Ранний отказ экономит время
    и раннеры.
  explanation: |
    Критерий — не важность, а **отношение времени к вероятности отказа**: опечатка
    в YAML ловится за секунды, и нет смысла узнавать о ней после десятиминутной
    сборки. Обратная сторона — при параллельных job'ах порядок теряется, поэтому
    самые дешёвые проверки часто оставляют в одном быстром job впереди всех.
  ref: "https://docs.github.com/actions/using-workflows/about-workflows"

- id: cicd-pipeline-design-003
  domain: cicd
  subtopic: pipeline-design
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Почему собранный артефакт не пересобирают для каждого окружения?
  answer: |
    Потому что тогда в прод едет **другой** артефакт, чем проверяли на стенде:
    изменились зависимости, базовый образ, версия компилятора. Один артефакт
    проходит все окружения, а различия задаются конфигурацией.
  explanation: |
    Отсюда практическое требование к образу: он не должен содержать ничего,
    специфичного для окружения, — адреса и секреты приходят при запуске.
    Проверяемое следствие — если в конвейере есть отдельная сборка «для прода»,
    контур неверен, и тестирование ничего не гарантирует.
  ref: "https://docs.github.com/actions/deployment/about-deployments"

- id: cicd-pipeline-design-004
  domain: cicd
  subtopic: pipeline-design
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое trunk-based development и как он влияет на конвейер?
  answer: |
    Работа короткими ветками, вливаемыми в основную по нескольку раз в день,
    вместо долгоживущих веток. Конвейер при этом обязан быть быстрым: он запускается
    на каждое слияние.
  explanation: |
    Связь двусторонняя: медленный конвейер вынуждает копить изменения в ветке,
    а долгие ветки дают тяжёлые слияния и редкие, страшные выкаты. Отсюда
    и практический ориентир — время от коммита до готового артефакта в пределах
    десяти минут; всё, что дольше, начинает менять поведение команды.
  ref: "https://docs.github.com/actions/using-workflows/about-workflows"

- id: cicd-pipeline-design-005
  domain: cicd
  subtopic: pipeline-design
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое flaky-тест и почему его нельзя просто перезапускать?
  answer: |
    Тест, который падает случайным образом при неизменном коде. Автоматический
    повтор прячет проблему: команда перестаёт верить красной сборке
    и начинает перезапускать всё подряд, включая настоящие поломки.
  explanation: |
    Цена не в самом тесте, а в подорванном доверии: конвейер ценен ровно настолько,
    насколько его вердикт считают истиной. Поэтому нестабильные тесты помечают
    и чинят или временно исключают явно — так их видно, в отличие от повтора,
    который делает проблему невидимой.
  ref: "https://docs.github.com/actions/automating-builds-and-tests/about-continuous-integration"

- id: cicd-pipeline-design-006
  domain: cicd
  subtopic: pipeline-design
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Как связать версию артефакта с исходным кодом?
  answer: |
    Тегом и метками, содержащими коммит: образ помечается SHA коммита, а метки
    `org.opencontainers.image.revision` и `source` кладутся в сам образ. По
    работающему контейнеру восстанавливается, из чего он собран.
  explanation: |
    Без этой связи разбор инцидента упирается в вопрос «какой код сейчас в проде»,
    на который нет ответа: тег вроде `v1.2` неоднозначен, если его пересобирали.
    Отсюда практика — неизменяемые теги по коммиту как основной идентификатор,
    а человекочитаемая версия как дополнительная метка.
  ref: "https://github.com/opencontainers/image-spec/blob/main/annotations.md"

- id: cicd-pipeline-design-007
  domain: cicd
  subtopic: pipeline-design
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое монорепозиторий с точки зрения конвейера и в чём главная сложность?
  answer: |
    Один репозиторий на несколько сервисов. Сложность — определить, **что именно
    пересобирать**: наивный запуск всего при каждом коммите быстро становится
    неподъёмным.
  explanation: |
    Простое решение — фильтры по путям, но оно ломается на общих библиотеках:
    правка общего кода обязана пересобрать всех потребителей, а фильтр этого
    не знает. Отсюда и появление систем сборки с графом зависимостей, которые
    вычисляют затронутое множество, — их берут, когда фильтры перестают
    справляться, а не сразу.
  ref: "https://docs.github.com/actions/using-workflows/triggering-a-workflow"

- id: cicd-pipeline-design-008
  domain: cicd
  subtopic: pipeline-design
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Кто должен применять изменения в прод: конвейер или агент внутри кластера?
  answer: |
    Оба варианта рабочие, но различаются моделью доступа. Push из конвейера требует
    хранить в нём права на прод. Pull-агент внутри кластера сам ходит в репозиторий,
    и наружу права не выдаются вовсе.
  explanation: |
    Второй вариант заодно даёт непрерывную сверку: ручное изменение в кластере
    будет замечено и откачено, чего push-модель не умеет в принципе — она применяет
    разово. Плата — ещё один компонент в кластере и менее очевидная связь
    «нажал кнопку — увидел результат».
  ref: "https://docs.github.com/actions/deployment/about-deployments"

- id: cicd-pipeline-design-009
  domain: cicd
  subtopic: pipeline-design
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Конвейер стал занимать сорок минут. С чего начинать оптимизацию?
  answer: |
    С измерения: какой шаг сколько занимает. Дальше по частоте выигрыша — кеш
    зависимостей, распараллеливание независимых job'ов, отказ от пересборки
    неизменившегося, и только потом более мощные раннеры.
  explanation: |
    Порядок важен, потому что интуиция обычно указывает на «медленное железо»,
    а реальность чаще в последовательном графе и скачивании зависимостей заново.
    Мощные раннеры стоят денег и не помогают, если критический путь — ожидание
    внешнего сервиса или последовательность из пяти job'ов по восемь минут.
  ref: "https://docs.github.com/actions/using-workflows/caching-dependencies-to-speed-up-workflows"

- id: cicd-pipeline-design-010
  domain: cicd
  subtopic: pipeline-design
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужны обязательные проверки на ветке, если конвейер и так запускается?
  answer: |
    Запуск конвейера сам по себе ничего не запрещает: слить можно и с красной
    сборкой. Защита ветки делает успешные проверки **условием** слияния
    и заодно требует ревью.
  explanation: |
    Это разница между информированием и контролем. Практическая тонкость: в список
    обязательных попадают конкретные job'ы по имени, и переименование job'а
    молча выводит его из-под требования — проверка идёт, но слиянию больше
    не мешает. Такие вещи ловятся только периодической ревизией настроек.
  ref: "https://docs.github.com/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches"

- id: cicd-pipeline-design-011
  domain: cicd
  subtopic: pipeline-design
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что должно происходить при падении конвейера на основной ветке?
  answer: |
    Починка становится приоритетом: пока сборка красная, никто не может уверенно
    сливать и выкатывать. Либо чинят причину, либо откатывают вызвавшее изменение.
  explanation: |
    Терпимость к красной основной ветке разрушает конвейер как инструмент: если
    красный цвет — норма, он перестаёт что-либо означать, и настоящую поломку
    не замечают. Откат при этом честнее долгой починки: он возвращает всем
    рабочее состояние, а разбираться можно в своей ветке.
  ref: "https://docs.github.com/actions/automating-builds-and-tests/about-continuous-integration"

- id: cicd-pipeline-design-012
  domain: cicd
  subtopic: pipeline-design
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему конвейер, который сам себя проверяет, ненадёжен?
  answer: |
    Изменение в конвейере проверяется тем же изменённым конвейером: сломанная
    или ослабленная проверка не сможет пожаловаться на себя. Отсюда и практика
    защищать файлы конвейера отдельными правилами.
  explanation: |
    Практическое проявление — pull request, удаляющий шаг сканирования, проходит
    все проверки, потому что их больше нет. Защита строится снаружи: обязательное
    ревью от отдельной группы на изменения в `.github/`, политики уровня
    организации и проверка того, что обязательные job'ы на месте.
  ref: "https://docs.github.com/actions/security-guides/security-hardening-for-github-actions"
