- id: cicd-testing-in-ci-001
  domain: cicd
  subtopic: testing-in-ci
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Какие уровни тестов обычно запускают в конвейере и в каком порядке?
  answer: |
    Юнит-тесты (быстрые, без внешних зависимостей), интеграционные (с базой
    и соседними сервисами), затем end-to-end на развёрнутом стенде. Порядок —
    от быстрых к медленным.
  explanation: |
    Пропорция важнее набора: много быстрых тестов и мало медленных. Обратная
    пирамида — сотни end-to-end при десятке юнитов — даёт конвейер, который идёт
    час и падает по случайным причинам, из-за чего его вердикту перестают верить.
  ref: "https://docs.github.com/actions/automating-builds-and-tests/about-continuous-integration"

- id: cicd-testing-in-ci-002
  domain: cicd
  subtopic: testing-in-ci
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Как поднять базу для интеграционных тестов в конвейере?
  answer: |
    Сервисным контейнером: платформа поднимает рядом с job'ом контейнер с базой,
    доступный по сети. Либо контейнеры поднимает сам тест через соответствующую
    библиотеку.
  explanation: |
    Ключевое — база одноразовая и своя у каждого запуска: общий стенд для тестов
    даёт гонки между параллельными сборками и накопленное состояние, из-за которого
    тесты проходят или падают в зависимости от порядка. Плата — время на старт,
    которое сглаживают ожиданием готовности вместо фиксированной паузы.
  ref: "https://docs.github.com/actions/using-containerized-services/about-service-containers"

- id: cicd-testing-in-ci-003
  domain: cicd
  subtopic: testing-in-ci
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужен порог покрытия и почему сам по себе он мало что значит?
  answer: |
    Порог не даёт покрытию падать при новых изменениях. Но высокая цифра
    не означает качества: тесты могут выполнять код, ничего не проверяя.
  explanation: |
    Полезнее не абсолютное значение, а покрытие **изменённых** строк в pull request:
    оно отвечает на нужный вопрос — проверил ли автор то, что написал. Жёсткий
    общий порог, наоборот, порождает тесты ради процента: длинные, хрупкие
    и без утверждений.
  ref: "https://docs.github.com/actions/automating-builds-and-tests/about-continuous-integration"

- id: cicd-testing-in-ci-004
  domain: cicd
  subtopic: testing-in-ci
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Тесты проходят локально и падают в конвейере. Типовые причины?
  answer: |
    Разница окружения: другая версия языка или библиотек, отсутствие переменных,
    иная временная зона и локаль, другой порядок выполнения при параллельности,
    зависимость от файлов, не попавших в репозиторий.
  explanation: |
    Общее у всех причин — **неявная зависимость от локальной машины**, и конвейер
    честно её обнаруживает. Отсюда ценность чистого одноразового окружения:
    оно ловит то, что на рабочем ноутбуке маскируется годами накопленной настройкой.
    Быстрый способ проверить — запустить тесты локально в контейнере.
  ref: "https://docs.github.com/actions/automating-builds-and-tests/about-continuous-integration"

- id: cicd-testing-in-ci-005
  domain: cicd
  subtopic: testing-in-ci
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое сканирование зависимостей и чем оно отличается от сканирования образа?
  answer: |
    Сканирование зависимостей смотрит на файлы манифестов проекта: библиотеки
    и их версии. Сканирование образа — на всё, что внутри, включая пакеты базового
    слоя и системные библиотеки.
  explanation: |
    Слои разные, и одно не заменяет другое: уязвимость может быть и в твоей
    библиотеке, и в системном пакете базового образа, к которому проект отношения
    не имеет. Отсюда практика — оба сканера в конвейере плюс регулярная пересборка,
    потому что база стареет сама по себе.
  ref: "https://docs.github.com/code-security/supply-chain-security"

- id: cicd-testing-in-ci-006
  domain: cicd
  subtopic: testing-in-ci
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Как не превратить сканеры безопасности в шум, который все игнорируют?
  answer: |
    Ломать сборку только на том, что действительно применимо: высокая критичность,
    есть исправление, компонент реально используется. Остальное — в отчёт,
    а исключения оформлять явно с обоснованием и сроком.
  explanation: |
    Сканер, роняющий сборку на уязвимости без патча в неиспользуемой библиотеке,
    обучает команду одному — добавлять исключения не глядя. Это тот же механизм,
    что усталость от ложных алертов: инструмент теряет ценность не когда молчит,
    а когда кричит слишком часто.
  ref: "https://docs.github.com/code-security/supply-chain-security"

- id: cicd-testing-in-ci-007
  domain: cicd
  subtopic: testing-in-ci
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Как тестировать инфраструктурный код в конвейере?
  answer: |
    Статически — форматирование, валидация, линтеры и политики по плану Terraform.
    Динамически — применение на одноразовом окружении с проверкой результата
    и обязательным уничтожением после.
  explanation: |
    Ограничение статических проверок то же, что у `validate`: они не видят
    столкновения с существующим состоянием. Поэтому главной проверкой остаётся
    план на реальном окружении и его ревью. Динамическое тестирование дорого
    и потому оправдано для общих модулей, а не для каждой правки.
  ref: "https://developer.hashicorp.com/terraform/language/tests"

- id: cicd-testing-in-ci-008
  domain: cicd
  subtopic: testing-in-ci
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Тесты в конвейере иногда падают на таймауте, а при перезапуске проходят.
    Как подходить к разбору?
  answer: |
    Считать это дефектом, а не помехой: искать общий признак — параллельность,
    ожидание внешнего сервиса, фиксированные паузы, зависимость от порядка.
    Перезапуск как решение маскирует проблему.
  explanation: |
    Практический ход — собрать статистику падений по тестам, а не разбирать
    по одному: нестабильность обычно концентрируется в единицах тестов, и они же
    дают основной шум. Пока их не починили, честнее пометить их явно, чем
    перезапускать всю сборку: так видно масштаб проблемы.
  ref: "https://docs.github.com/actions/automating-builds-and-tests/about-continuous-integration"
