# id вечен: он же GUID заметки в Anki.

- id: cicd-jenkins-001
  domain: cicd
  subtopic: jenkins
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое Jenkinsfile и чем declarative pipeline отличается от scripted?
  answer: |
    Описание конвейера кодом в репозитории. Declarative — структурированный формат
    с фиксированными секциями и валидацией. Scripted — фактически программа
    на Groovy с полной свободой.
  explanation: |
    Свобода scripted оборачивается тем, что конвейер становится программой,
    которую нужно поддерживать и отлаживать. Declarative появился именно как ответ
    на это: меньше возможностей, зато читаемость и проверка синтаксиса до запуска.
    Историческая альтернатива обоим — настройка кликами в интерфейсе,
    которая не версионируется вовсе.
  ref: "https://www.jenkins.io/doc/book/pipeline/syntax/"

- id: cicd-jenkins-002
  domain: cicd
  subtopic: jenkins
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Как устроены агенты в Jenkins и почему их не запускают на мастере?
  answer: |
    Мастер оркестрирует, агенты выполняют сборки. Запуск сборок на мастере опасен:
    произвольный код из репозитория получает доступ к конфигурации Jenkins,
    его учётным данным и всем job'ам.
  explanation: |
    Это тот же аргумент, что против self-hosted раннера на публичном репозитории,
    только последствия хуже: компрометация мастера означает компрометацию всей
    системы сборки. Отсюда типовая современная схема — динамические агенты
    в Kubernetes, поднимаемые под каждую сборку и уничтожаемые после.
  ref: "https://www.jenkins.io/doc/book/security/controller-isolation/"

- id: cicd-jenkins-003
  domain: cicd
  subtopic: jenkins
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему Jenkins часто становится «снежинкой» и что с этим делают?
  answer: |
    Потому что состояние копится вне репозитория: плагины, глобальные настройки,
    учётные данные, job'ы, созданные руками. Воспроизвести такой сервер с нуля
    невозможно. Лечится описанием конфигурации кодом и созданием job'ов из репозитория.
  explanation: |
    Симптом узнаваемый — обновлять страшно, потому что неизвестно, что сломается,
    и никто не знает, зачем стоит половина плагинов. Это общий закон: система,
    состояние которой не описано, со временем становится незаменяемой,
    и разница с современными конвейерами именно в том, что там конфигурация
    по построению лежит в репозитории.
  ref: "https://www.jenkins.io/projects/jcasc/"
