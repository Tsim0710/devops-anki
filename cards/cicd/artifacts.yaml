# cicd / artifacts
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: cicd-artifacts-001
  domain: cicd
  subtopic: artifacts
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем артефакт отличается от кеша?
  answer: |
    Артефакт — **результат** сборки: он нужен дальше по конвейеру или человеку,
    и его отсутствие это ошибка. Кеш — ускорение: его промах означает лишь
    более долгий запуск.
  explanation: |
    Из разного смысла следует разное поведение при сбое и разные политики хранения:
    артефакт релиза хранят долго и не меняют, кеш можно чистить в любой момент.
    Смешение приводит к неприятному классу багов, когда сборка «работает»
    только потому, что нужный файл случайно остался в кеше.
  ref: "https://docs.github.com/actions/using-workflows/storing-workflow-data-as-artifacts"

- id: cicd-artifacts-002
  domain: cicd
  subtopic: artifacts
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что считается артефактом в контейнерном мире?
  answer: |
    Образ в реестре, а не файл в хранилище конвейера. Реестр — это и хранилище,
    и способ доставки: кластер тянет образ оттуда напрямую.
  explanation: |
    Отсюда смещение практик: политики хранения, сканирование и подписи применяются
    к реестру, а не к артефактам сборки. И отсюда же требование к идентификатору —
    неизменяемый тег или digest, иначе «тот же артефакт» в разных окружениях
    может оказаться разным содержимым.
  ref: "https://docs.docker.com/registry/"

- id: cicd-artifacts-003
  domain: cicd
  subtopic: artifacts
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем конвейеру политика хранения артефактов?
  answer: |
    Хранилище конечно и платно, а число сборок растёт линейно со временем.
    Без политики репозиторий образов и хранилище артефактов разрастаются,
    пока не упрутся в квоту или счёт.
  explanation: |
    Тонкость в том, что удалять можно не всё: образы, на которые ссылаются
    работающие поды и возможные откаты, обязаны остаться. Отсюда практика —
    хранить по возрасту с запасом на глубину отката и отдельно защищать
    релизные теги, а не чистить по общему правилу.
  ref: "https://docs.docker.com/registry/garbage-collection/"

- id: cicd-artifacts-004
  domain: cicd
  subtopic: artifacts
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что должно попадать в артефакты сборки, кроме самого бинарника или образа?
  answer: |
    Отчёты о тестах и покрытии, результаты сканирования, SBOM, логи сборки.
    Всё, что понадобится для разбора, когда сборка уже завершилась.
  explanation: |
    Ключевое ограничение — их надо выгружать шагом с условием «выполнять всегда»,
    иначе падение тестов уносит с собой и отчёт о том, что именно упало. Это тот же
    приём, что `always` в Ansible и `trap` в скриптах: уборка и сбор диагностики
    не должны зависеть от успешного пути.
  ref: "https://docs.github.com/actions/using-workflows/storing-workflow-data-as-artifacts"

- id: cicd-artifacts-005
  domain: cicd
  subtopic: artifacts
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Почему артефакты не стоит делать доступными на запись всем job'ам?
  answer: |
    Потому что артефакт — это доказательство: то, что проверено, должно попасть
    в прод неизменным. Возможность перезаписать его после проверки разрывает
    связь между проверкой и тем, что выкатывается.
  explanation: |
    Тот же принцип, что неизменяемые теги образов: идентификатор обязан однозначно
    определять содержимое. Практическое следствие — публикация в реестр делается
    из ограниченного job'а с отдельными правами, а не любым шагом, которому
    случайно достался токен с записью.
  ref: "https://docs.github.com/actions/security-guides/security-hardening-for-github-actions"

- id: cicd-artifacts-006
  domain: cicd
  subtopic: artifacts
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое SBOM и зачем он в конвейере?
  answer: |
    Список компонентов артефакта: библиотеки, версии, лицензии. Генерируется
    при сборке и хранится рядом с образом. Отвечает на вопрос «из чего это собрано».
  explanation: |
    Ценность проявляется при новой уязвимости: с SBOM ответ «какие наши образы
    содержат уязвимую библиотеку» — это запрос, а без него — перебор всех образов
    заново. Сканирование при сборке отвечает на другой вопрос — что было известно
    **на момент проверки**, и через месяц этот ответ устаревает.
  ref: "https://docs.docker.com/build/attestations/sbom/"

- id: cicd-artifacts-007
  domain: cicd
  subtopic: artifacts
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что даёт подпись артефакта и где её проверяют?
  answer: |
    Доказательство, что артефакт собран твоим конвейером и не подменён. Проверяют
    на входе в кластер — admission-политикой, отклоняющей неподписанные образы.
  explanation: |
    Без проверки на входе подпись остаётся украшением: подписать можно что угодно,
    смысл появляется, когда неподписанное не запускается. Именно поэтому подпись
    и политика идут парой, а сама проверка ставится в кластере, а не в конвейере —
    иначе её обходит любой, кто применит манифест мимо конвейера.
  ref: "https://kubernetes.io/docs/concepts/security/supply-chain-security/"

- id: cicd-artifacts-008
  domain: cicd
  subtopic: artifacts
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Как связать артефакт с породившей его сборкой?
  answer: |
    Метками и провенансом: в образ кладут коммит, номер запуска и ссылку
    на конвейер (`org.opencontainers.image.revision`, `source`). По контейнеру
    в проде восстанавливается вся цепочка до кода.
  explanation: |
    Это то, чего не хватает в инциденте чаще всего: контейнер работает, а откуда
    он взялся — неизвестно, потому что тег переписывали. Провенанс в современном
    виде идёт дальше меток: это подписанное утверждение о том, кто, когда
    и из чего собрал артефакт, проверяемое автоматически.
  ref: "https://docs.docker.com/build/attestations/slsa-provenance/"
