# СИД-карты: нужны, чтобы проверить пайплайн end-to-end, а не чтобы наполнить колоду.
# 4 basic + 2 mcq, разложены по junior/middle/senior.
# Все многострочные поля — через | (literal). > склеивает строки и ломает отступы в коде.

- id: k8s-probes-001
  domain: k8s
  subtopic: probes
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что происходит с подом, когда его `readinessProbe` начинает падать?
  answer: |
    Под **исключается из endpoints** своего Service — трафик на него больше не идёт.
    Контейнер при этом **не перезапускается** и продолжает работать.
  explanation: |
    `readinessProbe` отвечает на вопрос «можно ли давать этому поду трафик», а не
    «жив ли он». Поэтому актор здесь — endpoints-контроллер, а не kubelet: он убирает
    адрес пода из `EndpointSlice`, и `kube-proxy` перестаёт балансировать на него.
    Разделение нужно ровно для того, чтобы под мог временно отказаться от трафика
    (прогрев кеша, переподключение к БД) и не быть за это убитым.
  ref: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"

- id: k8s-probes-002
  domain: k8s
  subtopic: probes
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем нужен `startupProbe`, если уже есть `initialDelaySeconds` у liveness?
  answer: |
    `startupProbe` **глушит liveness и readiness до своего первого успеха** — приложению
    даётся столько времени на старт, сколько нужно, без ослабления liveness после старта.
  explanation: |
    `initialDelaySeconds` — это одна фиксированная задержка, и её приходится подбирать под
    худший случай старта. Тогда упавшее в рантайме приложение будет висеть мёртвым ровно
    столько же. `startupProbe` разводит эти два режима: `failureThreshold × periodSeconds`
    задаёт щедрый бюджет **только на старт**, а после успеха включается обычный liveness
    с коротким периодом.
  ref: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"

- id: k8s-probes-003
  domain: k8s
  subtopic: probes
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    `livenessProbe` провалилась `failureThreshold` раз подряд. Что делает kubelet и
    меняется ли при этом IP пода?
  answer: |
    Kubelet **убивает контейнер** и перезапускает его по `restartPolicy` прямо на том же
    узле; растёт `restartCount`, повторные падения уходят в `CrashLoopBackOff`.
    **IP пода не меняется** — пересоздаётся контейнер, а не под.
  explanation: |
    Актор здесь kubelet, а не scheduler: перепланирования не происходит, `spec.nodeName`
    остаётся прежним, sandbox (pause-контейнер) с сетевым namespace живёт дальше — отсюда
    и сохранение IP. Отсюда же типичная ошибка на собесе: «под перезапустился» и «под
    пересоздался» — разные события. Первое видно в `restartCount`, второе — в смене имени
    пода и его IP.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"

- id: k8s-probes-004
  domain: k8s
  subtopic: probes
  difficulty: middle
  source: interview
  type: mcq
  verified: false
  prompt: |
    Приложение отдаёт `200` на `/healthz` (liveness) и `503` на `/ready` (readiness).
    Что произойдёт с подом?
  options:
    a: "Контейнер перезапустится, трафик продолжит идти"
    b: "Контейнер продолжит работать, но трафик на него идти перестанет"
    c: "Под будет вытеснен с узла и перепланирован на другой"
    d: "Под перейдёт в `CrashLoopBackOff`"
  answer: b
  explanation: |
    Liveness отвечает «жив», значит kubelet контейнер не трогает. Readiness отвечает «не
    готов», значит endpoints-контроллер убирает под из `EndpointSlice`. Это ровно та пара
    сигналов, которую путают чаще всего: liveness управляет **жизнью контейнера**,
    readiness — **потоком трафика**, и они независимы. Вытеснение с узла (c) — это вообще
    другой механизм (taints/eviction), пробы его не вызывают.
  ref: "Вопрос с собеса: «чем liveness отличается от readiness, если оба HTTP-пробы»"

- id: k8s-probes-005
  domain: k8s
  subtopic: probes
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему проверять доступность внешней БД внутри `readinessProbe` — плохая идея?
  answer: |
    Потому что при недоступности БД **все реплики разом** выпадают из endpoints, Service
    остаётся без бэкендов, и сервис отдаёт `503` даже на те запросы, которым БД не нужна.
    Локальная деградация превращается в полный отказ.
  explanation: |
    Readiness — это утверждение пода о **себе**, а не о мире вокруг. Проверка общей
    зависимости делает пробу коррелированной: один общий сбой снимает с балансировки
    сразу весь Deployment, и вдобавок закрывает путь к health-эндпоинтам, по которым
    диагностируют инцидент. Вдобавок так теряется деградация: часть ручек могла бы
    продолжать работать. Правильный контур — readiness проверяет только собственную
    готовность процесса, а недоступность БД отражается в метриках и алертах.
  ref: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"

- id: k8s-probes-006
  domain: k8s
  subtopic: probes
  difficulty: senior
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Приложение прогревается 90 секунд. Заданы только:

    ```yaml
    livenessProbe:
      httpGet: { path: /healthz, port: 8080 }
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3
    ```

    Что произойдёт при первом запуске пода?
  options:
    a: "Под нормально стартует: kubelet ждёт готовности приложения"
    b: "Под уйдёт в `CrashLoopBackOff`, так и не успев прогреться"
    c: "Проба будет падать, но контейнер доживёт до готовности и продолжит работать"
    d: "Kubelet автоматически увеличит `initialDelaySeconds` после первого рестарта"
  answer: b
  explanation: |
    Бюджет на старт равен `initialDelaySeconds + failureThreshold × periodSeconds`
    = 10 + 3 × 10 = 40 секунд, а прогрев занимает 90. На 40-й секунде kubelet убивает
    контейнер, отсчёт начинается заново — и так по кругу, с растущим backoff. Приложение
    в принципе не может доехать до готовности. Лечится не раздуванием
    `initialDelaySeconds` (это ослабило бы liveness навсегда), а отдельным `startupProbe`
    с большим `failureThreshold`.
  ref: "Вопрос с собеса: «под в CrashLoopBackOff, в логах приложение стартует нормально»"

# --- probes: добор junior/middle ---

- id: k8s-probes-007
  domain: k8s
  subtopic: probes
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Какими четырьмя способами kubelet может выполнить пробу?
  answer: |
    `httpGet` (код 200–399 = успех), `exec` (exit code 0 = успех), `tcpSocket`
    (соединение установилось = успех) и `grpc` (стандартный health-протокол gRPC).
  explanation: |
    Выбор механизма — это выбор того, **что именно** ты считаешь признаком здоровья.
    `tcpSocket` проверяет только что порт слушает: зависшее приложение с открытым сокетом
    такую пробу пройдёт. `httpGet` спрашивает у самого приложения. `exec` даёт полную
    свободу, но стоит форка процесса на каждую проверку.
  ref: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"

- id: k8s-probes-008
  domain: k8s
  subtopic: probes
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    На каком уровне манифеста объявляются пробы — на поде или на контейнере?
  answer: |
    На **контейнере**. У каждого контейнера в поде свои `livenessProbe`,
    `readinessProbe` и `startupProbe`.
  explanation: |
    Это прямо следует из того, кто исполняет последствия: liveness убивает **контейнер**,
    а не под, поэтому и настройка живёт там же. Отсюда же вытекает поведение
    многоконтейнерного пода — провал пробы у sidecar рестартит sidecar, а основной
    контейнер продолжает работать.
  ref: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"

- id: k8s-probes-009
  domain: k8s
  subtopic: probes
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Какие значения по умолчанию у `periodSeconds`, `timeoutSeconds`, `failureThreshold`
    и `initialDelaySeconds`?
  answer: |
    `periodSeconds: 10`, `timeoutSeconds: 1`, `failureThreshold: 3`,
    `initialDelaySeconds: 0`.
  explanation: |
    Знать их нужно из-за `timeoutSeconds: 1` — это самый неожиданный дефолт. Ручка
    `/healthz`, которая под нагрузкой отвечает за 1.2 секунды, считается **провалившейся**,
    хотя приложение живо. Дальше три таких провала подряд — и liveness убивает
    здоровый контейнер ровно в тот момент, когда сервису и так тяжело.
  ref: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"

- id: k8s-probes-010
  domain: k8s
  subtopic: probes
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Под провалил readiness. Он исчезает из `EndpointSlice` или остаётся там?
  answer: |
    **Остаётся**, но с `conditions.ready: false`. Из списка он не удаляется — меняется
    его состояние, и kube-proxy перестаёт заводить на него правила.
  explanation: |
    Это важно для отладки: `kubectl get endpointslice` покажет под, и по одному факту
    его присутствия нельзя делать вывод «трафик идёт». Смотреть надо именно на `ready`.
    Заодно отсюда работает `publishNotReadyAddresses` у headless-сервисов — адрес есть,
    просто помечен неготовым.
  ref: "https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/"

- id: k8s-probes-011
  domain: k8s
  subtopic: probes
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Почему `successThreshold` у liveness и startup нельзя поставить больше 1?
  answer: |
    Kubernetes это запрещает: для liveness и startup допустимо только `successThreshold: 1`.
    Больше единицы можно задать лишь у readiness.
  explanation: |
    Асимметрия намеренная. Для «жив» и «стартовал» задержка подтверждения означала бы,
    что контейнер считается мёртвым дольше, чем он мёртв на самом деле — это только
    вредит. А вот для трафика осторожность оправдана: `successThreshold: 3` у readiness
    не даёт вернуть нагрузку на флапающий под после единственного удачного ответа.
  ref: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"

- id: k8s-probes-012
  domain: k8s
  subtopic: probes
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `exec`-проба дороже остальных на плотно набитом узле?
  answer: |
    Каждая проверка — это **запуск процесса внутри контейнера**, каждые `periodSeconds`,
    у каждого контейнера. Сотня подов с exec-пробой раз в 10 секунд даёт постоянный
    поток форков и заметный расход CPU на узле.
  explanation: |
    `httpGet` и `tcpSocket` kubelet делает сам, из своего процесса, сетевым запросом —
    это дешёвая операция. `exec` идёт через container runtime и поднимает процесс
    в namespace контейнера. Отсюда практическое правило: exec берут, когда приложение
    физически не умеет отдать HTTP-ручку, а не по умолчанию.
  ref: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"

- id: k8s-probes-013
  domain: k8s
  subtopic: probes
  difficulty: middle
  source: core
  type: mcq
  verified: false
  prompt: |
    В поде два контейнера: `app` и `log-shipper`. У `log-shipper` провалилась
    `livenessProbe`. Что произойдёт?
  options:
    a: "Перезапустится только контейнер `log-shipper`, `app` продолжит работать"
    b: "Перезапустится весь под, оба контейнера"
    c: "Под будет пересоздан контроллером на другом узле"
    d: "Под целиком выпадет из endpoints, но перезапуска не будет"
  answer: a
  explanation: |
    Пробы объявляются на контейнере, и последствия у них контейнерные: kubelet убивает
    и перезапускает именно тот контейнер, чья проба провалилась. Под при этом живёт
    дальше, его IP и sandbox сохраняются, растёт только `restartCount` конкретного
    контейнера. Вариант (d) описывает readiness, а не liveness.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"

- id: k8s-probes-014
  domain: k8s
  subtopic: probes
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Приложение стартует за 2 секунды, но раз в несколько дней зависает намертво.
    Какую пробу и с какими параметрами ставить?
  answer: |
    `livenessProbe` с коротким `periodSeconds` и небольшим `failureThreshold` —
    зависание должно обнаруживаться быстро. `startupProbe` здесь не нужен: старт быстрый.
  explanation: |
    Параметры проб задаются не «на всякий случай», а из двух чисел: сколько длится
    легитимный старт и как быстро надо реагировать на зависание. Когда эти числа
    конфликтуют (медленный старт + быстрая реакция), их разводят через `startupProbe`.
    Когда не конфликтуют — лишняя проба только добавляет мест, где можно ошибиться.
  ref: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"

- id: k8s-probes-015
  domain: k8s
  subtopic: probes
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужна `readinessProbe` у пода, который уже прошёл `startupProbe` и стабильно
    работает?
  answer: |
    Чтобы под мог **временно** отказаться от трафика в рантайме: переподключение к БД,
    прогрев кеша, переполненная очередь запросов, graceful shutdown.
  explanation: |
    Readiness — не одноразовый стартовый гейт, kubelet опрашивает её всю жизнь пода.
    Это единственный штатный способ сказать «я жив, но сейчас не обслуживай меня»
    без рестарта и потери состояния. Если readiness рассматривать как «проверку при
    старте», её обычно ставят один раз и лишают смысла.
  ref: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"

# --- pods: junior/middle ---

- id: k8s-pods-001
  domain: k8s
  subtopic: pods
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что контейнеры внутри одного пода делят между собой?
  answer: |
    Сетевой namespace (общий IP, общий localhost, общий диапазон портов), IPC-namespace
    и тома, которые примонтированы обоим. **Файловые системы у них раздельные.**
  explanation: |
    Из общего сетевого namespace следуют два практических вывода: контейнеры в поде
    ходят друг к другу по `localhost`, и два контейнера **не могут слушать один порт** —
    будет конфликт. Раздельные файловые системы — причина, по которой обмен файлами
    между контейнерами требует явного общего тома, обычно `emptyDir`.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/"

- id: k8s-pods-002
  domain: k8s
  subtopic: pods
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Перечисли фазы пода (`status.phase`) и что означает каждая.
  answer: |
    `Pending` — принят, но не все контейнеры запущены (ждёт планирования или тянет образ);
    `Running` — назначен на узел, хотя бы один контейнер работает;
    `Succeeded` — все контейнеры завершились с кодом 0 и перезапуска не будет;
    `Failed` — все завершились, хотя бы один с ненулевым кодом;
    `Unknown` — состояние получить не удалось (обычно узел недоступен).
  explanation: |
    Фаза — это грубая сводка, а не диагноз, и на ней часто останавливаются зря.
    `Running` не значит «работает»: под с контейнером в `CrashLoopBackOff` тоже
    в фазе `Running`. Настоящая причина всегда в `status.containerStatuses` и в событиях,
    которые видно через `kubectl describe pod`.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"

- id: k8s-pods-003
  domain: k8s
  subtopic: pods
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Какие значения бывают у `restartPolicy` и какое из них по умолчанию?
  answer: |
    `Always` (по умолчанию), `OnFailure`, `Never`. Политика задаётся на **поде**
    и применяется ко всем его контейнерам.
  explanation: |
    Политика неявно связана с типом нагрузки: у Deployment всегда `Always`, потому что
    сервис обязан работать всегда; у Job допустимы только `OnFailure` и `Never`, потому что
    задача обязана завершиться — с `Always` она бы перезапускалась вечно после успеха.
    Kubernetes это прямо запрещает при создании Job.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"

- id: k8s-pods-004
  domain: k8s
  subtopic: pods
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как выполняются init-контейнеры относительно основных?
  answer: |
    Строго **последовательно и до** основных: каждый должен завершиться с кодом 0,
    только тогда запускается следующий. Основные контейнеры не стартуют, пока не
    отработали все init.
  explanation: |
    Отсюда их типичное применение: дождаться миграции БД, скачать конфиг, проверить
    доступность зависимости. И отсюда же типичный симптом — под навсегда в `Init:0/2`,
    когда init ждёт того, чего никогда не будет. Упавший init перезапускается
    по `restartPolicy` пода, поэтому с `Never` под сразу уходит в `Failed`.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/init-containers/"

- id: k8s-pods-005
  domain: k8s
  subtopic: pods
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что за контейнер `pause` и зачем он в каждом поде?
  answer: |
    Инфраструктурный контейнер (sandbox), который **держит namespace'ы пода** — прежде
    всего сетевой. Он ничего не делает, только ждёт.
  explanation: |
    Именно `pause` объясняет, почему IP пода переживает рестарт контейнера: приложение
    убили и подняли заново, а sandbox с сетевым namespace никто не трогал. Если бы
    namespace принадлежал прикладному контейнеру, каждый рестарт менял бы адрес пода.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/"

- id: k8s-pods-006
  domain: k8s
  subtopic: pods
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Контейнер упал и перезапустился. Как посмотреть логи именно упавшего запуска?
  answer: |
    `kubectl logs <pod> --previous` (можно `-p`), при нескольких контейнерах —
    с `-c <container>`.
  explanation: |
    Обычный `kubectl logs` показывает **текущий** запуск, а он у только что
    перезапущенного контейнера почти пустой — причина падения осталась в предыдущем.
    Это первая команда при разборе `CrashLoopBackOff`. Хранится только один предыдущий
    запуск: после второго рестарта логи первого уже недоступны.
  ref: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/"

- id: k8s-pods-007
  domain: k8s
  subtopic: pods
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Что на самом деле означает `CrashLoopBackOff`?
  answer: |
    Что контейнер уже несколько раз падал, и kubelet **ждёт перед очередным
    перезапуском**. Задержка растёт экспоненциально: 10s, 20s, 40s и так далее
    до потолка в 5 минут.
  explanation: |
    Это состояние ожидания, а не причина падения — искать надо в логах предыдущего
    запуска и в exit code, а не в самом статусе. Backoff существует, чтобы битый под
    не жёг ресурсы узла бесконечным циклом рестартов. Успешная работа контейнера
    сбрасывает счётчик задержки.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"

- id: k8s-pods-008
  domain: k8s
  subtopic: pods
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что означают exit codes `137` и `143` у контейнера?
  answer: |
    Оба вида `128 + номер сигнала`. `137` = 128 + 9 (SIGKILL) — чаще всего OOMKilled
    или истёкший grace period. `143` = 128 + 15 (SIGTERM) — штатное завершение
    по сигналу остановки.
  explanation: |
    Различать их нужно, потому что это два противоположных диагноза: `143` — под гасили
    штатно (выкат, drain, масштабирование), и это норма; `137` — процесс убили
    принудительно, и это почти всегда либо превышение memory-limit, либо приложение,
    не успевшее умереть за `terminationGracePeriodSeconds`. Подтверждение OOM ищется
    в `status.containerStatuses[].lastState.terminated.reason`.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/"

- id: k8s-pods-009
  domain: k8s
  subtopic: pods
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как определяется QoS-класс пода?
  answer: |
    `Guaranteed` — у **каждого** контейнера заданы и requests, и limits по CPU и памяти,
    и они равны. `BestEffort` — не задано вообще ничего. `Burstable` — всё остальное.
  explanation: |
    Класс не выставляется руками, он выводится из requests и limits — и определяет
    порядок вытеснения при нехватке памяти на узле: первыми выгоняют `BestEffort`,
    последними `Guaranteed`. Отсюда типичная ошибка: limits проставили только одному
    контейнеру из двух, и весь под остался `Burstable`.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/"

- id: k8s-pods-010
  domain: k8s
  subtopic: pods
  difficulty: middle
  source: theory
  type: mcq
  verified: false
  prompt: |
    Контейнер стабильно упирается в свои `limits` по CPU и по памяти.
    Что с ним происходит?
  options:
    a: "И то и другое приводит к перезапуску контейнера"
    b: "CPU — троттлинг, память — контейнер убивают (OOMKilled)"
    c: "CPU — контейнер убивают, память — троттлинг аллокаций"
    d: "Оба лимита мягкие: под просто вытеснят на другой узел"
  answer: b
  explanation: |
    CPU — ресурс сжимаемый: у процесса можно отобрать такты, и он просто станет медленнее,
    поэтому cgroups его троттлят. Память отобрать нельзя — уже выделенные страницы
    не отдать обратно, поэтому единственный способ соблюсти лимит это убить процесс.
    Практическое следствие: симптом превышения CPU-лимита — рост latency без единой
    ошибки в логах, и по логам его не найти.
  ref: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"

- id: k8s-pods-011
  domain: k8s
  subtopic: pods
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что происходит с подом от момента `kubectl delete pod` до его исчезновения?
  answer: |
    Под помечается на удаление и параллельно: адрес снимается из endpoints; выполняется
    хук `preStop`; контейнерам шлётся `SIGTERM`; по истечении
    `terminationGracePeriodSeconds` (по умолчанию 30) — `SIGKILL`.
  explanation: |
    Ключевое слово здесь — **параллельно**: снятие из endpoints и отправка SIGTERM
    не синхронизированы между собой, распространение правил по узлам занимает время.
    Поэтому под может получить запросы уже после SIGTERM. Отсюда стандартный приём —
    `preStop: sleep 5`, который даёт правилам разъехаться до того, как приложение
    начнёт закрываться.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"

- id: k8s-pods-012
  domain: k8s
  subtopic: pods
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Кто перезапускает контейнер, а кто пересоздаёт под — и в чём разница для меня?
  answer: |
    Контейнер перезапускает **kubelet** на том же узле: под, его имя и IP сохраняются,
    растёт `restartCount`. Под пересоздаёт **контроллер** (ReplicaSet и подобные):
    появляется новый объект с новым именем и новым IP.
  explanation: |
    Сам под себя не воскрешает — удали под, созданный вручную, и он исчезнет навсегда.
    Различать эти два события важно при разборе инцидента: `restartCount: 47` означает
    падающее приложение, а вереница подов с новыми именами — что их выселяет узел
    или пересоздаёт выкат. Ищутся они в разных местах: первое в статусе пода,
    второе в событиях.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/"

- id: k8s-pods-013
  domain: k8s
  subtopic: pods
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Когда два контейнера действительно должны жить в одном поде, а когда это ошибка?
  answer: |
    Должны — когда они неразрывны: делят том или localhost и не имеют смысла по
    отдельности (sidecar с логами, прокси, адаптер метрик). Ошибка — когда их просто
    удобно катить вместе: у пода один жизненный цикл и одно масштабирование на всех.
  explanation: |
    Под — это единица планирования и масштабирования. Запихнув в него фронт и бэкенд,
    ты получаешь их обязательно на одном узле, в одинаковом количестве реплик и
    с общим рестартом. Проверочный вопрос: «нужно ли мне когда-нибудь скейлить их
    по-разному?» Ответ «да» — это два Deployment, а не один под.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/"

# --- workload-controllers: junior/middle ---

- id: k8s-workload-controllers-001
  domain: k8s
  subtopic: workload-controllers
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как устроена цепочка Deployment → ReplicaSet → Pod: кто за что отвечает?
  answer: |
    Deployment управляет версиями: на каждое изменение pod-template он создаёт новый ReplicaSet
    и перекладывает реплики между старым и новым. ReplicaSet держит **заданное число
    подов**. Поды запускает kubelet.
  explanation: |
    Разделение нужно именно ради выката: чтобы катиться без даунтайма и уметь
    откатываться, кто-то должен одновременно держать две версии. Эту роль играет
    Deployment, а ReplicaSet остаётся тупым счётчиком «должно быть N штук» и понятия
    не имеет ни про версии, ни про rollout.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"

- id: k8s-workload-controllers-002
  domain: k8s
  subtopic: workload-controllers
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему ReplicaSet не пишут руками, хотя он умеет держать реплики?
  answer: |
    Потому что он не умеет катиться: смена образа в ReplicaSet не обновит уже работающие
    поды и не даст откатиться. Deployment добавляет ровно это.
  explanation: |
    ReplicaSet следит только за числом подов, а не за их содержимым. Чтобы применить
    новую версию, пришлось бы удалять поды руками — то есть с даунтаймом и без пути
    назад. Голый ReplicaSet осмыслен разве что в учебных целях; в проде его создаёт
    Deployment и он же им управляет.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/"

- id: k8s-workload-controllers-003
  domain: k8s
  subtopic: workload-controllers
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем DaemonSet отличается от Deployment по способу задания числа реплик?
  answer: |
    У DaemonSet числа реплик **нет**: он держит по одному поду на каждом подходящем узле.
    Добавили узел — под приедет туда сам, убрали узел — под исчезнет вместе с ним.
  explanation: |
    Это ровно та модель, которая нужна инфраструктурным агентам: CNI, сборщик логов,
    node-exporter, CSI-драйвер. Они привязаны к узлу, а не к нагрузке, поэтому
    «сколько реплик» — неправильный вопрос. Множество узлов сужается через
    `nodeSelector`, `affinity` и tolerations.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/"

- id: k8s-workload-controllers-004
  domain: k8s
  subtopic: workload-controllers
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что StatefulSet даёт поду такого, чего не даёт Deployment?
  answer: |
    Стабильную идентичность: предсказуемое имя с порядковым номером (`web-0`, `web-1`),
    **свой** PVC, привязанный к этому имени, персональную DNS-запись в headless-сервисе
    и упорядоченные запуск и остановку.
  explanation: |
    Всё это нужно там, где реплики не взаимозаменяемы: у базы данных `web-0` — это
    конкретный участник кластера со своими данными, а не «одна из трёх». В Deployment
    поды анонимны, имена случайны, том общий или отсутствует, порядок запуска не
    определён — для stateful-нагрузки это неприемлемо.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"

- id: k8s-workload-controllers-005
  domain: k8s
  subtopic: workload-controllers
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем Job отличается от CronJob?
  answer: |
    Job запускает поды до успешного завершения **один раз**. CronJob — это контроллер
    над Job: по расписанию он штампует новые объекты Job, каждый из которых работает
    самостоятельно.
  explanation: |
    Отсюда важное следствие для отладки: CronJob сам ничего не запускает, он только
    создаёт Job'ы. Проблема «задача не отработала» ищется в порождённом Job и его подах,
    а не в CronJob. Оттуда же берётся мусор в кластере: каждое срабатывание оставляет
    объект, и без ограничения истории они копятся.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/"

- id: k8s-workload-controllers-006
  domain: k8s
  subtopic: workload-controllers
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Сколько ReplicaSet существует у Deployment во время выката и после него?
  answer: |
    Во время выката — минимум два: старый, у которого реплики убывают, и новый,
    у которого прибывают. После выката старый остаётся с нулём реплик.
  explanation: |
    Именно поэтому откат мгновенный: старый ReplicaSet никуда не делся, у него полностью
    сохранён pod-template, и `rollout undo` просто снова поднимает ему реплики — ничего
    не пересобирается и не скачивается заново. Сколько таких пустых ReplicaSet
    сохраняется, задаёт `revisionHistoryLimit`.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"

- id: k8s-workload-controllers-007
  domain: k8s
  subtopic: workload-controllers
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что задают `maxSurge` и `maxUnavailable` и какие у них значения по умолчанию?
  answer: |
    `maxSurge` — сколько подов можно поднять **сверх** желаемого числа; `maxUnavailable` —
    сколько можно недосчитаться в процессе. По умолчанию оба `25%`.
  explanation: |
    Вдвоём они задают ширину окна выката, то есть компромисс между скоростью и запасом
    ёмкости. `maxUnavailable: 0` означает «сначала подними новый под, только потом гаси
    старый» — безопасно, но требует свободных ресурсов в кластере. Оба в ноль
    одновременно поставить нельзя: выкат не сможет сдвинуться с места.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"

- id: k8s-workload-controllers-008
  domain: k8s
  subtopic: workload-controllers
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    В `rollout history` пять ревизий. Ты делаешь `kubectl rollout undo --to-revision=1`.
    Какой номер получит результат?
  options:
    a: "6 — номера ревизий только растут"
    b: "1 — ревизия возвращается на своё место"
    c: "5 — текущая ревизия перезаписывается"
    d: "0 — счётчик сбрасывается"
  answer: a
  explanation: |
    Откат — это не перемотка истории, а **новое изменение**, просто с уже известным
    содержимым: Deployment снова активирует старый ReplicaSet и присваивает этому
    событию следующий номер. История строго монотонна, поэтому по номеру нельзя судить
    о содержимом ревизии — только `rollout history --revision=N` покажет, что там внутри.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"

- id: k8s-workload-controllers-009
  domain: k8s
  subtopic: workload-controllers
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Когда `strategy: Recreate` обязателен вместо RollingUpdate?
  answer: |
    Когда две версии приложения не могут работать одновременно: том с
    `ReadWriteOnce`, который не отдать двум подам сразу; несовместимая миграция схемы БД;
    эксклюзивная блокировка или лицензия.
  explanation: |
    RollingUpdate по определению держит старую и новую версию рядом — это его смысл.
    Если сосуществование невозможно, выкат встанет намертво (новый под не получит том)
    либо, хуже, две версии подерутся за общий ресурс. `Recreate` честно гасит всё
    старое до запуска нового, платя за это даунтаймом.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"

- id: k8s-workload-controllers-010
  domain: k8s
  subtopic: workload-controllers
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Предыдущий запуск CronJob ещё работает, наступило время следующего.
    Чем управляется поведение?
  answer: |
    Полем `concurrencyPolicy`: `Allow` (по умолчанию) — запустить параллельно;
    `Forbid` — пропустить новый запуск; `Replace` — убить текущий и запустить новый.
  explanation: |
    Дефолт `Allow` опасен именно для тех задач, ради которых берут CronJob: бэкап,
    миграция, рассылка. Если задача иногда идёт дольше интервала, копии начинают
    наслаиваться, соревноваться за один ресурс и дублировать побочные эффекты.
    Для всего, что имеет побочный эффект, ставят `Forbid`.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/"

- id: k8s-workload-controllers-011
  domain: k8s
  subtopic: workload-controllers
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Минутный CronJob за месяц оставил в кластере десятки тысяч объектов.
    Чем это ограничивают?
  answer: |
    Полями `successfulJobsHistoryLimit` (по умолчанию 3) и `failedJobsHistoryLimit`
    (по умолчанию 1) — сколько завершённых Job хранить. Плюс `ttlSecondsAfterFinished`
    на самом Job для автоудаления по времени.
  explanation: |
    Каждый Job тянет за собой поды, а всё это лежит в etcd — единственном хранилище
    состояния кластера. Раздутый etcd замедляет apiserver, то есть вообще всё.
    Дефолты выглядят безобидно, но их легко обнулить: `successfulJobsHistoryLimit: 0`
    в шаблоне — и история не хранится совсем.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/"

- id: k8s-workload-controllers-012
  domain: k8s
  subtopic: workload-controllers
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Удалил StatefulSet — PVC его подов остались. Это баг?
  answer: |
    Нет, поведение по умолчанию: тома переживают удаление контроллера, чтобы данные
    не пропали вместе с манифестом. Удалять PVC надо осознанно и руками.
  explanation: |
    Логика в том, что StatefulSet — описание нагрузки, а PVC — заявка на данные, и
    вторые дороже первого: пересоздашь StatefulSet с тем же именем — поды подхватят
    свои прежние тома. Обратная сторона — тихо копящиеся оплачиваемые диски после
    удалённых нагрузок. Управлять этим можно через
    `persistentVolumeClaimRetentionPolicy`.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"

- id: k8s-workload-controllers-013
  domain: k8s
  subtopic: workload-controllers
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Задеплоил DaemonSet, а на control-plane узлах подов нет. Почему?
  answer: |
    На control-plane узлах стоит taint `node-role.kubernetes.io/control-plane:NoSchedule`.
    Нужен явный `toleration` в pod-template DaemonSet.
  explanation: |
    Taint — это отказ узла принимать поды, и DaemonSet никакого иммунитета к нему
    не имеет. Для мониторинга и сбора логов покрытие control-plane обычно как раз нужно,
    поэтому у таких чартов toleration прописан по умолчанию. Проверяется симптом
    мгновенно: `desired` в статусе DaemonSet будет меньше числа узлов.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/"

- id: k8s-workload-controllers-014
  domain: k8s
  subtopic: workload-controllers
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Почему в Job нельзя указать `restartPolicy: Always`?
  answer: |
    Потому что Job обязан завершиться, а `Always` означает «перезапускать даже после
    успеха» — задача никогда бы не закончилась. API отклоняет такой манифест;
    допустимы только `OnFailure` и `Never`.
  explanation: |
    Разница между `OnFailure` и `Never` в том, **что** повторяется при падении:
    `OnFailure` перезапускает контейнер в том же поде, `Never` оставляет под в `Failed`,
    и Job создаёт новый под. Второе удобнее для разбора — упавшие поды остаются
    на месте вместе с логами.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/job/"

- id: k8s-workload-controllers-015
  domain: k8s
  subtopic: workload-controllers
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    `kubectl rollout status` висит и не завершается. Куда смотреть?
  answer: |
    Новые поды не становятся ready. Причины по частоте: не проходит `readinessProbe`,
    не тянется образ (`ImagePullBackOff`), нет ресурсов для планирования (`Pending`),
    упирается в квоту namespace. Через `progressDeadlineSeconds` (по умолчанию 600)
    выкат помечается провалившимся.
  explanation: |
    Deployment продвигает выкат только по готовности новых подов, поэтому «завис
    rollout» — это всегда симптом, а не причина: проблема в конкретном поде. Смотреть
    надо не на Deployment, а на новый ReplicaSet и его поды. Важно, что откат
    автоматически **не** происходит — по истечении дедлайна выкат просто останавливается
    в текущем состоянии.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"

# --- services: junior/middle ---

- id: k8s-services-001
  domain: k8s
  subtopic: services
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Service хранит у себя список подов?
  answer: |
    Нет. Service хранит **селектор**. По селектору контроллер endpoints ведёт отдельный
    объект `EndpointSlice` со списком адресов, а kube-proxy на каждом узле превращает
    его в правила в ядре.
  explanation: |
    Отсюда порядок отладки «сервис есть, трафика нет»: смотреть надо не на Service,
    а на `kubectl get endpointslice` — пустой список означает, что селектор не совпал
    с метками подов или поды не готовы. Само по себе существование Service ничего
    не гарантирует, это лишь декларация намерения.
  ref: "https://kubernetes.io/docs/concepts/services-networking/service/"

- id: k8s-services-002
  domain: k8s
  subtopic: services
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Перечисли типы Service и как они соотносятся друг с другом.
  answer: |
    `ClusterIP` — базовый, адрес только внутри кластера. `NodePort` — это ClusterIP
    **плюс** порт на каждом узле. `LoadBalancer` — это NodePort **плюс** внешний
    балансировщик от облака. `ExternalName` стоит особняком: это просто CNAME в DNS.
  explanation: |
    Типы — надстройки, а не альтернативы: у LoadBalancer внутри всё равно есть и
    ClusterIP, и NodePort. Понимание этой матрёшки объясняет, почему у LoadBalancer
    на узлах открываются порты из диапазона NodePort, и почему внутрикластерные
    обращения к нему всё равно идут через ClusterIP.
  ref: "https://kubernetes.io/docs/concepts/services-networking/service/"

- id: k8s-services-003
  domain: k8s
  subtopic: services
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает `clusterIP: None` (headless Service)?
  answer: |
    Отключает виртуальный IP и балансировку: DNS-имя сервиса начинает резолвиться
    **сразу в IP всех готовых подов**, а не в один ClusterIP.
  explanation: |
    Нужно там, где клиент обязан видеть отдельные экземпляры, а не безликую точку входа:
    реплики БД (писать только в primary), кластеры с обнаружением участников, gRPC-клиент
    с собственной балансировкой. Для StatefulSet headless-сервис ещё и даёт каждому поду
    персональное DNS-имя вида `web-0.svc-name`.
  ref: "https://kubernetes.io/docs/concepts/services-networking/service/"

- id: k8s-services-004
  domain: k8s
  subtopic: services
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем различаются `port`, `targetPort` и `nodePort` в манифесте Service?
  answer: |
    `port` — порт самого сервиса (на ClusterIP), `targetPort` — порт **контейнера**,
    куда трафик пересылается, `nodePort` — порт на каждом узле для типа NodePort.
  explanation: |
    Три числа для трёх разных сетевых точек, и путаница между ними — самая частая
    причина «сервис есть, а curl молчит». Клиенты внутри кластера обращаются на `port`,
    приложение слушает `targetPort`, а `nodePort` появляется только когда вход нужен
    снаружи. Если `targetPort` не указан, он считается равным `port`.
  ref: "https://kubernetes.io/docs/concepts/services-networking/service/"

- id: k8s-services-005
  domain: k8s
  subtopic: services
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    ClusterIP не поднят ни на одном интерфейсе в кластере, но `curl` на него работает.
    Как?
  answer: |
    ClusterIP — виртуальный адрес, существующий только как **правило в ядре**.
    Пакет на него никуда не доезжает: он переписывается (DNAT) на IP конкретного пода
    прямо на узле-отправителе.
  explanation: |
    Отсюда следствия, которые проверяют на собесе: ClusterIP нельзя пропинговать
    (ICMP правилами не обрабатывается) и его не видно в `ip addr`. Правила
    раскладывает kube-proxy на **каждом** узле, поэтому подмена происходит локально,
    ещё до того как пакет ушёл в сеть.
  ref: "https://kubernetes.io/docs/concepts/services-networking/service/"

- id: k8s-services-006
  domain: k8s
  subtopic: services
  difficulty: middle
  source: theory
  type: mcq
  verified: false
  prompt: |
    Через что физически проходит пакет, отправленный на ClusterIP?
  options:
    a: "Через процесс kube-proxy на узле-отправителе"
    b: "Через правила в ядре узла-отправителя, kube-proxy их только записывает"
    c: "Через kube-apiserver, который знает актуальный список подов"
    d: "Через ingress-controller, он и есть балансировщик кластера"
  answer: b
  explanation: |
    Имя `kube-proxy` обманывает: он не проксирует трафик, а работает control plane'ом
    для сети сервисов — следит за EndpointSlice и программирует iptables, IPVS или
    nftables. Данные идут через ядро. Поэтому упавший kube-proxy не рвёт существующие
    соединения — правила остаются на месте, просто перестают обновляться.
  ref: "https://kubernetes.io/docs/reference/networking/virtual-ips/"

- id: k8s-services-007
  domain: k8s
  subtopic: services
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Балансировка Service работает на уровне запросов или соединений?
  answer: |
    На уровне **соединений**. Под выбирается один раз, при установке соединения,
    и все запросы внутри него идут в один и тот же под.
  explanation: |
    Это следствие того, что балансировка живёт на L4, в ядре: там нет понятия
    «HTTP-запрос», есть только новый коннект. Для HTTP/1.1 с коротким keep-alive это
    незаметно, а для долгих соединений — принципиально. Балансировка ещё и «тупая»:
    это выбор наугад по весу, без учёта загрузки подов.
  ref: "https://kubernetes.io/docs/reference/networking/virtual-ips/"

- id: k8s-services-008
  domain: k8s
  subtopic: services
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Отскейлил gRPC-сервис до 10 реплик, но нагрузка идёт в один под. Почему и что делать?
  answer: |
    gRPC работает поверх HTTP/2 и держит **одно долгое соединение**, а Service
    балансирует на коннект. Клиент выбрал под один раз и остался на нём навсегда.
    Лечится клиентской балансировкой через headless Service, service mesh или прокси
    с поддержкой HTTP/2.
  explanation: |
    Симптом контринтуитивен: реплики есть, они здоровы, все запросы у одной. Причина
    в том, что L4-балансировщик физически не видит границ запросов внутри установленного
    соединения. Поэтому решение всегда лежит на уровне, который эти границы видит —
    у клиента или у L7-прокси.
  ref: "https://kubernetes.io/docs/reference/networking/virtual-ips/"

- id: k8s-services-009
  domain: k8s
  subtopic: services
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Создал `type: LoadBalancer` на bare-metal кластере, `EXTERNAL-IP` вечно `<pending>`.
    Почему?
  answer: |
    Внешний адрес выдаёт не Kubernetes, а cloud-controller-manager, который ходит в API
    облака. На bare-metal его нет, выдавать адрес некому. Нужен MetalLB или аналог.
  explanation: |
    Kubernetes сам по себе балансировщиков не создаёт — он лишь описывает намерение
    и ждёт, что кто-то его исполнит. Это тот же паттерн, что с Ingress: объект без
    контроллера остаётся декларацией. `<pending>` означает «заявка принята, исполнитель
    не найден», и в событиях сервиса это будет видно прямым текстом.
  ref: "https://kubernetes.io/docs/concepts/services-networking/service/"

- id: k8s-services-010
  domain: k8s
  subtopic: services
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Какой диапазон портов у NodePort по умолчанию и чем NodePort плох в проде?
  answer: |
    `30000–32767`. Плох тем, что открывает порт на **каждом** узле кластера, даёт
    некрасивый адрес вида `узел:31543`, не умеет TLS и путей, и требует, чтобы клиент
    сам знал живые адреса узлов.
  explanation: |
    NodePort — это механизм, а не продуктовое решение: он существует как фундамент
    для LoadBalancer, а не как способ выставить сервис наружу. В проде наружу выходят
    через Ingress или LoadBalancer, а NodePort остаётся для отладки и стендов.
    Отдельный риск — сетевой периметр: порт открывается на всех узлах разом.
  ref: "https://kubernetes.io/docs/concepts/services-networking/service/"

- id: k8s-services-011
  domain: k8s
  subtopic: services
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает `externalTrafficPolicy: Local` и чем за это платишь?
  answer: |
    Запрещает пересылку входящего внешнего трафика на другие узлы — пакет обслуживает
    только под на том узле, куда он пришёл. Взамен сохраняется **реальный source IP**
    клиента. Плата — неравномерность: узлы с большим числом подов получат больше нагрузки.
  explanation: |
    При дефолтном `Cluster` узел может перекинуть пакет соседу, и для этого делает SNAT —
    подменяет источник, из-за чего приложение видит IP узла вместо клиента. Это ломает
    геолокацию, rate limiting по IP и аудит. `Local` убирает лишний хоп и SNAT, но
    требует, чтобы поды были на всех узлах, куда балансировщик шлёт трафик.
  ref: "https://kubernetes.io/docs/tutorials/services/source-ip/"

- id: k8s-services-012
  domain: k8s
  subtopic: services
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что умеет и чего не умеет `sessionAffinity: ClientIP`?
  answer: |
    Умеет привязать соединения с одного IP к одному поду (по умолчанию на 3 часа).
    Не умеет ничего сложнее: ни куки, ни заголовки, ни ключ сессии — это L4, он видит
    только адреса.
  explanation: |
    Привязка по IP разваливается ровно там, где она обычно нужна: клиенты за общим NAT
    выглядят одним адресом и уедут в один под, а мобильный клиент при смене сети
    поменяет IP и потеряет привязку. Это костыль для legacy-приложений с состоянием
    в памяти; нормальное решение — вынести сессию во внешнее хранилище.
  ref: "https://kubernetes.io/docs/reference/networking/virtual-ips/"

- id: k8s-services-013
  domain: k8s
  subtopic: services
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Какие три сети живут в кластере и какая из них маршрутизируется в обычной сети?
  answer: |
    Сеть узлов (реальная, из VPC), pod CIDR (адреса подов, раздаёт CNI) и service CIDR
    (виртуальные ClusterIP). Реально маршрутизируется только сеть узлов; pod-сеть —
    внутри кластера, service-сеть не существует вне правил ядра.
  explanation: |
    Разделение объясняет типовые сетевые сюрпризы: на ClusterIP нельзя сходить снаружи
    кластера, а pod IP не отвечает из офисной сети без специальной маршрутизации.
    И оно же объясняет требование не пересекать эти диапазоны с адресами VPC —
    иначе часть реальной сети станет недостижимой изнутри подов.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/networking/"

# --- config-secrets: junior/middle ---

- id: k8s-config-secrets-001
  domain: k8s
  subtopic: config-secrets
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Какими двумя способами ConfigMap или Secret попадают в контейнер?
  answer: |
    Переменными окружения (`env` / `envFrom`) и файлами через том (`volumeMounts`).
    Выбор способа определяет главное — обновится ли значение без рестарта пода.
  explanation: |
    Это не вопрос вкуса: env впаивается в процесс при старте и не меняется никогда,
    а файлы в томе kubelet обновляет на живом поде. Отсюда практическое правило —
    скалярные настройки, которые всё равно требуют рестарта, можно через env;
    целые конфиг-файлы и то, что должно перечитываться на лету, — только томом.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-002
  domain: k8s
  subtopic: config-secrets
  difficulty: junior
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Secret шифрует свои данные?
  answer: |
    Нет. Значения хранятся в base64 — это кодирование, а не шифрование, и разворачивается
    одной командой. Шифрование в etcd включается отдельно администратором кластера.
  explanation: |
    Реальные отличия Secret от ConfigMap лежат в другом: он не светится в выводе по
    умолчанию, у него есть типы, kubelet держит его в tmpfs, и на него отдельно
    навешивается RBAC. То есть Secret — это про **разграничение доступа**, а не про
    криптографию. Кто может читать Secret'ы в namespace, тот видит их открытым текстом.
  ref: "https://kubernetes.io/docs/concepts/configuration/secret/"

- id: k8s-config-secrets-003
  domain: k8s
  subtopic: config-secrets
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает `envFrom` в отличие от `env` с `valueFrom`?
  answer: |
    `envFrom` втягивает **весь** ConfigMap или Secret целиком: каждый ключ становится
    переменной окружения с тем же именем. `env` + `valueFrom` берёт один конкретный ключ.
  explanation: |
    `envFrom` короче, но делает состав переменных неявным — по манифесту пода уже
    не видно, что именно в него приезжает, и добавление ключа в ConfigMap молча меняет
    окружение приложения. Плюс ключи, не подходящие под правила имён переменных,
    молча пропускаются. Для секретов явное перечисление обычно предпочтительнее.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-004
  domain: k8s
  subtopic: config-secrets
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем у Secret есть поле `type` и какие типы встречаются чаще всего?
  answer: |
    Тип задаёт ожидаемый набор ключей и позволяет Kubernetes использовать секрет
    по назначению. Чаще всего: `Opaque` (произвольные данные, по умолчанию),
    `kubernetes.io/tls` (ключи `tls.crt` и `tls.key`), `kubernetes.io/dockerconfigjson`
    (доступ к приватному registry).
  explanation: |
    Тип — это контракт: Ingress ждёт от TLS-секрета именно `tls.crt` и `tls.key`
    и с произвольным Opaque работать не станет, а `imagePullSecrets` требует
    dockerconfigjson. Плюс API валидирует состав ключей при создании, то есть ошибка
    ловится сразу, а не в момент, когда под не смог подтянуть образ.
  ref: "https://kubernetes.io/docs/concepts/configuration/secret/"

- id: k8s-config-secrets-005
  domain: k8s
  subtopic: config-secrets
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как под получает доступ к образу из приватного registry?
  answer: |
    Через `imagePullSecrets` в спеке пода (или в ServiceAccount, под которым он
    запускается) — ссылку на Secret типа `kubernetes.io/dockerconfigjson`.
  explanation: |
    Тянет образ **kubelet**, а не приложение, поэтому секрет нужен до старта контейнера
    и читается с узла. Прописывать его в ServiceAccount удобнее: тогда он автоматически
    применяется ко всем подам namespace и его не надо копировать в каждый манифест.
    Симптом отсутствия — `ImagePullBackOff` с ошибкой авторизации в событиях пода.
  ref: "https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/"

- id: k8s-config-secrets-006
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Ты поменял значение в ConfigMap. Под его использует. Когда изменение доедет?
  options:
    a: "Через env — сразу; через том — только после рестарта пода"
    b: "Через env — никогда без рестарта; через том — kubelet обновит файл с задержкой"
    c: "И то и другое обновится сразу, kubelet следит за обоими"
    d: "Ни то ни другое: ConfigMap читается один раз при создании пода"
  answer: b
  explanation: |
    Переменные окружения задаются процессу при `exec` и после этого физически
    неизменяемы — ни Kubernetes, ни кто-либо ещё не может подменить окружение живому
    процессу. Файлы в томе — это симлинки, которые kubelet периодически переставляет
    на новую версию, поэтому там обновление происходит, но не мгновенно.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-007
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Файл из ConfigMap обновился в томе. Значит ли это, что приложение подхватило
    новый конфиг?
  answer: |
    Нет. Обновился только файл на диске. Перечитает ли его приложение — целиком вопрос
    к приложению: умеет ли оно следить за файлом или перезагружаться по сигналу.
  explanation: |
    Это две независимые границы, и их постоянно склеивают в одну. Большинство сервисов
    читают конфиг один раз при старте, поэтому обновлённый файл лежит рядом
    и никем не замечен. Отсюда стандартный приём: аннотация с хешем конфига
    в pod-template — меняется конфиг, меняется аннотация, Deployment катит новые поды.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-008
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему файл, примонтированный через `subPath`, перестаёт обновляться?
  answer: |
    Потому что `subPath` монтирует **конкретный файл**, а не каталог. Механизм обновления
    работает через подмену симлинка внутри каталога тома — при `subPath` этой ссылки нет,
    и файл замерзает на версии, которая была при старте пода.
  explanation: |
    Ловушка в том, что `subPath` берут ровно там, где он ломает: чтобы положить один
    файл в каталог с чужим содержимым (`/etc/nginx/nginx.conf`) и не затереть остальное.
    Обходной путь — монтировать каталог целиком в отдельное место и делать симлинк
    самому, либо смириться и катить поды при смене конфига.
  ref: "https://kubernetes.io/docs/concepts/storage/volumes/"

- id: k8s-config-secrets-009
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что произойдёт с содержимым `/etc/nginx`, если примонтировать туда том с одним файлом?
  answer: |
    Всё, что было в этом каталоге в образе, станет недоступно: монтирование **закрывает
    каталог целиком**, оставляя видимым только содержимое тома.
  explanation: |
    Это обычная семантика mount в Linux, а не особенность Kubernetes: точка монтирования
    перекрывает то, что лежало под ней. Симптом — приложение не находит файлов, которые
    точно есть в образе. Решения два: `subPath` для подмены одного файла (ценой потери
    авто-обновления) или монтирование в пустой каталог.
  ref: "https://kubernetes.io/docs/concepts/storage/volumes/"

- id: k8s-config-secrets-010
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как заставить приложение увидеть новый конфиг, если оно читает его только при старте?
  answer: |
    Положить хеш конфига в аннотацию pod-template Deployment. Меняется ConfigMap →
    меняется аннотация → меняется pod-template → Deployment катит новые поды штатным
    rolling update.
  explanation: |
    Deployment реагирует только на изменение своего pod-template — правка ConfigMap
    для него невидима, поэтому сам по себе выкат не начнётся. Аннотация с хешем делает
    внешнее изменение видимым в шаблоне. В Helm это `checksum/config` в аннотациях,
    и такая строка есть почти в каждом приличном чарте.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"

- id: k8s-config-secrets-011
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Под завис в `ContainerCreating`. Как это связано с ConfigMap и Secret?
  answer: |
    Скорее всего под ссылается на несуществующий ConfigMap или Secret. Планирование
    прошло, узел выбран, но kubelet не может смонтировать том и ждёт — бесконечно,
    пока объект не появится.
  explanation: |
    Ждать, а не падать, — сознательное решение: объект может появиться через секунду,
    и убивать под из-за гонки при развёртывании неправильно. Цена в том, что симптом
    молчаливый: в логах пусто, потому что контейнер даже не стартовал. Причина всегда
    видна в `kubectl describe pod`, в событиях, прямым текстом.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"

- id: k8s-config-secrets-012
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    В `env.valueFrom.configMapKeyRef` опечатка в имени ключа. Что будет с подом?
  answer: |
    Под **не запустится**: kubelet не сможет собрать окружение и остановится
    с `CreateContainerConfigError`. Дефолт не подставляется.
  explanation: |
    Kubernetes не угадывает намерения: ссылка на несуществующий ключ — это ошибка
    конфигурации, а не повод стартовать с пустым значением. Поведение можно смягчить
    флагом `optional: true` — тогда переменная просто не появится, и ответственность
    за отсутствующее значение переходит приложению.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-013
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что даёт `immutable: true` у ConfigMap и Secret?
  answer: |
    Запрещает изменять `data` — объект можно только удалить и создать заново. Взамен
    kubelet перестаёт следить за ним и снимает нагрузку с apiserver.
  explanation: |
    В большом кластере каждый под с примонтированным ConfigMap держит watch на apiserver;
    на десятках тысяч подов это заметная нагрузка. Неизменяемость её убирает. Побочный
    эффект полезен сам по себе: конфиг перестаёт незаметно меняться под работающими
    подами, а новая версия требует нового объекта и явного выката.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-014
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Почему секреты лучше монтировать томом, чем прокидывать через `env`?
  answer: |
    Переменные окружения утекают слишком легко: они видны в `kubectl describe pod`,
    в дампах при краше, в логах стартующего приложения, наследуются дочерними процессами
    и попадают в системы отчётов об ошибках.
  explanation: |
    Файл в томе доступен только процессу, который его открыл, лежит в tmpfs
    (то есть не попадает на диск узла) и обновляется без рестарта пода. Окружение же
    по своей природе глобально для процесса и путешествует вниз по дереву процессов —
    ровно то поведение, которого от секрета не хочется.
  ref: "https://kubernetes.io/docs/concepts/configuration/secret/"

- id: k8s-config-secrets-015
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    ConfigMap удалили, а под с ним продолжает работать. Почему и что сломается дальше?
  answer: |
    Работающий контейнер уже получил свои данные: env впаян в процесс, файлы тома лежат
    у kubelet локально. Сломается при **следующем** старте пода — новый под не сможет
    смонтировать том и зависнет в `ContainerCreating`.
  explanation: |
    Это классическая отложенная поломка: кластер выглядит здоровым ровно до первого
    выката, перепланирования или рестарта узла, а потом сервис не поднимается, и связь
    с давним удалением объекта уже неочевидна. Отсюда правило — состояние кластера
    держать в git, а не править объекты руками.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

# --- architecture: junior/middle ---

- id: k8s-architecture-001
  domain: k8s
  subtopic: architecture
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Из каких компонентов состоит control plane и что делает каждый?
  answer: |
    `kube-apiserver` — единственная дверь ко всему; `etcd` — key-value хранилище,
    единственный источник истины; `kube-scheduler` — решает, на какой узел сажать под;
    `kube-controller-manager` — набор контроллеров, приводящих факт к желаемому.
    В облаке добавляется `cloud-controller-manager`.
  explanation: |
    Разделение построено вокруг apiserver: ни один компонент не ходит в etcd напрямую
    и не общается с другими напрямую — все читают и пишут через API. Отсюда единая точка
    для аутентификации, авторизации, аудита и валидации, и отсюда же следует, что
    падение apiserver парализует управление, хотя запущенные поды продолжают работать.
  ref: "https://kubernetes.io/docs/concepts/architecture/"

- id: k8s-architecture-002
  domain: k8s
  subtopic: architecture
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что работает на worker-узле?
  answer: |
    `kubelet` — агент, который берёт spec у apiserver, просит runtime запустить
    контейнеры и пишет status обратно; `kube-proxy` — программирует сетевые правила
    Service; container runtime (обычно `containerd`) — собственно запускает контейнеры.
  explanation: |
    Docker в этом списке нет с версии 1.24: kubelet общается с runtime по CRI, а Docker
    его не реализует напрямую. Полезно помнить, кто чей начальник: kubelet — единственный,
    кто реально запускает контейнеры, а scheduler и controller-manager только пишут
    объекты в API.
  ref: "https://kubernetes.io/docs/concepts/architecture/"

- id: k8s-architecture-003
  domain: k8s
  subtopic: architecture
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему никто не ходит в etcd напрямую?
  answer: |
    Потому что apiserver — единственное место, где выполняются аутентификация,
    авторизация, admission-проверки, валидация схемы и аудит. Запись мимо него
    обходит все гарантии разом и легко оставит кластер в невалидном состоянии.
  explanation: |
    etcd не знает ничего про Kubernetes — для него это просто ключи и значения.
    Вся семантика (что поле обязательно, что имя уникально, что у объекта есть владелец)
    живёт в apiserver. Плюс watch-механизм: контроллеры подписаны именно на apiserver,
    и запись мимо него они увидят не так, как ожидают.
  ref: "https://kubernetes.io/docs/concepts/overview/components/"

- id: k8s-architecture-004
  domain: k8s
  subtopic: architecture
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает `kube-scheduler`, когда выбрал узел для пода?
  answer: |
    Делает ровно **одну запись**: проставляет `spec.nodeName` у объекта пода
    (через подресурс binding). Больше ничего — контейнеры он не запускает.
  explanation: |
    Это шов между scheduler и kubelet: kubelet каждого узла следит за подами со своим
    `nodeName` и подхватывает всё, что там появилось. Отсюда следует, что под с заранее
    проставленным `nodeName` минует scheduler целиком, а падение scheduler'а не трогает
    уже работающие поды — новые просто зависают в `Pending`.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/"

- id: k8s-architecture-005
  domain: k8s
  subtopic: architecture
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Через какие три ступени проходит любой запрос к apiserver?
  answer: |
    Аутентификация (кто ты) → авторизация (можно ли тебе это, обычно RBAC) →
    admission (мутация и валидация объекта). Только после этого объект пишется в etcd.
  explanation: |
    Ступени решают разные задачи, и по сообщению об ошибке видно, какая сработала:
    `Unauthorized` — не опознали, `Forbidden` — опознали, но не разрешили, отказ
    от webhook'а — прошёл RBAC, но не понравился политике. Admission — единственная
    ступень, которая может **изменить** объект: так работают инъекции sidecar'ов.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/controlling-access/"

- id: k8s-architecture-006
  domain: k8s
  subtopic: architecture
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Упал etcd. Что произойдёт с уже работающими подами?
  options:
    a: "Продолжат работать; сломается управление кластером"
    b: "Будут остановлены — kubelet потеряет их спецификации"
    c: "Будут перепланированы на другие узлы"
    d: "Перейдут в статус Unknown и через 5 минут удалятся"
  answer: a
  explanation: |
    Контейнеры запущены runtime'ом на узле и от etcd не зависят: kubelet держит спеки
    в собственном кеше и продолжает следить за контейнерами. Перестаёт работать всё,
    что требует чтения или записи состояния — `kubectl`, выкаты, планирование новых подов,
    реакция на падение узла. Кластер становится «замороженным, но живым».
  ref: "https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/"

- id: k8s-architecture-007
  domain: k8s
  subtopic: architecture
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    В HA-кластере три реплики controller-manager. Не создадут ли они три ReplicaSet
    на один Deployment?
  answer: |
    Нет. Контроллеры используют leader election: активна ровно одна реплика, остальные
    стоят в горячем резерве и ждут, пока лидер перестанет продлевать аренду (Lease).
  explanation: |
    Это принципиально для reconcile-архитектуры: несколько контроллеров, одновременно
    приводящих один объект к желаемому состоянию, устроили бы гонку и дублирование.
    Отсюда же вывод про HA-control-plane вообще: три узла дают **отказоустойчивость,
    а не производительность** — работает всё равно один.
  ref: "https://kubernetes.io/docs/concepts/architecture/leases/"

- id: k8s-architecture-008
  domain: k8s
  subtopic: architecture
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое static pod и почему его нельзя удалить через `kubectl delete`?
  answer: |
    Это под, который kubelet запускает по файлу с узла (обычно из
    `/etc/kubernetes/manifests`), а не по объекту из API. В API он виден как mirror pod —
    зеркало, доступное только на чтение. Удалишь его — kubelet тут же создаст зеркало заново.
  explanation: |
    Так решается проблема курицы и яйца при загрузке кластера: apiserver сам запускается
    как static pod, ведь пока его нет, никакой API-объект создать невозможно. Чтобы
    убрать static pod по-настоящему, нужно удалить его манифест с файловой системы узла.
  ref: "https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/"

- id: k8s-architecture-009
  domain: k8s
  subtopic: architecture
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как по имени пода понять, кто его создал?
  answer: |
    `web-7d9f8c5b4-x2kfp` (два случайных сегмента) — Deployment через ReplicaSet;
    `web-0` (порядковый номер) — StatefulSet; `web-x2kfp` (один случайный сегмент) —
    DaemonSet или Job; `kube-apiserver-node1` (имя узла в конце) — static pod.
  explanation: |
    Полезный навык при разборе незнакомого кластера: имя сразу говорит, где искать
    владельца и что произойдёт при удалении пода. Средний сегмент у Deployment — это хеш
    pod-template, поэтому он меняется при каждом выкате: по нему видно, какие поды
    от какой версии.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/"

- id: k8s-architecture-010
  domain: k8s
  subtopic: architecture
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем оркестратор принципиально отличается от `docker compose` + Ansible?
  answer: |
    Compose и Ansible описывают, **что сделать сейчас**, и на этом их ответственность
    кончается. Kubernetes описывает, **что должно быть верно всегда**, и непрерывно
    приводит факт к этому состоянию сам.
  explanation: |
    Отсюда всё остальное: поднять упавшее, переселить поды с умершего узла, выкатить
    версию без даунтайма, добавить реплик под нагрузкой. С императивными инструментами
    каждое из этих действий — отдельный запуск, который кто-то должен инициировать.
    Куб — это петля, работающая без тебя.
  ref: "https://kubernetes.io/docs/concepts/overview/"

- id: k8s-architecture-011
  domain: k8s
  subtopic: architecture
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что происходит между `kubectl apply -f deploy.yaml` и запущенным контейнером?
  answer: |
    kubectl шлёт объект в apiserver → тот проводит его через authn/authz/admission
    и пишет в etcd → deployment-контроллер создаёт ReplicaSet → тот создаёт поды →
    scheduler проставляет им `nodeName` → kubelet нужного узла видит свой под и просит
    containerd запустить контейнеры.
  explanation: |
    Цепочка — это карта для диагностики: на каждом звене свой симптом. Объект не создался —
    RBAC или admission; под в `Pending` — scheduler не нашёл узел; под в
    `ContainerCreating` — kubelet не смог смонтировать том или сеть; `ImagePullBackOff` —
    runtime не достал образ. Отсюда правило: не гадать, а идти по цепочке сверху вниз.
  ref: "https://kubernetes.io/docs/concepts/overview/components/"

- id: k8s-architecture-012
  domain: k8s
  subtopic: architecture
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что даёт managed-кластер (GKE, EKS) и чего в нём нельзя?
  answer: |
    Провайдер держит control plane сам: обновляет, бэкапит etcd, обеспечивает HA.
    Взамен нет доступа к узлам control plane и к etcd, ограничен набор флагов apiserver
    и список admission-плагинов.
  explanation: |
    Практическое следствие для отладки: в managed-кластере нет смысла искать
    `kube-apiserver` среди подов — их не видно, а логи control plane приходят через
    систему логирования облака. Всё, что требует правки флагов apiserver или прямого
    доступа к etcd, в managed-кластере либо делается через API провайдера, либо
    не делается вовсе.
  ref: "https://kubernetes.io/docs/concepts/architecture/"

- id: k8s-architecture-013
  domain: k8s
  subtopic: architecture
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Откуда apiserver знает, кто ты, когда ты выполняешь `kubectl get pods`?
  answer: |
    Из `kubeconfig`: там лежит клиентский сертификат, токен или конфигурация OIDC.
    Личность зашита в эти учётные данные — Kubernetes не хранит пользователей у себя
    как объекты.
  explanation: |
    Отсюда особенность, которая удивляет: объекта User в API нет, «создать пользователя»
    нельзя. Есть только способ доказать личность (серт, токен, OIDC) и RBAC, который
    привязывает права к имени из этого доказательства. Для подов личность выдаётся иначе —
    токеном ServiceAccount, который kubelet монтирует в контейнер.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/authentication/"

# --- api-model: junior/middle ---

- id: k8s-api-model-001
  domain: k8s
  subtopic: api-model
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое `spec` и `status` у объекта Kubernetes?
  answer: |
    `spec` — желаемое состояние, его пишешь ты. `status` — фактическое состояние,
    его пишет контроллер. Работа контроллера — это бесконечное приведение status к spec.
  explanation: |
    Отсюда главное правило работы с кластером: не воюй с фактом — меняй желаемое.
    Убил под руками, а он вернулся, — значит `spec` контроллера выше по цепочке говорит,
    что подов должно быть N, и он прав. Менять надо `spec`, а не воевать со следствием.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/"

- id: k8s-api-model-002
  domain: k8s
  subtopic: api-model
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Какие четыре поля есть у любого объекта Kubernetes?
  answer: |
    `apiVersion`, `kind`, `metadata` (имя, namespace, метки, аннотации) и `spec`.
    У большинства объектов ещё и `status`, который заполняет контроллер.
  explanation: |
    Единообразие здесь не косметика: оно позволяет одному `kubectl` и одному apiserver
    работать с любым типом, включая те, которых в Kubernetes нет — CRD выглядят
    ровно так же. Отсюда же понятно, что расширение кластера своими типами не требует
    менять ядро.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/"

- id: k8s-api-model-003
  domain: k8s
  subtopic: api-model
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем `kubectl apply` отличается от `kubectl create`?
  answer: |
    `create` — императивная операция: создать, и если объект есть, упасть с ошибкой.
    `apply` — декларативная: привести объект к описанному состоянию, создав его или
    обновив.
  explanation: |
    Разница в идемпотентности: `apply` можно выполнять сколько угодно раз с тем же
    результатом, поэтому именно он лежит в основе GitOps. Он же умеет удалять поля,
    исчезнувшие из манифеста, — для этого apiserver хранит информацию о том, кто
    какими полями владеет.
  ref: "https://kubernetes.io/docs/tasks/manage-kubernetes-objects/declarative-config/"

- id: k8s-api-model-004
  domain: k8s
  subtopic: api-model
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как посмотреть, какие поля есть у ресурса, не открывая документацию?
  answer: |
    `kubectl explain <ресурс>` и глубже через точку: `kubectl explain deployment.spec.strategy`.
    Флаг `--recursive` покажет всё дерево полей сразу.
  explanation: |
    Схему отдаёт сам apiserver, поэтому ответ всегда соответствует **твоей** версии
    кластера — в отличие от документации в интернете, которая может описывать другую.
    Это же работает для CRD: `kubectl explain` покажет поля установленных операторов.
  ref: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_explain/"

- id: k8s-api-model-005
  domain: k8s
  subtopic: api-model
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Сделал `kubectl scale deploy/web --replicas=1`, через минуту реплик снова 3. Почему?
  answer: |
    Потому что желаемое состояние приехало обратно: скорее всего сработал GitOps-агент
    (Argo CD) или HPA, у которых свой источник правды. Ручное изменение факта проигрывает
    тому, кто владеет `spec`.
  explanation: |
    Это тот же принцип «не воюй с фактом», но на уровень выше: у объекта может быть
    внешний владелец, который непрерывно приводит его к своему представлению.
    Чинить надо там, где живёт правда — в git-репозитории или в настройках HPA,
    а не командой в кластере.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/"

- id: k8s-api-model-006
  domain: k8s
  subtopic: api-model
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое `ownerReferences` и что происходит при удалении владельца?
  answer: |
    Ссылка в `metadata` дочернего объекта на родителя. При удалении владельца garbage
    collector удаляет всех детей каскадно — так удаление Deployment уносит ReplicaSet,
    а тот поды.
  explanation: |
    Каскад объясняет, почему удалять надо с самого верха цепочки: удалишь только поды —
    ReplicaSet создаст новые, удалишь ReplicaSet — Deployment создаст новый. Режим
    можно менять: `--cascade=orphan` оставит детей сиротами, и они продолжат
    существовать без владельца.
  ref: "https://kubernetes.io/docs/concepts/architecture/garbage-collection/"

- id: k8s-api-model-007
  domain: k8s
  subtopic: api-model
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что означают `metadata.generation` и `status.observedGeneration`?
  answer: |
    `generation` растёт на каждое изменение `spec`. `observedGeneration` — та generation,
    которую контроллер уже обработал. Если они не совпали, изменение ещё не доехало.
  explanation: |
    Это машинный способ отличить «контроллер ещё не увидел мои правки» от «увидел, но
    не может их применить». Без него остаётся гадать, глядя на статус. На той же паре
    строится ожидание готовности в скриптах и в операторах.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/"

- id: k8s-api-model-008
  domain: k8s
  subtopic: api-model
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Удалённый под «воскрес». Это тот же под?
  answer: |
    Нет. Это **новый объект**: другое имя, другой UID, другой IP, пустая история.
    Контроллер не воскрешает под, он создаёт другой, чтобы их снова стало N.
  explanation: |
    Разница принципиальна для отладки: логи, события и состояние старого пода исчезли
    вместе с ним, `kubectl logs --previous` тут уже не поможет. Поэтому упавший под,
    который нужно исследовать, «замораживают» — снимают с него selector-метку, чтобы
    контроллер потерял его и создал замену, а больной экземпляр остался нетронутым.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/"

- id: k8s-api-model-009
  domain: k8s
  subtopic: api-model
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что значит запись `apps/v1` в `apiVersion` и бывает ли пусто перед версией?
  answer: |
    Это группа API и её версия. Ядро (Pod, Service, ConfigMap) живёт в «пустой» группе
    и пишется просто `v1`. Всё остальное — в именованных группах: `apps/v1`,
    `batch/v1`, `networking.k8s.io/v1`.
  explanation: |
    Группы позволяют развивать разные части API независимо и постепенно выводить старые
    версии: `v1beta1` может исчезнуть в следующем релизе, `v1` — нет. Отсюда типичная
    поломка при обновлении кластера: манифест с устаревшей версией перестаёт
    приниматься, хотя ресурс никуда не делся.
  ref: "https://kubernetes.io/docs/reference/using-api/"

- id: k8s-api-model-010
  domain: k8s
  subtopic: api-model
  difficulty: middle
  source: theory
  type: mcq
  verified: false
  prompt: |
    Где императивные команды (`kubectl scale`, `kubectl edit`) остаются легитимными?
  options:
    a: "При отладке и в инцидентах, когда важна скорость реакции"
    b: "Всегда — это самый быстрый способ управлять кластером"
    c: "Нигде, любая императивная команда — антипаттерн"
    d: "Только в managed-кластерах, где нет доступа к манифестам"
  answer: a
  explanation: |
    Императив плох не сам по себе, а как **источник правды**: изменение, живущее только
    в памяти кластера, теряется при следующем `apply` и не воспроизводится при
    пересоздании. В инциденте, когда надо срочно погасить нагрузку, это приемлемо —
    при условии, что потом то же изменение поедет в git. Антипаттерн — `kubectl edit`
    как штатный способ выката.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/"

- id: k8s-api-model-011
  domain: k8s
  subtopic: api-model
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Почему контроллеры устроены как бесконечный цикл, а не как реакция на событие?
  answer: |
    Потому что событие можно пропустить: сеть моргнула, контроллер перезапустился,
    watch оборвался. Цикл сверки текущего состояния с желаемым самовосстанавливается —
    пропущенное изменение будет замечено на следующем витке.
  explanation: |
    Это называется level-triggered в противоположность edge-triggered: контроллер
    смотрит на **состояние**, а не на факт изменения. Watch-события служат лишь
    оптимизацией — они ускоряют реакцию, но корректность на них не завязана.
    Отсюда устойчивость кластера к рестартам собственных компонентов.
  ref: "https://kubernetes.io/docs/concepts/architecture/controller/"

- id: k8s-api-model-012
  domain: k8s
  subtopic: api-model
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Объект принят кластером без ошибок. Значит ли это, что механизм заработал?
  answer: |
    Нет. Валидация проверяет **форму** объекта, а не наличие исполнителя. Ingress без
    ingress-controller, PVC без StorageClass, HPA без metrics-server создадутся молча
    и не будут делать ничего.
  explanation: |
    Это следствие декларативной модели: запись в etcd и её исполнение — разные события.
    Поэтому после создания всегда смотрят на `status` и на события объекта, а не
    на факт успешного `apply`. «Принято» означает лишь «понято», но не «сделано».
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/"

# --- labels-selectors: junior/middle ---

- id: k8s-labels-selectors-001
  domain: k8s
  subtopic: labels-selectors
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем label отличается от annotation?
  answer: |
    По label **ищут и выбирают** — это индексируемый ключ, по которому работают
    селекторы. Annotation ищут нельзя: это прицепленные данные для людей и инструментов.
  explanation: |
    Разница не стилистическая, а функциональная: селекторы Service, Deployment и
    `kubectl get -l` работают только с labels. Проверочный вопрос при выборе:
    «я буду по этому что-то выбирать?» Да — label. Нет, это просто данные для
    cert-manager или ingress-контроллера — annotation.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/"

- id: k8s-labels-selectors-002
  domain: k8s
  subtopic: labels-selectors
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Какие ограничения у селектора Service по сравнению с селектором Deployment?
  answer: |
    Селектор Service понимает **только равенство** (`app: web`). Deployment и другие
    контроллеры умеют ещё и множественные выражения: `matchExpressions` с `In`, `NotIn`,
    `Exists`, `DoesNotExist`.
  explanation: |
    Ограничение историческое, но живое: попытка описать в Service выбор «всё, кроме
    canary» просто не выразима, и разделять трафик приходится дополнительной меткой
    вроде `track: stable`. Знать это полезно, чтобы не искать несуществующий синтаксис.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/"

- id: k8s-labels-selectors-003
  domain: k8s
  subtopic: labels-selectors
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Какие метки принято ставить для верхнеуровневой идентификации приложения?
  answer: |
    Рекомендованный набор `app.kubernetes.io/*`: `name`, `instance`, `version`,
    `component`, `part-of`, `managed-by`.
  explanation: |
    Смысл соглашения — чтобы чужие инструменты (дашборды, оператор, сборщик метрик)
    понимали твой кластер без настройки. Важно не путать эти метки с selector-метками
    контроллера: `version` меняется при каждом релизе, и селектор по нему сломался бы
    при первом же выкате.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/common-labels/"

- id: k8s-labels-selectors-004
  domain: k8s
  subtopic: labels-selectors
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    У Deployment 3 реплики. Ты навесил его selector-метку на посторонний под вручную.
    Сколько подов останется?
  options:
    a: "3 — Deployment удалит лишний под, чтобы сошлось число"
    b: "4 — посторонний под просто добавится к трём"
    c: "3, но Deployment пересоздаст все поды заново"
    d: "4 — и Deployment перестанет управлять своими подами"
  answer: a
  explanation: |
    Принадлежность к контроллеру вычисляется **каждый тик** по совпадению селектора,
    а не фиксируется при создании. ReplicaSet видит четыре подходящих пода вместо трёх
    и убирает лишний — причём необязательно чужой, выбор идёт по внутренним правилам.
    Обратная операция работает так же: снял метку — под осиротел, и контроллер
    немедленно создал ему замену.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/"

- id: k8s-labels-selectors-005
  domain: k8s
  subtopic: labels-selectors
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как «заморозить» больной под в проде для разбора, не останавливая сервис?
  answer: |
    Снять с него selector-метку (`kubectl label pod <name> app-`). Под выпадет
    из Service и из-под контроля ReplicaSet, тот создаст замену, а больной экземпляр
    останется живым и нетронутым.
  explanation: |
    Приём работает ровно потому, что принадлежность вычисляется по метке в реальном
    времени. Он бьёт сразу в две цели: под перестаёт получать трафик и перестаёт быть
    кандидатом на удаление. Альтернатива — удалить под — уничтожает всё состояние,
    ради которого разбор и затевался.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/"

- id: k8s-labels-selectors-006
  domain: k8s
  subtopic: labels-selectors
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему `spec.selector` у Deployment нельзя изменить после создания?
  answer: |
    Он иммутабелен. Смена селектора оторвала бы контроллер от его текущих подов:
    старые осиротели бы, новые создались с нуля — то есть неуправляемый даунтайм.
    Единственный путь — создать новый Deployment.
  explanation: |
    Это защита от операции, у которой нет безопасного исхода: Kubernetes не умеет
    атомарно «переподписать» существующие поды на новый селектор. Отсюда практический
    вывод — selector-метки выбираются один раз и делаются минимальными и стабильными
    (`app: web`), а всё изменчивое живёт в других метках.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"

- id: k8s-labels-selectors-007
  domain: k8s
  subtopic: labels-selectors
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    `EndpointSlice` сервиса пуст, поды при этом здоровы. Первая гипотеза?
  answer: |
    Разъехались селектор Service и метки подов — опечатка или лишняя метка в одном
    из двух мест. Вторая по частоте причина — поды не проходят readiness.
  explanation: |
    Kubernetes здесь принципиально молчалив: селектор, который ничему не соответствует,
    полностью валиден — может быть, поды появятся позже. Ошибки не будет нигде, будет
    просто пустота. Проверяется мгновенно: `kubectl get pods -l <селектор из Service>` —
    если вывод пуст, вопрос закрыт.
  ref: "https://kubernetes.io/docs/concepts/services-networking/service/"

- id: k8s-labels-selectors-008
  domain: k8s
  subtopic: labels-selectors
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Под оброс контейнером, которого нет в манифесте. Кто его добавил?
  answer: |
    Mutating admission webhook — он вклинивается между авторизацией и записью в etcd
    и может изменять объект. Так работают инъекции sidecar'ов у service mesh
    и агентов секретов, обычно по метке или аннотации namespace.
  explanation: |
    Отсюда важное следствие: то, что лежит в etcd, может отличаться от того, что ты
    применил, — сравнивать надо `kubectl get -o yaml`, а не свой файл. Вторая половина
    механизма, validating webhook, объект не меняет, а только выносит вердикт да/нет.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/admission-controllers/"

# --- cluster-dns: junior/middle ---

- id: k8s-cluster-dns-001
  domain: k8s
  subtopic: cluster-dns
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Откуда под знает адрес DNS-сервера кластера?
  answer: |
    `/etc/resolv.conf` внутрь пода пишет **kubelet** при запуске. Туда попадает ClusterIP
    сервиса `kube-dns`, список `search`-доменов и опция `ndots`.
  explanation: |
    Из образа этот файл не берётся и приложением не настраивается — поэтому «поправить
    DNS в Dockerfile» бессмысленно. Настройка меняется через `dnsPolicy` и `dnsConfig`
    в спеке пода. Важно и то, что сервис `kube-dns` имеет фиксированный ClusterIP:
    иначе поды не знали бы, куда обращаться при пересоздании CoreDNS.
  ref: "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"

- id: k8s-cluster-dns-002
  domain: k8s
  subtopic: cluster-dns
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как выглядит полное DNS-имя сервиса внутри кластера?
  answer: |
    `<service>.<namespace>.svc.cluster.local`. Например `payments.prod.svc.cluster.local`.
  explanation: |
    Из структуры имени видно устройство пространства имён: сервисы одного namespace
    не конфликтуют с сервисами другого, потому что namespace входит в имя. Короткая
    форма работает только благодаря `search`-доменам в `resolv.conf`, и она всегда
    относительна namespace **спрашивающего** пода.
  ref: "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"

- id: k8s-cluster-dns-003
  domain: k8s
  subtopic: cluster-dns
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое CoreDNS с точки зрения кластера?
  answer: |
    Обычный Deployment из нескольких подов в `kube-system`, стоящий за Service с
    фиксированным ClusterIP. Он следит за объектами Service и Pod через apiserver
    и отвечает на запросы по ним.
  explanation: |
    Отсюда двойственность: с одной стороны, это рядовая нагрузка, которая может упасть,
    вытесниться или упереться в лимиты; с другой — от неё зависит **всё** в кластере,
    потому что приложения ходят друг к другу по именам. Поэтому CoreDNS мониторят
    как критичный компонент, а не как обычный под.
  ref: "https://kubernetes.io/docs/tasks/administer-cluster/coredns/"

- id: k8s-cluster-dns-004
  domain: k8s
  subtopic: cluster-dns
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Под из namespace `staging` обращается к `payments` и попадает не туда.
    Что произошло?
  answer: |
    Короткое имя резолвится относительно namespace **спрашивающего**: из `staging`
    оно превратилось в `payments.staging.svc.cluster.local`. Для обращения в другой
    namespace нужно как минимум `payments.prod`.
  explanation: |
    Это следствие `search`-списка в `resolv.conf`, первым элементом которого стоит
    собственный namespace пода. Опасность в том, что при наличии одноимённого сервиса
    рядом ошибки не будет вообще — запрос молча уйдёт не в тот контур. Поэтому
    кросс-namespace обращения пишут явным FQDN.
  ref: "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"

- id: k8s-cluster-dns-005
  domain: k8s
  subtopic: cluster-dns
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает опция `ndots:5` и почему из-за неё растёт нагрузка на DNS?
  answer: |
    Имена, содержащие меньше пяти точек, сначала проверяются по всем `search`-доменам
    и только потом как абсолютные. Для `api.github.com` (две точки) это означает
    четыре бесполезных запроса перед правильным.
  explanation: |
    Значение выбрано ради удобства коротких имён внутри кластера, а расплачиваются
    за него внешние вызовы. Заметно это на сервисах, которые часто ходят в интернет:
    лишние запросы дают и задержку, и лишнюю нагрузку на CoreDNS. Лечится точкой
    в конце имени (`api.github.com.`) или собственным `ndots` в `dnsConfig` пода.
  ref: "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"

- id: k8s-cluster-dns-006
  domain: k8s
  subtopic: cluster-dns
  difficulty: middle
  source: theory
  type: mcq
  verified: false
  prompt: |
    CoreDNS полностью недоступен. Что произойдёт с уже установленными
    TCP-соединениями между сервисами?
  options:
    a: "Останутся живыми: резолв нужен только при установке соединения"
    b: "Разорвутся сразу — маршрутизация внутри кластера идёт через DNS"
    c: "Останутся живыми, но балансировка перестанет работать"
    d: "Разорвутся по истечении TTL DNS-записи"
  answer: a
  explanation: |
    Имя превращается в IP один раз, перед подключением; дальше пакеты ходят по адресам,
    и DNS в этом не участвует. Поэтому симптом падения CoreDNS специфический: старые
    соединения работают, а любая новая попытка подключиться падает с ошибкой резолва.
    Разделять «имя → IP» и «IP → под» — разные слои — тут принципиально.
  ref: "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"

- id: k8s-cluster-dns-007
  domain: k8s
  subtopic: cluster-dns
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что вернёт DNS-запрос к headless-сервису?
  answer: |
    Список A-записей — IP всех готовых подов, а не один ClusterIP. Для StatefulSet
    дополнительно доступны персональные имена вида `web-0.<service>.<ns>.svc.cluster.local`.
  explanation: |
    Так DNS становится механизмом обнаружения участников: клиент сам видит все
    экземпляры и решает, к какому идти. На этом строятся клиентская балансировка gRPC
    и кластеризация БД, где нужно отличать primary от реплик. У обычного сервиса
    такой возможности нет — он всегда отвечает одним виртуальным адресом.
  ref: "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"

- id: k8s-cluster-dns-008
  domain: k8s
  subtopic: cluster-dns
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Почему внутри кластера обращаются по имени сервиса, а не по его ClusterIP?
  answer: |
    ClusterIP выдаётся при создании Service и меняется при его пересоздании, а имя
    стабильно. Захардкоженный адрес переживёт ровно до первого пересоздания сервиса.
  explanation: |
    Симптом при этом крайне неприятный: приложение долго работает, а после безобидного
    `kubectl delete svc && apply` начинает стучаться в никуда — соединение просто виснет,
    потому что старый адрес больше никому не принадлежит. Имя же резолвится заново
    при каждом подключении.
  ref: "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"

# --- ingress: junior/middle ---

- id: k8s-ingress-001
  domain: k8s
  subtopic: ingress
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем Ingress отличается от ingress-controller?
  answer: |
    Ingress — это **правило**, объект в etcd: какой домен и путь ведут в какой сервис.
    Ingress-controller — под-исполнитель (обычно nginx или подобное), который следит
    за этими объектами и превращает их в свою конфигурацию.
  explanation: |
    Разделение объясняет самый частый симптом: Ingress создался, `kubectl get ingress`
    его показывает, а ничего не работает и колонка `ADDRESS` пуста — контроллера
    в кластере просто нет. Правило без исполнителя остаётся текстом в базе.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-ingress-002
  domain: k8s
  subtopic: ingress
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем нужен Ingress, если есть Service типа LoadBalancer?
  answer: |
    Экономика и возможности: каждый LoadBalancer-сервис — это отдельный балансировщик
    облака с отдельным IP и отдельным счётом. Ingress даёт **один** вход на десятки
    доменов плюс маршрутизацию по путям, TLS-терминацию и заголовки.
  explanation: |
    Разница ещё и в слое: Service работает на L4 и видит только адреса и порты, а Ingress
    на L7 и читает домен и путь. Всё, что требует понимания HTTP — раздача по путям,
    редиректы, единый сертификат на домен — на L4 невыразимо в принципе.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-ingress-003
  domain: k8s
  subtopic: ingress
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что задаёт `ingressClassName` в манифесте Ingress?
  answer: |
    Какой именно контроллер должен обработать это правило. В кластере их может быть
    несколько (внешний и внутренний nginx, облачный контроллер), и каждый берёт
    только свой класс.
  explanation: |
    Без указания класса правило может не подобрать никто — и симптом будет тот же,
    что при полном отсутствии контроллера: объект есть, `ADDRESS` пуст. В кластере
    может быть класс по умолчанию, помеченный аннотацией, но полагаться на него
    в манифестах — источник сюрпризов при переезде между кластерами.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-ingress-004
  domain: k8s
  subtopic: ingress
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Где должен лежать TLS-секрет, на который ссылается Ingress?
  answer: |
    В **том же namespace**, что и сам Ingress, и быть типа `kubernetes.io/tls`
    с ключами `tls.crt` и `tls.key`.
  explanation: |
    Ограничение namespace здесь — граница безопасности: иначе любой Ingress мог бы
    прочитать чужой приватный ключ. Практическое следствие — при нескольких namespace
    один и тот же wildcard-сертификат приходится размножать, чем обычно занимается
    отдельный контроллер репликации секретов.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-ingress-005
  domain: k8s
  subtopic: ingress
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Куда ingress-controller отправляет запрос — на ClusterIP сервиса или на IP пода?
  answer: |
    Напрямую на **IP подов**, которые он берёт из `EndpointSlice`. ClusterIP
    и kube-proxy при этом не участвуют.
  explanation: |
    Отсюда два следствия. Первое: балансирует контроллер сам, на L7, то есть по запросам,
    а не по соединениям — поэтому за Ingress gRPC размазывается по репликам нормально.
    Второе: составом upstream управляет readiness подов, и обновляется он на лету,
    без перезагрузки nginx.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress-controllers/"

- id: k8s-ingress-006
  domain: k8s
  subtopic: ingress
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    От Ingress прилетает `502`, а не `404`. О чём это говорит?
  options:
    a: "Правило нашлось, но upstream не ответил или ответил мусором"
    b: "Правило не нашлось: не тот домен или путь"
    c: "Сертификат не подошёл к запрошенному домену"
    d: "Ingress-controller не установлен в кластере"
  answer: a
  explanation: |
    Код ошибки указывает на слой, где всё сломалось, и это экономит половину диагностики.
    `404` от nginx означает, что запрос дошёл, но не подошёл ни к одному правилу —
    проблема в `host`, `path` или классе. `502` означает, что правило сработало
    и контроллер пошёл в upstream — значит смотреть надо в поды: readiness, порт,
    приложение.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-ingress-007
  domain: k8s
  subtopic: ingress
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как тридцать HTTPS-доменов на одном IP выбирают нужный сертификат, если TLS
    устанавливается **раньше**, чем сервер видит HTTP-заголовки?
  answer: |
    По SNI: имя домена клиент передаёт открытым текстом в `ClientHello`, ещё
    до шифрования. Контроллер по нему выбирает сертификат, и только потом,
    внутри установленного TLS, читает `Host` и маршрутизирует.
  explanation: |
    Без SNI один IP мог бы обслуживать только один HTTPS-сайт — исторически так и было.
    Порядок здесь важен и на собесе: сначала SNI выбирает **сертификат**, затем
    заголовок `Host` выбирает **правило**. Это два разных имени в двух разных местах,
    и они могут не совпасть.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-ingress-008
  domain: k8s
  subtopic: ingress
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Браузер показывает `Fake Certificate` при заходе на домен через nginx-ingress.
    Что это значит?
  answer: |
    Что для запрошенного домена nginx не нашёл подходящего TLS-секрета и отдал
    свой самоподписанный дефолтный сертификат. Обычно секрета нет, он в другом
    namespace или домен в `spec.tls` не совпадает с запрошенным.
  explanation: |
    Отдавать заглушку, а не рвать соединение — сознательное поведение: так проблема
    выглядит как ошибка сертификата в браузере, а не как «сайт недоступен», и её проще
    диагностировать. Если сертификаты выписывает cert-manager, смотреть надо на объекты
    `Certificate` и `Order` — секрет появляется только после успешной валидации.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-ingress-009
  domain: k8s
  subtopic: ingress
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Сайт за Cloudflare в режиме Flexible уходит в `ERR_TOO_MANY_REDIRECTS`. Почему?
  answer: |
    Cloudflare ходит в origin по HTTP, а nginx-ingress по умолчанию редиректит HTTP
    на HTTPS. Cloudflare получает редирект, снова идёт по HTTP — цикл. Лечится
    отключением `ssl-redirect` или переводом Cloudflare в режим Full.
  explanation: |
    Корень в том, что TLS здесь терминируется **дважды**: браузер → Cloudflare
    и Cloudflare → origin, и это два независимых сертификата и два независимых решения
    про схему. Origin не видит, что клиент пришёл по HTTPS, и честно пытается его
    туда отправить.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-ingress-010
  domain: k8s
  subtopic: ingress
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Аннотация в Ingress написана с опечаткой в ключе. Что произойдёт?
  answer: |
    Ничего — ни ошибки, ни предупреждения. Аннотации не валидируются: контроллер просто
    не найдёт ожидаемый ключ и применит поведение по умолчанию.
  explanation: |
    Это цена того, что аннотации — свободное поле для расширений: apiserver не знает,
    какие ключи понимает конкретный контроллер, и проверить их не может. Отсюда
    практика — сверять ключи с документацией **своего** контроллера и проверять
    результат, а не факт применения манифеста.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/"

- id: k8s-ingress-011
  domain: k8s
  subtopic: ingress
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Ingress умеет маршрутизировать не-HTTP трафик, например Postgres или SMTP?
  answer: |
    Нет. Ingress API описывает только HTTP и HTTPS. Проброс произвольного TCP или UDP
    делается нестандартными средствами конкретного контроллера или через
    Service типа LoadBalancer.
  explanation: |
    Ограничение вытекает из модели: правила Ingress состоят из `host` и `path`,
    а этих понятий у обычного TCP нет. Именно эта негибкость — одна из причин появления
    Gateway API, где транспорт и протокол описываются явно и расширяемо.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-ingress-012
  domain: k8s
  subtopic: ingress
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что Gateway API даёт такого, чего не даёт Ingress?
  answer: |
    Разделение ролей и типизацию: инфраструктурная команда владеет `GatewayClass`
    и `Gateway`, а команды приложений — своими `HTTPRoute`. Возможности (заголовки,
    веса, зеркалирование, не-HTTP протоколы) описаны полями API, а не аннотациями.
  explanation: |
    Ingress упёрся в собственную простоту: всё, что выходило за host и path, уезжало
    в аннотации, а те у каждого контроллера свои и не переносятся между реализациями.
    Gateway API — официальный преемник, но Ingress не объявлен устаревшим и в проде
    его всё ещё большинство.
  ref: "https://kubernetes.io/docs/concepts/services-networking/gateway/"

- id: k8s-ingress-013
  domain: k8s
  subtopic: ingress
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Все поды приложения в статусе `Running`, но Ingress отдаёт `503`.
    Что проверять первым?
  answer: |
    `kubectl get endpointslice` для этого сервиса. `Running` не означает `Ready`:
    скорее всего поды не проходят readiness, и список бэкендов пуст.
  explanation: |
    `Running` — это фаза пода, она говорит лишь о том, что контейнеры запущены.
    В endpoints попадают только **готовые** поды, а ingress-controller берёт upstream
    именно оттуда. Поэтому цепочка проверки идёт не от логов приложения,
    а от состава endpoints: пусто — вопрос к readiness и меткам, не пусто — вопрос
    к самому приложению.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

# --- storage: junior/middle ---

- id: k8s-storage-001
  domain: k8s
  subtopic: storage
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Сколько живёт `emptyDir` и что его переживает?
  answer: |
    Ровно столько же, сколько под. Рестарт **контейнера** он переживает, удаление
    или переезд пода — нет: данные исчезают вместе с подом.
  explanation: |
    Границу «контейнер» и «под» тут путают чаще всего. Том создаётся при создании пода
    и живёт в его sandbox, поэтому упавший и перезапущенный контейнер находит файлы
    на месте. А вот новый под — это другой объект, и `emptyDir` у него пустой.
    Отсюда область применения: кеш, обмен файлами между контейнерами, временные файлы —
    но не данные.
  ref: "https://kubernetes.io/docs/concepts/storage/volumes/"

- id: k8s-storage-002
  domain: k8s
  subtopic: storage
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как распределены роли между PV, PVC и StorageClass?
  answer: |
    PVC — **заявка** от приложения: сколько места и с каким режимом доступа.
    PV — конкретный кусок хранилища. StorageClass — рецепт, по которому PV создаётся
    автоматически под заявку.
  explanation: |
    Разделение отвязывает приложение от инфраструктуры: манифест просит «10 гигабайт
    RWO», не зная, будет это диск GCP, Ceph или NFS. Поэтому один и тот же чарт едет
    в разные кластеры без правок — меняется только StorageClass, и обычно он вообще
    не указан и берётся дефолтный.
  ref: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"

- id: k8s-storage-003
  domain: k8s
  subtopic: storage
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое динамический провижининг?
  answer: |
    Создание PV **по факту заявки**: появился PVC со StorageClass — CSI-драйвер сам
    заказал диск у облака или СХД и связал его с заявкой. Администратору не нужно
    готовить тома заранее.
  explanation: |
    Без него работал бы статический сценарий: админ вручную создаёт PV, а PVC потом
    к ним подбираются по размеру и режиму — медленно и с постоянными несовпадениями.
    Динамика — причина, по которой `volumeClaimTemplates` у StatefulSet просто работает:
    отскейлил до пяти реплик, получил пять новых дисков.
  ref: "https://kubernetes.io/docs/concepts/storage/dynamic-provisioning/"

- id: k8s-storage-004
  domain: k8s
  subtopic: storage
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Какие бывают `accessModes` у PVC?
  answer: |
    `ReadWriteOnce` (RWO) — монтируется на **одном узле**; `ReadOnlyMany` (ROX) —
    только чтение с многих узлов; `ReadWriteMany` (RWX) — чтение и запись с многих узлов;
    `ReadWriteOncePod` — ровно один под.
  explanation: |
    Режим — не пожелание, а свойство драйвера: обычный блочный диск физически
    не подключается к двум виртуалкам сразу, поэтому у него только RWO. RWX требует
    сетевой файловой системы (NFS, CephFS, Filestore), и она есть далеко не везде —
    отсюда постоянные сюрпризы при переносе манифестов между кластерами.
  ref: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"

- id: k8s-storage-005
  domain: k8s
  subtopic: storage
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Deployment с тремя репликами и одним RWO-PVC. Что произойдёт?
  options:
    a: "Поды на одном узле поднимутся, на других — зависнут с Multi-Attach error"
    b: "Все три пода поднимутся: RWO ограничивает одного писателя, а не монтирование"
    c: "Ни один под не поднимется: RWO разрешает ровно один под"
    d: "Поды поднимутся, но том будет доступен только на чтение"
  answer: a
  explanation: |
    RWO — это «один **узел**», а не «один под»: несколько подов на одном и том же узле
    спокойно разделят такой том. Проблема начинается, когда scheduler разносит реплики
    по разным узлам — второй узел не может подключить уже подключённый диск, и под
    зависает с `Multi-Attach error`. Отсюда правило: stateful-нагрузка — это StatefulSet
    с `volumeClaimTemplates`, где у каждой реплики свой том.
  ref: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"

- id: k8s-storage-006
  domain: k8s
  subtopic: storage
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает `volumeBindingMode: WaitForFirstConsumer` и зачем это нужно?
  answer: |
    Откладывает создание и привязку тома до момента, когда scheduler выберет узел
    для пода. При дефолтном `Immediate` диск создаётся сразу, ещё до планирования.
  explanation: |
    Проблема, которую это решает, — зональность: диск в облаке принадлежит конкретной
    зоне, и если он создан заранее в зоне `a`, под уже не сможет уехать в зону `b`.
    При `Immediate` получается замкнутый круг: том выбрал зону, а свободные ресурсы
    оказались в другой, и под навсегда в `Pending`. Ожидание переворачивает порядок:
    сначала узел, потом диск рядом с ним.
  ref: "https://kubernetes.io/docs/concepts/storage/storage-classes/"

- id: k8s-storage-007
  domain: k8s
  subtopic: storage
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Чем `reclaimPolicy: Delete` отличается от `Retain` и где это больно?
  answer: |
    `Delete` — вместе с PVC уничтожается PV и **сам диск с данными**. `Retain` — том
    остаётся, данные целы, но повторно использовать его нужно вручную.
    У большинства облачных StorageClass по умолчанию стоит `Delete`.
  explanation: |
    Опасность в том, что удаление выглядит безобидно: `kubectl delete pvc` — обычная
    команда над обычным объектом, а уносит она реальные данные без подтверждения
    и без корзины. Для всего, что дороже кеша, StorageClass берут с `Retain` —
    и это единственный момент, когда решение можно принять, потому что политика
    у существующего PV меняется, а прошлое уже не вернуть.
  ref: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"

- id: k8s-storage-008
  domain: k8s
  subtopic: storage
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Удалил PVC, а он висит в `Terminating` и не исчезает. Почему?
  answer: |
    На нём финализатор `kubernetes.io/pvc-protection`: пока PVC используется живым подом,
    удаление не завершается. Объект уйдёт, когда пода не останется.
  explanation: |
    Финализатор — это протокол удаления, а не баг: apiserver помечает объект
    `deletionTimestamp` и ждёт, пока ответственный контроллер снимет свою метку.
    Так предотвращается ситуация «том выдернули из-под работающей базы». Снимать
    финализатор руками — крайняя мера, которая ровно эту защиту и отключает.
  ref: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"

- id: k8s-storage-009
  domain: k8s
  subtopic: storage
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает `volumeClaimTemplates` у StatefulSet?
  answer: |
    Создаёт **отдельный PVC на каждую реплику** по шаблону, с именем, привязанным
    к имени пода. `web-0` всегда получает свой том, `web-1` — свой, и после
    пересоздания под находит именно тот, что был у него раньше.
  explanation: |
    Это техническая основа «стабильной идентичности» StatefulSet: без неё все реплики
    претендовали бы на один PVC из шаблона пода, что для RWO невозможно, а для базы
    данных бессмысленно. Обратная сторона — при уменьшении числа реплик тома
    не удаляются: они ждут возвращения пода с тем же номером.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"

- id: k8s-storage-010
  domain: k8s
  subtopic: storage
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Коллега снёс StatefulSet, а потом PVC. В какой момент погибли данные?
  answer: |
    При удалении PVC — и то лишь если у StorageClass `reclaimPolicy: Delete`.
    Удаление самого StatefulSet тома не трогает вообще.
  explanation: |
    Цепочка ответственности здесь трёхэтажная: StatefulSet → PVC → PV с диском, и
    каскадного удаления вниз по ней нет **специально**. Это единственная защита данных,
    встроенная в модель, и снимается она одной командой над PVC. Вывод простой: PVC —
    самый опасный объект в кластере, а снапшоты CSI и живой PVC бэкапом не являются.
  ref: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"

- id: k8s-storage-011
  domain: k8s
  subtopic: storage
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    PVC — это бэкап?
  answer: |
    Нет. Это подключённый рабочий диск: удаление данных приложением, повреждение
    файловой системы или `DROP TABLE` доедут до него мгновенно. Снапшот CSI ближе,
    но живёт в той же системе хранения, что и оригинал.
  explanation: |
    Бэкап определяется не технологией, а изоляцией: копия должна лежать отдельно
    от источника, переживать его полную потерю и быть проверенной восстановлением.
    Реплика и снапшот защищают от отказа железа, но не от ошибки человека
    и не от удаления всего проекта в облаке.
  ref: "https://kubernetes.io/docs/concepts/storage/volume-snapshots/"

- id: k8s-storage-012
  domain: k8s
  subtopic: storage
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Диск кончается. Можно ли расширить существующий PVC?
  answer: |
    Только если у StorageClass стоит `allowVolumeExpansion: true`. Тогда достаточно
    увеличить `spec.resources.requests.storage` в PVC. Уменьшить том нельзя никогда.
  explanation: |
    Флаг проверяется в момент правки PVC, а не при создании тома, поэтому забытый
    `allowVolumeExpansion` обнаруживается ровно тогда, когда место уже кончилось
    и что-то делать поздно. Само расширение состоит из двух шагов — увеличить том
    и растянуть файловую систему; второй у некоторых драйверов требует перезапуска пода.
  ref: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"

- id: k8s-storage-013
  domain: k8s
  subtopic: storage
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем опасен `hostPath` и когда он всё-таки уместен?
  answer: |
    Он монтирует каталог **узла**, поэтому под привязывается к конкретной машине,
    а данные не переезжают вместе с ним. Плюс это прямая дыра в изоляции: доступ
    к файловой системе узла. Уместен для системных DaemonSet — сбор логов, метрики узла.
  explanation: |
    Коварство в том, что на одноузловом кластере `hostPath` работает прекрасно и создаёт
    ложное ощущение рабочего решения. На нескольких узлах под уезжает и обнаруживает
    пустой каталог. Для локального хранилища с гарантиями существует отдельный механизм —
    `local` PV, который хотя бы привязывает под к нужному узлу явно.
  ref: "https://kubernetes.io/docs/concepts/storage/volumes/"

- id: k8s-storage-014
  domain: k8s
  subtopic: storage
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Откуда в кластере берутся осиротевшие PVC и чем они плохи?
  answer: |
    Из уменьшения реплик StatefulSet и из удалённых нагрузок: тома не удаляются вместе
    с контроллером. Плохи тем, что за каждый диск капает счёт, а по имени PVC уже
    не понять, нужен он или нет.
  explanation: |
    Это прямое следствие защиты данных — Kubernetes сознательно не удаляет тома
    каскадно. Расплата в том, что уборка становится ручной задачей, о которой никто
    не помнит. Практика: `kubectl get pvc -A` в регулярный чек-лист и осмысленные
    метки на PVC, чтобы через полгода можно было понять происхождение диска.
  ref: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"

# --- cluster-networking: junior/middle ---

- id: k8s-cluster-networking-001
  domain: k8s
  subtopic: cluster-networking
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Kubernetes сам создаёт сеть между подами на разных узлах?
  answer: |
    Нет. Он только **задаёт требования**: у каждого пода свой IP, поды видят друг друга
    напрямую без NAT, узлы видят поды. Реализует это CNI-плагин, который ставится отдельно.
  explanation: |
    Отсюда состояние свежего кластера: узлы в `NotReady`, поды в `ContainerCreating`,
    пока не установлен CNI — и это не поломка, а незавершённая установка. Отсюда же
    возможность выбирать реализацию под свою сеть: Calico, Cilium, Flannel решают одну
    задачу очень по-разному.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/networking/"

- id: k8s-cluster-networking-002
  domain: k8s
  subtopic: cluster-networking
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    CNI — это одна сущность или две?
  answer: |
    Две. **Плагин** — короткоживущий бинарник на диске узла, который containerd
    вызывает на создание пода, чтобы выдать адрес и настроить интерфейс.
    **Агент** — постоянно работающий DaemonSet, который занимается маршрутизацией
    между узлами.
  explanation: |
    Разделение объясняет разные симптомы отказа. Сломан бинарник — поды не создаются
    вообще, зависают в `ContainerCreating`, ошибка видна сразу. Умер агент — новые поды
    создаются нормально, но перестают быть доступными с других узлов: отказ отложенный
    и потому куда более коварный.
  ref: "https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/"

- id: k8s-cluster-networking-003
  domain: k8s
  subtopic: cluster-networking
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает `hostNetwork: true` и чем за это платишь?
  answer: |
    Под получает сетевой namespace **узла**: его процессы слушают прямо на адресе узла,
    отдельного pod IP нет. Плата — конфликты портов между подами и потеря сетевой
    изоляции.
  explanation: |
    Используется там, где нужно видеть или обслуживать сеть самого узла: CNI-агенты,
    kube-proxy, сборщики сетевых метрик. Для приложений это почти всегда ошибка —
    два таких пода не сядут на один узел, если слушают один порт, и никакие
    NetworkPolicy к ним уже не применяются.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/"

- id: k8s-cluster-networking-004
  domain: k8s
  subtopic: cluster-networking
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем overlay-сеть отличается от native routing?
  answer: |
    Overlay заворачивает пакет пода в дополнительный пакет между узлами (VXLAN, Geneve) —
    работает в любой сети, но платит накладными расходами. Native routing прописывает
    маршруты до pod-подсетей прямо в сеть — быстрее, но требует, чтобы сеть об этих
    подсетях знала.
  explanation: |
    Выбор диктуется не вкусом, а тем, управляешь ли ты маршрутизацией. В своём VPC
    маршруты добавить можно — берут routing. В чужой или сложной сети остаётся overlay.
    Отличить их на живом кластере просто: посмотреть, есть ли на узлах интерфейс
    вроде `vxlan.calico` или `flannel.1`.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/networking/"

- id: k8s-cluster-networking-005
  domain: k8s
  subtopic: cluster-networking
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Между подами на разных узлах: короткие запросы проходят, большие POST'ы виснут
    без ошибки. Первая гипотеза?
  options:
    a: "MTU: overlay добавляет заголовки, крупные пакеты не проходят"
    b: "NetworkPolicy режет трафик по размеру запроса"
    c: "Перегружен CoreDNS, резолв не успевает"
    d: "kube-proxy потерял правила для этого сервиса"
  answer: a
  explanation: |
    Overlay добавляет к каждому пакету обёртку (для VXLAN порядка 50 байт), и если MTU
    интерфейса пода не уменьшен на эту величину, полноразмерные пакеты не помещаются
    в кадр. Мелкие запросы влезают и ходят, крупные молча теряются — соединение
    устанавливается и виснет на передаче тела. Симптом «мелочь работает, крупное
    висит» — почти всегда MTU.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/networking/"

- id: k8s-cluster-networking-006
  domain: k8s
  subtopic: cluster-networking
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему pod CIDR не должен пересекаться с адресами VPC?
  answer: |
    Потому что узел будет считать эти адреса «своими подами» и направлять трафик
    внутрь кластера вместо реальной сети. Часть VPC — базы, внешние сервисы —
    станет недостижимой из подов.
  explanation: |
    Ошибку легко не заметить при запуске: пересекающийся диапазон может долго
    не выдаваться никому, и всё работает. Ломается позже и точечно — «этот один сервис
    не отвечает из кластера», причём только из подов, а с узла по SSH всё доступно.
    Диапазоны планируются один раз, до создания кластера: сменить их потом нельзя.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/networking/"

- id: k8s-cluster-networking-007
  domain: k8s
  subtopic: cluster-networking
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    За чем следит CNI-агент — за подами или за узлами?
  answer: |
    За **узлами**. Он смотрит, какая pod-подсеть выделена каждому узлу, и обеспечивает
    доставку до этой подсети. Отдельные поды его не интересуют — их адреса раздаёт
    плагин локально.
  explanation: |
    Отсюда масштабируемость: маршрутов в кластере столько же, сколько узлов, а не
    сколько подов, и создание тысячи подов не создаёт тысячу записей в сети.
    И отсюда же понятно, почему добавление узла требует времени на сходимость —
    новую подсеть должны увидеть агенты на всех остальных узлах.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/networking/"

- id: k8s-cluster-networking-008
  domain: k8s
  subtopic: cluster-networking
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Чем сетевая модель пода отличается от сети Docker по умолчанию?
  answer: |
    В Docker контейнер сидит за NAT на bridge и снаружи виден только через проброс порта.
    В Kubernetes у каждого пода **свой маршрутизируемый IP**, и поды общаются напрямую,
    без NAT и без проброса.
  explanation: |
    Отсутствие NAT — не деталь реализации, а требование модели: приложение видит тот же
    адрес источника, который у отправителя, что нужно для service discovery, аудита
    и mTLS. Побочный эффект — адресов расходуется много, и pod CIDR приходится
    планировать с запасом на рост кластера.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/networking/"

- id: k8s-cluster-networking-009
  domain: k8s
  subtopic: cluster-networking
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Под завис в `ContainerCreating` с ошибкой про сеть. Что проверять?
  answer: |
    CNI на этом узле: жив ли агент-DaemonSet, есть ли бинарник плагина и его конфиг
    на диске узла, не кончились ли адреса в подсети узла.
  explanation: |
    Порядок создания пода — sandbox сначала, сеть потом: containerd поднимает
    pause-контейнер и зовёт CNI, чтобы тот выдал адрес. Пока адреса нет, запускать
    прикладные контейнеры бессмысленно, и kubelet ждёт. Поэтому сетевые проблемы
    проявляются именно как затык на создании, а не как отказ уже работающего пода.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"

- id: k8s-cluster-networking-010
  domain: k8s
  subtopic: cluster-networking
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает NetworkPolicy и что будет, если её применить в кластере без поддержки?
  answer: |
    Ограничивает, кто может обращаться к подам, отобранным селектором. Если CNI
    не поддерживает NetworkPolicy (например Flannel), объект **создастся и будет
    молча игнорироваться** — ограничения не появятся.
  explanation: |
    Это самый опасный вид отказа: политика есть, ревью пройдено, а трафик ходит как
    ходил, и об этом никто не узнает до аудита. Вторая особенность — как только
    на под навешена хоть одна политика, он переходит в режим «запрещено всё, кроме
    разрешённого», поэтому забытое правило легко обрывает легитимный трафик.
  ref: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"

- id: k8s-cluster-networking-011
  domain: k8s
  subtopic: cluster-networking
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему нельзя поставить в кластер два CNI сразу?
  answer: |
    Оба будут раздавать адреса и прописывать маршруты для одних и тех же подсетей,
    конфликтуя за одни и те же ресурсы узла. Результат — непредсказуемая сеть,
    которую невозможно диагностировать.
  explanation: |
    Частая причина такой ситуации — не осознанный выбор, а остатки: поставили Flannel,
    решили перейти на Calico, применили манифест поверх, а старые конфиги плагина
    остались на дисках узлов. Смена CNI — это операция с полной очисткой конфигов
    и, как правило, с пересозданием подов.
  ref: "https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/"

- id: k8s-cluster-networking-012
  domain: k8s
  subtopic: cluster-networking
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему MTU в кластере лучше задать явно, а не полагаться на автоопределение?
  answer: |
    Автоопределение смотрит на MTU интерфейса узла и не всегда учитывает то, что лежит
    ниже: VPN, туннель между зонами, оборудование с нестандартным MTU. Ошибка проявится
    не при старте, а под нагрузкой на крупных пакетах.
  explanation: |
    Цена ошибки несимметрична: заниженный MTU стоит немного производительности,
    завышенный даёт зависающие соединения, которые ищут неделями и обычно не там.
    Поэтому в средах со своей сетью значение проставляют руками в конфиге CNI
    и проверяют большим пакетом с запретом фрагментации.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/networking/"

# --- scheduling: junior/middle ---

- id: k8s-scheduling-001
  domain: k8s
  subtopic: scheduling
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    На что смотрит scheduler при выборе узла — на реальное потребление или на что-то другое?
  answer: |
    Только на **брони**: сумму `requests` уже размещённых подов против `allocatable`
    узла. Фактическое потребление он не смотрит никогда.
  explanation: |
    Отсюда два симметричных сюрприза. Узел загружен на 20%, но новый под туда не садится —
    значит, соседи забронировали больше, чем едят. И наоборот: узел задыхается под
    реальной нагрузкой, а scheduler спокойно досаживает поды, потому что по броням
    место есть. Requests — это не «сколько нужно», а «сколько я занял в учёте».
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/"

- id: k8s-scheduling-002
  domain: k8s
  subtopic: scheduling
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что означает `cpu: 200m` в requests?
  answer: |
    200 millicores, то есть 0.2 ядра — одна пятая процессорного времени одного ядра.
    `1000m` = `1` = целое ядро.
  explanation: |
    Единица дробная потому, что CPU — ресурс делимый во времени: контейнеру выдаётся
    доля тактов, а не физическое ядро. С памятью так нельзя, поэтому она задаётся
    абсолютными величинами (`Mi`, `Gi`) и ведёт себя принципиально иначе при превышении.
  ref: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"

- id: k8s-scheduling-003
  domain: k8s
  subtopic: scheduling
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем `capacity` узла отличается от `allocatable`?
  answer: |
    `capacity` — всё железо узла. `allocatable` — то, что остаётся подам после вычета
    резервов на систему и kubelet (`kube-reserved`, `system-reserved`) и порога вытеснения.
    Планирование идёт по `allocatable`.
  explanation: |
    Разница объясняет, почему на узле с 8 ГБ нельзя разместить поды на 8 ГБ requests —
    гигабайта попросту нет в наличии. Резервы существуют, чтобы kubelet и systemd
    не умерли от голода вместе с узлом: без них перегруженный узел уходит в `NotReady`
    и уносит все свои поды разом.
  ref: "https://kubernetes.io/docs/tasks/administer-cluster/reserve-compute-resources/"

- id: k8s-scheduling-004
  domain: k8s
  subtopic: scheduling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Из каких двух фаз состоит работа scheduler'а?
  answer: |
    Фильтрация — отсеять узлы, где под разместить **нельзя** (не хватает ресурсов,
    не подходят taints, nodeSelector, тома). Скоринг — оценить оставшиеся и выбрать
    лучший по сумме баллов.
  explanation: |
    Разделение подсказывает, как читать `Pending`: если сообщение говорит
    «0/5 nodes are available» с перечислением причин — под не прошёл фильтрацию,
    и надо смотреть именно на эти причины. Скоринг же объясняет, почему поды обычно
    размазываются по узлам, а не сваливаются в кучу: за равномерность даются баллы.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/kube-scheduler/"

- id: k8s-scheduling-005
  domain: k8s
  subtopic: scheduling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Под висит в `Pending`. Какие причины бывают и где написана точная?
  answer: |
    Не хватает ресурсов по броням, не подходят taints или affinity, не привязывается том,
    упирается в квоту namespace, нет узлов вообще. Точная причина — в событиях:
    `kubectl describe pod`, сообщение от `default-scheduler`.
  explanation: |
    `Pending` означает ровно одно: узел ещё не выбран, `spec.nodeName` пуст. Поэтому
    смотреть в логи приложения бессмысленно — контейнеров не существует. Scheduler
    при этом любезно перечисляет, сколько узлов отсеялось по каждой причине, и обычно
    это готовый ответ.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"

- id: k8s-scheduling-006
  domain: k8s
  subtopic: scheduling
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Под класса `Guaranteed` (requests == limits) упёрся в свой лимит памяти.
    Спасёт ли его QoS-класс?
  options:
    a: "Нет — его убьют по OOM за превышение собственного лимита"
    b: "Да — Guaranteed-поды не убивают по OOM никогда"
    c: "Да, но только если на узле есть свободная память"
    d: "Нет, но вместо убийства kubelet начнёт троттлить его память"
  answer: a
  explanation: |
    QoS-класс определяет **только очередь на вытеснение при нехватке памяти на узле** —
    кого выгонят первым, когда узел в целом задыхается. Собственный лимит контейнера
    к этому отношения не имеет: превысил свой `limits.memory` — ядро убивает процесс,
    независимо от класса и от того, свободна ли память на узле. Это два разных
    механизма, которые постоянно путают.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/"

- id: k8s-scheduling-007
  domain: k8s
  subtopic: scheduling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Узел под давлением памяти. Кого kubelet выселит первым?
  answer: |
    Сначала `BestEffort`, затем `Burstable`, превысившие свои `requests` — и чем сильнее
    превысили, тем раньше. `Guaranteed` и поды, потребляющие **меньше** своих requests,
    трогают в последнюю очередь.
  explanation: |
    Логика справедливая: выселяют того, кто наврал сильнее всех при бронировании.
    Отсюда практический вывод — честные requests это не бюрократия, а страховка:
    под, который ест меньше забронированного, фактически защищён от вытеснения,
    даже когда на узле пожар.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/"

- id: k8s-scheduling-008
  domain: k8s
  subtopic: scheduling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Стоит ли ставить `limits.cpu`, если узел всё равно недогружен?
  answer: |
    Спорно и часто вредно: лимит троттлит контейнер, **даже когда процессор на узле
    свободен**. Пики нагрузки упираются в потолок без всякой пользы для соседей.
  explanation: |
    Защиту соседей обеспечивают `requests` — они гарантируют долю времени при
    конкуренции. `limits.cpu` нужен там, где важна предсказуемость, а не скорость:
    бенчмарки, шумные фоновые задачи, жёсткий мультитенант. С памятью всё наоборот:
    `limits.memory` ставить обязательно, иначе одна утечка утащит узел целиком.
  ref: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"

- id: k8s-scheduling-009
  domain: k8s
  subtopic: scheduling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Приложение регулярно получает OOMKilled, хотя утечки нет и памяти на узле полно.
    Что смотреть?
  answer: |
    `limits.memory` контейнера. Скорее всего он занижен относительно реального пика:
    ядро убивает процесс по превышению **его собственного** лимита, состояние узла
    здесь ни при чём.
  explanation: |
    Ключ к диагнозу — регулярность без роста: утечка даёт растущий график и всё более
    ранние падения, а заниженный лимит даёт стабильный цикл, привязанный к пикам
    трафика или к тяжёлым операциям вроде импорта. Числа берут из метрик за неделю
    по 95-му перцентилю, а не из головы.
  ref: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"

- id: k8s-scheduling-010
  domain: k8s
  subtopic: scheduling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Сколько подов помещается на один узел и чем это ограничено?
  answer: |
    По умолчанию 110 подов на узел — это настройка kubelet (`maxPods`), а не следствие
    ресурсов. Ограничение может упереться раньше, чем CPU и память.
  explanation: |
    Предел существует не из-за железа, а из-за накладных расходов: на каждый под нужны
    адрес из подсети узла, набор сетевых правил, watch-соединения и место в отчётах
    kubelet о статусе. Отсюда неожиданный `Pending` на пустом с виду узле — особенно
    в кластерах, где много мелких подов и sidecar'ов.
  ref: "https://kubernetes.io/docs/setup/best-practices/cluster-large/"

- id: k8s-scheduling-011
  domain: k8s
  subtopic: scheduling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Приложение тормозит, ошибок в логах нет, поды здоровы, рестартов нет. Куда смотреть?
  answer: |
    На CPU throttling: контейнер упёрся в `limits.cpu`, и ядро отбирает у него такты.
    Метрика — `container_cpu_cfs_throttled_seconds_total`.
  explanation: |
    Троттлинг принципиально невидим для приложения: оно не получает ошибку, ему просто
    реже дают процессор — растёт latency, копятся очереди, а логи чистые. Именно
    поэтому такой инцидент ищут долго: все обычные признаки поломки отсутствуют,
    и в логи смотреть бесполезно.
  ref: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"

- id: k8s-scheduling-012
  domain: k8s
  subtopic: scheduling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Куда считается `emptyDir` с `medium: Memory`?
  answer: |
    В память пода: это tmpfs, и записанные файлы занимают RAM, учитываемую в лимите
    контейнера. Заполнил такой том — получил OOMKilled.
  explanation: |
    Ловушка в том, что причина выглядит совершенно не связанной: приложение памяти
    не ест, утечки нет, а под убивают. Обычно виноват кеш или временные файлы, которые
    сложили в быстрый tmpfs и забыли, что он живёт в оперативке. Обычный `emptyDir`
    без `medium` лежит на диске узла и в лимит памяти не попадает.
  ref: "https://kubernetes.io/docs/concepts/storage/volumes/"

- id: k8s-scheduling-013
  domain: k8s
  subtopic: scheduling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем плохо задать `requests` сильно ниже реального потребления?
  answer: |
    Scheduler посчитает узел свободным и досадит туда поды. Все они начнут есть больше
    брони, узел уйдёт в давление по памяти, и вытеснять начнут именно тех, кто наврал —
    возможно, вместе с чужими подами.
  explanation: |
    Заниженные requests выглядят выгодно — поды плотнее садятся, кластер кажется
    экономным. Расплата приходит под нагрузкой и не там, где сэкономили: страдают соседи
    по узлу. Это же объясняет эффект «узлы падают по очереди» — вытесненные поды едут
    на следующий узел и повторяют историю.
  ref: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"

# --- placement: junior/middle ---

- id: k8s-placement-001
  domain: k8s
  subtopic: placement
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем `nodeSelector` отличается от node affinity?
  answer: |
    `nodeSelector` — простое совпадение меток узла, только жёсткое. Node affinity умеет
    то же самое плюс операторы (`In`, `NotIn`, `Exists`) и **мягкий** вариант
    `preferredDuringScheduling`, который лишь добавляет узлу баллов.
  explanation: |
    Различие «жёстко или мягко» проходит через все механизмы размещения и определяет
    поведение при нехватке подходящих узлов: жёсткое правило оставляет под в `Pending`
    навсегда, мягкое позволяет сесть куда получится. Выбор между ними — это выбор между
    «лучше не запуститься» и «лучше запуститься неидеально».
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/"

- id: k8s-placement-002
  domain: k8s
  subtopic: placement
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Где живёт taint, где toleration, и что они делают?
  answer: |
    Taint — на **узле**, это отказ принимать поды. Toleration — на **поде**, это
    способность такой отказ терпеть. Без toleration под на узел с taint не сядет.
  explanation: |
    Механизм придуман для обратной задачи по сравнению с affinity: не «притянуть под
    к узлу», а «отогнать от узла всех, кроме избранных». Так работает защита
    control-plane узлов и выделенных пулов с GPU — иначе туда набежала бы вся
    обычная нагрузка.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/"

- id: k8s-placement-003
  domain: k8s
  subtopic: placement
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Какие бывают эффекты у taint?
  answer: |
    `NoSchedule` — новые поды без toleration не сядут; `PreferNoSchedule` — мягкая
    версия, сядут при отсутствии альтернатив; `NoExecute` — вдобавок **выгоняет
    уже работающие** поды без toleration.
  explanation: |
    Только `NoExecute` действует на живые поды — остальные два работают исключительно
    в момент планирования. На этом построена реакция на отказ узла: контроллер вешает
    `node.kubernetes.io/unreachable:NoExecute`, и поды уезжают. У toleration к нему
    есть `tolerationSeconds` — сколько под готов ждать перед выселением.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/"

- id: k8s-placement-004
  domain: k8s
  subtopic: placement
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Ты вытеснил обычную нагрузку с GPU-узлов через taint и добавил toleration
    поду с моделью. Где он окажется?
  options:
    a: "Где угодно: toleration разрешает сесть на GPU-узел, но не притягивает к нему"
    b: "Обязательно на GPU-узле — toleration работает как селектор"
    c: "На GPU-узле, если там есть свободные ресурсы, иначе в Pending"
    d: "Нигде: taint и toleration взаимно исключают друг друга"
  answer: a
  explanation: |
    Toleration снимает запрет, но ничего не говорит о предпочтении — для scheduler'а
    такой под просто стал совместим с большим числом узлов, включая все обычные.
    Поэтому «выделенные узлы для избранных подов» всегда состоят из двух половин:
    taint на узле, чтобы отогнать чужих, и `nodeSelector` или affinity на поде,
    чтобы притянуть своих.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/"

- id: k8s-placement-005
  domain: k8s
  subtopic: placement
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает pod anti-affinity и зачем она нужна?
  answer: |
    Запрещает или не рекомендует ставить под рядом с другими подами, подходящими
    под селектор, в пределах указанной топологии (узел, зона). Классика — развести
    реплики одного приложения по разным узлам.
  explanation: |
    Без неё три реплики вполне могут оказаться на одном узле — scheduler разносит поды
    по баллам, но никаких гарантий не даёт. Тогда отказ одной машины уносит весь сервис,
    а `replicas: 3` создаёт ложное чувство надёжности. Жёсткий вариант при этом опасен
    сам по себе: узлов меньше, чем реплик — и лишние поды навсегда в `Pending`.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/"

- id: k8s-placement-006
  domain: k8s
  subtopic: placement
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что задают `maxSkew` и `whenUnsatisfiable` в topology spread constraints?
  answer: |
    `maxSkew` — максимально допустимая разница в числе подов между самой полной
    и самой пустой топологической областью. `whenUnsatisfiable` — что делать, если
    условие не выполняется: `DoNotSchedule` (жёстко) или `ScheduleAnyway` (мягко).
  explanation: |
    Это тот же выбор «жёстко или мягко», но с числом: `maxSkew: 1` требует почти
    идеального равенства, что при нехватке узлов легко оставляет поды в `Pending`.
    Отсюда типовая пара: `maxSkew: 1` с `ScheduleAnyway` для распределения без риска,
    и `DoNotSchedule` только там, где перекос действительно недопустим.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/"

- id: k8s-placement-007
  domain: k8s
  subtopic: placement
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Topology spread распределяет по зонам. Считается ли зона, где ни один под
    физически не влезет?
  answer: |
    Да. Перекос считается по **наличию узлов с нужной меткой топологии**, а не по тому,
    есть ли там место. Забитая зона всё равно участвует в расчёте как область
    с нулём подов.
  explanation: |
    Отсюда неожиданный `Pending` при жёстком `DoNotSchedule`: под обязан поехать
    в «пустую» зону, чтобы выровнять перекос, а там нет ресурсов — и он не едет
    никуда, хотя место в других зонах есть. Разбирается это только чтением событий
    scheduler'а: причина в них написана явно.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/"

- id: k8s-placement-008
  domain: k8s
  subtopic: placement
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое PriorityClass и preemption?
  answer: |
    PriorityClass задаёт поду числовой приоритет. Если высокоприоритетному поду негде
    разместиться, scheduler может **вытеснить** (preempt) поды с меньшим приоритетом,
    освободив место.
  explanation: |
    Важно, что preemption живёт в scheduler'е и считает **брони**, а не реальную
    загрузку: жертвы выбираются по requests. Этим он отличается от вытеснения
    по node pressure, которым занимается kubelet и которое смотрит на фактическое
    потребление памяти. Два разных механизма с разными критериями и разными акторами.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/"

- id: k8s-placement-009
  domain: k8s
  subtopic: placement
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Добавил в кластер новый пустой узел. Переедут ли на него уже работающие поды,
    чтобы выровнять нагрузку?
  answer: |
    Нет. Переезда живых подов не существует: решение о размещении принимается **один раз**,
    при создании пода. Перераспределение случится само собой при следующем выкате
    или отказе узла.
  explanation: |
    Это следствие того, что scheduler работает с несозданными подами, а не с картиной
    кластера целиком. Для принудительной перебалансировки существует отдельный
    компонент, descheduler, который просто удаляет неудачно стоящие поды, чтобы
    контроллер создал их заново — и уже новые пройдут через планирование.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/"

- id: k8s-placement-010
  domain: k8s
  subtopic: placement
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем topology spread отличается от DaemonSet, если оба «раскидывают поды по узлам»?
  answer: |
    DaemonSet ставит под на **каждый** подходящий узел и число реплик не имеет.
    Topology spread работает с фиксированным числом реплик обычного Deployment
    и лишь следит, чтобы они распределялись равномерно.
  explanation: |
    Разные задачи: DaemonSet — про покрытие инфраструктуры (агент должен быть везде),
    spread — про отказоустойчивость приложения (три реплики не должны лежать в одной
    зоне). Путаница возникает из-за похожего результата на маленьком кластере, где
    число реплик совпадает с числом узлов.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/"

- id: k8s-placement-011
  domain: k8s
  subtopic: placement
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает PodDisruptionBudget и от чего он **не** защищает?
  answer: |
    Ограничивает, сколько подов приложения может быть недоступно при **добровольных**
    нарушениях: `kubectl drain`, обновление узлов, работа автоскейлера. От падения узла,
    OOM и вытеснения по нехватке памяти он не защищает никак.
  explanation: |
    Граница ровно между «кто-то решил» и «так вышло»: PDB — это протокол вежливости
    для операций обслуживания, а не гарантия доступности. Обратная сторона — слишком
    строгий бюджет (`minAvailable` равен числу реплик) намертво блокирует drain,
    и обновление кластера встаёт.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/disruptions/"

- id: k8s-placement-012
  domain: k8s
  subtopic: placement
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Preemption и eviction по node pressure — кто из них смотрит на реальную загрузку?
  answer: |
    Eviction по node pressure: им занимается **kubelet**, и он реагирует на фактическую
    нехватку памяти или диска на узле. Preemption делает **scheduler** и считает
    только брони и приоритеты.
  explanation: |
    Разделение объясняет, почему поды иногда выселяются с узла, который по броням
    свободен, а иногда не выселяются с узла, который задыхается. Это два независимых
    контура с разными входными данными. Диагностика тоже разная: preemption видно
    в событиях от `default-scheduler`, node-pressure eviction — в событиях от `kubelet`.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/"

# --- rbac: junior/middle ---

- id: k8s-rbac-001
  domain: k8s
  subtopic: rbac
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что описывает Role и что описывает RoleBinding?
  answer: |
    Role — **что** можно делать: набор глаголов (`get`, `list`, `create`) над набором
    ресурсов. RoleBinding — **кому и где**: связывает Role с пользователем, группой
    или ServiceAccount в конкретном namespace.
  explanation: |
    Права никогда не висят на человеке напрямую — между ними всегда стоит роль.
    Отсюда самая частая ошибка новичка: написали Role, обрадовались, а Binding забыли,
    и прав не появилось. Отсюда же удобство: чтобы отозвать доступ, достаточно убрать
    субъект из Binding, не трогая описание прав.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"

- id: k8s-rbac-002
  domain: k8s
  subtopic: rbac
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем ClusterRole отличается от Role, кроме зоны действия?
  answer: |
    ClusterRole умеет то, что Role не может в принципе: права на **кластерные** ресурсы
    (узлы, namespace, PV, CRD) и на подресурсы вроде `nodes/proxy`. Такие объекты
    не принадлежат ни одному namespace, поэтому Role их не выражает.
  explanation: |
    Отсюда рабочий дефолт, который путает всех при первой встрече: **ClusterRole
    в паре с RoleBinding**. Роль описана один раз глобально, а привязка даёт права
    только в одном namespace. Так не приходится копировать одинаковые Role в каждый
    namespace, и при этом никто не получает лишнего.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"

- id: k8s-rbac-003
  domain: k8s
  subtopic: rbac
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Есть ли в Kubernetes объект User?
  answer: |
    Нет. Пользователей как объектов не существует — их нельзя создать, перечислить
    или удалить. Есть только способ доказать личность (сертификат, токен, OIDC),
    из которого apiserver берёт имя, и RBAC, привязывающий права к этому имени.
    А вот ServiceAccount — настоящий объект в API.
  explanation: |
    Отсюда неочевидное следствие: `kubectl get users` не существует, и узнать список
    людей с доступом можно только через внешнюю систему или через разбор всех Binding.
    Отсюда же вопрос «как отозвать доступ уволившемуся» — не «удалить пользователя»,
    а отозвать сертификат или убрать его группу из OIDC.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/authentication/"

- id: k8s-rbac-004
  domain: k8s
  subtopic: rbac
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое ServiceAccount и как он попадает в под?
  answer: |
    Это identity **процесса в поде**. kubelet монтирует в контейнер короткоживущий
    токен, которым приложение представляется apiserver. Не указан явно — используется
    `default` из namespace.
  explanation: |
    В RBAC такой субъект записывается жёстким форматом
    `system:serviceaccount:<namespace>:<имя>`, и ошибка в нём — частая причина
    необъяснимого `Forbidden`. Практика — отдельный SA на каждое приложение
    с минимальными правами, а не общий `default`, у которого права имеют свойство
    накапливаться незаметно.
  ref: "https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/"

- id: k8s-rbac-005
  domain: k8s
  subtopic: rbac
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Роль запрещает `delete pods`, другая привязка разрешает. Что победит?
  options:
    a: "Разрешение: модель RBAC чисто разрешающая, запретов в ней нет"
    b: "Запрет: явное запрещение всегда сильнее разрешения"
    c: "Победит правило из более узкой области — из namespace, а не из кластера"
    d: "Запрос будет отклонён как противоречивый"
  answer: a
  explanation: |
    В RBAC нет глагола «запретить» — роль может только разрешать, а итоговые права это
    объединение всех привязок субъекта. Формулировка «роль запрещает» некорректна
    в принципе: роль просто не упоминает действие. Отсюда практическое следствие —
    урезать доступ нужно, убирая привязки, а не добавляя новые; проверять же итог
    удобно через `kubectl auth can-i`.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"

- id: k8s-rbac-006
  domain: k8s
  subtopic: rbac
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем отличаются ответы `Unauthorized` и `Forbidden` от apiserver?
  answer: |
    `401 Unauthorized` — не прошла аутентификация: тебя не опознали, сертификат
    или токен невалиден. `403 Forbidden` — опознали, но RBAC не разрешает эту операцию.
  explanation: |
    Разница сразу указывает, где чинить: первый случай — kubeconfig, протухший
    сертификат, неправильный контекст; второй — Role и Binding. В тексте `403`
    apiserver обычно называет и субъект, и ресурс, и глагол — то есть готовый рецепт,
    какую роль дописать.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/authorization/"

- id: k8s-rbac-007
  domain: k8s
  subtopic: rbac
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как быстро проверить, есть ли у субъекта конкретное право?
  answer: |
    `kubectl auth can-i <глагол> <ресурс>` — для себя;
    `kubectl auth can-i list secrets --as=system:serviceaccount:prod:app -n prod` —
    от имени другого субъекта.
  explanation: |
    Ответ даёт сам apiserver по своим правилам, поэтому он учитывает все привязки разом,
    включая унаследованные от групп. Читать десяток YAML и складывать права в голове
    не нужно и опасно — легко пропустить `ClusterRoleBinding`, который выдаёт права
    во всех namespace сразу.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/authorization/"

- id: k8s-rbac-008
  domain: k8s
  subtopic: rbac
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Role и RoleBinding созданы, права всё равно не работают. Две типовые причины?
  answer: |
    Binding создан **не в том namespace** (он действует только в своём) или
    в `subjects` указано неточное имя субъекта — чаще всего ServiceAccount без
    полного формата или с другим namespace.
  explanation: |
    Обе ошибки молчаливые: apiserver принимает Binding, ссылающийся на несуществующий
    субъект, потому что субъект может появиться позже — и `User` вообще не объект,
    проверить его нечем. Поэтому единственный надёжный способ убедиться — не читать
    манифесты, а спросить `kubectl auth can-i --as=...`.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"

- id: k8s-rbac-009
  domain: k8s
  subtopic: rbac
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Почему право `list secrets` в namespace — это фактически доступ ко всем секретам?
  answer: |
    Потому что `list` возвращает объекты **целиком**, вместе с данными. Отдельного
    права «видеть имена, но не содержимое» в RBAC нет.
  explanation: |
    Это ломает интуицию: `list` кажется безобидным «посмотреть список», как `ls`.
    На деле разрешение читать секреты в namespace эквивалентно выдаче всех паролей
    и токенов этого namespace, включая токены ServiceAccount, через которые можно
    получить и чужие права. Отсюда правило — `secrets` в ролях перечисляют поимённо
    через `resourceNames`.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"

- id: k8s-rbac-010
  domain: k8s
  subtopic: rbac
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем ставить `automountServiceAccountToken: false`?
  answer: |
    Чтобы в под не монтировался токен ServiceAccount. Приложению, которое не ходит
    в API Kubernetes, он не нужен, а его наличие даёт злоумышленнику при взломе
    готовые учётные данные к кластеру.
  explanation: |
    По умолчанию токен монтируется **всем** подам, включая nginx и статику, которым он
    заведомо не нужен. Это классическая точка эскалации: пробили приложение — получили
    токен — пошли в apiserver с правами его SA. Флаг ставится на уровне пода
    или самого ServiceAccount.
  ref: "https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/"

- id: k8s-rbac-011
  domain: k8s
  subtopic: rbac
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему права принято вешать на группу, а не на конкретного человека?
  answer: |
    Потому что группа приходит из внешней системы (OIDC, сертификат), и управление
    доступом сводится к членству в ней. Иначе на каждого нового сотрудника нужен
    новый Binding, а на уволившегося — ревизия всех манифестов.
  explanation: |
    Особенно это важно из-за того, что объекта User не существует: «удалить
    пользователя» в кластере нельзя, отзыв доступа происходит там, где выдаются
    удостоверения. Привязка к группе делает кластер согласованным с этим фактом —
    убрали человека из группы в SSO, и права исчезли везде разом.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"

- id: k8s-rbac-012
  domain: k8s
  subtopic: rbac
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем опасна связка ClusterRole + ClusterRoleBinding?
  answer: |
    Она даёт права **во всех namespace сразу**, включая будущие. Легко получить
    случайный кластер-админ, когда хотелось выдать доступ к одному окружению.
  explanation: |
    Разница с парой ClusterRole + RoleBinding ровно в области действия, а выглядят
    манифесты почти одинаково — отличается одно слово в `kind`. Поэтому при ревизии
    прав начинают именно с `kubectl get clusterrolebindings`: там обычно и находится
    забытый доступ, выданный «на время отладки».
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"

# --- senior-слой, проход 1 ---

- id: k8s-probes-016
  domain: k8s
  subtopic: probes
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Выкат намертво встал: новые поды не становятся ready, старые не гасятся.
    Как связаны readiness и `maxUnavailable: 0`?
  answer: |
    `maxUnavailable: 0` запрещает уменьшать число готовых подов, а Deployment считает
    готовность по readiness. Если новый под её не проходит, гасить старый нельзя —
    и выкат стоит, пока не сработает `progressDeadlineSeconds`.
  explanation: |
    Комбинация выглядит максимально безопасной и именно поэтому опасна: строгая
    readiness плюс нулевая недоступность превращают любую ошибку готовности
    в бессрочную заморозку вместо честного падения. Автоотката при этом не происходит —
    выкат просто помечается провалившимся и остаётся в половинчатом состоянии,
    с подами двух версий одновременно.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"

- id: k8s-probes-017
  domain: k8s
  subtopic: probes
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем нативная `grpc`-проба отличается от вызова `grpc_health_probe` через `exec`?
  answer: |
    Нативная выполняется самим kubelet по стандартному протоколу gRPC Health Checking —
    без запуска процессов и без лишнего бинарника в образе. `exec` с `grpc_health_probe`
    делает то же самое, но ценой форка на каждую проверку и дополнительной зависимости.
  explanation: |
    Практическая разница видна на плотных узлах: сотни exec-проб дают заметный расход
    CPU, которого у нативной пробы нет вовсе. Второй аргумент — безопасность образа:
    distroless-образ без лишних бинарников невозможно проверить через exec в принципе,
    и раньше это было главной причиной тащить в него отдельный инструмент.
  ref: "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"

- id: k8s-probes-018
  domain: k8s
  subtopic: probes
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем у пробы есть собственный `terminationGracePeriodSeconds`, если он уже есть у пода?
  answer: |
    Чтобы зависший контейнер, убиваемый по liveness, гасился **быстро**, а штатное
    завершение пода при этом сохраняло длинный grace period для корректного слива
    соединений.
  explanation: |
    Два случая требуют противоположного поведения: при выкате приложение надо аккуратно
    дождаться, при зависании — прибить немедленно, потому что ждать от него уже нечего.
    Без раздельной настройки приходилось выбирать одно число на оба сценария, и обычно
    выбирали длинное — из-за чего зависший под ещё минуту занимал место и держал
    соединения.
  ref: "https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/"

- id: k8s-pods-014
  domain: k8s
  subtopic: pods
  difficulty: senior
  source: [theory, core]
  type: basic
  verified: false
  prompt: |
    Job с sidecar'ом никогда не завершается. Как это чинится нативным sidecar'ом
    и с какой версии он стабилен?
  answer: |
    Нативный sidecar — это init-контейнер с `restartPolicy: Always`. Такой контейнер
    не мешает Job завершиться: завершение считается по основному контейнеру.
    Стабилен с **1.33**, доступен начиная с 1.28.
  explanation: |
    Обычный второй контейнер в Job удерживает под в работе бесконечно: под считается
    завершённым, только когда закончились **все** его контейнеры, а прокси или сборщик
    метрик закончиться не собирается. Нативный sidecar решает и вторую задачу — порядок:
    он гарантированно стартует до основного контейнера и гасится после него.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/"

- id: k8s-pods-015
  domain: k8s
  subtopic: pods
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Можно ли изменить потолок задержки между рестартами контейнера, если
    пятиминутный `CrashLoopBackOff` слишком долгий?
  answer: |
    Да, через конфигурацию kubelet: `crashLoopBackOff.maxContainerRestartPeriod`
    в диапазоне от `1s` до `300s`. Настройка **пер-узел**, не пер-под.
  explanation: |
    Дефолт остаётся прежним: старт с 10s, удвоение, потолок 300s. Важно, что ручка
    живёт у kubelet, а не в манифесте пода — то есть в managed-кластере её может
    не быть вовсе, и разные узлы одного кластера могут вести себя по-разному.
    Если заданный потолок меньше 10s, с него же начинается и первая задержка.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/"

- id: k8s-pods-016
  domain: k8s
  subtopic: pods
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Kubelet на узле перезапустился. Что произойдёт с работающими подами?
  answer: |
    Ничего: контейнеры запущены container runtime'ом и от kubelet не зависят.
    Поднявшись, kubelet заново узнаёт состояние у runtime и продолжает следить
    за уже работающими контейнерами.
  explanation: |
    Разделение ответственности здесь принципиально: kubelet — управляющий агент,
    а не родитель процессов. Отсюда же следует, что во время его отсутствия
    не работают пробы, не обновляется status и не монтируются новые тома —
    кластер про такой узел ничего не знает и через несколько минут пометит его
    `NotReady`, начав выселять поды, хотя они живы.
  ref: "https://kubernetes.io/docs/concepts/architecture/nodes/"

- id: k8s-workload-controllers-016
  domain: k8s
  subtopic: workload-controllers
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает `podManagementPolicy: Parallel` у StatefulSet и когда это допустимо?
  answer: |
    Отключает порядок: поды создаются и удаляются одновременно, а не строго
    по номерам с ожиданием готовности предыдущего. Допустимо там, где реплики
    не зависят друг от друга при старте.
  explanation: |
    Дефолтный `OrderedReady` нужен базам с выборами лидера и последовательной
    инициализацией, но за это платят временем: кластер из десяти реплик поднимается
    в десять шагов, и один зависший под блокирует всех, кто за ним. Если стабильные
    имена и тома нужны, а порядок нет — `Parallel` убирает это узкое место.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"

- id: k8s-workload-controllers-017
  domain: k8s
  subtopic: workload-controllers
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Как выкатить новую версию StatefulSet только на часть реплик?
  answer: |
    Через `updateStrategy.rollingUpdate.partition: N` — обновятся только поды
    с порядковым номером **больше или равным** N. Остальные останутся на старой версии
    до снижения partition.
  explanation: |
    Это встроенная канарейка для stateful-нагрузки: поставил `partition: 4` при пяти
    репликах — обновился только `web-4`, посмотрел на него, опустил partition до нуля.
    Работает именно благодаря порядковым именам: у Deployment такого механизма нет,
    поды там анонимны, и канарейку приходится делать вторым Deployment.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"

- id: k8s-workload-controllers-018
  domain: k8s
  subtopic: workload-controllers
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `podFailurePolicy` дополняет `backoffLimit` в Job?
  answer: |
    `backoffLimit` считает **все** падения одинаково. `podFailurePolicy` разбирает
    их по причине: по коду выхода или по условию пода можно решить прекратить Job
    немедленно либо, наоборот, не засчитывать попытку.
  explanation: |
    Разница важна для долгих задач: под, вытесненный с узла по preemption, — это
    не ошибка приложения, но `backoffLimit` съедает на нём попытку, и многочасовой
    расчёт падает из-за инфраструктуры. И наоборот, код выхода, означающий неверные
    входные данные, нет смысла ретраить шесть раз — правильнее сразу остановиться.
  ref: "https://kubernetes.io/docs/tasks/job/pod-failure-policy/"

- id: k8s-workload-controllers-019
  domain: k8s
  subtopic: workload-controllers
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Контроллер CronJob лежал два часа. Что произойдёт с пропущенными запусками?
  answer: |
    Он попробует запустить пропущенное, ограничившись окном `startingDeadlineSeconds`.
    Если пропущено больше сотни запусков и дедлайн не задан, CronJob вообще перестанет
    запускаться и пожалуется в события.
  explanation: |
    Поведение спроектировано против лавины: минутный CronJob после двухчасового простоя
    иначе стартовал бы сто двадцать задач разом и добил бы кластер. Практический вывод —
    `startingDeadlineSeconds` задают осознанно: короткое окно означает «пропущенное
    неактуально», отсутствие поля — риск полного залипания расписания.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/"

- id: k8s-services-014
  domain: k8s
  subtopic: services
  difficulty: senior
  source: [theory, core]
  type: basic
  verified: false
  prompt: |
    Чем режим kube-proxy `iptables` отличается от `IPVS` и когда разница становится
    заметной?
  answer: |
    В iptables правила образуют цепочку, которая просматривается последовательно,
    и её обновление переписывает большой набор правил. IPVS использует хеш-таблицы
    в ядре: поиск не зависит от числа сервисов, обновление точечное.
    Разница проявляется на тысячах сервисов и эндпоинтов.
  explanation: |
    На небольшом кластере выбор не имеет значения, и iptables проще в отладке. При росте
    начинает болеть не столько сама маршрутизация, сколько **время применения изменений**:
    каждое обновление endpoints перезаписывает огромный набор правил, и распространение
    отстаёт на секунды. Тот же класс проблем решает режим nftables и подходы на eBPF,
    где kube-proxy заменяется целиком.
  ref: "https://kubernetes.io/docs/reference/networking/virtual-ips/"

- id: k8s-services-015
  domain: k8s
  subtopic: services
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем headless-сервису StatefulSet нужен `publishNotReadyAddresses: true`?
  answer: |
    Чтобы DNS-имена подов резолвились **до** того, как поды станут готовы. Иначе
    реплики базы не смогут найти друг друга при первом запуске: каждая ждёт кворума,
    а кворум ждёт их готовности.
  explanation: |
    Это классический дедлок начальной загрузки кластерного приложения. Обычная логика
    «не готов — нет в DNS» правильна для трафика пользователей, но убийственна для
    внутреннего обнаружения участников. Поэтому у headless-сервисов StatefulSet этот
    флаг стоит почти всегда, и в чартах баз данных он прописан по умолчанию.
  ref: "https://kubernetes.io/docs/concepts/services-networking/service/"

- id: k8s-services-016
  domain: k8s
  subtopic: services
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Как из кластера ходить на внешнюю БД так, чтобы приложение об этом не знало?
  answer: |
    Создать Service **без селектора** и вручную завести для него `EndpointSlice`
    с адресом БД. Приложение обращается по обычному имени сервиса, а куда он ведёт —
    вопрос конфигурации кластера.
  explanation: |
    Приём даёт слой косвенности: переезд БД или переключение со внешней на внутреннюю
    меняет один объект в кластере, а не конфиги всех приложений. Отличие от
    `ExternalName` в том, что тот работает только через CNAME и требует DNS-имени,
    а здесь можно указать голый IP. Обратная сторона — эндпоинты никто не проверяет
    на живость: readiness тут нет.
  ref: "https://kubernetes.io/docs/concepts/services-networking/service/"

- id: k8s-services-017
  domain: k8s
  subtopic: services
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Кластер раскинут на три зоны, и половина счёта — межзональный трафик.
    Что с этим делает Kubernetes?
  answer: |
    Даёт маршрутизацию с учётом топологии: поле `trafficDistribution` у Service
    (значение `PreferClose`) просит отдавать предпочтение эндпоинтам в своей зоне,
    пока их достаточно.
  explanation: |
    По умолчанию Service балансирует по всем готовым подам одинаково, не различая зон, —
    и в облаке каждый межзональный пакет стоит денег. Механизм намеренно мягкий:
    при нехватке локальных эндпоинтов трафик всё равно уйдёт в другую зону, иначе
    экономия обернулась бы отказом. Отличие от `externalTrafficPolicy` в том,
    что тот про **входящий извне** трафик и сохранение source IP.
  ref: "https://kubernetes.io/docs/concepts/services-networking/service/"

- id: k8s-config-secrets-016
  domain: k8s
  subtopic: config-secrets
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что даёт шифрование Secret'ов at rest в etcd и от чего оно **не** защищает?
  answer: |
    Защищает от чтения секретов из файлов или бэкапов etcd — данные лежат
    зашифрованными. Не защищает от того, у кого есть доступ к API: apiserver
    расшифровывает их прозрачно, и `kubectl get secret` вернёт открытый текст.
  explanation: |
    Это ровно один слой из четырёх, на которых держится защита: RBAC (кто может читать),
    шифрование at rest (что лежит на диске), доступ к узлам (kubelet держит секреты
    в tmpfs) и способ доставки в под (файл против env). Ни один из них не заменяет
    остальные, а без первого шифрование почти бесполезно.
  ref: "https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/"

- id: k8s-config-secrets-017
  domain: k8s
  subtopic: config-secrets
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему токен ServiceAccount в поде теперь короткоживущий и что такое `audience`?
  answer: |
    Токен монтируется как projected volume, kubelet сам его продлевает, а при удалении
    пода он становится невалидным. `audience` ограничивает, **кому** токен предъявляется:
    выданный для внешнего сервиса не подойдёт к apiserver.
  explanation: |
    Раньше токен был вечным Secret'ом: утёк один раз — действителен всегда, отозвать
    можно только пересозданием ServiceAccount. Привязка ко времени и к аудитории
    превращает утечку из катастрофы в инцидент с ограниченным сроком. Тот же механизм
    лежит в основе federation с облачным IAM — под получает токен с audience облака
    и меняет его на облачные права без единого статического ключа.
  ref: "https://kubernetes.io/docs/concepts/security/service-accounts/"

- id: k8s-config-secrets-018
  domain: k8s
  subtopic: config-secrets
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужны External Secrets или Secrets Store CSI, если Secret уже есть в кластере?
  answer: |
    Чтобы источником правды был внешний менеджер секретов (Vault, облачный Secret
    Manager), а кластер получал значения оттуда. Это даёт ротацию, аудит доступа
    и единое хранилище на все окружения — и позволяет не держать секреты в git.
  explanation: |
    Родной Secret решает задачу доставки, но не жизненного цикла: он не умеет ни
    ротироваться сам, ни рассказать, кто и когда его читал. Отсюда же вечная проблема
    GitOps — манифест Secret нельзя положить в репозиторий как есть. Два подхода
    различаются механикой: External Secrets синхронизирует внешнее хранилище в обычный
    Secret, CSI-драйвер монтирует значения в под напрямую, не создавая объект в API.
  ref: "https://kubernetes.io/docs/concepts/storage/volumes/"

# --- senior-слой, проход 2 ---

- id: k8s-architecture-014
  domain: k8s
  subtopic: architecture
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Как контроллеры узнают об изменениях, не опрашивая apiserver в цикле?
  answer: |
    Через watch: контроллер один раз выкачивает список объектов, запоминает
    `resourceVersion` и дальше держит долгоживущее соединение, получая только изменения.
    Локальная копия объектов лежит в informer-кеше.
  explanation: |
    Отсюда масштабируемость apiserver: тысяча контроллеров не создаёт тысячу
    периодических запросов. Отсюда же практическое следствие для отладки: контроллер
    читает **свой кеш**, а не etcd, поэтому между записью объекта и реакцией на неё
    всегда есть лаг. И отсюда же периодический resync — страховка на случай
    оборванного watch, тот самый level-triggered подход.
  ref: "https://kubernetes.io/docs/reference/using-api/api-concepts/"

- id: k8s-architecture-015
  domain: k8s
  subtopic: architecture
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Узел потерял связь с control plane на десять минут. Что произойдёт с его подами?
  answer: |
    Через `node-monitor-grace-period` узел помечается `NotReady`, на него вешается taint
    `node.kubernetes.io/unreachable:NoExecute`, и контроллер начинает удалять объекты
    подов, чтобы контроллеры создали их на других узлах. Но **сами контейнеры на узле
    продолжают работать**, пока узел не вернётся.
  explanation: |
    Это ключевой риск split-brain: с точки зрения кластера поды уже переехали,
    с точки зрения узла они живы и, возможно, всё ещё пишут в общий том или держат
    внешнюю блокировку. Именно поэтому для StatefulSet с RWO-томом переезд требует
    отсоединения тома, а для приложений с эксклюзивным доступом нужна внешняя
    страховка вроде fencing.
  ref: "https://kubernetes.io/docs/concepts/architecture/nodes/"

- id: k8s-architecture-016
  domain: k8s
  subtopic: architecture
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Три реплики apiserver за балансировщиком. Как они не конфликтуют при
    одновременной записи одного объекта?
  answer: |
    Через оптимистичную блокировку: у каждого объекта есть `resourceVersion`, и запись
    принимается, только если версия совпадает с текущей. Проигравший получает конфликт
    и повторяет операцию на свежих данных.
  explanation: |
    Сами apiserver'ы состояния не хранят — они полностью stateless, а арбитраж
    происходит в etcd, который и обеспечивает консенсус. Отсюда понятно, почему
    масштабирование apiserver горизонтально работает, а масштабирование etcd — нет:
    добавление узлов etcd увеличивает надёжность, но замедляет запись, потому что
    кворум становится шире.
  ref: "https://kubernetes.io/docs/reference/using-api/api-concepts/"

- id: k8s-api-model-013
  domain: k8s
  subtopic: api-model
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое server-side apply и какую проблему он решает?
  answer: |
    Режим, в котором apiserver запоминает, **какой клиент владеет каким полем**
    (`managedFields`). Два контроллера, правящие разные поля одного объекта,
    больше не затирают работу друг друга, а попытка отобрать чужое поле даёт конфликт.
  explanation: |
    До него `apply` работал через аннотацию с последним применённым состоянием
    на стороне клиента, и любой посторонний контроллер, дописавший поле, ломал расчёт
    разницы. В кластере с HPA, service mesh и мутирующими webhook'ами у одного объекта
    легко оказывается три-четыре автора — server-side apply делает это сосуществование
    явным и разрешимым.
  ref: "https://kubernetes.io/docs/reference/using-api/server-side-apply/"

- id: k8s-api-model-014
  domain: k8s
  subtopic: api-model
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Namespace второй час висит в `Terminating`. Что происходит и почему нельзя
    просто снять финализатор?
  answer: |
    Один из объектов внутри не удаляется: чаще всего это CR, чей оператор мёртв,
    или API-сервис расширения, который не отвечает. Namespace ждёт, пока все ресурсы
    внутри будут вычищены.
  explanation: |
    Финализатор — это обещание довести уборку до конца: снять его руками означает
    удалить объект, минуя эту уборку, и оставить в системе сирот — облачные диски,
    балансировщики, записи во внешних системах, за которые продолжает капать счёт.
    Правильный путь — найти застрявший ресурс через `kubectl api-resources` и понять,
    какой контроллер не отвечает.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/finalizers/"

- id: k8s-cluster-dns-009
  domain: k8s
  subtopic: cluster-dns
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает NodeLocal DNSCache и какую проблему он закрывает?
  answer: |
    Ставит на каждый узел локальный кеширующий DNS, к которому обращаются поды этого
    узла. Снимает нагрузку с CoreDNS и убирает сетевой хоп до него на каждый запрос.
  explanation: |
    Кроме очевидной экономии, он лечит специфическую беду: DNS-запросы идут по UDP через
    conntrack, и на нагруженных узлах это приводило к потерянным пакетам и загадочным
    таймаутам ровно в пять секунд — характерная подпись повторной попытки резолва.
    Локальный кеш общается с CoreDNS по TCP и этот класс проблем убирает.
  ref: "https://kubernetes.io/docs/tasks/administer-cluster/nodelocaldns/"

- id: k8s-cluster-dns-010
  domain: k8s
  subtopic: cluster-dns
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Сервис пересоздали, но одно приложение продолжает стучаться на старый адрес часами.
    Почему кластерный DNS тут ни при чём?
  answer: |
    Потому что кеширует **клиент**. Классический случай — JVM, которая исторически
    кеширует результат резолва бессрочно; то же бывает у HTTP-клиентов с собственным
    пулом соединений. TTL записи кластера при этом соблюдается.
  explanation: |
    Разделение слоёв здесь спасает часы поисков: `nslookup` из того же пода покажет
    правильный новый адрес, а приложение будет ходить на старый — значит, дело
    не в DNS-инфраструктуре, а в рантайме приложения. Лечится настройкой кеша
    в самом клиенте, а не в CoreDNS.
  ref: "https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/"

- id: k8s-ingress-014
  domain: k8s
  subtopic: ingress
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    HTTP-01 валидация cert-manager висит неделями, под `cm-acme-http-solver` живой.
    Где искать?
  answer: |
    В маршруте до solver'а: Let's Encrypt должен снаружи достучаться до
    `/.well-known/acme-challenge/...`. Мешает обычно принудительный HTTPS-редирект,
    правило, перехватывающее все пути, закрытый снаружи домен или неверный DNS.
  explanation: |
    Solver — обычный под за временным Ingress, и он подчиняется тем же правилам
    маршрутизации, что и приложение. Отсюда парадокс: чем строже настроен вход
    (везде HTTPS, всё редиректится), тем вернее ломается выпуск сертификата, потому
    что валидация идёт именно по HTTP. Проверяется снаружи обычным curl'ом по пути
    challenge, а не изнутри кластера.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-storage-015
  domain: k8s
  subtopic: storage
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Из каких двух этапов состоит подключение тома к поду и почему это важно
    для диагностики?
  answer: |
    Attach — подключение диска к **узлу** (делает controller-manager через CSI),
    и mount — монтирование файловой системы в под (делает kubelet). Это разные
    операции с разными акторами и разными ошибками.
  explanation: |
    По симптому сразу видно этаж: `Multi-Attach error` или `FailedAttachVolume` —
    проблема на уровне узла и облачного API, том всё ещё числится за другой машиной.
    `FailedMount` — диск к узлу подключён, но не смонтировался: не та файловая система,
    права, отсутствующий каталог. Смешивать их — значит искать в облаке то,
    что лежит на узле.
  ref: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"

- id: k8s-storage-016
  domain: k8s
  subtopic: storage
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужен режим `ReadWriteOncePod`, если уже есть `ReadWriteOnce`?
  answer: |
    RWO допускает **несколько подов на одном узле** — этого достаточно, чтобы два
    экземпляра базы одновременно писали в одни файлы. RWOP гарантирует ровно один под
    во всём кластере.
  explanation: |
    Дыра в RWO проявляется именно в момент выката: старый и новый под какое-то время
    живут вместе, и если scheduler поставил их на один узел, оба получают доступ к тому.
    Для СУБД это повреждение данных, а не гонка за производительность. RWOP закрывает
    ровно этот сценарий, ценой того, что выкат становится обязательно с даунтаймом.
  ref: "https://kubernetes.io/docs/concepts/storage/persistent-volumes/"

- id: k8s-cluster-networking-013
  domain: k8s
  subtopic: cluster-networking
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Ты навесил на под одну NetworkPolicy, разрешающую вход от фронтенда.
    Что произошло с остальным его трафиком?
  answer: |
    Весь остальной **входящий** трафик к этому поду закрылся. Как только под попал
    под хотя бы одну политику по данному направлению, для него включается режим
    «запрещено всё, кроме явно разрешённого».
  explanation: |
    Ловушка в асимметрии: политика с секцией `ingress` не трогает исходящий трафик
    вовсе, и наоборот. Поэтому «закрыл вход, а под перестал ходить в БД» означает,
    что где-то есть вторая политика с `egress`. Вторая половина ловушки — проверки
    мониторинга и health-эндпоинты: их источник тоже надо разрешать явно, иначе
    под окажется здоров и невидим одновременно.
  ref: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"

- id: k8s-cluster-networking-014
  domain: k8s
  subtopic: cluster-networking
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что даёт замена kube-proxy на реализацию поверх eBPF?
  answer: |
    Обработка сервисного трафика уходит из цепочек iptables в программы eBPF в ядре:
    поиск бэкенда становится по хеш-таблице, независимо от числа сервисов, а часть
    хопов и NAT'ов исчезает вовсе.
  explanation: |
    Выигрыш заметен там же, где болит iptables: тысячи сервисов, частые изменения
    endpoints, задержка применения правил. Побочная выгода — видимость: eBPF-реализации
    отдают подробную сетевую телеметрию, которой в iptables взять неоткуда.
    Плата — требования к версии ядра и заметно более сложная отладка.
  ref: "https://kubernetes.io/docs/concepts/extend-kubernetes/compute-storage-net/network-plugins/"

- id: k8s-scheduling-014
  domain: k8s
  subtopic: scheduling
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Кластер стабильно недоутилизирован, но новые поды не влезают. Что менять
    и чем это опасно?
  answer: |
    Разрыв между `requests` и реальным потреблением: снижать брони до честных значений
    по метрикам. Опасность в том, что это осознанный overcommit — под пиковой нагрузкой
    сумма фактического потребления может превысить ресурсы узла.
  explanation: |
    Компромисс здесь не технический, а экономический: высокие requests дают
    предсказуемость и пустые узлы, низкие — плотность и риск вытеснений. Безопасная
    середина — requests по 95-му перцентилю реального потребления и обязательные
    `limits.memory`, чтобы одна утечка не забрала узел целиком. Именно эту задачу
    автоматизирует VPA в режиме рекомендаций.
  ref: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"

- id: k8s-placement-013
  domain: k8s
  subtopic: placement
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    `kubectl drain` висит и не может выселить под. При чём тут PodDisruptionBudget?
  answer: |
    PDB запрещает опускать число доступных подов ниже порога, а drain — добровольное
    нарушение и обязан его соблюдать. Если реплика одна, а PDB требует `minAvailable: 1`,
    выселить её нельзя никогда.
  explanation: |
    Получается дедлок из двух правильных по отдельности настроек, и он останавливает
    обновление узлов всего кластера. Разрешается либо увеличением числа реплик, либо
    переходом на `maxUnavailable: 1` вместо `minAvailable`, который ведёт себя разумно
    при малом числе подов. Это же объясняет, почему у синглтонов PDB обычно не ставят.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/disruptions/"

- id: k8s-placement-014
  domain: k8s
  subtopic: placement
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Жёсткая anti-affinity по узлам при трёх репликах и двух узлах. Что произойдёт
    во время выката?
  answer: |
    Выкат встанет: третья реплика не может разместиться уже сейчас, а при
    `maxSurge > 0` новый под тем более не найдёт свободного узла — на каждом уже
    сидит под этого же приложения.
  explanation: |
    Жёсткое правило размещения и стратегия выката конфликтуют неочевидно: по отдельности
    обе выглядят разумно, а вместе дают тупик, который проявляется не при создании,
    а через недели, при первом же обновлении. Отсюда практика — anti-affinity брать
    в мягком варианте, а гарантии распределения выражать через topology spread
    с `ScheduleAnyway`.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/"

- id: k8s-rbac-013
  domain: k8s
  subtopic: rbac
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему пользователь не может создать роль с правами шире собственных?
  answer: |
    Это защита от эскалации привилегий: apiserver проверяет, что создаваемая роль
    не выходит за пределы прав автора. Обойти проверку можно только имея явные глаголы
    `escalate` или `bind`.
  explanation: |
    Без такой проверки право `create roles` в своём namespace автоматически означало бы
    право стать в нём администратором — достаточно выписать роль на всё и привязать
    её себе. Отсюда же следует, почему глаголы `escalate` и `bind` считаются
    администраторскими: выдавая их, ты фактически выдаёшь право раздавать любые права.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/rbac/"

- id: k8s-rbac-014
  domain: k8s
  subtopic: rbac
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как отозвать доступ к кластеру у уволившегося сотрудника?
  answer: |
    Убрать его из группы в SSO или отозвать сертификат — то есть там, где выдаются
    удостоверения. Внутри кластера удалять нечего: объекта User не существует,
    а RBAC-привязки описывают права группы, а не человека.
  explanation: |
    Это следствие того, что аутентификацию Kubernetes делегирует наружу. Клиентские
    сертификаты здесь худший вариант: отозвать их без перевыпуска CA нельзя, поэтому
    их выписывают с коротким сроком или не используют для людей вовсе. При OIDC
    отзыв мгновенный и централизованный — это главный практический аргумент за него.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/authentication/"

# --- troubleshooting ---

- id: k8s-troubleshooting-001
  domain: k8s
  subtopic: troubleshooting
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Первая команда при разборе любой проблемы с подом — какая и почему?
  answer: |
    `kubectl describe pod <name>`. Она показывает **события**: почему под не планируется,
    не тянется образ, не монтируется том, падают пробы — то, чего нет ни в статусе,
    ни в логах.
  explanation: |
    Логи показывают, что говорит приложение, но подавляющая часть отказов происходит
    **до** запуска приложения — на планировании, скачивании образа, монтировании.
    В этих случаях логов физически не существует, и попытка начать с `kubectl logs`
    даёт пустоту вместо диагноза. События же называют причину прямым текстом.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"

- id: k8s-troubleshooting-002
  domain: k8s
  subtopic: troubleshooting
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что означает `READY 0/1` при статусе `Running`?
  answer: |
    Контейнер запущен, но не прошёл `readinessProbe`. Приложение работает, а трафик
    на него не идёт — из endpoints оно исключено.
  explanation: |
    Колонка `STATUS` отвечает на вопрос «запустилось ли», колонка `READY` — «можно ли
    давать трафик», и это два независимых факта. Именно это расхождение стоит за
    большинством жалоб «под живой, а сервис не отвечает»: смотрели на `Running`
    и не заметили нули слева.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"

- id: k8s-troubleshooting-003
  domain: k8s
  subtopic: troubleshooting
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Сколько живут события (`Events`) в кластере?
  answer: |
    Около часа — по умолчанию у них TTL, после которого apiserver их удаляет.
  explanation: |
    Отсюда правило разбора ночных инцидентов: события к утру уже мертвы, и восстановить
    причину по ним невозможно. Остаются только внешние системы — централизованные
    логи и метрики. Это же объясняет пустой раздел `Events` у пода, который сломался
    вчера и с тех пор просто висит.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/"

- id: k8s-troubleshooting-004
  domain: k8s
  subtopic: troubleshooting
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `kubectl logs -f` отличается от `kubectl logs --previous`?
  answer: |
    `-f` следит за логом **текущего** запуска в реальном времени. `--previous` показывает
    лог **предыдущего**, уже завершившегося запуска контейнера.
  explanation: |
    При падении контейнера причина остаётся в предыдущем запуске, а текущий начинается
    с чистого листа — поэтому у только что перезапущенного пода `logs` без флага почти
    всегда пуст или бесполезен. Хранится ровно один предыдущий запуск: после второго
    рестарта самый первый лог уже недоступен.
  ref: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/"

- id: k8s-troubleshooting-005
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Опиши лестницу диагностики: в каком порядке проверять, когда «сервис не работает».
  answer: |
    Снизу вверх: **объект существует** → **под запланирован** → **контейнер запущен** →
    **под готов** (readiness, endpoints) → **трафик доходит** (Service, DNS, Ingress).
    На каждой ступени своя команда и свой класс причин.
  explanation: |
    Порядок не произволен: каждая ступень — предусловие следующей, и проверять верхнюю,
    не убедившись в нижней, значит искать не там. Классическая потеря времени — читать
    логи приложения, когда под ещё в `Pending`: приложения не существует. Правило
    «сначала стадия, потом команда» экономит больше, чем знание любой отдельной команды.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/"

- id: k8s-troubleshooting-006
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Deployment создан, `kubectl get pods` пуст, событий на подах нет. Куда смотреть?
  answer: |
    На **ReplicaSet**: `kubectl describe rs`. Если подов не существует, события о причине
    висят на том, кто пытался их создать. Типичные причины — ResourceQuota, admission-политика,
    ошибка в pod-template.
  explanation: |
    Это применение правила «нет объекта — иди к владельцу». Диагностика по умолчанию
    смотрит на поды, но когда создание пода отклонено на admission, пода нет, и смотреть
    не на что. Ошибка при этом никуда не делась — она записана у контроллера, который
    получил отказ.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"

- id: k8s-troubleshooting-007
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Соединение к сервису отваливается по **таймауту**, а не с `connection refused`.
    О чём это говорит?
  options:
    a: "Пакет не дошёл: его дропнули по дороге — NetworkPolicy, firewall, неверный маршрут"
    b: "Пакет дошёл, но на порту никто не слушает"
    c: "Приложение приняло соединение и слишком долго отвечает"
    d: "Не разрешилось DNS-имя сервиса"
  answer: a
  explanation: |
    Разница диагностична и экономит половину поиска. `Connection refused` означает, что
    пакет **доехал** до хоста и ядро ответило RST — сеть в порядке, проблема в том, что
    процесс не слушает нужный порт. Таймаут означает, что ответа нет вообще: пакет
    молча уничтожен где-то по пути, и искать надо сетевые правила, а не приложение.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/"

- id: k8s-troubleshooting-008
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем `NXDOMAIN` отличается от таймаута при резолве имени сервиса?
  answer: |
    `NXDOMAIN` — DNS **ответил**, что такого имени нет: неверное имя, не тот namespace,
    сервиса не существует. Таймаут — DNS не ответил вовсе: проблема с CoreDNS,
    сетью до него или закрытым egress.
  explanation: |
    Это та же логика «ответ против тишины», что с refused и таймаутом, только на слое
    имён. Различать критично, потому что ведёт в противоположные стороны: в первом
    случае чинишь манифест приложения, во втором — инфраструктуру кластера. Проверяется
    одной командой `nslookup` изнутри пода: она показывает и сам ответ, и то, откуда он.
  ref: "https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/"

- id: k8s-troubleshooting-009
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как проверить, что приложение вообще отвечает, минуя Service, Ingress и DNS?
  answer: |
    `kubectl port-forward pod/<name> 8080:8080` — соединение идёт через apiserver прямо
    к поду, в обход всей сетевой машинерии кластера.
  explanation: |
    Это способ разрезать проблему пополам одним действием. Работает через port-forward,
    но не работает через Ingress — значит, приложение живо, и виноват путь: Service,
    endpoints, ingress-controller. Не работает и так — виновато само приложение,
    и в сеть можно не ходить.
  ref: "https://kubernetes.io/docs/tasks/access-application-cluster/port-forward-access-application-cluster/"

- id: k8s-troubleshooting-010
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    В образе нет ни shell, ни утилит (distroless). Как попасть внутрь пода на отладку?
  answer: |
    `kubectl debug -it <pod> --image=busybox --target=<container>` — в под добавляется
    **ephemeral-контейнер** с нужными инструментами, а `--target` даёт ему общий
    process namespace с отлаживаемым контейнером.
  explanation: |
    Без `--target` ты попадаешь в соседний контейнер того же пода: сеть и тома общие,
    но чужих процессов не видно, и `ps` покажет пустоту. Именно `--target` превращает
    отладку в полноценную. Важное ограничение: ephemeral-контейнер нельзя ни удалить,
    ни перезапустить — он живёт до конца жизни пода.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/"

- id: k8s-troubleshooting-011
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Под в `CrashLoopBackOff`. Перечисли шаги разбора по порядку.
  answer: |
    1) `kubectl logs --previous` — что сказало приложение перед смертью;
    2) exit code в `describe` — 137 (OOM или SIGKILL), 1 (ошибка приложения), 0
    (завершился штатно при `restartPolicy: Always`);
    3) события — не убивает ли его liveness;
    4) конфиг — переменные, тома, права.
  explanation: |
    Порядок идёт от самого информативного к самому редкому. Отдельно стоит помнить,
    что `CrashLoopBackOff` — состояние ожидания, а не причина, и что exit code 0 тут
    тоже означает проблему: контейнер сделал работу и вышел, а политика требует держать
    его вечно — обычно это неверно выбранный тип нагрузки.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"

- id: k8s-troubleshooting-012
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Под завис в `ContainerCreating`. Какие три класса причин и как их различить?
  answer: |
    Тома (нет ConfigMap или Secret, не монтируется PVC), сеть (CNI не выдал адрес),
    образ (тянется или не тянется). Различает `describe`: причина написана в событиях
    прямым текстом.
  explanation: |
    Все три объединяет одно: kubelet начал работу и застрял на подготовке, поэтому
    контейнеров ещё нет и логов не существует. Практическая ценность классификации
    в том, что они ведут к разным людям: тома и образ — вопрос к манифесту
    и реестру, сеть — к администратору кластера.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"

- id: k8s-troubleshooting-013
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что значит фраза «эндпоинты разъехались» и почему это не диагноз?
  answer: |
    Что `EndpointSlice` сервиса пуст. Это **наблюдение**: оно говорит, где искать,
    но не почему. Причин две — метки подов не совпали с селектором Service,
    либо поды не готовы.
  explanation: |
    Разделение наблюдения и диагноза здесь принципиально, потому что дальше действия
    противоположны: в первом случае правишь манифест, во втором — разбираешься с
    readiness или приложением. Различить их — одна команда:
    `kubectl get pods -l <селектор из Service>`. Пусто — метки; не пусто, но не
    `READY` — готовность.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-service/"

- id: k8s-troubleshooting-014
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Ingress отдал `502`. Как понять, страницу нарисовал ingress-controller
    или само приложение?
  answer: |
    Если ошибку отрисовал nginx (характерная страница, заголовок `Server: nginx`) —
    контроллер жив, значит проблема в upstream. Если ответ пришёл от приложения —
    путь целиком рабочий, и это уже его собственная ошибка.
  explanation: |
    Правило «кто нарисовал страницу, тот дожил» позволяет за один взгляд определить,
    до какого этажа доехал запрос. Отсюда и разбор: `502` от nginx означает «правило
    сработало, upstream не ответил» — смотреть надо поды и порт `targetPort`, а не
    манифест Ingress.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-troubleshooting-015
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Приложению нужно знать имя своего пода и узла. Как передать это без хардкода?
  answer: |
    Через Downward API: значения из `metadata` и `spec` пробрасываются в переменные
    окружения или в файлы — `POD_NAME`, `NODE_NAME`, namespace, IP пода.
  explanation: |
    Это единственный штатный способ дать приложению знать о себе, не выдавая ему доступ
    к API кластера. Практическая польза именно в диагностике: имя пода и узла
    в структурированном логе превращают централизованные логи из свалки в нечто,
    по чему можно отследить конкретный экземпляр и понять, все ли реплики болеют
    или только одна.
  ref: "https://kubernetes.io/docs/concepts/workloads/pods/downward-api/"

- id: k8s-troubleshooting-016
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `kubectl events --for pod/<name>` удобнее, чем `describe`?
  answer: |
    Он показывает события в **хронологическом порядке** и умеет следить в реальном
    времени (`--watch`), тогда как `describe` даёт срез вперемешку с остальным описанием
    объекта.
  explanation: |
    Порядок важен там, где надо восстановить последовательность: сначала не сработала
    проба, потом убили контейнер, потом не смогли скачать образ — или наоборот. По
    описанию объекта эту цепочку не собрать. Плюс события можно смотреть по всему
    namespace сразу и увидеть, что проблема не в одном поде.
  ref: "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_events/"

- id: k8s-troubleshooting-017
  domain: k8s
  subtopic: troubleshooting
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как правильно проверять гипотезу при разборе инцидента?
  answer: |
    Проверять тем, что гипотезу **отличает** от конкурирующих, а не тем, что её
    подтверждает. Хорошая проверка — та, результат которой при разных гипотезах разный.
  explanation: |
    Классическая ловушка: подозреваешь сеть, идёшь смотреть сетевые метрики, находишь
    там что-нибудь необычное и успокаиваешься — при том что необычное там есть всегда.
    Дисциплина различающих проверок и объясняет силу пар вроде «таймаут против refused»
    или «NXDOMAIN против тишины»: каждая делит пространство причин пополам одним действием.
  ref: "https://kubernetes.io/docs/tasks/debug/"

- id: k8s-troubleshooting-018
  domain: k8s
  subtopic: troubleshooting
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Endpoints полны, поды `Ready`, а Ingress всё равно отдаёт `502`. Что осталось?
  answer: |
    Приложение принимает соединение, но отвечает неверно: не тот протокол (HTTPS
    на HTTP-порту), слишком долгий ответ против таймаута контроллера, слишком большие
    заголовки, разорванный keep-alive. Проверяется `curl` прямо на pod IP.
  explanation: |
    Это остаток после того, как отсеяны все инфраструктурные слои: маршрут найден,
    бэкенды есть, соединение устанавливается. Значит расхождение в **семантике** HTTP,
    а не в доставке пакетов. Отсюда следующий шаг — сравнить, что отдаёт под напрямую
    и что видит контроллер: разница и есть ответ.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-troubleshooting-019
  domain: k8s
  subtopic: troubleshooting
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Приложение жалуется на нехватку памяти, но под не убивают и `restartCount` нулевой.
    Что происходит?
  answer: |
    Убивают **процесс внутри** контейнера, а не сам контейнер: OOM-killer ядра выбрал
    дочерний процесс, PID 1 выжил, значит с точки зрения kubelet ничего не случилось.
  explanation: |
    Из-за этого инцидент невидим для кластера: рестартов нет, статус зелёный, метрики
    пода в норме — а приложение теряет воркеров. Смотреть надо в логи самого приложения
    и в `dmesg` на узле. Это же аргумент за то, чтобы PID 1 корректно реагировал на
    смерть детей, иначе контейнер превращается в кладбище зомби-процессов.
  ref: "https://kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/"

- id: k8s-troubleshooting-020
  domain: k8s
  subtopic: troubleshooting
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Всё в кластере выглядит здоровым, но `kubectl apply` иногда висит и падает
    по таймауту. Куда смотреть?
  answer: |
    На admission webhooks: mutating или validating webhook с `failurePolicy: Fail`,
    чей под недоступен, блокирует создание объектов. Список — `kubectl get
    mutatingwebhookconfigurations,validatingwebhookconfigurations`.
  explanation: |
    Webhook стоит на пути **каждого** подходящего запроса к apiserver, и его недоступность
    выглядит не как отказ приложения, а как поломка самого кластера. Самый неприятный
    вариант — webhook, который перехватывает создание подов в своём же namespace:
    он не может подняться, потому что для этого нужен он сам. Отсюда практика —
    исключать системные namespace из области действия политик.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/"

- id: k8s-troubleshooting-021
  domain: k8s
  subtopic: troubleshooting
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Один под из десяти реплик отвечает медленно, остальные нормально. С чего начать?
  answer: |
    Сравнить его окружение с остальными: на каком он узле, кто его соседи, есть ли
    на этом узле троттлинг или давление памяти. Проблема реплики, а не приложения,
    почти всегда живёт на уровне узла.
  explanation: |
    Ключ в самой асимметрии: код и конфиг у всех реплик одинаковые, значит различие
    приходит извне — шумный сосед, неудачное распределение по зонам, деградировавший
    диск. Это тот случай, когда `NODE_NAME` в логах через Downward API окупается
    мгновенно: без него связь «медленно» и «вот этот узел» не увидеть.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-cluster/"

- id: k8s-troubleshooting-022
  domain: k8s
  subtopic: troubleshooting
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Kubelet на узле не отвечает, но контейнеры работают. Чем посмотреть, что на узле
    реально запущено?
  answer: |
    `crictl ps` и `crictl logs` прямо на узле — они разговаривают с container runtime
    по CRI, минуя kubelet и apiserver.
  explanation: |
    Это последний этаж диагностики, куда спускаются, когда обычные инструменты
    бесполезны: `kubectl` спрашивает apiserver, apiserver знает лишь то, что успел
    сообщить kubelet, а тот молчит. `crictl` показывает факт, а не представление
    кластера о факте, — и расхождение между ними само по себе диагноз.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-cluster/crictl/"

- id: k8s-troubleshooting-023
  domain: k8s
  subtopic: troubleshooting
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Приложение периодически получает ошибки соединения ровно через 5 секунд ожидания.
    Что это за подпись?
  answer: |
    Характерный признак проблем с DNS по UDP: клиент ждёт стандартный таймаут резолвера
    в 5 секунд и повторяет запрос. Обычно за этим стоят потери UDP-пакетов
    на нагруженном узле или перегруженный CoreDNS.
  explanation: |
    Ровные пятисекундные задержки — редкий случай, когда число само называет причину:
    в приложении такие круглые интервалы почти не встречаются, а таймаут резолвера
    именно таков по умолчанию. Лечится обычно локальным DNS-кешем на узлах и переходом
    резолва на TCP; крутить таймауты приложения бесполезно, они лишь маскируют симптом.
  ref: "https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/"

- id: k8s-troubleshooting-024
  domain: k8s
  subtopic: troubleshooting
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Под удалили, а он всё ещё в `Terminating` спустя полчаса. Причины и что делать?
  answer: |
    Приложение не реагирует на `SIGTERM` и висит до конца grace period; или зависло
    размонтирование тома; или недоступен узел, и kubelet не подтверждает удаление.
    Принудительно — `--force --grace-period=0`, но с пониманием последствий.
  explanation: |
    Форс удаляет объект из API, **не дожидаясь подтверждения от узла**, — и если узел
    жив, контейнер на нём продолжает работать. Для stateful-нагрузки с общим томом
    это прямой путь к двум писателям и повреждению данных. Поэтому форс уместен, когда
    точно известно, что узла больше нет.
  ref: "https://kubernetes.io/docs/tasks/run-application/force-delete-stateful-set-pod/"

# --- autoscaling ---

- id: k8s-autoscaling-001
  domain: k8s
  subtopic: autoscaling
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Три слоя автоскейлинга в Kubernetes — что каждый из них крутит?
  answer: |
    HPA меняет **число реплик** пода. VPA меняет **requests и limits** одного пода.
    Cluster Autoscaler меняет **число узлов** в кластере.
  explanation: |
    Слои отвечают на разные вопросы: «нагрузки больше, чем тянет одна реплика» — HPA;
    «реплика просит не столько, сколько ест» — VPA; «поды некуда сажать» — CA.
    Общее у всех троих одно и принципиальное: решения принимаются по **броням**
    (`requests`), а не по фактическому потреблению узлов.
  ref: "https://kubernetes.io/docs/concepts/workloads/autoscaling/"

- id: k8s-autoscaling-002
  domain: k8s
  subtopic: autoscaling
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    По какой формуле HPA считает нужное число реплик?
  answer: |
    `желаемые = ceil(текущие × (текущая метрика / целевая метрика))`. Результат
    ограничивается `minReplicas` и `maxReplicas`.
  explanation: |
    Из формулы следует главное свойство: HPA **пропорционален, а не инкрементален**.
    При двукратном превышении цели он сразу удваивает число реплик, а не добавляет
    по одной. Это отвечает на частый вопрос «почему сразу с 2 до 8» — потому что
    метрика была вчетверо выше целевой.
  ref: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"

- id: k8s-autoscaling-003
  domain: k8s
  subtopic: autoscaling
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Относительно чего HPA считает утилизацию CPU в процентах?
  answer: |
    Относительно `requests`, а не limits и не мощности узла. `targetAverageUtilization: 80`
    означает «80% от забронированного», то есть при `requests: 100m` — 80m.
  explanation: |
    Отсюда неочевидное поведение: под с заниженными requests кажется HPA перегруженным
    и вызывает лишний скейл, а с завышенными — вечно недогруженным, и скейла не будет
    никогда, сколько ни лей нагрузки. То есть корректность автоскейлинга напрямую
    зависит от честности броней.
  ref: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"

- id: k8s-autoscaling-004
  domain: k8s
  subtopic: autoscaling
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что должно стоять в кластере, чтобы HPA работал по CPU?
  answer: |
    `metrics-server`: он собирает потребление с kubelet'ов и отдаёт его через
    `metrics.k8s.io`. Ту же цепочку использует `kubectl top`.
  explanation: |
    Именно поэтому проверка «работает ли `kubectl top pods`» — первый шаг при разборе
    неработающего HPA: обе функции висят на одном источнике. Prometheus здесь
    не помогает: он отдельная система и к `metrics.k8s.io` отношения не имеет,
    пока не поставлен адаптер.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/"

- id: k8s-autoscaling-005
  domain: k8s
  subtopic: autoscaling
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    `kubectl get hpa` показывает `TARGETS: <unknown>/80%`. Самая частая причина?
  options:
    a: "У контейнеров не заданы `requests` по CPU — считать процент не от чего"
    b: "HPA ещё не собрал историю метрик, нужно подождать 5 минут"
    c: "Число реплик уже достигло `maxReplicas`"
    d: "Нагрузка нулевая, поэтому метрика не определена"
  answer: a
  explanation: |
    Утилизация — это дробь, у которой в знаменателе стоят `requests`. Нет знаменателя —
    нет и значения, и HPA честно пишет `<unknown>` вместо того, чтобы гадать.
    Вторая по частоте причина того же симптома — отсутствующий или упавший
    `metrics-server`, то есть отсутствие числителя. Обе проверяются за одну минуту.
  ref: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"

- id: k8s-autoscaling-006
  domain: k8s
  subtopic: autoscaling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему HPA увеличивает число реплик быстро, а уменьшает медленно?
  answer: |
    Асимметрия заложена намеренно: у scale-down есть окно стабилизации (по умолчанию
    300 секунд), в течение которого HPA берёт максимум из недавних рекомендаций.
    У scale-up такого окна по умолчанию нет.
  explanation: |
    Цена ошибок разная. Поздно добавить реплики — отказ обслуживания прямо сейчас.
    Рано убрать — риск снять мощности перед следующим всплеском и начать колебаться.
    Поэтому вверх система реагирует немедленно, а вниз — только убедившись, что спад
    устойчив. Окно настраивается через `behavior`.
  ref: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"

- id: k8s-autoscaling-007
  domain: k8s
  subtopic: autoscaling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему HPA и VPA нельзя вешать на один и тот же ресурс?
  answer: |
    Они образуют петлю: VPA поднимает `requests`, из-за чего утилизация в процентах
    падает, HPA убирает реплики; нагрузка на оставшиеся растёт, VPA снова поднимает
    requests. Результат — постоянное колебание.
  explanation: |
    Причина в общем знаменателе: HPA считает проценты от requests, а VPA этот самый
    знаменатель и меняет. Два регулятора, управляющие одной величиной с разных сторон,
    неизбежно раскачивают систему. Рабочая комбинация — VPA по памяти, HPA по CPU
    или по внешней метрике, то есть разные ресурсы.
  ref: "https://kubernetes.io/docs/concepts/workloads/autoscaling/"

- id: k8s-autoscaling-008
  domain: k8s
  subtopic: autoscaling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что триггерит Cluster Autoscaler на добавление узла?
  answer: |
    Наличие подов в `Pending`, которые **поместились бы**, если бы появился ещё один
    узел из группы. CA симулирует посадку на узел-кандидат и добавляет машину только
    если под действительно на неё сядет.
  explanation: |
    Симуляция объясняет частый ступор: под висит `Pending`, а узлы не добавляются —
    значит, ни один узел из группы поду не подойдёт. Причина обычно не в ресурсах,
    а в ограничениях: жёсткая affinity, taint, зональность тома, слишком большие
    requests. Загрузка узлов при этом на решение не влияет вообще.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/cluster-autoscaling/"

- id: k8s-autoscaling-009
  domain: k8s
  subtopic: autoscaling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Узлы полупустые, но Cluster Autoscaler их не удаляет. Какие типовые блокеры?
  answer: |
    Поды без контроллера (созданные вручную), поды с локальным хранилищем, поды,
    которые нарушат PodDisruptionBudget, поды в `kube-system` без PDB, и явная
    аннотация `cluster-autoscaler.kubernetes.io/safe-to-evict: "false"`.
  explanation: |
    Scale-down по природе опаснее scale-up: он трогает работающие поды, поэтому обвешан
    защитами и требует, чтобы **каждый** под с узла было куда переселить. Один
    неудачно стоящий под держит целую машину и её счёт. Отсюда практика — PDB
    на всё, что переживает обслуживание, и осознанное отношение к аннотациям.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/cluster-autoscaling/"

- id: k8s-autoscaling-010
  domain: k8s
  subtopic: autoscaling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем KEDA, если есть HPA?
  answer: |
    KEDA даёт скейл по **внешним** событиям — длине очереди Kafka или RabbitMQ, числу
    сообщений, метрике из Prometheus, расписанию — и умеет масштабировать до нуля.
    Технически он создаёт HPA под капотом.
  explanation: |
    Для обработчика очереди CPU — ложный сигнал: воркер может простаивать с пустым
    процессором при тысяче необработанных сообщений или, наоборот, грузить CPU на
    последней задаче. Правильная метрика здесь — глубина очереди, то есть объём
    невыполненной работы. Скейл до нуля — вторая причина: HPA сам по себе ниже
    единицы не опускается.
  ref: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"

- id: k8s-autoscaling-011
  domain: k8s
  subtopic: autoscaling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    HPA стоит, нагрузка очевидно есть, реплики не растут. Порядок проверки?
  answer: |
    1) `kubectl top pods` — жив ли metrics-server; 2) заданы ли `requests` по нужному
    ресурсу; 3) `kubectl describe hpa` — что он сам пишет в условиях и событиях;
    4) не достигнут ли `maxReplicas`; 5) не упирается ли скейл в квоту namespace.
  explanation: |
    Порядок идёт от источника данных к потребителю: без метрик и броней HPA не может
    даже вычислить цель, и всё остальное проверять бессмысленно. `describe hpa` стоит
    третьим, потому что в его `Conditions` (`AbleToScale`, `ScalingActive`) причина
    обычно написана словами — большинство разборов на этом и заканчивается.
  ref: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"

- id: k8s-autoscaling-012
  domain: k8s
  subtopic: autoscaling
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Реплики скачут вверх-вниз каждую минуту. Что настраивать?
  answer: |
    Секцию `behavior` у HPA: окно стабилизации и политики скорости изменения. Плюс
    проверить, не воюют ли за одну метрику два регулятора и не слишком ли резкая
    выбрана целевая величина.
  explanation: |
    Флаппинг — это классическая перерегуляция: система реагирует быстрее, чем успевает
    проявиться эффект её же предыдущего действия. Новые поды не начинают снимать
    нагрузку мгновенно — им нужно запуститься и прогреться, а HPA за это время
    успевает посчитать ещё раз. Окно стабилизации даёт эффекту дойти до метрики.
  ref: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"

- id: k8s-autoscaling-013
  domain: k8s
  subtopic: autoscaling
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    HPA управляет числом реплик, но в манифесте Deployment стоит `replicas: 3`
    и он лежит в git под Argo CD. Что произойдёт?
  answer: |
    Постоянная война: HPA ставит своё число, GitOps-агент возвращает три. Лечится
    удалением поля `replicas` из манифеста или явным исключением его из сравнения.
  explanation: |
    Оба участника правы по-своему: HPA обязан приводить число реплик к нагрузке,
    Argo CD — к тому, что записано в git. Конфликт возникает из-за того, что одно поле
    имеет двух владельцев. Именно эту проблему в общем виде решает server-side apply
    с учётом владения полями, но в случае с `replicas` проще просто не описывать его
    в манифесте.
  ref: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"

- id: k8s-autoscaling-014
  domain: k8s
  subtopic: autoscaling
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему VPA в режиме `Auto` перезапускает поды и чем это опасно?
  answer: |
    Потому что `requests` исторически задавались только при создании пода: чтобы
    применить новые значения, VPA вытесняет под и даёт контроллеру создать его заново.
    Опасно для нагрузок, чувствительных к рестарту, и для синглтонов.
  explanation: |
    Отсюда популярность режима рекомендаций: VPA считает и показывает подходящие
    значения, а применяет их человек при следующем выкате — без сюрпризов в проде.
    Именно эту слабость закрывает появившееся изменение ресурсов пода на лету,
    но оно относительно новое и включено не в каждом кластере.
  ref: "https://kubernetes.io/docs/concepts/workloads/autoscaling/"

- id: k8s-autoscaling-015
  domain: k8s
  subtopic: autoscaling
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Cluster Autoscaler добавляет узел за минуты, а трафик вырос за секунды.
    Как закрывают этот разрыв?
  answer: |
    Заранее выделенной «подушкой»: низкоприоритетные поды-заглушки, которые занимают
    место и вытесняются preemption'ом, как только появляется реальная нагрузка. Узел
    для неё уже готов, а заглушки уезжают ждать нового узла.
  explanation: |
    Приём меняет размен: платишь за постоянно свободные ресурсы, но получаешь мгновенный
    отклик. Работает он ровно на механике preemption — жертвы выбираются по приоритету,
    а заглушкам ставят отрицательный. Это же объясняет, зачем `PriorityClass` нужен
    не только для «важных» нагрузок, но и для намеренно неважных.
  ref: "https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/"

- id: k8s-autoscaling-016
  domain: k8s
  subtopic: autoscaling
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему масштабирование по CPU плохо работает для сервиса, который в основном ждёт
    ответа от базы?
  answer: |
    Потому что ожидание ввода-вывода не потребляет процессор: сервис может держать
    тысячи висящих запросов при нулевом CPU. HPA увидит недогруз и не добавит реплик,
    хотя очередь растёт.
  explanation: |
    CPU — метрика **насыщения вычислением**, а узкое место здесь совсем другое: число
    одновременных соединений или размер пула. Правильный сигнал в таком случае —
    прикладная метрика: длина очереди, число активных запросов, latency. Отсюда общий
    принцип: скейлить надо по тому, что реально ограничивает пропускную способность.
  ref: "https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/"

- id: k8s-autoscaling-017
  domain: k8s
  subtopic: autoscaling
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что сломается, если позволить HPA скейлить StatefulSet с базой данных?
  answer: |
    Почти всё: новая реплика получает пустой том и должна пройти инициализацию
    и репликацию, а роли в кластере БД (кто primary) автоскейлер не понимает.
    Уменьшение числа реплик рискует убрать узел, который держит данные или лидерство.
  explanation: |
    Автоскейлинг построен на допущении взаимозаменяемости реплик — оно верно для
    stateless-сервисов и ложно для баз. Технически HPA к StatefulSet прицепить можно,
    и это делает его особенно опасным: механизм сработает, а осмысленность результата
    никто не проверит. Масштабирование БД — задача оператора, который знает её протокол.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"

- id: k8s-autoscaling-018
  domain: k8s
  subtopic: autoscaling
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Cluster Autoscaler и Karpenter решают одну задачу. В чём разница подхода?
  answer: |
    CA работает с **заранее описанными группами узлов** и умеет только менять их размер.
    Karpenter смотрит на неразмещённые поды и подбирает под них подходящий тип машины,
    создавая узлы напрямую, без групп.
  explanation: |
    Разница практическая: с CA приходится заранее угадывать нужные типы машин
    и заводить группу под каждый профиль нагрузки, а поды, не влезающие ни в один
    профиль, висят в `Pending`. Karpenter снимает этот шаг и заодно лучше упаковывает
    нагрузку, но привязан к конкретным облакам и меняет модель эксплуатации.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/cluster-autoscaling/"

# --- namespaces-quotas ---

- id: k8s-namespaces-quotas-001
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что namespace даёт и чего он НЕ даёт?
  answer: |
    Даёт: область имён (объекты с одинаковыми именами не конфликтуют), область действия
    RBAC и область действия квот. **Не даёт** сетевой изоляции, изоляции по узлам
    и защиты от соседей по ресурсам.
  explanation: |
    Самое опасное заблуждение — считать namespace границей безопасности. Под из одного
    namespace по умолчанию свободно ходит по сети в любой другой: сеть кластера плоская,
    и режет её только NetworkPolicy. Namespace — это про организацию и права,
    а изоляция строится отдельными механизмами.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/"

- id: k8s-namespaces-quotas-002
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Какие ресурсы вообще не принадлежат namespace?
  answer: |
    Узлы, PersistentVolume, StorageClass, ClusterRole и ClusterRoleBinding, CRD,
    IngressClass, PriorityClass и сами namespace. Проверить —
    `kubectl api-resources --namespaced=false`.
  explanation: |
    Логика проста: если объект описывает **кластер как целое** или его физические
    ресурсы, он не может принадлежать одному namespace. Отсюда практическое следствие
    для мультитенантности — команда, получившая полный доступ к своему namespace,
    всё равно не может создать StorageClass или CRD, и это правильно: такие объекты
    влияют на всех.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/"

- id: k8s-namespaces-quotas-003
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что ограничивает ResourceQuota?
  answer: |
    Суммарные `requests` и `limits` по CPU и памяти в namespace, объём запрошенного
    хранилища и **количество объектов** — сколько подов, сервисов, PVC, секретов
    можно создать.
  explanation: |
    Второй пункт недооценивают: ограничение числа объектов защищает не от перерасхода
    железа, а от засорения etcd — забытым CronJob'ом, циклом создания секретов,
    сбойным оператором. Квота на `services.loadbalancers` при этом защищает
    непосредственно бюджет: каждый такой сервис — отдельный платный балансировщик.
  ref: "https://kubernetes.io/docs/concepts/policy/resource-quotas/"

- id: k8s-namespaces-quotas-004
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает LimitRange?
  answer: |
    Задаёт для **отдельного** контейнера или пода значения по умолчанию (`default`,
    `defaultRequest`) и допустимые границы (`min`, `max`). Работает при создании пода.
  explanation: |
    Разница с квотой в объекте регулирования: ResourceQuota считает сумму по namespace,
    LimitRange разбирается с каждым подом поштучно. Поэтому один без другого работает
    плохо: квота без LimitRange отвергает поды без requests, а LimitRange без квоты
    не мешает создать их тысячу.
  ref: "https://kubernetes.io/docs/concepts/policy/limit-range/"

- id: k8s-namespaces-quotas-005
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    В namespace включили ResourceQuota на CPU и память. Что станет с подами,
    у которых не заданы `requests` и `limits`?
  options:
    a: "Их перестанут создавать: без явных значений квоту не посчитать"
    b: "Они создадутся, но получат класс BestEffort и будут вытесняться первыми"
    c: "Они создадутся, kubelet подставит значения по умолчанию"
    d: "Ничего не изменится: квота считает только фактическое потребление"
  answer: a
  explanation: |
    Квота — это бухгалтерия броней: чтобы прибавить под к сумме namespace, нужно знать
    его вклад, а у пода без requests его нет. Поэтому квота на compute-ресурс
    **делает их обязательными** для всех новых подов. Именно поэтому ResourceQuota
    и LimitRange ставят только парой: второй подставляет дефолты и снимает проблему.
  ref: "https://kubernetes.io/docs/concepts/policy/resource-quotas/"

- id: k8s-namespaces-quotas-006
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Квота проверяется на admission или при планировании?
  answer: |
    На **admission**, то есть при создании объекта. Если под не проходит по квоте,
    он вообще не появляется — его не будет даже в `Pending`.
  explanation: |
    Отсюда самый сбивающий с толку симптом: Deployment есть, подов ноль, событий
    на подах нет и быть не может. Ошибка записана у ReplicaSet, который получил отказ.
    Сравни с нехваткой ресурсов на узлах: там под создаётся и честно висит в `Pending` —
    другой этаж, другое место поиска.
  ref: "https://kubernetes.io/docs/concepts/policy/resource-quotas/"

- id: k8s-namespaces-quotas-007
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Указал у контейнера только `limits`, `requests` не указал. Что получится?
  answer: |
    `requests` автоматически приравняются к `limits`. Под получит класс `Guaranteed`
    и забронирует ровно столько, сколько указано в потолке.
  explanation: |
    Умолчание работает в одну сторону и на этом ловит: указал только `requests` —
    `limits` останутся пустыми (если их не задаст LimitRange), и контейнер сможет
    съесть сколько угодно. То есть неполное описание ресурсов даёт либо избыточную
    бронь и пустые узлы, либо отсутствие потолка и риск утащить узел.
  ref: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"

- id: k8s-namespaces-quotas-008
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    В каком порядке применяются LimitRange, квота и планирование?
  answer: |
    Сначала admission: LimitRange подставляет дефолты и проверяет границы, затем
    ResourceQuota считает сумму по namespace. Только после этого объект попадает
    в etcd, и уже потом scheduler ищет для него узел.
  explanation: |
    Порядок объясняет, почему LimitRange обязан идти первым: квота считает уже
    **дополненный** под, иначе объект без requests не прошёл бы. И он же объясняет,
    почему квота ничего не знает о свободном месте на узлах: она работает на этаж выше,
    с намерениями, а не с физикой.
  ref: "https://kubernetes.io/docs/concepts/policy/limit-range/"

- id: k8s-namespaces-quotas-009
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Квоту выставили на уже живой namespace, где поды без `requests`. Что произойдёт?
  answer: |
    Работающие поды продолжат работать — квота их не трогает. Но любой новый под
    без requests будет отвергнут: сломается первый же выкат, рестарт или скейл.
  explanation: |
    Отложенность — главная опасность такой операции: изменение выглядит безобидно,
    кластер зелёный, а поломка ждёт следующего деплоя, возможно через недели, и связь
    с квотой к тому моменту уже неочевидна. Поэтому квоту вводят вместе с LimitRange
    и проверяют, что все нагрузки namespace объявляют ресурсы.
  ref: "https://kubernetes.io/docs/concepts/policy/resource-quotas/"

- id: k8s-namespaces-quotas-010
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Два Ingress в разных namespace объявляют один и тот же `host`. Что будет?
  answer: |
    Конфликт: правила попадут в конфигурацию одного контроллера, и поведение зависит
    от его реализации — обычно выигрывает более старый объект, а второй молча
    не работает.
  explanation: |
    Причина в асимметрии: `host` — это глобальное пространство имён DNS, а `backend`
    ссылается на сервис локально. Namespace защищает от коллизий только имена объектов,
    но не доменные имена. Ограничить, кто какие домены может занимать, штатным
    Kubernetes нельзя — это делается политиками вроде Kyverno.
  ref: "https://kubernetes.io/docs/concepts/services-networking/ingress/"

- id: k8s-namespaces-quotas-011
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем мягкая мультитенантность отличается от жёсткой?
  answer: |
    Мягкая — команды в одном кластере, разделённые namespace, RBAC, квотами
    и NetworkPolicy: защищает от **ошибки** соседа. Жёсткая — защита от **злого умысла**,
    и она требует отдельных кластеров либо изоляции на уровне ядра.
  explanation: |
    Граница проходит по общему ядру: контейнеры на одном узле делят ядро, и уязвимость
    в нём обходит любые namespace и политики. Поэтому вопрос «изолируем команды или
    недоверенный код» имеет два разных ответа, и подменять один другим — самая дорогая
    ошибка в проектировании мультитенантности.
  ref: "https://kubernetes.io/docs/concepts/security/multi-tenancy/"

- id: k8s-namespaces-quotas-012
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Почему namespace лучше создавать декларативно из git, а не командой
    `kubectl create ns`?
  answer: |
    Потому что namespace редко бывает пустым: с ним идут квота, LimitRange, RoleBinding,
    NetworkPolicy, лейблы Pod Security Admission. Созданный руками namespace приезжает
    без всего этого.
  explanation: |
    Голый namespace — это открытая дверь: без квот в него можно уложить весь кластер,
    без лейблов PSA в нём разрешены привилегированные поды, без NetworkPolicy он
    доступен по сети отовсюду. При этом внешне он выглядит совершенно нормально, что
    и делает такие «временные» namespace живучими.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/"

- id: k8s-namespaces-quotas-013
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Namespace висит в `Terminating` и не удаляется. Как найти виновника?
  answer: |
    Посмотреть `kubectl get namespace <ns> -o yaml`: в `status.conditions` перечислено,
    какие ресурсы не удалось вычистить. Обычно это CR мёртвого оператора или
    недоступный agregated API-сервис.
  explanation: |
    Namespace удаляется только после уборки всего содержимого, а уборку CR делает
    контроллер, которого может уже не быть. Соблазн снять финализатор руками велик
    и опасен: он оставляет за собой сирот во внешних системах — облачные диски,
    балансировщики, записи в DNS, за которые продолжает капать счёт.
  ref: "https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/"

- id: k8s-namespaces-quotas-014
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Можно ли квотой ограничить, сколько узлов или какой процент кластера
    достанется команде?
  answer: |
    Нет. ResourceQuota оперирует суммой броней в namespace и ничего не знает ни об
    узлах, ни о размере кластера. Привязка нагрузки к конкретным машинам делается
    через taints, tolerations и affinity, а не квотами.
  explanation: |
    Это два независимых измерения: квота отвечает «сколько тебе можно попросить»,
    размещение — «где именно ты можешь оказаться». Команда с квотой на 100 ядер
    получит их с любых узлов кластера, включая те, что предназначались другим.
    Выделенные пулы под команду строятся taint'ами, а квота лишь ограничивает аппетит.
  ref: "https://kubernetes.io/docs/concepts/policy/resource-quotas/"

- id: k8s-namespaces-quotas-015
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем у ResourceQuota нужны `scopes`, например `PriorityClass`?
  answer: |
    Чтобы квота считала не все поды подряд, а только подпадающие под условие: например
    отдельный лимит на поды с высоким приоритетом или на `BestEffort`. Одна общая сумма
    не различает важное и фоновое.
  explanation: |
    Без разделения по scope команда может выбрать всю квоту фоновыми задачами, и на
    критичный сервис места не останется — при том что формально лимит соблюдён.
    Отдельная квота на высокий приоритет резервирует ёмкость под то, что действительно
    должно работать, и заодно мешает раздавать высокий приоритет всем подряд.
  ref: "https://kubernetes.io/docs/concepts/policy/resource-quotas/"

- id: k8s-namespaces-quotas-016
  domain: k8s
  subtopic: namespaces-quotas
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему сумма квот всех namespace может спокойно превышать ёмкость кластера?
  answer: |
    Потому что квота ограничивает **право попросить**, а не наличие ресурсов.
    Kubernetes не проверяет, обеспечены ли выданные квоты железом.
  explanation: |
    Это осознанный overcommit на организационном уровне: команды редко выбирают квоту
    целиком, и раздача с запасом повышает утилизацию. Плата — отказ проявляется
    не как понятное «превышена квота», а как поды в `Pending` без видимой причины,
    когда все одновременно решили вырасти. Поэтому сумму квот отслеживают отдельно
    от их соблюдения.
  ref: "https://kubernetes.io/docs/concepts/policy/resource-quotas/"

# --- pod-security ---

- id: k8s-pod-security-001
  domain: k8s
  subtopic: pod-security
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое контейнер с точки зрения ядра Linux?
  answer: |
    Обычный процесс, изолированный namespace'ами (PID, network, mount, user) и
    ограниченный cgroups. **Ядро у него общее с узлом** — своей ОС внутри нет.
  explanation: |
    Из этого вытекает вся модель безопасности контейнеров: изоляция обеспечивается
    ядром, а не виртуализацией, поэтому уязвимость в ядре пробивает её насквозь.
    Отсюда же самый практический вывод: root внутри контейнера — это тот же uid 0
    снаружи, и при выходе за периметр он остаётся root'ом на узле.
  ref: "https://kubernetes.io/docs/concepts/security/"

- id: k8s-pod-security-002
  domain: k8s
  subtopic: pod-security
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает `runAsNonRoot: true`?
  answer: |
    Запрещает запуск контейнера от uid 0: kubelet проверяет пользователя образа
    и отказывается стартовать контейнер, если тот root. Конкретный uid задаётся
    отдельно через `runAsUser`.
  explanation: |
    Проверка происходит **до запуска**, поэтому нарушение видно как отказ старта
    (`CreateContainerConfigError`), а не как поломка в рантайме. Важная тонкость:
    флаг проверяет, но не меняет — если в образе не создан непривилегированный
    пользователь, нужен ещё и `runAsUser`, иначе под просто не поднимется.
  ref: "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"

- id: k8s-pod-security-003
  domain: k8s
  subtopic: pod-security
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что даёт `readOnlyRootFilesystem: true`?
  answer: |
    Делает корневую файловую систему контейнера доступной только на чтение. Всё, куда
    приложению нужно писать, монтируется явно — обычно `emptyDir` в `/tmp` и каталоги
    кеша.
  explanation: |
    Смысл не в защите файлов, а в ограничении злоумышленника: скачать и запустить
    полезную нагрузку внутрь контейнера становится некуда. Побочная польза
    архитектурная — флаг заставляет явно перечислить все точки записи, что превращает
    контейнер в честно неизменяемый артефакт.
  ref: "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"

- id: k8s-pod-security-004
  domain: k8s
  subtopic: pod-security
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что означает `capabilities: drop: ["ALL"]`?
  answer: |
    Отобрать у процесса все привилегии Linux capabilities. Нужные возвращаются точечно
    через `add` — например `NET_BIND_SERVICE`, чтобы слушать порт ниже 1024.
  explanation: |
    Capabilities дробят всемогущество root'а на десятки отдельных прав, и контейнеру
    почти никогда не нужно ни одного из них. Подход «отобрать всё, вернуть требуемое»
    работает лучше выборочного отбора, потому что список привилегий велик и меняется
    от версии ядра к версии.
  ref: "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"

- id: k8s-pod-security-005
  domain: k8s
  subtopic: pod-security
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Какие три уровня описывают Pod Security Standards?
  answer: |
    `privileged` — без ограничений; `baseline` — запрещены известные способы выхода
    из контейнера (privileged, hostNetwork, hostPath, опасные capabilities);
    `restricted` — жёсткий профиль: non-root, drop ALL, seccomp, без повышения привилегий.
  explanation: |
    Стандарты появились на замену удалённым PodSecurityPolicy и намеренно сведены
    к трём готовым профилям вместо конструктора: PSP давали бесконечную гибкость,
    в которой почти все ошибались. `baseline` задуман как разумный минимум,
    `restricted` — как цель, к которой стоит идти.
  ref: "https://kubernetes.io/docs/concepts/security/pod-security-standards/"

- id: k8s-pod-security-006
  domain: k8s
  subtopic: pod-security
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как включается Pod Security Admission и какие у него три режима?
  answer: |
    Лейблами на namespace: `pod-security.kubernetes.io/<режим>=<уровень>`. Режимы —
    `enforce` (отклонять), `audit` (пропускать, писать в аудит), `warn` (пропускать,
    предупреждать в ответе kubectl).
  explanation: |
    Три режима существуют ради безопасного внедрения: сначала вешаешь `warn` и `audit`,
    смотришь, что бы сломалось, чинишь нагрузки и только потом включаешь `enforce`.
    Попытка включить `enforce` сразу на живом namespace обычно кончается тем, что
    выкат встаёт в самый неудобный момент.
  ref: "https://kubernetes.io/docs/concepts/security/pod-security-admission/"

- id: k8s-pod-security-007
  domain: k8s
  subtopic: pod-security
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Включили `enforce: restricted` на namespace с работающим Deployment,
    который не проходит профиль. Что произойдёт сразу?
  options:
    a: "Ничего: работающие поды не трогают, сломается следующий выкат или рестарт"
    b: "Все поды немедленно будут удалены как нарушающие политику"
    c: "Поды продолжат работать, но потеряют лишние привилегии на лету"
    d: "Deployment откатится на предыдущую ревизию автоматически"
  answer: a
  explanation: |
    PSA — это admission-контроль: он проверяет объекты **на входе**, а к уже
    существующим подам не применяется. Отсюда коварство: кластер выглядит здоровым
    ровно до первого события, требующего создать под, — выката, скейла, переезда
    с узла. И тогда `READY 0/3` появляется без всякой связи с недавним изменением лейбла.
  ref: "https://kubernetes.io/docs/concepts/security/pod-security-admission/"

- id: k8s-pod-security-008
  domain: k8s
  subtopic: pod-security
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Какова сеть кластера по умолчанию с точки зрения доступа между подами?
  answer: |
    Полностью открытой: любой под может обратиться к любому другому в любом namespace.
    Ограничения появляются только с NetworkPolicy — и только если CNI их поддерживает.
  explanation: |
    Это осознанный выбор в пользу работоспособности из коробки, но он же делает
    «namespace изолирует» самым частым заблуждением. Практическое следствие: скомпрометированный
    под во второстепенном сервисе по умолчанию имеет сетевой доступ к базе, к API
    кластера и ко всему остальному.
  ref: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"

- id: k8s-pod-security-009
  domain: k8s
  subtopic: pod-security
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    По чему NetworkPolicy отбирает источники трафика — по IP или по меткам?
  answer: |
    По **меткам**: селекторы подов и namespace. Работа с адресами есть только
    в `ipBlock` и предназначена для внешних сетей, а не для подов кластера.
  explanation: |
    Иначе и быть не может: IP пода эфемерен и меняется при каждом пересоздании, правило
    по адресу протухло бы за минуты. Метки же переживают пересоздание, потому что
    приезжают из pod-template. Следствие — политики надо читать вместе с метками подов,
    и опечатка в селекторе даёт молчаливую дыру: правило есть, а не совпадает ни с чем.
  ref: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"

- id: k8s-pod-security-010
  domain: k8s
  subtopic: pod-security
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Написал `deny-all` политику, а поды всё равно общаются. Почему?
  answer: |
    Либо CNI не поддерживает NetworkPolicy (объект создался и игнорируется), либо
    политика закрывает только одно направление: `ingress` и `egress` независимы,
    и правило без секции `egress` исходящий трафик не трогает.
  explanation: |
    Обе причины молчаливые, и это худший вид отказа в безопасности: политика есть,
    ревью пройдено, ограничений нет. Первую проверяют по документации своего CNI —
    у Flannel поддержки нет вовсе. Вторую видно в самом манифесте:
    в `policyTypes` должны быть перечислены оба направления.
  ref: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"

- id: k8s-pod-security-011
  domain: k8s
  subtopic: pod-security
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Закрыл egress политикой — приложение перестало видеть базу, причём не сразу
    с ошибкой соединения. Что забыли?
  answer: |
    Разрешить DNS: обращения к CoreDNS идут по UDP и TCP на порт 53 в `kube-system`.
    Без этого приложение не резолвит имя и падает по таймауту резолва,
    а не по отказу соединения.
  explanation: |
    Это самая частая ошибка при закрытии egress, и симптом сбивает с толку: кажется,
    что политика отрезала базу, хотя до попытки соединения дело даже не доходит.
    Отличить легко — `nslookup` из пода не отвечает вовсе. Поэтому в любой набор
    egress-правил разрешение DNS кладут первым.
  ref: "https://kubernetes.io/docs/concepts/services-networking/network-policies/"

- id: k8s-pod-security-012
  domain: k8s
  subtopic: pod-security
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    В каком порядке работают mutating и validating admission webhooks?
  answer: |
    Сначала **mutating** — они могут изменить объект (дописать sidecar, проставить
    метки, подставить значения). Затем схема, затем **validating** — они только
    выносят вердикт да или нет, менять объект уже нельзя.
  explanation: |
    Порядок обязателен по смыслу: валидировать нужно то, что реально уедет в etcd,
    а mutating к этому моменту всё уже дописали. Отсюда практический вывод для отладки
    политик: проверять надо не свой манифест, а результат — `kubectl get -o yaml`,
    потому что отклонён может быть объект, которого ты не писал.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/"

- id: k8s-pod-security-013
  domain: k8s
  subtopic: pod-security
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как Istio или подобный оператор дописывает sidecar в чужой под?
  answer: |
    Mutating admission webhook: он перехватывает создание пода и добавляет контейнер
    в спеку. Обычно включается меткой на namespace, поэтому владелец приложения свой
    манифест не меняет вовсе.
  explanation: |
    Отсюда странный на первый взгляд эффект: в git один контейнер, в кластере два.
    И отсюда же диагностическое правило — при расследовании смотреть фактический
    объект, а не исходный манифест. Тот же механизм используют инжекторы секретов
    и агенты наблюдаемости.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/"

- id: k8s-pod-security-014
  domain: k8s
  subtopic: pod-security
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Приложение начало падать при записи в файл после включения профиля безопасности.
    Что именно сломалось?
  answer: |
    Скорее всего `readOnlyRootFilesystem: true` без смонтированных каталогов для записи,
    либо `runAsNonRoot` — файлы в образе принадлежат root'у, а процесс теперь другой uid.
  explanation: |
    Оба случая одинаково выглядят как «приложение сломалось после безобидной правки»,
    хотя ломает их разное: в первом писать некуда, во втором нет прав. Различает
    сообщение об ошибке — `read-only file system` против `permission denied`.
    Второй случай лечится `fsGroup`, который меняет владельца смонтированных томов.
  ref: "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"

- id: k8s-pod-security-015
  domain: k8s
  subtopic: pod-security
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем нужен сканер образов вроде Trivy в CI, если образ собран из официального базового?
  answer: |
    Официальный базовый образ стареет: уязвимости находят после релиза. Сканер
    сверяет установленные пакеты и зависимости приложения с базами CVE на момент
    сборки, а не на момент публикации базового образа.
  explanation: |
    Отсюда практика пересобирать образы регулярно, даже когда код не менялся: без этого
    приложение годами едет на базовом слое из позапрошлого года. Сканирование в CI
    ценно ещё и тем, что даёт точку принятия решения до выката, а не после —
    когда уязвимый образ уже в проде.
  ref: "https://kubernetes.io/docs/concepts/security/supply-chain-security/"

- id: k8s-pod-security-016
  domain: k8s
  subtopic: pod-security
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем `failurePolicy: Fail` у admission webhook опасен для всего кластера?
  answer: |
    Тем, что при недоступности webhook'а apiserver **отклоняет** все подпадающие
    под него запросы. Упавший под политики останавливает создание объектов
    во всём кластере.
  explanation: |
    Самый неприятный вариант — самоблокировка: webhook перехватывает создание подов
    в том числе в своём namespace, поэтому подняться заново он не может — для этого
    нужен он сам. Отсюда два обязательных правила: исключать системные namespace
    из области действия и держать webhook в нескольких репликах с PDB.
    `failurePolicy: Ignore` безопаснее для доступности, но оставляет дыру в политике.
  ref: "https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/"

- id: k8s-pod-security-017
  domain: k8s
  subtopic: pod-security
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему `hostPath` на `/var/run/docker.sock` или на корень узла считается
    эквивалентом root-доступа к машине?
  answer: |
    Потому что монтирование файловой системы узла даёт возможность читать и менять
    её содержимое от имени процесса контейнера: подложить свой юнит systemd, прочитать
    kubelet-сертификаты, запустить привилегированный контейнер через сокет runtime.
  explanation: |
    Это самый прямой путь выхода из контейнера, и он не требует никаких уязвимостей —
    только разрешённый `hostPath`. Именно поэтому профиль `baseline` его ограничивает,
    а `restricted` запрещает. Тот же аргумент объясняет, почему сборку образов внутри
    кластера делают инструментами без доступа к сокету runtime.
  ref: "https://kubernetes.io/docs/concepts/security/pod-security-standards/"

- id: k8s-pod-security-018
  domain: k8s
  subtopic: pod-security
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем PSA принципиально уступает Kyverno или Gatekeeper?
  answer: |
    PSA умеет только три фиксированных профиля безопасности пода и ничего больше.
    Политики общего назначения проверяют что угодно: обязательные метки, разрешённые
    реестры образов, запрет `latest`, лимиты на домены Ingress — и умеют не только
    отклонять, но и дописывать объекты.
  explanation: |
    Разделение осмысленное: PSA встроен, не требует установки и закрывает самый
    критичный класс рисков — выход из контейнера. Всё остальное — это уже правила
    конкретной организации, которых ядро знать не может. Отсюда типичная связка:
    PSA как базовый рубеж плюс движок политик для собственных требований.
  ref: "https://kubernetes.io/docs/concepts/security/pod-security-admission/"

- id: k8s-pod-security-019
  domain: k8s
  subtopic: pod-security
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что даёт `seccompProfile: RuntimeDefault` и почему это дёшево включить?
  answer: |
    Ограничивает набор системных вызовов, доступных контейнеру, профилем по умолчанию
    от container runtime. Он отсекает десятки редких и опасных вызовов, которых
    обычному приложению не требуется.
  explanation: |
    Дёшево потому, что профиль подобран так, чтобы не ломать типовые приложения:
    в отличие от собственных seccomp-профилей, его не нужно составлять и отлаживать.
    При этом он заметно сужает поверхность атаки на ядро — а ядро в контейнерной
    модели общее, и именно оно является главной границей безопасности.
  ref: "https://kubernetes.io/docs/tutorials/security/seccomp/"

- id: k8s-pod-security-020
  domain: k8s
  subtopic: pod-security
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает `allowPrivilegeEscalation: false` и чем отличается от `runAsNonRoot`?
  answer: |
    Запрещает процессу получить больше привилегий, чем у его родителя, — то есть
    отключает механику `setuid`-бинарников вроде `sudo`. `runAsNonRoot` запрещает
    **стартовать** от root, но не мешает повысить привилегии позже.
  explanation: |
    Это два разных рубежа: первый про точку входа, второй про то, что можно сделать
    после. Без запрета эскалации непривилегированный процесс, нашедший в образе
    подходящий setuid-бинарник, поднимается до root внутри контейнера — а дальше уже
    работают все остальные слои защиты. Профиль `restricted` требует обоих.
  ref: "https://kubernetes.io/docs/tasks/configure-pod-container/security-context/"

# --- observability ---

- id: k8s-observability-001
  domain: k8s
  subtopic: observability
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем `metrics-server` отличается от Prometheus?
  answer: |
    `metrics-server` — узкий компонент кластера: держит **текущее** потребление CPU
    и памяти в памяти, без истории, и питает `kubectl top` и HPA. Prometheus — полноценная
    система мониторинга с историей, запросами и алертами.
  explanation: |
    Это два разных крана, и один не заменяет другой: HPA по умолчанию ходит
    в `metrics.k8s.io`, который отдаёт именно metrics-server, поэтому установка
    Prometheus сама по себе автоскейлинг не чинит. И наоборот, metrics-server не годится
    для расследования вчерашнего инцидента — истории у него нет вовсе.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/"

- id: k8s-observability-002
  domain: k8s
  subtopic: observability
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что показывает `kube-state-metrics` и чем это отличается от потребления ресурсов?
  answer: |
    **Состояние объектов** API: сколько реплик желаемо и сколько доступно, в какой фазе
    поды, сколько рестартов, когда истекает Job. Потребление CPU и памяти он не измеряет
    вообще.
  explanation: |
    Три источника отвечают на три разных вопроса: kubelet (через cAdvisor) — «сколько
    ест», kube-state-metrics — «в каком состоянии объекты», приложение — «что происходит
    в бизнес-логике». Большинство полезных алертов про кластер строится именно
    на втором: растущий `restartCount` или расхождение желаемых и готовых реплик.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/monitoring/"

- id: k8s-observability-003
  domain: k8s
  subtopic: observability
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Prometheus работает по push или по pull?
  answer: |
    По **pull**: он сам ходит по HTTP на эндпоинт `/metrics` каждой цели с заданным
    интервалом. Приложение никуда ничего не отправляет.
  explanation: |
    Из модели вытекают практические следствия: недоступность цели сама по себе является
    сигналом (метрика `up`), а приложению не нужно знать адрес мониторинга. Обратная
    сторона — короткоживущие задачи вроде Job могут завершиться между опросами
    и остаться незамеченными; для них существует отдельный Pushgateway.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/monitoring/"

- id: k8s-observability-004
  domain: k8s
  subtopic: observability
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое golden signals?
  answer: |
    Четыре сигнала, описывающие здоровье сервиса с точки зрения пользователя: **latency**
    (сколько ждать), **traffic** (сколько запросов), **errors** (доля ошибок),
    **saturation** (насколько заполнены ресурсы).
  explanation: |
    Ценность набора в том, что он смещает мониторинг с внутренностей на наблюдаемый
    эффект: пользователю безразлична загрузка CPU, ему важно, отвечает ли сервис
    и быстро ли. Отсюда правило алертов — алертить на симптом (растёт latency,
    растут ошибки), а не на причину (высокий CPU), потому что причин у симптома
    десятки, а страдает пользователь одинаково.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/monitoring/"

- id: k8s-observability-005
  domain: k8s
  subtopic: observability
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как Prometheus узнаёт о новых подах, если они появляются и исчезают постоянно?
  answer: |
    Через service discovery: он подписан на apiserver и получает актуальный список
    подов, сервисов и эндпоинтов. В экосистеме оператора цели описываются объектами
    `ServiceMonitor` и `PodMonitor`.
  explanation: |
    Без этого мониторинг в кластере был бы невозможен: статический список целей протух
    бы после первого же выката. Отсюда типичный симптом «поставил ServiceMonitor,
    метрик нет» — он не совпал метками ни с одним сервисом, либо оператор настроен
    искать мониторы только в определённых namespace.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/monitoring/"

- id: k8s-observability-006
  domain: k8s
  subtopic: observability
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему CPU throttling не виден в `kubectl top`?
  answer: |
    Потому что `top` показывает **потребление**, а троттлинг — это принудительное
    ограничение: контейнер упёрся в лимит и потребляет ровно столько, сколько ему
    разрешено. Цифра выглядит нормальной. Нужна метрика
    `container_cpu_cfs_throttled_seconds_total`.
  explanation: |
    Отсюда классический тупик: приложение тормозит, `top` зелёный, ошибок нет.
    Наблюдаемость здесь требует не «сколько используется», а «сколько раз хотели
    больше и не дали» — принципиально иной вопрос. Это общий урок: отсутствие
    аномалии в метрике часто означает, что метрика не про то.
  ref: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"

- id: k8s-observability-007
  domain: k8s
  subtopic: observability
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое cardinality метрики и почему высокая cardinality убивает Prometheus?
  answer: |
    Cardinality — число уникальных комбинаций меток. Каждая комбинация это отдельный
    временной ряд со своим хранением в памяти. Метка с неограниченным набором значений
    (ID запроса, email, полный URL) порождает миллионы рядов.
  explanation: |
    Взрыв происходит нелинейно: метки перемножаются, и три поля по сто значений дают
    миллион рядов из одной метрики. Prometheus держит индекс активных рядов в памяти,
    поэтому итог — OOM, а не постепенное замедление. Правило простое: в метку идёт
    только то, у чего конечный и небольшой набор значений.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/monitoring/"

- id: k8s-observability-008
  domain: k8s
  subtopic: observability
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему логи нужно централизовать, а не читать через `kubectl logs`?
  answer: |
    Потому что логи живут вместе с подом: удалили под — логи исчезли, а хранится
    только один предыдущий запуск. Плюс `kubectl logs` не умеет искать по десяти
    репликам и по вчерашнему дню.
  explanation: |
    Особенно жестоко это работает в инциденте: под, который упал и был пересоздан,
    уносит с собой ровно те логи, ради которых всё и затевалось. Централизация
    нужна раньше, чем кажется — фактически с первого прода. `stern` и подобные
    инструменты помогают смотреть несколько подов сразу, но проблему хранения
    не решают.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/logging/"

- id: k8s-observability-009
  domain: k8s
  subtopic: observability
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему логи приложения в кластере пишут в stdout, а не в файл?
  answer: |
    Потому что сборщик логов забирает поток stdout через container runtime — это
    стандартный контракт. Файл внутри контейнера ему не виден и исчезнет вместе с подом.
  explanation: |
    Модель следует принципу «контейнер не хранит состояние»: ротация, хранение
    и доставка логов — не задача приложения. Запись в файл вдобавок съедает диск узла
    (`emptyDir` или, хуже, слой контейнера) и может уронить узел по нехватке места —
    отказ, который выглядит как проблема кластера, а не приложения.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/logging/"

- id: k8s-observability-010
  domain: k8s
  subtopic: observability
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что обязательно мониторить в самом кластере, а не в приложениях?
  answer: |
    Доступность control plane и etcd (задержки записи, размер базы), узлы (`NotReady`,
    давление по памяти и диску), CoreDNS, число рестартов и `Pending`-подов, истечение
    сертификатов, заполнение PV.
  explanation: |
    Общее у этого списка одно: отказ любого пункта проявляется в приложениях как
    что-то совершенно другое и уводит расследование в сторону. Перегруженный CoreDNS
    выглядит как медленная база, полный диск узла — как падающее приложение,
    просроченный сертификат — как внезапная потеря доступа к кластеру.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/monitoring/"

- id: k8s-observability-011
  domain: k8s
  subtopic: observability
  difficulty: middle
  source: theory
  type: mcq
  verified: false
  prompt: |
    Какой алерт полезнее дежурному инженеру?
  options:
    a: "Доля ответов 5xx на checkout превысила 2% в течение 5 минут"
    b: "CPU на узле node-7 превысил 85%"
    c: "Число подов в namespace prod изменилось"
    d: "Средняя загрузка памяти по кластеру выросла на 10%"
  answer: a
  explanation: |
    Алертить нужно на симптом, который чувствует пользователь, а не на причину. Высокий
    CPU — нормальное состояние работающей системы: он либо ни к чему не приводит,
    либо его последствия и так видны в latency и ошибках. Алерты на причины дают поток
    ложных срабатываний, а от него дежурный перестаёт реагировать вообще — и пропускает
    настоящий инцидент.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/monitoring/"

- id: k8s-observability-012
  domain: k8s
  subtopic: observability
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Почему по средней latency нельзя судить о здоровье сервиса?
  answer: |
    Среднее прячет хвост: при девяноста быстрых запросах и десяти по десять секунд
    среднее выглядит приемлемо, а десять процентов пользователей ждут вечность.
    Нужны перцентили — p95 и p99.
  explanation: |
    Хвост распределения — это и есть жалобы: пользователь ощущает свой запрос,
    а не среднее по системе. Перцентили ещё и лучше показывают деградацию: p99 растёт
    первым, когда начинают заполняться очереди и пулы соединений, задолго до того,
    как сдвинется среднее.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/monitoring/"

- id: k8s-observability-013
  domain: k8s
  subtopic: observability
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Приложение тормозит, а все дашборды зелёные. Что это обычно означает?
  answer: |
    Что измеряется не то узкое место. Типичные слепые зоны: CPU throttling, ожидание
    внешней зависимости, исчерпанный пул соединений, потери и ретраи DNS, очередь
    внутри приложения.
  explanation: |
    Инфраструктурные метрики описывают ресурсы, а тормозит обычно **ожидание**: поток,
    стоящий в очереди за соединением к базе, не потребляет ни CPU, ни памяти и выглядит
    идеально здоровым. Отсюда ценность трассировки — она показывает, где именно
    в цепочке вызовов ушло время, вместо того чтобы гадать по графикам ресурсов.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/monitoring/"

- id: k8s-observability-014
  domain: k8s
  subtopic: observability
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что дают распределённые трейсы, чего не дают метрики и логи?
  answer: |
    Путь **одного конкретного запроса** через все сервисы с временем на каждом шаге.
    Метрики отвечают агрегатами, логи — событиями одного сервиса; ни те, ни другие
    не связывают шаги в цепочку.
  explanation: |
    Как только сервисов больше двух, вопрос «где ушли те самые три секунды» перестаёт
    иметь ответ в метриках: каждый сервис по отдельности выглядит быстрым. Трейс
    показывает и последовательность, и параллельность вызовов — и часто вскрывает
    не медленный сервис, а лишние повторные обращения.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/system-traces/"

- id: k8s-observability-015
  domain: k8s
  subtopic: observability
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем логам структурированный формат вместо свободного текста?
  answer: |
    Чтобы по ним можно было искать и агрегировать: JSON с полями `level`, `trace_id`,
    `pod`, `user_id` фильтруется запросом, а строка текста — только регулярным
    выражением, которое ломается при первом изменении формата.
  explanation: |
    В кластере это не стилистика, а необходимость: логи десятков реплик смешиваются
    в один поток, и без поля с именем пода невозможно понять, болеют все или одна.
    Поле с идентификатором трассировки при этом сшивает логи с трейсами и превращает
    три отдельных инструмента в один связный контур.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/logging/"

- id: k8s-observability-016
  domain: k8s
  subtopic: observability
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Prometheus съел всю память узла и упал. Что искать в первую очередь?
  answer: |
    Взрыв cardinality: новую метку с неограниченным набором значений или новую цель,
    отдающую тысячи рядов. Проверяется через `topk` по числу рядов на метрику
    и на job.
  explanation: |
    Причина почти никогда не в объёме данных за длительный период — исторические
    блоки лежат на диске. В памяти живёт индекс **активных** рядов, поэтому падение
    обычно совпадает по времени с выкатом, который добавил метку. Отсюда и профилактика:
    лимиты на число рядов со стороны scrape-конфигурации, чтобы одно приложение
    не унесло мониторинг всего кластера.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/monitoring/"

- id: k8s-observability-017
  domain: k8s
  subtopic: observability
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему `container_memory_usage_bytes` — плохая метрика для алерта на нехватку памяти?
  answer: |
    Она включает страничный кеш, который ядро освободит при необходимости. Приложение,
    активно читающее файлы, покажет потребление у самого лимита, будучи совершенно
    здоровым. Для алертов берут `working_set` — то, что реально нельзя отдать.
  explanation: |
    Различие принципиально ещё и потому, что именно `working_set` использует kubelet,
    решая, кого убивать по OOM. То есть алерт на `usage` будет срабатывать тогда,
    когда ничего не грозит, и молчать, когда под действительно близок к смерти —
    худшая из возможных комбинаций.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-cluster/resource-metrics-pipeline/"

- id: k8s-observability-018
  domain: k8s
  subtopic: observability
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое SLI, SLO и error budget и как это меняет работу дежурного?
  answer: |
    SLI — измеримый показатель качества (доля успешных запросов). SLO — целевое значение
    (99.9%). Error budget — разрешённая доля отказов, вытекающая из SLO. Дежурного
    поднимают, когда бюджет расходуется слишком быстро, а не на каждое отклонение.
  explanation: |
    Подход решает главную болезнь алертинга — усталость от ложных срабатываний: алерт
    на скорость сжигания бюджета молчит, пока пользователи не страдают, и срабатывает
    рано, когда страдают. Второй эффект организационный: исчерпанный бюджет —
    объективный аргумент притормозить выкаты и заняться надёжностью.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/monitoring/"

- id: k8s-observability-019
  domain: k8s
  subtopic: observability
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Prometheus в поде хранит данные и переживает рестарт. Какие с этим проблемы
    в долгую?
  answer: |
    Локальное хранилище ограничено диском узла и не реплицируется: потеря PV означает
    потерю истории. Плюс один экземпляр не масштабируется горизонтально. Для длительного
    хранения ставят Thanos, Mimir или подобное с выгрузкой блоков в объектное хранилище.
  explanation: |
    Архитектурно Prometheus задуман как локальный и простой — надёжность и долгое
    хранение сознательно вынесены наружу. Отсюда типичная эволюция: сначала один
    экземпляр с retention на пару недель, затем боль при расследовании старых инцидентов,
    затем слой долговременного хранения.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/monitoring/"

- id: k8s-observability-020
  domain: k8s
  subtopic: observability
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему сбор логов делают DaemonSet'ом, а не sidecar'ом в каждом поде?
  answer: |
    Один агент на узел читает файлы логов всех контейнеров из каталога узла: меньше
    накладных расходов, единая конфигурация, ничего не нужно менять в манифестах
    приложений. Sidecar добавляет контейнер к каждому поду и умножает расход памяти.
  explanation: |
    Sidecar остаётся оправданным в частных случаях: приложение пишет в файл и его
    нельзя переучить на stdout, либо нужен свой парсинг для одной нагрузки. Общее
    правило — инфраструктурная функция, привязанная к узлу, живёт в DaemonSet;
    в под она переезжает, только когда требует контекста самого приложения.
  ref: "https://kubernetes.io/docs/concepts/cluster-administration/logging/"
