# git / workflows
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: git-workflows-001
  domain: git
  subtopic: workflows
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое trunk-based development?
  answer: |
    Модель, где все работают от одной основной ветки короткими ветками, живущими
    часы или день, и вливают их по нескольку раз в день. Долгоживущих
    параллельных веток нет.
  explanation: |
    Модель требовательна к инфраструктуре: нужны быстрый конвейер, хорошие тесты
    и feature flags, чтобы вливать незаконченное выключенным. Взамен исчезают
    тяжёлые слияния и «интеграционный ад» — расхождение просто не успевает
    накопиться.
  ref: "https://git-scm.com/book/en/v2/Distributed-Git-Distributed-Workflows"

- id: git-workflows-002
  domain: git
  subtopic: workflows
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое git flow и почему от него часто отказываются?
  answer: |
    Модель с постоянными ветками `develop` и `master` плюс ветки feature, release
    и hotfix. Отказываются из-за сложности: много долгоживущих веток, тяжёлые
    слияния и задержка между «готово» и «в проде».
  explanation: |
    Придуман он был для продуктов с версиями и редкими релизами — там модель
    осмысленна и сегодня. Для веб-сервиса с выкатами по нескольку раз в день
    она создаёт работу на ровном месте: ветка `develop` становится вторым
    источником правды, который надо синхронизировать.
  ref: "https://git-scm.com/book/en/v2/Distributed-Git-Distributed-Workflows"

- id: git-workflows-003
  domain: git
  subtopic: workflows
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что даёт соглашение о формате сообщений коммита?
  answer: |
    Машиночитаемую историю: по префиксам вида `feat`, `fix`, `chore` генерируются
    changelog и следующая версия по правилам semver, а поиск по истории
    становится осмысленным.
  explanation: |
    Выгода появляется только при автоматизации: если по сообщениям ничего
    не генерируется, соглашение остаётся бюрократией и соблюдается всё хуже.
    Проверять формат при этом лучше на сервере — клиентский хук обходится,
    и история получается наполовину размеченной.
  ref: "https://www.conventionalcommits.org/"

- id: git-workflows-004
  domain: git
  subtopic: workflows
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Каким должен быть размер pull request и почему это важно?
  answer: |
    Небольшим — сотни строк, а не тысячи. Качество ревью резко падает с объёмом:
    на большом PR комментарии становятся косметическими, а серьёзные проблемы
    не замечают.
  explanation: |
    Причина не в лени, а в устройстве внимания: удержать в голове взаимодействие
    двух тысяч изменённых строк невозможно. Отсюда практика разбивать работу
    на последовательность PR, а рефакторинг отделять от содержательных
    изменений — смешанный PR нечитаем по определению.
  ref: "https://docs.github.com/pull-requests"

- id: git-workflows-005
  domain: git
  subtopic: workflows
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Как правильно писать сообщение коммита?
  answer: |
    Первая строка — короткое повелительное описание изменения. Дальше пустая
    строка и тело, отвечающее на вопрос **почему**, а не что: что видно из diff.
  explanation: |
    Ценность тела проявляется через год, когда кто-то (обычно ты сам) смотрит
    `git blame` и спрашивает «зачем здесь этот костыль». Diff покажет строку,
    и только сообщение может объяснить, какую проблему она решала. Это тот же
    принцип, что `explanation` в карточках: механизм, а не пересказ.
  ref: "https://git-scm.com/book/en/v2/Distributed-Git-Contributing-to-a-Project"

- id: git-workflows-006
  domain: git
  subtopic: workflows
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужны релизные ветки, если есть теги?
  answer: |
    Тег — метка на коммите, он не позволяет продолжать разработку релиза.
    Релизная ветка нужна, когда после выпуска приходится выпускать исправления
    для старой версии, пока основная ветка ушла вперёд.
  explanation: |
    Если продукт всегда выкатывается «последней версией», релизные ветки не нужны
    вовсе — достаточно тегов. Они появляются там, где есть поддерживаемые версии
    у клиентов. Отсюда и типовой процесс: фикс делается в основной ветке
    и переносится cherry-pick в релизную, а не наоборот.
  ref: "https://git-scm.com/book/en/v2/Git-Branching-Branching-Workflows"

- id: git-workflows-007
  domain: git
  subtopic: workflows
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Монорепозиторий или отдельные репозитории — по какому критерию выбирают?
  answer: |
    По связности изменений. Если правка регулярно затрагивает несколько компонентов
    сразу, монорепозиторий избавляет от согласования версий. Если компоненты
    независимы и выпускаются раздельно — отдельные репозитории проще.
  explanation: |
    Монорепозиторий переносит сложность из координации релизов в инструменты:
    нужен конвейер, умеющий пересобирать только затронутое, и права на уровне
    каталогов. Отдельные репозитории переносят её обратно в людей: согласованное
    изменение становится цепочкой из нескольких PR в правильном порядке.
  ref: "https://git-scm.com/book/en/v2/Distributed-Git-Distributed-Workflows"

- id: git-workflows-008
  domain: git
  subtopic: workflows
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем подписывают коммиты и что именно это доказывает?
  answer: |
    Что коммит создан владельцем ключа. Поле автора в git — **произвольная строка**,
    его можно поставить любое, поэтому без подписи авторство ничем не подтверждено.
  explanation: |
    Практический смысл появляется вместе с требованием на стороне платформы:
    неподписанные коммиты в защищённой ветке отклоняются. Иначе подпись —
    украшение. Это та же логика, что с подписью образов: механизм работает,
    когда неподписанное не принимается.
  ref: "https://git-scm.com/book/en/v2/Git-Tools-Signing-Your-Work"

- id: git-workflows-009
  domain: git
  subtopic: workflows
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем удалять ветку сразу после слияния?
  answer: |
    Чтобы список веток отражал текущую работу, а не археологию. Коммиты
    при этом никуда не деваются — они уже в основной ветке, а ветка была
    лишь указателем.
  explanation: |
    Через полгода репозиторий с двумя сотнями слитых веток теряет навигацию:
    невозможно понять, что живо. Платформы умеют удалять ветку автоматически
    при слиянии PR — это и есть правильный вариант, потому что не зависит
    от дисциплины.
  ref: "https://docs.github.com/repositories/configuring-branches-and-merges-in-your-repository"

- id: git-workflows-010
  domain: git
  subtopic: workflows
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Какую стратегию слияния PR выбрать: merge commit, squash или rebase?
  answer: |
    Squash даёт один коммит на задачу и самую читаемую основную ветку. Merge
    commit сохраняет все коммиты ветки и факт слияния. Rebase даёт линейную
    историю без коммита слияния, но переписывает SHA.
  explanation: |
    Выбирают один вариант на репозиторий и фиксируют настройкой платформы —
    смесь даёт худшее из всех. Практическое следствие squash: ветка формально
    не влита, и `git branch -d` откажется её удалять, а автоудаление
    на платформе с этим справится.
  ref: "https://docs.github.com/pull-requests/collaborating-with-pull-requests/incorporating-changes-from-a-pull-request/about-pull-request-merges"
