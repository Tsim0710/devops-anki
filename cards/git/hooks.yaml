# git / hooks
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: git-hooks-001
  domain: git
  subtopic: hooks
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое хук и где он лежит?
  answer: |
    Скрипт, который git запускает на определённом событии: `pre-commit`,
    `commit-msg`, `pre-push`. Лежит в `.git/hooks/` — то есть **вне** репозитория
    и не попадает в клон.
  explanation: |
    Отсюда главное ограничение: хук нельзя просто закоммитить и рассчитывать,
    что он появится у команды. Решают это настройкой `core.hooksPath`
    на отслеживаемый каталог либо менеджером хуков, который ставит их
    при установке зависимостей.
  ref: "https://git-scm.com/book/en/v2/Customizing-Git-Git-Hooks"

- id: git-hooks-002
  domain: git
  subtopic: hooks
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что обычно вешают на `pre-commit`?
  answer: |
    Быстрые проверки: форматирование, линтер по изменённым файлам, поиск секретов,
    запрет отладочных вызовов. Всё, что занимает секунды.
  explanation: |
    Критерий один — время: хук, работающий полминуты, начинают обходить,
    и он перестаёт что-либо гарантировать. Полный прогон тестов место в CI,
    а не здесь. Локальные хуки вообще стоит считать удобством для разработчика,
    а не механизмом контроля.
  ref: "https://git-scm.com/book/en/v2/Customizing-Git-Git-Hooks"

- id: git-hooks-003
  domain: git
  subtopic: hooks
  difficulty: middle
  source: core
  type: mcq
  verified: false
  prompt: |
    Почему на клиентские хуки нельзя полагаться как на защиту?
  options:
    a: "Их можно обойти флагом `--no-verify` и просто не устанавливать"
    b: "Они не запускаются при работе через графические клиенты"
    c: "Git запускает их только на основной ветке"
    d: "Они выполняются после коммита, а не до"
  answer: a
  explanation: |
    Хук живёт на машине разработчика и целиком под его контролем: не установил,
    отключил, передал `--no-verify` — и его нет. Поэтому обязательные требования
    ставят на стороне сервера: обязательные проверки перед слиянием
    и серверные хуки. Клиентские дают быструю обратную связь, а не гарантию.
  ref: "https://git-scm.com/book/en/v2/Customizing-Git-Git-Hooks"

- id: git-hooks-004
  domain: git
  subtopic: hooks
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Чем серверные хуки отличаются от клиентских?
  answer: |
    Они выполняются на сервере при приёме push: `pre-receive` может отклонить
    отправку целиком. Обойти их с клиента нельзя — этим они и ценны.
  explanation: |
    На них строят жёсткие правила: запрет force-push в защищённые ветки,
    требования к формату сообщений, проверка подписей. В облачных платформах
    прямого доступа к серверным хукам обычно нет, и ту же роль играют
    настройки защиты веток и обязательные проверки.
  ref: "https://git-scm.com/book/en/v2/Customizing-Git-Git-Hooks"

- id: git-hooks-005
  domain: git
  subtopic: hooks
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Как раздать хуки команде, если `.git/hooks` не версионируется?
  answer: |
    Настройкой `core.hooksPath` на каталог внутри репозитория либо менеджером
    хуков, который прописывает путь при установке зависимостей проекта.
  explanation: |
    Второй способ практичнее: конфигурация хуков лежит в репозитории файлом,
    а сами инструменты ставятся в изолированное окружение — не нужно требовать
    от каждого нужных утилит в системе. Обязательным это всё равно не становится:
    настройку git каждый волен изменить у себя.
  ref: "https://git-scm.com/docs/githooks"

- id: git-hooks-006
  domain: git
  subtopic: hooks
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужен `commit-msg` и что им обычно проверяют?
  answer: |
    Он получает файл с сообщением коммита и может отклонить его. Чаще всего
    проверяют формат: соглашение о префиксах, ссылку на задачу, длину
    первой строки.
  explanation: |
    Ценность формата не в эстетике: по структурированным сообщениям генерируются
    changelog и версия релиза, а поиск по истории становится осмысленным.
    Тот же хук умеет дописывать номер задачи из имени ветки — это лучше запретов,
    потому что не создаёт трения.
  ref: "https://git-scm.com/docs/githooks"

- id: git-hooks-007
  domain: git
  subtopic: hooks
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем опасен хук, который сам правит файлы во время коммита?
  answer: |
    Он меняет содержимое **после** того, как ты посмотрел на diff: в коммит
    попадает не то, что ты видел. Форматировщик, запущенный в `pre-commit`,
    может изменить и те части файла, которые ты не трогал.
  explanation: |
    Отсюда практика: хук проверяет и отклоняет, а не исправляет молча.
    Если автоформатирование всё же нужно, оно должно работать на весь файл
    и быть включено у всех, иначе каждый коммит начнёт таскать за собой
    переформатирование чужих строк и ломать `git blame`.
  ref: "https://git-scm.com/docs/githooks"

- id: git-hooks-008
  domain: git
  subtopic: hooks
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Хук не срабатывает. Что проверять?
  answer: |
    Имя файла точно как ожидает git и **без расширения**, бит исполнения,
    корректный shebang, и не переопределён ли `core.hooksPath`. Ошибок git
    при этом не показывает.
  explanation: |
    Молчаливость — главная особенность: неисполняемый файл просто игнорируется,
    как будто хука нет. Отсюда и типичная история с шаблонами `.sample`
    в `.git/hooks`: их копируют, забывают убрать расширение, и ничего
    не происходит. Проверяется запуском скрипта вручную.
  ref: "https://git-scm.com/docs/githooks"
