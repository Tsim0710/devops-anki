# aws / kms-secrets
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.
#
# Секреты в конвейерах и GitOps — в cicd/secrets-management и k8s/packaging-gitops.

- id: aws-kms-secrets-001
  domain: aws
  subtopic: kms-secrets
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Как устроено envelope encryption в AWS KMS и зачем оно, если KMS сам умеет шифровать?
  answer: |
    `GenerateDataKey` возвращает **data key** в двух видах: открытом и зашифрованном
    KMS-ключом. Данные шифруют открытым data key локально и сразу стирают его из памяти,
    а зашифрованную копию хранят рядом с данными. Для расшифровки копию отдают в `Decrypt`,
    получают data key и расшифровывают данные.
  explanation: |
    KMS-ключ не покидает KMS и шифрует только маленькие data keys, поэтому объём данных
    не упирается в сеть и лимиты KMS, а KMS не видит самих данных. Data keys KMS не хранит
    и не учитывает — ими управляет приложение или сервис. Так работают S3, EBS и RDS:
    доступ к данным в итоге сводится к праву `kms:Decrypt` на KMS-ключ.
  ref: "https://docs.aws.amazon.com/kms/latest/developerguide/data-keys.html"

- id: aws-kms-secrets-002
  domain: aws
  subtopic: kms-secrets
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Роли выдали IAM-политику с `kms:Decrypt` на ключ, а расшифровка получает `AccessDenied`.
    Что проверить в первую очередь?
  answer: |
    **Key policy** ключа. Для KMS она первична: IAM-политики действуют, только если key
    policy разрешает это аккаунту утверждением с принципалом `arn:aws:iam::ACCOUNT_ID:root`.
    Без него никакая IAM-политика доступа не даст, хотя IAM-политики с deny продолжат
    действовать.
  explanation: |
    В отличие от большинства ресурсов AWS, ключ KMS не доверяет своему аккаунту
    автоматически. Default key policy как раз содержит утверждение для аккаунта, включающее
    IAM. Кастомная key policy без него делает ключ доступным только перечисленным
    принципалам, а если их удалить, ключ становится неуправляемым и возвращается только
    через поддержку.
  ref: "https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html"

- id: aws-kms-secrets-003
  domain: aws
  subtopic: kms-secrets
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зашифрованный snapshot RDS нужно отдать в другой аккаунт, но шаринг не проходит.
    Snapshot зашифрован ключом `aws/rds`. Что делать?
  answer: |
    Snapshot, зашифрованный **AWS managed key**, расшарить нельзя: key policy такого ключа
    не изменить и другому аккаунту доступ не выдать. Делают копию snapshot, перешифрованную
    **customer managed key**, в key policy которого разрешён целевой аккаунт, и шарят копию.
    В целевом аккаунте IAM-политика тоже должна разрешать использование ключа.
  explanation: |
    Кросс-аккаунтный доступ к KMS требует обеих сторон: key policy у владельца ключа
    и IAM-политики у пользователя. AWS managed keys управляются сервисом, поэтому для любых
    сценариев с другими аккаунтами — бэкапы в изолированный аккаунт, общие образы — сразу
    берут customer managed keys. Переделка задним числом стоит копирования всех снимков.
  ref: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html"

- id: aws-kms-secrets-004
  domain: aws
  subtopic: kms-secrets
  difficulty: middle
  source: core
  type: mcq
  verified: false
  prompt: |
    Что происходит, когда для customer managed KMS-ключа запускают удаление?
  options:
    a: "Ключ переходит в `Pending deletion` на 7–30 дней, по умолчанию 30; до конца срока удаление можно отменить, после — зашифрованные им данные не расшифровать"
    b: "Ключ удаляется сразу, но AWS хранит резервную копию 30 дней"
    c: "Удаляется только текущая версия key material, старые остаются для расшифровки"
    d: "Ключ удаляется через 7 дней, отменить можно только через поддержку"
  answer: a
  explanation: |
    Удаление ключа уничтожает key material и делает данные невосстановимыми, поэтому KMS
    требует срок ожидания. В это время ключ нельзя использовать, и попытки его использовать —
    лучший сигнал, что он кому-то нужен: на них ставят CloudWatch alarm. Если уверенности
    нет, ключ **выключают**, а не удаляют — выключение обратимо.
  ref: "https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html"

- id: aws-kms-secrets-005
  domain: aws
  subtopic: kms-secrets
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Включили автоматическую ротацию KMS-ключа. Нужно ли перешифровывать данные и менять ARN
    ключа в приложениях?
  answer: |
    Нет. Ротация меняет только текущий key material: ключ остаётся тем же ресурсом с тем же
    ID и ARN, новое шифрование идёт новым материалом, старые версии сохраняются, и KMS сам
    выбирает нужную при расшифровке. По умолчанию ротация раз в 365 дней, период
    настраивается, есть и ротация по требованию.
  explanation: |
    Прозрачность — причина включать ротацию без опасений, и она же задаёт предел:
    уже выданные ключом data keys не ротируются, данные не перешифровываются, так что
    скомпрометированный data key ротация не лечит. Автоматическая ротация доступна для
    симметричных ключей с материалом, созданным KMS; асимметричные, HMAC и ключи в custom
    key stores ротируют вручную — созданием нового ключа.
  ref: "https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html"

- id: aws-kms-secrets-006
  domain: aws
  subtopic: kms-secrets
  difficulty: junior
  source: core
  type: mcq
  verified: false
  prompt: |
    Пароль к базе должен автоматически ротироваться. Где его хранить?
  options:
    a: "SSM Parameter Store, тип `SecureString`"
    b: "AWS Secrets Manager"
    c: "В переменных окружения Lambda, зашифрованных KMS"
    d: "В S3 с SSE-KMS"
  answer: b
  explanation: |
    Secrets Manager создан для секретов: встроенная ротация, в том числе для баз данных,
    кросс-аккаунтный доступ и репликация между регионами. Parameter Store — для конфигурации:
    стандартные параметры до 4 KB бесплатны, `SecureString` шифруется KMS, но встроенной
    ротации нет. Сама AWS рекомендует пароли и API-ключи держать в Secrets Manager,
    а Parameter Store оставить для настроек.
  ref: "https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html"

- id: aws-kms-secrets-007
  domain: aws
  subtopic: kms-secrets
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    KMS-ключ, которым зашифрован RDS-инстанс, случайно выключили. Что будет с базой?
  answer: |
    RDS теряет доступ к ключу, и через 2 часа инстанс с включёнными бэкапами переходит
    в `inaccessible-encryption-credentials-recoverable` и останавливается. Семь дней его можно
    вернуть: включить ключ и запустить инстанс. Иначе он уходит в терминальное
    `inaccessible-encryption-credentials`, и остаётся только восстановление из бэкапа.
  explanation: |
    Шифрование на стороне сервиса делает ключ зависимостью доступности, а не только
    безопасности: операция над ключом роняет базу. При этом отзыв прав на ключ у создателя
    инстанса работающую базу не трогает — RDS пользуется grant'ом на всё время жизни
    инстанса, — а выключение ключа бьёт по всем ресурсам, зашифрованным им. Поэтому операции
    над ключами ограничивают отдельно от прав на сами ресурсы.
  ref: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html"
