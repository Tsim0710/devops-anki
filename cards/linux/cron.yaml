# linux / cron
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: linux-cron-001
  domain: linux
  subtopic: cron
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Как читается строка расписания `*/5 * * * 1-5`?
  answer: |
    Пять полей: минута, час, день месяца, месяц, день недели. Здесь — каждые пять
    минут, во все часы, с понедельника по пятницу.
  explanation: |
    Ловушка в двух полях дня: день месяца и день недели соединяются по **ИЛИ**,
    а не по И. Расписание `0 0 1 * 1` сработает и первого числа, и каждый
    понедельник — а не «первого числа, если это понедельник». Это одна из самых
    частых ошибок при настройке периодических задач.
  ref: "man 5 crontab"

- id: linux-cron-002
  domain: linux
  subtopic: cron
  difficulty: middle
  source: core
  type: mcq
  verified: false
  prompt: |
    Скрипт отлично работает из твоей сессии, но падает из cron. Самая частая причина?
  options:
    a: "Другое окружение: урезанный `PATH` и отсутствие переменных из профиля"
    b: "Cron запускает скрипт от другого пользователя"
    c: "У скрипта нет бита исполнения"
    d: "Cron не поддерживает длительные задачи"
  answer: a
  explanation: |
    Cron даёт минимальное окружение и **не читает** `.bashrc` и `.profile`:
    нет переменных, нет привычного `PATH`, часто другой рабочий каталог. Отсюда
    правило — в задачах указывать абсолютные пути и явно задавать нужные переменные,
    а не полагаться на профиль. Вторая часть правила — перенаправлять вывод в лог,
    иначе диагностировать нечем.
  ref: "man 5 crontab"

- id: linux-cron-003
  domain: linux
  subtopic: cron
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `crontab -e` отличается от файлов в `/etc/cron.d`?
  answer: |
    `crontab -e` правит расписание **конкретного пользователя**, и поле пользователя
    в строках отсутствует. Файлы в `/etc/cron.d` системные: в них есть
    дополнительное поле с именем пользователя, и они кладутся конфигурацией как код.
  explanation: |
    Практическая разница в управляемости: пользовательский crontab живёт в служебном
    каталоге и легко теряется при переносе или пересоздании машины, а файл
    в `/etc/cron.d` раскладывается Ansible и версионируется. Отсюда правило —
    всё, что нужно воспроизвести, описывать файлом, а не командой.
  ref: "man 5 crontab"
