- id: linux-package-management-001
  domain: linux
  subtopic: package-management
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужен `apt update` перед `apt install`?
  answer: |
    Он обновляет **локальный индекс** доступных пакетов и версий, ничего не устанавливая.
    Без него менеджер работает по устаревшему списку и может не найти пакет
    или потянуть версию, которой уже нет в репозитории.
  explanation: |
    В контейнерах это порождает известную ловушку: `apt update` и `apt install`
    в разных слоях Dockerfile — кеш индекса берётся из старого слоя, а установка
    падает на несуществующей версии. Отсюда правило собирать их в одну инструкцию
    вместе с очисткой списков.
  ref: "man 8 apt"

- id: linux-package-management-002
  domain: linux
  subtopic: package-management
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему в контейнере не обновляют пакеты в рантайме, хотя технически это возможно?
  answer: |
    Потому что образ должен быть **неизменяемым и воспроизводимым**: обновление
    в рантайме делает каждый экземпляр уникальным, исчезает при перезапуске
    и не проходит ни ревью, ни сканирование.
  explanation: |
    Отсюда правильный контур: уязвимость закрывается пересборкой образа и выкатом,
    а не командой внутри работающего контейнера. И отсюда же необходимость
    регулярно пересобирать образы, даже когда код не менялся — иначе приложение
    годами едет на базовом слое позапрошлого года.
  ref: "https://kubernetes.io/docs/concepts/containers/images/"

- id: linux-package-management-003
  domain: linux
  subtopic: package-management
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `dpkg` и `rpm` отличаются от `apt` и `yum`/`dnf`?
  answer: |
    `dpkg` и `rpm` работают с **одним файлом пакета** и не умеют разрешать
    зависимости. `apt` и `dnf` — уровень выше: они знают репозитории, считают
    зависимости и скачивают всё нужное.
  explanation: |
    Отсюда типичный тупик: установили пакет напрямую через `dpkg -i`, получили
    неудовлетворённые зависимости и сломанное состояние. Разделение полезно
    и в обратную сторону — низкоуровневые утилиты удобны, чтобы посмотреть,
    какому пакету принадлежит файл, или что именно в пакет входит.
  ref: "man 8 dpkg"

- id: linux-package-management-004
  domain: linux
  subtopic: package-management
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем пакеты и репозитории подписывают GPG-ключами?
  answer: |
    Чтобы менеджер убедился, что пакет пришёл от владельца репозитория и не был
    подменён по пути. Без действительной подписи установка отклоняется.
  explanation: |
    Это защита цепочки поставок на уровне ОС: зеркало или канал могут быть
    скомпрометированы, а подпись проверяется у клиента. Отсюда и опасность привычки
    добавлять флаг «не проверять подписи», когда ключ протух: он снимает единственный
    механизм доверия. Та же идея в контейнерном мире выражается подписью образов.
  ref: "man 8 apt-secure"
