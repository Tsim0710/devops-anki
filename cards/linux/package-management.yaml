- id: linux-package-management-001
  domain: linux
  subtopic: package-management
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужен `apt update` перед `apt install`?
  answer: |
    Он обновляет **локальный индекс** доступных пакетов и версий, ничего не устанавливая.
    Без него менеджер работает по устаревшему списку и может не найти пакет
    или потянуть версию, которой уже нет в репозитории.
  explanation: |
    В контейнерах это порождает известную ловушку: `apt update` и `apt install`
    в разных слоях Dockerfile — кеш индекса берётся из старого слоя, а установка
    падает на несуществующей версии. Отсюда правило собирать их в одну инструкцию
    вместе с очисткой списков.
  ref: "man 8 apt"

- id: linux-package-management-002
  domain: linux
  subtopic: package-management
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему в контейнере не обновляют пакеты в рантайме, хотя технически это возможно?
  answer: |
    Потому что образ должен быть **неизменяемым и воспроизводимым**: обновление
    в рантайме делает каждый экземпляр уникальным, исчезает при перезапуске
    и не проходит ни ревью, ни сканирование.
  explanation: |
    Отсюда правильный контур: уязвимость закрывается пересборкой образа и выкатом,
    а не командой внутри работающего контейнера. И отсюда же необходимость
    регулярно пересобирать образы, даже когда код не менялся — иначе приложение
    годами едет на базовом слое позапрошлого года.
  ref: "https://kubernetes.io/docs/concepts/containers/images/"
