# linux / permissions
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: linux-permissions-001
  domain: linux
  subtopic: permissions
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что означает бит `x` на каталоге?
  answer: |
    Право **входить** в каталог и обращаться к его содержимому по имени. Право `r`
    отдельно — оно позволяет только получить список имён.
  explanation: |
    Разделение объясняет частую конфигурацию `--x` (режим 711): войти и открыть
    известный файл можно, а перечислить содержимое нельзя. Отсюда и типичная ошибка
    прав в контейнерах — файл доступен, но не открывается, потому что нет `x`
    на одном из промежуточных каталогов пути.
  ref: "man 7 path_resolution"

- id: linux-permissions-002
  domain: linux
  subtopic: permissions
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что делают setuid, setgid и sticky bit?
  answer: |
    setuid — запускать файл с правами его владельца, а не запустившего. setgid —
    то же для группы, а на каталоге заставляет новые файлы наследовать группу
    каталога. Sticky bit на каталоге разрешает удалять файлы только их владельцу —
    так устроен `/tmp`.
  explanation: |
    setuid — исторический механизм повышения привилегий (`passwd`, `sudo`) и потому
    главная мишень: найденный setuid-бинарник внутри контейнера позволяет
    непривилегированному процессу стать root. Именно это закрывает
    `allowPrivilegeEscalation: false` в Kubernetes, и именно поэтому образы
    сканируют на неожиданные setuid-файлы.
  ref: "man 1 chmod"

- id: linux-permissions-003
  domain: linux
  subtopic: permissions
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое capabilities и зачем они нужны, если есть root?
  answer: |
    Дробление всемогущества root на отдельные права: `NET_BIND_SERVICE` — слушать
    порты ниже 1024, `NET_ADMIN` — настраивать сеть, `SYS_ADMIN` — почти всё.
    Процесс получает нужное, не становясь root целиком.
  explanation: |
    Это позволяет веб-серверу занять порт 80, не имея права читать чужие файлы
    или загружать модули ядра. Отсюда практика в контейнерах — отобрать всё
    (`drop: ALL`) и вернуть точечно. Отдельно стоит помнить, что `SYS_ADMIN`
    настолько широк, что его выдача практически равна root.
  ref: "man 7 capabilities"

- id: linux-permissions-004
  domain: linux
  subtopic: permissions
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Когда обычных `rwx` не хватает и нужны ACL?
  answer: |
    Когда доступ нужен нескольким разным группам или пользователям с разными правами:
    классическая модель знает только владельца, одну группу и всех остальных.
    ACL (`setfacl`, `getfacl`) снимает это ограничение.
  explanation: |
    Обходной путь без ACL — плодить группы под каждое сочетание доступа, и он быстро
    превращается в неуправляемый список. Признак того, что в каталоге есть ACL, —
    знак `+` в конце строки прав в выводе `ls -l`; без него можно долго не понимать,
    почему права выглядят одними, а ведут себя иначе.
  ref: "man 5 acl"

- id: linux-permissions-005
  domain: linux
  subtopic: permissions
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Права выглядят правильными, но доступ всё равно запрещён. Что ещё может мешать?
  answer: |
    Мандатный контроль доступа: SELinux или AppArmor. Они действуют **поверх** обычных
    прав, и их отказ виден не в правах файла, а в журнале аудита.
  explanation: |
    Самый частый случай — bind mount каталога хоста в контейнер на системе
    с SELinux: права верные, а доступа нет, потому что не совпадает контекст
    (лечится опцией монтирования `:z` или `:Z`). Диагностический признак —
    отказ есть, а `ls -l` ничего не объясняет; смотреть надо `ausearch`
    или `dmesg`, а не менять права на `777`.
  ref: "man 8 selinux"
