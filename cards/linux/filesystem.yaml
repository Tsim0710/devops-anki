# linux / filesystem
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: linux-filesystem-001
  domain: linux
  subtopic: filesystem
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что лежит в `/etc`, `/var`, `/proc` и `/tmp`?
  answer: |
    `/etc` — конфигурация системы. `/var` — изменяемые данные: логи, кеши, очереди.
    `/proc` — виртуальная файловая система ядра: процессы и параметры, файлов
    на диске там нет. `/tmp` — временные файлы, обычно чистится при перезагрузке.
  explanation: |
    Разделение по изменчивости объясняет практику: `/etc` версионируют и кладут
    в конфигурацию как код, `/var` мониторят на заполнение, `/proc` читают
    для диагностики, `/tmp` не используют для того, что должно пережить перезапуск.
    В контейнерах то же деление превращается в правило, какие каталоги монтировать
    томом, а какие оставить в неизменяемом образе.
  ref: "man 7 file-hierarchy"

- id: linux-filesystem-002
  domain: linux
  subtopic: filesystem
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем жёсткая ссылка отличается от символической?
  answer: |
    Жёсткая — это второе имя для того же inode: файл существует, пока есть хоть одно
    имя. Символическая — отдельный файл с путём внутри: удалили цель, ссылка осталась
    и стала битой.
  explanation: |
    Отсюда ограничения жёстких ссылок: они не работают между разными файловыми
    системами и не указывают на каталоги, потому что inode принадлежит конкретной ФС.
    Механизм подмены символической ссылки, кстати, лежит в основе обновления
    ConfigMap в Kubernetes: kubelet переставляет ссылку на новую версию каталога.
  ref: "man 7 symlink"

- id: linux-filesystem-003
  domain: linux
  subtopic: filesystem
  difficulty: middle
  source: core
  type: mcq
  verified: false
  prompt: |
    `df -h` показывает свободное место, но система пишет `No space left on device`.
    Что проверить первым?
  options:
    a: "Свободные inode через `df -i`"
    b: "Права на каталог, куда идёт запись"
    c: "Квоту пользователя"
    d: "Размер файла — возможно, превышен лимит файловой системы"
  answer: a
  explanation: |
    Место и inode — два независимых конечных ресурса: миллионы крошечных файлов
    исчерпывают таблицу inode при почти пустом диске. Классические источники —
    незачищаемые сессии, кеши, письма в очереди. Вторая частая причина того же
    сообщения тоньше: файл удалён, но открыт процессом, и место освободится только
    после его завершения — видно через `lsof | grep deleted`.
  ref: "man 1 df"

- id: linux-filesystem-004
  domain: linux
  subtopic: filesystem
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое overlayfs и зачем он нужен контейнерам?
  answer: |
    Файловая система из слоёв: несколько каталогов только для чтения плюс один
    для записи объединяются в одно дерево. Запись идёт в верхний слой,
    нижние не меняются.
  explanation: |
    Это и есть механика образов: слои образа общие и неизменяемые, у каждого
    контейнера свой тонкий слой записи. Отсюда экономия — десять контейнеров
    из одного образа занимают место одного, — и отсюда же правило: данные,
    записанные в слой контейнера, исчезают вместе с ним, поэтому для них нужен том.
  ref: "man 8 mount.overlay"

- id: linux-filesystem-005
  domain: linux
  subtopic: filesystem
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему запись в файл не означает, что данные на диске?
  answer: |
    Запись попадает в страничный кеш ядра и сбрасывается на диск позже. Гарантию
    даёт только `fsync` — и то при условии, что нижележащее устройство не врёт
    про свой кеш.
  explanation: |
    Отсюда потеря данных при внезапном отключении питания у приложений, которые
    «записали» и не дождались подтверждения. Базы данных явно вызывают `fsync`
    на журнал, и именно поэтому их производительность так зависит от задержки диска.
    Практический вывод для инфраструктуры: сравнивать диски надо по поведению
    на `fsync`, а не по пиковой пропускной способности.
  ref: "man 2 fsync"

- id: linux-filesystem-006
  domain: linux
  subtopic: filesystem
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `du` отличается от `df` и почему их цифры расходятся?
  answer: |
    `df` спрашивает у файловой системы, сколько блоков занято. `du` обходит дерево
    и складывает размеры файлов. Расхождение обычно означает удалённый файл,
    который всё ещё держит открытым процесс.
  explanation: |
    Такой файл исчез из дерева, поэтому `du` его не видит, но блоки не освобождены,
    и `df` их считает. Классика — удалили огромный лог, а место не вернулось;
    оно вернётся только после перезапуска процесса. Найти виновника помогает
    `lsof | grep deleted`.
  ref: "man 1 du"

- id: linux-filesystem-007
  domain: linux
  subtopic: filesystem
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое `/dev/null`, `/dev/zero` и `/dev/urandom`?
  answer: |
    `/dev/null` — «чёрная дыра»: всё записанное пропадает, чтение даёт пустоту.
    `/dev/zero` при чтении отдаёт бесконечные нули. `/dev/urandom` — псевдослучайные
    байты.
  explanation: |
    Практическое применение прямое: `2>/dev/null` глушит поток ошибок, `/dev/zero`
    создаёт файл заданного размера для теста диска или swap, `/dev/urandom` даёт
    случайные значения для паролей и ключей. Важная деталь: `/dev/urandom` в
    современных ядрах криптографически стойкий и не блокируется, поэтому именно
    он и нужен, а не `/dev/random`.
  ref: "man 4 null"

- id: linux-filesystem-008
  domain: linux
  subtopic: filesystem
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем монтировать файловую систему с `noexec`, `nosuid` и `nodev`?
  answer: |
    `noexec` запрещает запуск программ с этого раздела, `nosuid` игнорирует биты
    setuid и setgid, `nodev` — файлы устройств. Это защита каталогов, куда может
    писать кто угодно: `/tmp`, `/var/tmp`, загрузки.
  explanation: |
    Логика в том, чтобы разорвать типовую цепочку атаки: злоумышленник кладёт файл
    в доступный на запись каталог и запускает его. С `noexec` последний шаг
    не срабатывает. `nosuid` закрывает вторую половину — подложенный setuid-бинарник
    не даст повышения прав. В контейнерах тот же смысл несёт `readOnlyRootFilesystem`.
  ref: "man 8 mount"

- id: linux-filesystem-009
  domain: linux
  subtopic: filesystem
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `lsof` полезен при разборе инцидентов?
  answer: |
    Он показывает, какие файлы и сокеты открыты какими процессами: кто держит
    удалённый файл, кто занял порт, кто не отпускает точку монтирования
    (`lsof +D /mnt`, `lsof -i :8080`).
  explanation: |
    Три типовых тупика решаются им мгновенно: место не освобождается после удаления
    лога, порт занят «непонятно кем», раздел не размонтируется. Во всех случаях
    ответ один — процесс, который держит ресурс. Аналог для сокетов — `ss -ltnp`,
    но `lsof` покрывает и файлы, и сокеты сразу.
  ref: "man 8 lsof"

- id: linux-filesystem-010
  domain: linux
  subtopic: filesystem
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужен LVM, если можно разметить диск разделами?
  answer: |
    Он даёт слой абстракции: тома можно расширять на лету, объединять несколько
    физических дисков, делать снапшоты. Разделы жёстко привязаны к порядку
    и границам на устройстве.
  explanation: |
    Практическая ценность в расширении: закончилось место — добавил диск в группу
    и увеличил том без остановки сервиса. Снапшот LVM при этом не бэкап: он живёт
    на том же устройстве и предназначен для согласованного копирования, а не
    для хранения. Расширение файловой системы поверх тома — отдельный шаг.
  ref: "man 8 lvm"

- id: linux-filesystem-011
  domain: linux
  subtopic: filesystem
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что даёт журналирование в ext4 и XFS и что оно **не** гарантирует?
  answer: |
    Журнал обеспечивает согласованность **метаданных** после сбоя: файловая система
    не разваливается и не требует долгой проверки. Сохранность содержимого файлов
    он не гарантирует — данные могли остаться в кеше.
  explanation: |
    Отсюда разделение ответственности: файловая система отвечает за свою структуру,
    приложение — за свои данные через `fsync`. Именно поэтому база после жёсткого
    выключения может подняться на исправной ФС, но с потерянными последними
    транзакциями, если она не дожидалась подтверждения записи.
  ref: "man 5 ext4"

- id: linux-filesystem-012
  domain: linux
  subtopic: filesystem
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Как найти файлы по имени, по возрасту и сразу что-то с ними сделать?
  answer: |
    `find /path -name "*.log"` — по имени; `-mtime +7` — изменённые больше недели назад;
    `-size +100M` — крупные. Действие — `-delete` или `-exec cmd {} +`.
  explanation: |
    Вариант `-exec ... +` собирает аргументы пачками и потому в разы быстрее, чем
    `\;`, вызывающий команду на каждый файл. Практическая осторожность: перед
    `-delete` те же условия сначала прогоняют без действия и смотрят список — иначе
    опечатка в пути превращается в массовое удаление.
  ref: "man 1 find"
