# linux / filesystem
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: linux-filesystem-001
  domain: linux
  subtopic: filesystem
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что лежит в `/etc`, `/var`, `/proc` и `/tmp`?
  answer: |
    `/etc` — конфигурация системы. `/var` — изменяемые данные: логи, кеши, очереди.
    `/proc` — виртуальная файловая система ядра: процессы и параметры, файлов
    на диске там нет. `/tmp` — временные файлы, обычно чистится при перезагрузке.
  explanation: |
    Разделение по изменчивости объясняет практику: `/etc` версионируют и кладут
    в конфигурацию как код, `/var` мониторят на заполнение, `/proc` читают
    для диагностики, `/tmp` не используют для того, что должно пережить перезапуск.
    В контейнерах то же деление превращается в правило, какие каталоги монтировать
    томом, а какие оставить в неизменяемом образе.
  ref: "man 7 file-hierarchy"

- id: linux-filesystem-002
  domain: linux
  subtopic: filesystem
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем жёсткая ссылка отличается от символической?
  answer: |
    Жёсткая — это второе имя для того же inode: файл существует, пока есть хоть одно
    имя. Символическая — отдельный файл с путём внутри: удалили цель, ссылка осталась
    и стала битой.
  explanation: |
    Отсюда ограничения жёстких ссылок: они не работают между разными файловыми
    системами и не указывают на каталоги, потому что inode принадлежит конкретной ФС.
    Механизм подмены символической ссылки, кстати, лежит в основе обновления
    ConfigMap в Kubernetes: kubelet переставляет ссылку на новую версию каталога.
  ref: "man 7 symlink"

- id: linux-filesystem-003
  domain: linux
  subtopic: filesystem
  difficulty: middle
  source: core
  type: mcq
  verified: false
  prompt: |
    `df -h` показывает свободное место, но система пишет `No space left on device`.
    Что проверить первым?
  options:
    a: "Свободные inode через `df -i`"
    b: "Права на каталог, куда идёт запись"
    c: "Квоту пользователя"
    d: "Размер файла — возможно, превышен лимит файловой системы"
  answer: a
  explanation: |
    Место и inode — два независимых конечных ресурса: миллионы крошечных файлов
    исчерпывают таблицу inode при почти пустом диске. Классические источники —
    незачищаемые сессии, кеши, письма в очереди. Вторая частая причина того же
    сообщения тоньше: файл удалён, но открыт процессом, и место освободится только
    после его завершения — видно через `lsof | grep deleted`.
  ref: "man 1 df"

- id: linux-filesystem-004
  domain: linux
  subtopic: filesystem
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое overlayfs и зачем он нужен контейнерам?
  answer: |
    Файловая система из слоёв: несколько каталогов только для чтения плюс один
    для записи объединяются в одно дерево. Запись идёт в верхний слой,
    нижние не меняются.
  explanation: |
    Это и есть механика образов: слои образа общие и неизменяемые, у каждого
    контейнера свой тонкий слой записи. Отсюда экономия — десять контейнеров
    из одного образа занимают место одного, — и отсюда же правило: данные,
    записанные в слой контейнера, исчезают вместе с ним, поэтому для них нужен том.
  ref: "man 8 mount.overlay"

- id: linux-filesystem-005
  domain: linux
  subtopic: filesystem
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему запись в файл не означает, что данные на диске?
  answer: |
    Запись попадает в страничный кеш ядра и сбрасывается на диск позже. Гарантию
    даёт только `fsync` — и то при условии, что нижележащее устройство не врёт
    про свой кеш.
  explanation: |
    Отсюда потеря данных при внезапном отключении питания у приложений, которые
    «записали» и не дождались подтверждения. Базы данных явно вызывают `fsync`
    на журнал, и именно поэтому их производительность так зависит от задержки диска.
    Практический вывод для инфраструктуры: сравнивать диски надо по поведению
    на `fsync`, а не по пиковой пропускной способности.
  ref: "man 2 fsync"
