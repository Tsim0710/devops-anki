- id: linux-text-processing-001
  domain: linux
  subtopic: text-processing
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Когда уместны `grep`, `sed` и `awk`?
  answer: |
    `grep` — найти строки по образцу. `sed` — построчно заменить или удалить.
    `awk` — разобрать строку на поля и посчитать по ним.
  explanation: |
    Граница проходит по задаче, а не по мощности: `awk` умеет всё, но использовать его
    ради поиска подстроки — усложнение. Практический признак, что пора остановиться
    и взять нормальный язык, — когда в конвейере появляется третий `sed` подряд
    или разбор JSON регулярными выражениями. Для JSON есть `jq`.
  ref: "man 1 awk"

- id: linux-text-processing-002
  domain: linux
  subtopic: text-processing
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает `set -euo pipefail` и почему это стандарт для скриптов?
  answer: |
    `-e` — прервать скрипт при первой ошибке; `-u` — считать ошибкой обращение
    к неопределённой переменной; `-o pipefail` — считать конвейер упавшим, если упало
    любое звено, а не только последнее.
  explanation: |
    Без этого скрипт по умолчанию **игнорирует** ошибки и продолжает выполняться —
    самое опасное поведение в автоматизации, где следующая команда может удалять
    файлы, рассчитывая на успех предыдущей. `pipefail` закрывает особенно коварный
    случай: `curl ... | tar x` возвращает успех, даже если `curl` не скачал ничего.
  ref: "man 1 bash"

- id: linux-text-processing-003
  domain: linux
  subtopic: text-processing
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему в скриптах пишут `"$var"` в кавычках, а не просто `$var`?
  answer: |
    Без кавычек shell разбивает значение по пробелам и раскрывает шаблоны. Имя файла
    с пробелом превращается в два аргумента, а значение `*` — в список файлов каталога.
  explanation: |
    Это источник самых разрушительных ошибок в автоматизации: `rm -rf $DIR/` при пустом
    `DIR` превращается в `rm -rf /`. Отсюда набор привычек — кавычки вокруг любых
    подстановок, `set -u`, чтобы пустая переменная роняла скрипт, и `--` перед
    аргументами, чтобы имя, начинающееся с дефиса, не приняли за флаг.
  ref: "man 1 bash"

- id: linux-text-processing-004
  domain: linux
  subtopic: text-processing
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем в скрипте нужен `trap`?
  answer: |
    Чтобы выполнить уборку при завершении — по ошибке, по сигналу или штатно:
    удалить временные файлы, снять блокировку, вернуть систему в исходное состояние.
    `trap cleanup EXIT` срабатывает в любом случае.
  explanation: |
    Без него скрипт, упавший на середине из-за `set -e`, оставляет за собой мусор:
    полуготовые файлы, взятый lock, включённый режим обслуживания. Особенно важно
    в автоматизации, где следующий запуск наткнётся на этот остаток и поведёт себя
    непредсказуемо. Это тот же принцип, что финализаторы в Kubernetes: уборка
    должна быть гарантированной, а не зависеть от удачного пути исполнения.
  ref: "man 1 bash"

- id: linux-text-processing-005
  domain: linux
  subtopic: text-processing
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем смотреть большой лог и как следить за ним в реальном времени?
  answer: |
    `less` для чтения (умеет искать по `/` и не грузит файл целиком), `tail -f`
    или `tail -F` для слежения. `-F` переживает ротацию файла, `-f` — нет.
  explanation: |
    Разница между `-f` и `-F` проявляется ровно в момент ротации: обычный `-f`
    остаётся на старом переименованном файле и замолкает, хотя запись продолжается
    в новый. Открывать многогигабайтный лог редактором не стоит вовсе — он читает
    файл в память целиком.
  ref: "man 1 tail"
