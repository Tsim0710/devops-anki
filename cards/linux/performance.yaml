# linux / performance
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: linux-performance-001
  domain: linux
  subtopic: performance
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что на самом деле показывает load average в Linux?
  answer: |
    Среднее число процессов в состоянии **runnable плюс uninterruptible sleep**
    за 1, 5 и 15 минут. То есть в него входят не только те, кто ждёт процессор,
    но и те, кто ждёт диск.
  explanation: |
    Отсюда специфика Linux: высокий load при простаивающем процессоре означает
    ожидание ввода-вывода, а не нехватку CPU — в других системах в этот показатель
    диск не входит. Сравнивать значение имеет смысл только с числом ядер: load 8
    на восьмиядерной машине это полная загрузка, на двухъядерной — четырёхкратная
    очередь.
  ref: "man 1 uptime"

- id: linux-performance-002
  domain: linux
  subtopic: performance
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    `free -m` показывает почти ноль свободной памяти. Это проблема?
  answer: |
    Обычно нет. Ядро занимает свободную память под страничный кеш и отдаёт её
    приложениям по первому требованию. Смотреть надо на колонку `available`,
    а не на `free`.
  explanation: |
    Незанятая память — потерянная память, поэтому пустой `free` это норма для
    работающей системы. Ровно та же путаница в контейнерах приводит к неверным
    алертам: метрика потребления, включающая кеш, показывает почти лимит,
    хотя под здоров, — и потому для порогов берут working set, а не общее
    потребление.
  ref: "man 1 free"

- id: linux-performance-003
  domain: linux
  subtopic: performance
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что значит и чего не значит высокий `%iowait`?
  answer: |
    Это доля времени, когда процессор **простаивал** и при этом были незавершённые
    операции ввода-вывода. Он не измеряет ни объём, ни медленность диска: при
    загруженном процессоре тот же диск даст низкий `%iowait`.
  explanation: |
    Отсюда две противоположные ошибки: увидеть высокий `iowait` и обвинить диск,
    хотя система просто ничем больше не занята; и не увидеть его при реальной
    проблеме с диском, потому что процессор занят другим. Прямые показатели —
    задержка и глубина очереди устройства в `iostat -x`, а `iowait` только повод
    туда заглянуть.
  ref: "man 1 iostat"

- id: linux-performance-004
  domain: linux
  subtopic: performance
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    С чего начать разбор «сервер тормозит», чтобы не гадать?
  answer: |
    Пройти по ресурсам методично: процессор (`top`, кто ест и сколько ждёт),
    память (`available`, swap, OOM в `dmesg`), диск (`iostat -x`: задержка и очередь),
    сеть (`ss -s`, ошибки на интерфейсах). Для каждого — загрузка, насыщение, ошибки.
  explanation: |
    Схема ценна тем, что заканчивается: перебрав четыре ресурса по трём признакам,
    ты либо нашёл узкое место, либо доказал, что дело не в ресурсах хоста —
    и тогда смотреть надо в приложение или в зависимости. Гадание же по одному
    показателю обычно приводит к первой правдоподобной аномалии, а они есть всегда.
  ref: "man 1 iostat"

- id: linux-performance-005
  domain: linux
  subtopic: performance
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужен swap и почему его выключают на узлах Kubernetes?
  answer: |
    Swap позволяет вытеснить редко используемые страницы на диск и пережить пик
    потребления. На узлах кластера он мешает: планирование строится на честном учёте
    памяти, а swap делает поведение при нехватке медленным и непредсказуемым.
  explanation: |
    Разница в целях: на обычном сервере лучше медленно, чем никак; в кластере лучше
    честный отказ, потому что под будет пересоздан на узле, где память есть.
    Приложение в swap не падает, а деградирует в десятки раз — и такой узел
    выглядит живым, продолжая тянуть на себя нагрузку.
  ref: "https://kubernetes.io/docs/concepts/architecture/nodes/"

- id: linux-performance-006
  domain: linux
  subtopic: performance
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Когда уместен `strace` и почему им нельзя пользоваться в проде беззаботно?
  answer: |
    Он показывает системные вызовы процесса — незаменим, когда непонятно, где тот
    застрял или какой файл не находит. Но он останавливает процесс на каждом вызове
    и замедляет его в разы.
  explanation: |
    Отсюда практика: подключаться точечно и ненадолго, фильтровать по нужным вызовам
    (`-e trace=file`), и никогда не вешать на процесс, обслуживающий трафик,
    без готовности к деградации. Более щадящие инструменты для той же задачи строятся
    на eBPF — они не останавливают процесс, а снимают события в ядре.
  ref: "man 1 strace"

- id: linux-performance-007
  domain: linux
  subtopic: performance
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему для баз данных обычно отключают transparent huge pages?
  answer: |
    Ядро пытается склеивать страницы в большие «на лету», и эта работа приходится
    на моменты выделения памяти. Для приложений с непредсказуемым доступом это даёт
    паузы в десятки и сотни миллисекунд.
  explanation: |
    Классический случай, когда оптимизация из коробки вредит конкретной нагрузке:
    большие страницы полезны при последовательной работе с крупными массивами
    и вредны при разреженном доступе. Отсюда и рекомендация почти всех СУБД
    выключать именно **прозрачный** механизм, оставляя возможность явных больших
    страниц там, где приложение умеет ими пользоваться.
  ref: "man 5 proc"
