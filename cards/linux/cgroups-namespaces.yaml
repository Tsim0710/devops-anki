# linux / cgroups-namespaces
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: linux-cgroups-namespaces-001
  domain: linux
  subtopic: cgroups-namespaces
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем namespaces отличаются от cgroups по решаемой задаче?
  answer: |
    Namespaces отвечают за **видимость**: что процесс видит — свои PID, свою сеть,
    свои точки монтирования. Cgroups отвечают за **потребление**: сколько ему
    позволено взять CPU, памяти, ввода-вывода.
  explanation: |
    Контейнер — это сочетание обоих: изоляция без ограничения ресурсов позволила бы
    одному контейнеру съесть весь узел, а ограничение без изоляции дало бы ему видеть
    чужие процессы и сеть. Разделение полезно и при диагностике: «видит лишнее» —
    вопрос к namespace, «тормозит или убит» — к cgroup.
  ref: "man 7 namespaces"

- id: linux-cgroups-namespaces-002
  domain: linux
  subtopic: cgroups-namespaces
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Какие бывают namespace и за что каждый отвечает?
  answer: |
    `pid` — своё дерево процессов; `net` — свой сетевой стек; `mnt` — свои монтирования;
    `uts` — своё hostname; `ipc` — своя разделяемая память и очереди;
    `user` — своё отображение uid; `cgroup` — свой корень иерархии cgroups.
  explanation: |
    Их можно комбинировать по отдельности, и на этом стоит устройство пода
    в Kubernetes: контейнеры делят `net`, `ipc` и `uts`, но имеют раздельные `mnt`.
    Отсюда и наблюдаемое поведение — общий localhost и общий IP при раздельных
    файловых системах.
  ref: "man 7 namespaces"

- id: linux-cgroups-namespaces-003
  domain: linux
  subtopic: cgroups-namespaces
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что cgroups ограничивают и чем v2 лучше v1?
  answer: |
    Ограничивают CPU, память, ввод-вывод, число процессов. В v1 у каждого ресурса
    была своя независимая иерархия, в v2 иерархия одна — контроллеры применяются
    к общему дереву, а учёт согласован между ресурсами.
  explanation: |
    Единая иерархия убирает целый класс несогласованных состояний, когда процесс
    попадал в разные группы по разным ресурсам. Практически это важно для контейнеров:
    v2 корректнее считает память вместе со страничным кешем и даёт мягкие пороги
    (`memory.high`) вместо единственного варианта «убить при превышении».
  ref: "man 7 cgroups"

- id: linux-cgroups-namespaces-004
  domain: linux
  subtopic: cgroups-namespaces
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что у контейнера **не** изолировано, несмотря на namespaces и cgroups?
  answer: |
    Ядро — оно общее, включая его уязвимости и параметры. Системное время. Большая
    часть `sysctl`. Аппаратные ресурсы и их состояние. Всё, что не покрыто
    отдельным namespace.
  explanation: |
    Это фундаментальная граница контейнерной изоляции и главный аргумент за отдельные
    кластеры или лёгкие виртуальные машины для недоверенного кода: уязвимость в ядре
    обходит всё сразу. Отсюда же практическое следствие — нельзя менять `sysctl`
    «только для своего контейнера», кроме небольшого списка тех, что признаны
    безопасными для namespace.
  ref: "man 7 namespaces"

- id: linux-cgroups-namespaces-005
  domain: linux
  subtopic: cgroups-namespaces
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что даёт user namespace и как он делает возможным rootless-режим?
  answer: |
    Отображение идентификаторов: uid 0 **внутри** namespace соответствует обычному
    непривилегированному uid снаружи. Процесс считает себя root и имеет все права
    внутри, не имея их на хосте.
  explanation: |
    Это снимает главный риск контейнеров — совпадение root внутри и root снаружи:
    выход за периметр даёт злоумышленнику права обычного пользователя, а не машины.
    Цена — сложности с монтированием томов и правами на файлы, потому что владельцы
    файлов тоже отображаются, и часть операций непривилегированному процессу
    по-прежнему недоступна.
  ref: "man 7 user_namespaces"

- id: linux-cgroups-namespaces-006
  domain: linux
  subtopic: cgroups-namespaces
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что делают `nsenter` и `unshare`?
  answer: |
    `unshare` создаёт **новые** namespace и запускает в них процесс. `nsenter`
    наоборот — входит в **существующие** namespace чужого процесса, обычно по его PID.
  explanation: |
    Это ручной эквивалент того, что делает контейнерный рантайм. Практическая ценность
    у `nsenter`: он позволяет с хоста войти в сетевой namespace контейнера
    и посмотреть его сокеты или снять дамп своими утилитами, когда в образе нет
    ничего. Тот же механизм лежит в основе `kubectl debug --target`.
  ref: "man 1 nsenter"

- id: linux-cgroups-namespaces-007
  domain: linux
  subtopic: cgroups-namespaces
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Как защититься от fork-бомбы в контейнере или сервисе?
  answer: |
    Ограничить число процессов через cgroup: `pids.max`, в Docker это `--pids-limit`,
    в systemd — `TasksMax`. Лимиты памяти и CPU от неё не спасают.
  explanation: |
    Fork-бомба не потребляет заметно ни памяти, ни процессора на каждый процесс —
    она исчерпывает **таблицу процессов** и не даёт запуститься ничему, включая
    средства восстановления. Именно поэтому у неё отдельный контроллер cgroups.
    Тот же лимит косвенно задаёт и `maxPods` на узле Kubernetes.
  ref: "man 7 cgroups"
