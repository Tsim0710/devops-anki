- id: linux-ssh-001
  domain: linux
  subtopic: ssh
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Как устроен вход по SSH-ключу?
  answer: |
    Приватный ключ остаётся у клиента, публичный кладётся в `~/.ssh/authorized_keys`
    на сервере. Сервер проверяет подпись, сделанную приватным ключом, — сам ключ
    по сети не передаётся.
  explanation: |
    Отсюда преимущества перед паролем: секрет не покидает клиента, перебор
    бессмысленен, а отзыв доступа сводится к удалению строки на сервере.
    Практическая деталь, о которую спотыкаются: SSH требователен к правам — каталог
    `.ssh` должен быть `700`, файл ключей `600`, иначе демон молча откажет.
  ref: "man 8 sshd"

- id: linux-ssh-002
  domain: linux
  subtopic: ssh
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `ProxyJump` лучше проброса агента при работе через bastion?
  answer: |
    `ProxyJump` строит туннель через промежуточный хост, а аутентификация остаётся
    **на твоей машине**. Проброс агента (`ForwardAgent`) отдаёт bastion возможность
    пользоваться твоим ключом, пока сессия жива.
  explanation: |
    Разница в модели доверия: при пробросе агента взломанный или недобросовестный
    bastion может авторизоваться твоим ключом куда угодно, куда пускает этот ключ.
    `ProxyJump` такой возможности не даёт вовсе, и потому он стандарт для доступа
    к внутренним машинам через прыжковый хост.
  ref: "man 5 ssh_config"

- id: linux-ssh-003
  domain: linux
  subtopic: ssh
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что означает предупреждение о смене host key и почему его нельзя просто
    подтвердить?
  answer: |
    Ключ сервера не совпал с записанным в `known_hosts`. Это либо законная
    переустановка сервера, либо подмена — то есть ровно тот сценарий, от которого
    защищает проверка.
  explanation: |
    Ключ сервера — единственное, что доказывает клиенту, куда он попал: без этой
    проверки SSH шифрует канал, но не знает, с кем. Привычка удалять строку
    из `known_hosts` не глядя обесценивает механизм целиком. Правильный порядок —
    выяснить, был ли сервер пересоздан, и брать отпечаток из доверенного источника,
    а не из самого подключения.
  ref: "man 1 ssh"
