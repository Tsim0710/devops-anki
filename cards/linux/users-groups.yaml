# linux / users-groups
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: linux-users-groups-001
  domain: linux
  subtopic: users-groups
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что хранится в `/etc/passwd` и что в `/etc/shadow`?
  answer: |
    В `passwd` — имя, uid, gid, домашний каталог и shell; файл читаем всеми.
    В `shadow` — хеши паролей и правила их устаревания; доступен только root.
  explanation: |
    Разделение появилось именно потому, что `passwd` обязан быть читаемым всеми —
    по нему любая программа переводит uid в имя. Хранить там хеши означало бы отдать
    их для офлайнового перебора. Отсюда же практический вывод: uid — это число,
    а имя лишь его отображение, и при монтировании томов в контейнер значение имеет
    именно совпадение чисел.
  ref: "man 5 passwd"

- id: linux-users-groups-002
  domain: linux
  subtopic: users-groups
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Файл на смонтированном томе не открывается контейнером, хотя права `644`
    и владелец существует. Почему?
  answer: |
    Совпадать должны **числовые** uid и gid, а не имена. Внутри контейнера свой
    `/etc/passwd`, и uid 1000 там может называться иначе или не существовать вовсе —
    ядру это безразлично, оно сравнивает числа.
  explanation: |
    Отсюда классическая боль с bind mount: файлы, созданные контейнером, принадлежат
    на хосте «непонятно кому», и наоборот. Решается заданием `runAsUser` и `fsGroup`
    в Kubernetes либо согласованием uid при сборке образа. User namespace добавляет
    сюда ещё один слой отображения.
  ref: "man 7 credentials"

- id: linux-users-groups-003
  domain: linux
  subtopic: users-groups
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `sudo` отличается от `su`, и что меняет `sudo -i`?
  answer: |
    `su` переключает на другого пользователя, требуя **его** пароль. `sudo` выполняет
    команду с повышенными правами по своему паролю и по правилам в `sudoers`,
    записывая это в журнал. `sudo -i` даёт полноценную сессию root с его окружением.
  explanation: |
    Разница не в удобстве, а в управляемости: `sudo` даёт адресные права и аудит —
    видно, кто и что выполнял, а отзыв сводится к правке правил. `su` требует общего
    пароля root, который нельзя ни ограничить, ни отследить. Отсюда и практика
    отключать вход root вовсе.
  ref: "man 8 sudo"

- id: linux-users-groups-004
  domain: linux
  subtopic: users-groups
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем сервисам заводят отдельных пользователей с `/usr/sbin/nologin`?
  answer: |
    Чтобы сервис работал с минимальными правами и при этом под этой учётной записью
    нельзя было войти в систему — ни по SSH, ни через `su`. Она существует только
    для владения процессом и файлами.
  explanation: |
    Это применение принципа наименьших привилегий на уровне ОС: компрометация
    веб-сервера даёт права его пользователя, а не root и не возможность залогиниться.
    Ровно та же логика в контейнерах выражается инструкцией `USER` и требованием
    `runAsNonRoot`.
  ref: "man 5 passwd"
