# linux / processes
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: linux-processes-001
  domain: linux
  subtopic: processes
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое PID и PPID, и кто становится родителем процесса, если его родитель умер?
  answer: |
    PID — номер процесса, PPID — номер родителя. Если родитель завершился, процесс
    **усыновляет** init (PID 1) — в системе с systemd это он.
  explanation: |
    Механизм усыновления объясняет, почему в системе не бывает процессов без родителя
    и зачем PID 1 особенный: он обязан забирать чужих сирот и «хоронить» их,
    иначе таблица процессов заполнится мёртвыми записями. Именно это ломается
    в контейнерах, где PID 1 — обычное приложение, не рассчитанное на такую роль.
  ref: "man 7 credentials"

- id: linux-processes-002
  domain: linux
  subtopic: processes
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `SIGTERM` отличается от `SIGKILL`, и какие сигналы нельзя перехватить?
  answer: |
    `SIGTERM` (15) — просьба завершиться, её можно перехватить и корректно закрыться.
    `SIGKILL` (9) и `SIGSTOP` перехватить **невозможно**: их обрабатывает ядро,
    процесс о них не узнаёт.
  explanation: |
    Отсюда весь смысл graceful shutdown: сначала посылают `SIGTERM`, дают время
    на слив соединений, и только потом `SIGKILL`. Ровно эту последовательность
    выполняет Kubernetes с `terminationGracePeriodSeconds` и `docker stop`.
    Приложение, игнорирующее `SIGTERM`, всегда умирает жёстко и теряет данные.
  ref: "man 7 signal"

- id: linux-processes-003
  domain: linux
  subtopic: processes
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что показывает `ps aux` в колонках `VSZ` и `RSS`?
  answer: |
    `VSZ` — виртуальный размер: сколько адресного пространства процесс запросил.
    `RSS` — resident set size: сколько физической памяти он реально занимает **сейчас**.
  explanation: |
    Смотреть надо на `RSS`: `VSZ` включает всё отображённое, в том числе никогда
    не использованное, и у JVM или Go-программы бывает огромным при скромном
    реальном потреблении. Но и `RSS` обманчив — он считает разделяемые страницы
    у каждого процесса, поэтому сумма `RSS` по всем процессам больше физической памяти.
  ref: "man 1 ps"

- id: linux-processes-004
  domain: linux
  subtopic: processes
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Чем зомби отличается от осиротевшего процесса?
  answer: |
    Зомби уже завершился, но родитель не забрал его код возврата — запись в таблице
    процессов висит. Сирота продолжает **работать**, просто его родитель умер,
    и он передан init.
  explanation: |
    Зомби не потребляет ни память, ни процессор — он занимает только номер в таблице,
    и опасен лишь массовостью: тысячи зомби исчерпывают лимит PID. Причина всегда
    одна — родитель не вызывает `wait()`. Убить зомби нельзя, он уже мёртв;
    лечат родителя или, если тот исчез, ждут усыновления init'ом.
  ref: "man 2 wait"

- id: linux-processes-005
  domain: linux
  subtopic: processes
  difficulty: middle
  source: core
  type: mcq
  verified: false
  prompt: |
    Приложение запущено в контейнере как PID 1 обычным shell-скриптом.
    Что с ним не так?
  options:
    a: "Оно не пересылает сигналы дочерним процессам и не забирает зомби"
    b: "Оно не сможет открыть порты ниже 1024"
    c: "Оно не получит переменные окружения контейнера"
    d: "Оно будет работать от root независимо от USER"
  answer: a
  explanation: |
    PID 1 несёт две особые обязанности: разносить сигналы и «хоронить» усыновлённых
    сирот. Обычный процесс их не выполняет, поэтому `docker stop` и `SIGTERM`
    от Kubernetes не доходят до приложения, а под убивают жёстко по истечении
    grace period. Лечится минимальным init внутри контейнера (`tini`,
    `docker run --init`) или запуском приложения через `exec`, а не как потомка.
  ref: "man 7 signal"

- id: linux-processes-006
  domain: linux
  subtopic: processes
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает `exec` в shell-скрипте и почему это важно для контейнеров?
  answer: |
    Заменяет текущий процесс новым, **не создавая** дочернего: тот же PID, то же место
    в дереве. В скрипте-обёртке это делает приложение самим PID 1, а не его потомком.
  explanation: |
    Без `exec` получается два процесса: shell как PID 1 и приложение под ним. Сигнал
    от `docker stop` придёт shell'у, тот его проигнорирует, приложение ничего
    не узнает. Строка `exec "$@"` в конце entrypoint-скрипта — стандартное решение
    этой проблемы и признак того, что автор образа понимал, что делает.
  ref: "man 1 bash"

- id: linux-processes-007
  domain: linux
  subtopic: processes
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Как ядро выбирает жертву при нехватке памяти и как на это повлиять?
  answer: |
    OOM killer считает каждому процессу оценку по объёму занятой памяти
    и корректирует её на `oom_score_adj` (от −1000 до 1000). Убивается процесс
    с наибольшей оценкой; итог виден в `dmesg`.
  explanation: |
    Отсюда контринтуитивный исход: часто убивают самое крупное приложение, а не то,
    которое течёт. Значение `oom_score_adj` позволяет защитить критичный процесс
    или, наоборот, подставить фоновый. Kubernetes использует именно этот механизм:
    QoS-класс пода транслируется в `oom_score_adj`, поэтому `BestEffort` умирает
    первым, а `Guaranteed` последним.
  ref: "man 5 proc"

- id: linux-processes-008
  domain: linux
  subtopic: processes
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что полезного можно узнать о процессе через `/proc/<pid>/`?
  answer: |
    `cmdline` и `environ` — с чем запущен; `fd/` — открытые файлы и сокеты;
    `limits` — его лимиты; `status` — память, состояние, uid; `ns/` — его namespace;
    `cgroup` — в каком cgroup он живёт.
  explanation: |
    Это единственный способ узнать правду о работающем процессе, когда обычные
    утилиты недоступны или врут. Практические применения: `fd/` показывает удалённый,
    но всё ещё открытый файл, занимающий место на диске; `ns/` позволяет войти
    в сетевой namespace контейнера через `nsenter`; `cgroup` говорит, какому
    контейнеру принадлежит процесс, если смотреть с хоста.
  ref: "man 5 proc"

- id: linux-processes-009
  domain: linux
  subtopic: processes
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `kill`, `pkill` и `killall` отличаются друг от друга?
  answer: |
    `kill` работает по PID. `pkill` — по образцу имени и другим признакам
    (пользователь, родитель). `killall` — по **точному** имени процесса.
  explanation: |
    Опасность в широте выборки: `pkill java` на машине с несколькими java-сервисами
    убьёт все. Поэтому перед отправкой сигнала полезно посмотреть, кого зацепит:
    у `pkill` для этого есть `pgrep` с теми же аргументами. Все три по умолчанию
    шлют `SIGTERM`, а не `SIGKILL`.
  ref: "man 1 pkill"

- id: linux-processes-010
  domain: linux
  subtopic: processes
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает `nohup` и чем отличается от простого `&`?
  answer: |
    `&` отправляет процесс в фон, но он остаётся потомком твоей сессии и умрёт вместе
    с ней. `nohup` дополнительно защищает от `SIGHUP` при разрыве терминала
    и перенаправляет вывод в файл.
  explanation: |
    Практический вывод: длинную задачу по SSH запускают не через `&`, а через `nohup`,
    `tmux` или `systemd-run` — иначе обрыв связи убьёт её на середине. Для регулярных
    задач всё это костыли: правильный ответ — unit systemd, потому что он переживает
    и перезагрузку, и разрыв сессии.
  ref: "man 1 nohup"

- id: linux-processes-011
  domain: linux
  subtopic: processes
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что делают `nice` и `renice`, и почему это не спасает от нехватки CPU?
  answer: |
    Меняют приоритет процесса от −20 (высший) до 19. Это лишь **относительный вес**
    при дележе процессорного времени: если конкуренции нет, низкий приоритет ничего
    не замедляет, а при нехватке всё равно кто-то ждёт.
  explanation: |
    Отсюда область применения: фоновые задачи вроде бэкапа или сборки помечают низким
    приоритетом, чтобы они уступали основной нагрузке. Но приоритет не ограничивает
    потребление — для этого нужны cgroups. И на ввод-вывод он не влияет вовсе,
    там свой механизм (`ionice`).
  ref: "man 1 nice"

- id: linux-processes-012
  domain: linux
  subtopic: processes
  difficulty: senior
  source: core
  type: mcq
  verified: false
  prompt: |
    Приложение падает с `Too many open files`, хотя файлов открыто немного.
    Что чаще всего забывают посчитать?
  options:
    a: "Сетевые сокеты — они тоже файловые дескрипторы"
    b: "Размер файлов — лимит считается в байтах"
    c: "Число процессов, а не дескрипторов"
    d: "Свободное место на диске"
  answer: a
  explanation: |
    В Linux дескриптором является всё: файлы, сокеты, каналы, `epoll`, `inotify`.
    Сервер с десятью тысячами соединений расходует лимит на сокеты, а не на файлы,
    и упирается в `RLIMIT_NOFILE`. Смотреть надо `ls /proc/<pid>/fd | wc -l` против
    `cat /proc/<pid>/limits`, а не на каталоги с данными. В systemd лимит задаётся
    директивой `LimitNOFILE`, в контейнере — настройками рантайма.
  ref: "man 2 getrlimit"

- id: linux-processes-013
  domain: linux
  subtopic: processes
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему `kill -9` — последнее средство, а не первое?
  answer: |
    `SIGKILL` не даёт процессу выполнить ни одного собственного действия: не сбрасывает
    буферы на диск, не закрывает соединения, не снимает блокировки и файлы-замки.
    Данные теряются, а после перезапуска приходится восстанавливаться.
  explanation: |
    Особенно болезненно это для баз и всего, что держит на диске состояние: остаётся
    файл блокировки, из-за которого сервис не поднимается, или недописанный журнал.
    Правильный порядок — `SIGTERM`, ожидание, разбор причины зависания, и лишь потом
    `SIGKILL`. Ту же последовательность соблюдают `docker stop` и Kubernetes.
  ref: "man 7 signal"

- id: linux-processes-014
  domain: linux
  subtopic: processes
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `top` полезнее `ps` и что смотреть в его выводе первым?
  answer: |
    `ps` — снимок на момент запуска, `top` обновляется и показывает динамику.
    Смотрят сначала строку состояния: load average, распределение времени CPU
    (`us`, `sy`, `wa`, `id`) и память, — и только потом список процессов.
  explanation: |
    Строка состояния сразу задаёт направление: высокий `wa` уводит к диску, высокий
    `sy` — к системным вызовам и ядру, высокий `us` — к самому приложению.
    Начинать со списка процессов — распространённая ошибка: там всегда кто-то
    первый, и это ничего не доказывает.
  ref: "man 1 top"
