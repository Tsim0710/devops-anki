- id: linux-logs-001
  domain: linux
  subtopic: logs
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Как посмотреть логи конкретного сервиса и его последние ошибки?
  answer: |
    `journalctl -u <сервис>` — весь журнал юнита; `-f` — следить в реальном времени;
    `-p err` — только ошибки; `--since "10 min ago"` — за период;
    `-b` — с последней загрузки.
  explanation: |
    Ключевое отличие journald от файлов в `/var/log` — структурированность: записи
    привязаны к юниту, приоритету и времени, поэтому фильтрация не требует
    регулярных выражений. Практически чаще всего нужна связка `-u`, `-p` и `--since`:
    она сразу сужает поиск до нужного сервиса и окна инцидента.
  ref: "man 1 journalctl"

- id: linux-logs-002
  domain: linux
  subtopic: logs
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    После перезагрузки логи journald пропали. Почему?
  answer: |
    По умолчанию журнал может храниться в памяти (`/run/log/journal`) и не переживает
    перезагрузку. Постоянное хранение включается созданием `/var/log/journal`
    и параметром `Storage=persistent`.
  explanation: |
    Ровно та же ловушка, что с событиями в Kubernetes: разбирать ночной инцидент
    утром не по чему, потому что данные не были рассчитаны на долгую жизнь.
    Отсюда правило — на любом узле, где предстоит расследовать инциденты,
    постоянное хранение включают заранее и ограничивают размер, чтобы журнал
    не съел диск.
  ref: "man 5 journald.conf"

- id: linux-logs-003
  domain: linux
  subtopic: logs
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что показывает `dmesg` и когда туда стоит смотреть?
  answer: |
    Кольцевой буфер сообщений **ядра**: OOM killer, ошибки дисков, проблемы с сетевыми
    картами, срабатывания файрвола. Туда идут события, о которых приложение
    ничего не знает.
  explanation: |
    Это единственное место, где видно, что процесс убил не сбой в коде, а ядро
    по нехватке памяти. Тот же буфер показывает переполнение таблицы соединений
    и ошибки ввода-вывода — то есть ровно те причины, которые в логах приложения
    выглядят как загадочные обрывы.
  ref: "man 1 dmesg"

- id: linux-logs-004
  domain: linux
  subtopic: logs
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Как работает logrotate и в чём разница между `create` и `copytruncate`?
  answer: |
    `create` переименовывает старый файл и создаёт новый — приложение обязано
    переоткрыть лог по сигналу, иначе продолжит писать в переименованный.
    `copytruncate` копирует содержимое и обрезает исходный файл, не требуя ничего
    от приложения, но рискует потерять записи в момент копирования.
  explanation: |
    Отсюда классический симптом: ротация «сработала», а место не освободилось —
    приложение держит открытым старый файл, и тот жив, пока процесс не перезапустят.
    `copytruncate` берут для программ, которые не умеют переоткрывать лог по сигналу,
    осознанно принимая риск потерять несколько строк.
  ref: "man 8 logrotate"
