# docker / dockerfile
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: docker-dockerfile-001
  domain: docker
  subtopic: dockerfile
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `RUN`, `CMD` и `ENTRYPOINT` отличаются друг от друга?
  answer: |
    `RUN` выполняется **при сборке** и создаёт слой. `ENTRYPOINT` — что запускается
    при старте контейнера. `CMD` — аргументы по умолчанию к нему либо команда,
    если `ENTRYPOINT` не задан.
  explanation: |
    Практическое разделение такое: `ENTRYPOINT` фиксирует, что это за контейнер,
    `CMD` даёт заменяемые по умолчанию параметры. Аргументы `docker run` заменяют
    `CMD`, но не `ENTRYPOINT` — отсюда и удобный шаблон «неизменяемая программа
    плюс настраиваемые аргументы».
  ref: "https://docs.docker.com/reference/dockerfile/"

- id: docker-dockerfile-002
  domain: docker
  subtopic: dockerfile
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `COPY` отличается от `ADD`?
  answer: |
    `COPY` просто копирует файлы из контекста. `ADD` дополнительно умеет
    распаковывать локальные архивы и скачивать по URL — и потому ведёт себя
    неочевидно.
  explanation: |
    Рекомендация однозначна: по умолчанию `COPY`, а `ADD` только когда осознанно
    нужна автоматическая распаковка. Скачивание по URL через `ADD` вдобавок плохо
    кешируется и не позволяет проверить контрольную сумму — для этого лучше
    явный `RUN curl` с проверкой.
  ref: "https://docs.docker.com/reference/dockerfile/"

- id: docker-dockerfile-003
  domain: docker
  subtopic: dockerfile
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем `ARG` отличается от `ENV`?
  answer: |
    `ARG` существует только **во время сборки** и в запущенный контейнер не попадает.
    `ENV` задаёт переменную окружения, которая остаётся в образе и видна процессу
    при запуске.
  explanation: |
    Разница важна для секретов, но не так, как кажется: `ARG` не виден в окружении
    контейнера, зато **остаётся в истории образа** и извлекается командой `history`.
    То есть ни один из них не годится для передачи паролей — для этого существуют
    секреты BuildKit, которые не попадают ни в слои, ни в историю.
  ref: "https://docs.docker.com/reference/dockerfile/"

- id: docker-dockerfile-004
  domain: docker
  subtopic: dockerfile
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое multi-stage build и зачем он нужен?
  answer: |
    Несколько секций `FROM` в одном Dockerfile: в первой собирают, из последней
    получается образ. Готовый артефакт копируется через `COPY --from=`, а компилятор
    и зависимости сборки в финальный образ не попадают.
  explanation: |
    Выигрыш двойной: размер образа падает в разы, и вместе с инструментами сборки
    исчезает большая часть поверхности атаки — компилятор, пакетный менеджер,
    исходники. Это же решает старую дилемму «собирать в образе или снаружи»:
    сборка воспроизводима внутри Docker, а результат остаётся минимальным.
  ref: "https://docs.docker.com/build/building/multi-stage/"

- id: docker-dockerfile-005
  domain: docker
  subtopic: dockerfile
  difficulty: middle
  source: core
  type: mcq
  verified: false
  prompt: |
    `CMD app --flag` против `CMD ["app", "--flag"]`. Почему форма важна?
  options:
    a: "Первая запускает процесс через shell, и приложение не получит SIGTERM"
    b: "Первая не позволяет передать аргументы при запуске"
    c: "Вторая не поддерживает переменные окружения вовсе"
    d: "Разницы нет, это вопрос стиля"
  answer: a
  explanation: |
    Shell-форма оборачивает команду в `/bin/sh -c`, и PID 1 становится shell,
    а приложение — его потомком. Сигнал от `docker stop` или от Kubernetes приходит
    shell'у, тот его не пересылает, и приложение убивают жёстко по истечении grace
    period. Exec-форма делает приложение самим PID 1 — тогда `SIGTERM` доходит,
    и graceful shutdown работает.
  ref: "https://docs.docker.com/reference/dockerfile/"

- id: docker-dockerfile-006
  domain: docker
  subtopic: dockerfile
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что мешает сборке образа быть воспроизводимой?
  answer: |
    Плавающие теги базового образа, `apt install` без фиксации версий, скачивание
    по URL без проверки суммы, зависимость от текущей даты и от состояния сети.
    Один и тот же Dockerfile даёт разные образы в разные дни.
  explanation: |
    Отсюда компромисс, который приходится выбирать осознанно: жёсткая фиксация даёт
    воспроизводимость, но замораживает и уязвимости — значит нужен регулярный
    управляемый подъём версий. Полностью плавающие версии дают свежесть,
    но делают невозможным разбор инцидента «вчера собиралось, сегодня нет».
  ref: "https://docs.docker.com/build/building/best-practices/"

- id: docker-dockerfile-007
  domain: docker
  subtopic: dockerfile
  difficulty: junior
  source: core
  type: mcq
  verified: false
  prompt: |
    Что делает инструкция `EXPOSE 8080` в Dockerfile?
  options:
    a: "Ничего не публикует — это документация и подсказка для инструментов"
    b: "Открывает порт 8080 на хосте при запуске контейнера"
    c: "Разрешает контейнеру слушать порт 8080"
    d: "Пробрасывает порт в другие контейнеры сети"
  answer: a
  explanation: |
    Порт публикует только `-p` при запуске или `-P`, который использует `EXPOSE`
    как список кандидатов. Само по себе объявление ничего не меняет: контейнер
    слушает те порты, что открыло приложение, независимо от Dockerfile. Ценность
    инструкции в другом — она сообщает читателю и оркестратору, какие порты
    предполагаются рабочими.
  ref: "https://docs.docker.com/reference/dockerfile/"

- id: docker-dockerfile-008
  domain: docker
  subtopic: dockerfile
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему `WORKDIR /app` лучше, чем `RUN cd /app`?
  answer: |
    Каждая инструкция `RUN` выполняется в отдельном процессе, и смена каталога в ней
    не переживает переход к следующей. `WORKDIR` задаёт рабочий каталог для всех
    последующих инструкций и для запуска контейнера.
  explanation: |
    Это проявление общего свойства: слои независимы, и «состояние оболочки»
    между ними не сохраняется — то же касается переменных, заданных через `export`.
    Постоянные значения задаются инструкциями `ENV` и `WORKDIR`, а не командами
    внутри `RUN`.
  ref: "https://docs.docker.com/reference/dockerfile/"

- id: docker-dockerfile-009
  domain: docker
  subtopic: dockerfile
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем образу метки `org.opencontainers.image.*`?
  answer: |
    Это стандартные метки происхождения: исходный репозиторий, коммит, версия, дата
    сборки, лицензия. Проставляются в CI инструкцией `LABEL` и читаются
    через `docker inspect`.
  explanation: |
    Практическая ценность в инциденте: по работающему контейнеру за секунды
    восстанавливается, из какого коммита он собран, — без этого приходится
    сопоставлять теги с историей вручную. Стандартные имена важны потому, что
    их понимают чужие инструменты: сканеры, каталоги образов, панели кластера.
  ref: "https://github.com/opencontainers/image-spec/blob/main/annotations.md"

- id: docker-dockerfile-010
  domain: docker
  subtopic: dockerfile
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему `docker commit` считают антипаттерном?
  answer: |
    Он делает образ из состояния работающего контейнера. Такой образ невоспроизводим:
    нет Dockerfile, неизвестно, что и в каком порядке в нём выполняли, ревью
    и сканирование опираться не на что.
  explanation: |
    Это ровно та же граница, что между императивным `kubectl edit` и декларативным
    манифестом: получившееся состояние существует, но не описано. Уместен `commit`
    в одном случае — зафиксировать состояние сломанного контейнера, чтобы разобрать
    его позже, то есть как инструмент отладки, а не сборки.
  ref: "https://docs.docker.com/reference/cli/docker/container/commit/"

- id: docker-dockerfile-011
  domain: docker
  subtopic: dockerfile
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает инструкция `USER` и почему её ставят в конце Dockerfile?
  answer: |
    Задаёт пользователя, от которого выполняются последующие инструкции и запускается
    контейнер. В конце — потому что установка пакетов и правка системных каталогов
    обычно требуют root.
  explanation: |
    Порядок отражает разделение времени сборки и времени работы: привилегии нужны
    первому, но не второму. Важная деталь — пользователь должен существовать
    в образе: `USER appuser` без предварительного создания даст ошибку запуска.
    В Kubernetes это дополняется требованием `runAsNonRoot`, которое проверяет
    результат.
  ref: "https://docs.docker.com/reference/dockerfile/"

- id: docker-dockerfile-012
  domain: docker
  subtopic: dockerfile
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Как запустить в контейнере другую команду, если задан `ENTRYPOINT`?
  answer: |
    Аргументы `docker run` заменяют только `CMD`. Чтобы подменить сам entrypoint,
    нужен флаг `--entrypoint`, например `--entrypoint sh`.
  explanation: |
    Это регулярно нужно при отладке: образ спроектирован запускать одно приложение,
    а надо заглянуть внутрь. Отсюда же понятно, зачем разделять две инструкции:
    `ENTRYPOINT` фиксирует, что это за контейнер, `CMD` даёт заменяемые аргументы
    по умолчанию — и подмена аргументов не требует особых флагов, а подмена
    программы требует.
  ref: "https://docs.docker.com/reference/dockerfile/"
