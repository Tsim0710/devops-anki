- id: docker-layers-cache-001
  domain: docker
  subtopic: layers-cache
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Как работает кеш сборки и когда он инвалидируется?
  answer: |
    Каждая инструкция даёт слой; если инструкция и её входные данные не изменились,
    берётся готовый слой. Как только один слой инвалидирован, **все последующие**
    пересобираются заново.
  explanation: |
    Каскадность и определяет всю стратегию написания Dockerfile: редко меняющееся
    ставят выше, часто меняющееся — ниже. Отсюда же следует, что перестановка двух
    строк местами способна превратить сборку из десяти секунд в десять минут,
    ничего не изменив по существу.
  ref: "https://docs.docker.com/build/cache/"

- id: docker-layers-cache-002
  domain: docker
  subtopic: layers-cache
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Почему манифест зависимостей копируют и ставят **до** копирования исходников?
  answer: |
    Потому что зависимости меняются редко, а код — постоянно. Слой с установкой
    зависимостей остаётся в кеше, пока не изменился файл манифеста, и каждая сборка
    экономит самый долгий шаг.
  explanation: |
    Порядок `COPY package.json` → `RUN install` → `COPY .` — это применение общего
    правила о каскадности кеша, а не частный трюк конкретной экосистемы. Тот же
    приём работает для `go.mod`, `requirements.txt`, `pom.xml`: сначала манифест,
    потом установка, потом остальное.
  ref: "https://docs.docker.com/build/cache/"

- id: docker-layers-cache-003
  domain: docker
  subtopic: layers-cache
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Почему `apt update` и `apt install` пишут одной инструкцией?
  answer: |
    Иначе слой с `update` закешируется, а `install` в следующем слое пересоберётся
    и будет ставить пакеты по **устаревшему** индексу — вплоть до ошибки
    «версия не найдена».
  explanation: |
    Это частный случай общей проблемы: кеш слоёв не знает про смысл команд и считает
    неизменную строку неизменным результатом. В той же инструкции обычно чистят
    списки пакетов, потому что удаление их отдельным слоем размера образа
    не уменьшит — файлы останутся в предыдущем слое.
  ref: "https://docs.docker.com/build/building/best-practices/"

- id: docker-layers-cache-004
  domain: docker
  subtopic: layers-cache
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Секрет попал в образ, и его удалили следующей инструкцией. Достаточно ли этого?
  answer: |
    Нет. Слой, в котором файл появился, остаётся в образе — его содержимое
    извлекается из истории. Удаление в следующем слое лишь скрывает файл
    из итогового дерева.
  explanation: |
    То же самое верно для размера: `RUN rm -rf` после установки ничего не экономит,
    если установка была отдельным слоем. Правильные решения разные: для размера —
    выполнять создание и удаление в одной инструкции или использовать multi-stage,
    для секретов — не давать им попадать в слои вовсе, через монтируемые секреты
    BuildKit. Скомпрометированный секрет в любом случае ротируют.
  ref: "https://docs.docker.com/build/building/secrets/"
