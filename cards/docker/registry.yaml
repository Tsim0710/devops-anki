# docker / registry
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: docker-registry-001
  domain: docker
  subtopic: registry
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое registry и как устроено полное имя образа?
  answer: |
    Хранилище образов. Полное имя — `registry/namespace/image:tag`. Если реестр
    не указан, подставляется Docker Hub, поэтому `nginx` означает
    `docker.io/library/nginx:latest`.
  explanation: |
    Неявная подстановка объясняет неприятный класс инцидентов: сборка, работавшая
    годами, ломается из-за лимитов Docker Hub или из-за того, что образ с таким же
    коротким именем нашёлся в другом месте. В проде реестр указывают явно,
    а базовые образы зеркалируют к себе.
  ref: "https://docs.docker.com/registry/"

- id: docker-registry-002
  domain: docker
  subtopic: registry
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Образ в реестре пересобрали под тем же тегом, а на узле остался старый. Почему?
  answer: |
    Локальный кеш: при политике «тянуть, если нет» узел не проверяет реестр,
    раз образ с таким именем у него уже есть. Тег — изменяемая метка, и одно имя
    начинает означать разное на разных машинах.
  explanation: |
    Отсюда симптом «на одном узле работает, на другом нет» при одинаковом манифесте.
    Правильное решение не в том, чтобы всегда тянуть заново — это делает реестр
    точкой отказа при каждом старте, — а в неизменяемых тегах или digest,
    когда одно имя навсегда означает одно содержимое.
  ref: "https://docs.docker.com/reference/cli/docker/image/pull/"

- id: docker-registry-003
  domain: docker
  subtopic: registry
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Реестр разрастается. Что чистить и чем это опасно?
  answer: |
    Политикой хранения удаляют старые теги, затем сборкой мусора — слои, на которые
    больше никто не ссылается. Опасность в том, что удалённый образ может
    использоваться работающими подами и понадобиться при следующем перезапуске.
  explanation: |
    Слои общие между образами, поэтому «удалить старый тег» и «освободить место» —
    разные операции: место высвобождает только сборка мусора. Практическое правило —
    хранить всё, на что могут ссылаться откаты, и чистить по возрасту с запасом,
    сверяясь с тем, какие образы реально запущены в кластерах.
  ref: "https://docs.docker.com/registry/garbage-collection/"
