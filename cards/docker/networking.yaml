# docker / networking
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.
# Базовая механика контейнерных сетей (netns, veth, мост, -p как DNAT, DNS
# в пользовательских сетях, overlay) живёт в домене networks / container-networking.
# Здесь — только то, что специфично для Docker как инструмента.

- id: docker-networking-001
  domain: docker
  subtopic: networking
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Контейнеру нужно обратиться к сервису, работающему на самом хосте.
    Как это сделать переносимо?
  answer: |
    Через специальное имя `host.docker.internal`, которое на Linux требует явного
    сопоставления: `--add-host=host.docker.internal:host-gateway`. Адрес `127.0.0.1`
    внутри контейнера указывает на сам контейнер, а не на хост.
  explanation: |
    Ошибка с `localhost` — самая частая при подключении к базе, запущенной рядом:
    у контейнера свой сетевой namespace, и его loopback принадлежит ему. Прописывать
    адрес моста руками нельзя — он меняется, поэтому и понадобился специальный
    псевдоним, который Docker подставляет сам.
  ref: "https://docs.docker.com/engine/network/"

- id: docker-networking-002
  domain: docker
  subtopic: networking
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что даёт подключение контейнера к нескольким сетям и сетевые алиасы?
  answer: |
    Контейнер получает по интерфейсу и адресу в каждой сети и виден в них
    по своему имени и по дополнительным алиасам. Так строят изоляцию:
    например, база доступна только приложению, а наружу смотрит один прокси.
  explanation: |
    Это способ сегментировать стек без файрвола: сервис, не подключённый к сети,
    физически не имеет до неё маршрута. Алиасы полезны при миграциях — новый
    контейнер отвечает на старое имя, и конфигурацию клиентов не нужно трогать.
    Ту же роль в кластере играют NetworkPolicy и имена Service.
  ref: "https://docs.docker.com/engine/network/"

- id: docker-networking-003
  domain: docker
  subtopic: networking
  difficulty: senior
  source: core
  type: mcq
  verified: false
  prompt: |
    На хосте настроен ufw, все порты кроме 22 закрыты. Запустили контейнер
    с `-p 8080:80`. Кто увидит порт 8080 из интернета?
  options:
    a: "Все: Docker пишет свои правила в netfilter раньше правил ufw"
    b: "Никто: ufw блокирует порт независимо от Docker"
    c: "Только адреса из белого списка ufw"
    d: "Никто, пока порт не разрешён и в ufw, и в Docker"
  answer: a
  explanation: |
    Docker добавляет правила DNAT в цепочку `PREROUTING`, которая проходится **до**
    того, как пакет попадёт в цепочки ufw для входящего трафика. Поэтому публикация
    порта фактически обходит настройку хостового файрвола, а администратор считает
    сервис закрытым. Правильное решение — публиковать на конкретный интерфейс
    (`-p 127.0.0.1:8080:80`) и не полагаться на ufw как на единственный рубеж.
  ref: "https://docs.docker.com/engine/network/packet-filtering-firewalls/"
