# docker / security
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: docker-security-001
  domain: docker
  subtopic: security
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему процесс в контейнере не стоит запускать от root?
  answer: |
    Потому что root внутри контейнера — это **тот же uid 0**, что на хосте. Выход
    за периметр контейнера при любой уязвимости даёт права суперпользователя
    на машине.
  explanation: |
    Изоляция контейнера обеспечивается namespaces и cgroups, а не отдельной ОС:
    ядро общее. Отсюда практика — инструкция `USER` в Dockerfile с непривилегированным
    пользователем и, где возможно, user namespace, при котором root внутри
    соответствует обычному пользователю снаружи.
  ref: "https://docs.docker.com/engine/security/"

- id: docker-security-002
  domain: docker
  subtopic: security
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Пароль передали в сборку через `--build-arg`. Где он окажется?
  answer: |
    В истории образа: `docker history` покажет значение аргумента. В окружение
    контейнера он не попадёт, но извлечь его из опубликованного образа сможет любой.
  explanation: |
    Это ловушка ложной безопасности: `ARG` действительно не виден процессу в рантайме,
    и потому кажется безопасным. Правильный механизм — секреты BuildKit, которые
    монтируются только на время выполнения инструкции и не оставляют следов
    ни в слоях, ни в истории. Уже утёкший секрет ротируют, а не «удаляют из образа».
  ref: "https://docs.docker.com/build/building/secrets/"

- id: docker-security-003
  domain: docker
  subtopic: security
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему доступ к `/var/run/docker.sock` равен root на хосте?
  answer: |
    Через сокет можно запустить контейнер с любыми правами — привилегированный,
    с монтированием корня хоста, с namespace хоста. То есть получить полный доступ
    к машине, не имея его напрямую.
  explanation: |
    Отсюда следует, что «дать пользователю docker-группу» равнозначно выдаче sudo
    без пароля. Тот же вывод применим к CI-агентам и контейнерам мониторинга,
    которым сокет прокидывают «только на чтение»: чтения достаточно, чтобы
    прочитать чужие переменные окружения и конфигурацию.
  ref: "https://docs.docker.com/engine/security/"

- id: docker-security-004
  domain: docker
  subtopic: security
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Образ прошёл сканирование месяц назад. Достаточно ли этого?
  answer: |
    Нет: уязвимости находят непрерывно, и вчера чистый образ сегодня может содержать
    критическую. Сканирование — это снимок на момент проверки, а не свойство образа.
  explanation: |
    Отсюда два обязательных процесса: периодическая пересборка даже без изменений
    в коде и повторное сканирование того, что уже в проде, а не только на этапе CI.
    Без первого приложение годами едет на базовом слое позапрошлого года,
    без второго об уязвимости узнают из новостей.
  ref: "https://docs.docker.com/scout/"

- id: docker-security-005
  domain: docker
  subtopic: security
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что даёт rootless-режим Docker и чем за него платишь?
  answer: |
    Демон и контейнеры работают от обычного пользователя через user namespace:
    компрометация не даёт root на хосте. Плата — ограничения с портами ниже 1024,
    сетевые режимы работают не все, часть возможностей и производительности теряется.
  explanation: |
    Это тот же размен, что везде в безопасности: снижаем радиус поражения ценой
    удобства. Rootless особенно уместен там, где сборка и запуск выполняют
    недоверенный код — на CI-агентах и машинах разработчиков, — и менее оправдан
    на выделенных узлах с контролируемой нагрузкой.
  ref: "https://docs.docker.com/engine/security/rootless/"

- id: docker-security-006
  domain: docker
  subtopic: security
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает seccomp-профиль Docker по умолчанию?
  answer: |
    Запрещает контейнеру заметную часть системных вызовов — те, что почти никогда
    не нужны приложениям, но полезны для атаки на ядро. Профиль применяется
    автоматически, если его не отключили.
  explanation: |
    Это дешёвая защита: поверхность атаки на ядро сужается, а типовые приложения
    ничего не замечают. Ломается она обычно там, где контейнеру действительно нужен
    редкий вызов — у отладчиков и профилировщиков. Правильная реакция — выдать
    точечную возможность, а не отключать профиль целиком через `--privileged`.
  ref: "https://docs.docker.com/engine/security/seccomp/"

- id: docker-security-007
  domain: docker
  subtopic: security
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что даёт userns-remap на уровне демона?
  answer: |
    Отображает пользователей контейнеров в непривилегированный диапазон uid хоста:
    root внутри контейнера соответствует обычному пользователю снаружи. Работает
    для всех контейнеров сразу.
  explanation: |
    Отличие от rootless-режима в том, что сам демон остаётся привилегированным —
    защищаются контейнеры, а не хостовый процесс Docker. Плата привычная: тома
    и bind mount требуют согласования владельцев, потому что uid на диске
    и uid внутри контейнера теперь разные. Это тот же механизм, что user namespace
    в Kubernetes.
  ref: "https://docs.docker.com/engine/security/userns-remap/"

- id: docker-security-008
  domain: docker
  subtopic: security
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Как дать контейнеру доступ к конкретному устройству, не включая `--privileged`?
  answer: |
    Флагом `--device /dev/xxx` — он пробрасывает одно устройство. Для GPU
    используют специальный runtime и `--gpus`, который делает то же самое
    вместе с нужными библиотеками.
  explanation: |
    Разница в радиусе: `--privileged` открывает все устройства и снимает seccomp
    и AppArmor разом, `--device` даёт ровно один узел устройства. Это общий принцип
    работы с привилегиями в контейнерах — точечное разрешение вместо отключения
    защиты целиком, тот же подход, что с `--cap-add` против полного набора прав.
  ref: "https://docs.docker.com/reference/cli/docker/container/run/"
