# docker / images
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: docker-images-001
  domain: docker
  subtopic: images
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем образ отличается от контейнера?
  answer: |
    Образ — неизменяемый шаблон из слоёв, лежащий на диске. Контейнер — запущенный
    экземпляр: те же слои только для чтения плюс тонкий слой записи и процесс.
  explanation: |
    Отношение то же, что между исполняемым файлом и процессом. Отсюда два следствия:
    из одного образа можно запустить сколько угодно контейнеров, и они разделят слои,
    экономя место; а всё, что контейнер записал в свой слой, исчезнет вместе с ним —
    для сохранения нужен том.
  ref: "https://docs.docker.com/get-started/overview/"

- id: docker-images-002
  domain: docker
  subtopic: images
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое слой образа и почему слои неизменяемы?
  answer: |
    Слой — набор изменений файловой системы от одной инструкции сборки. Он
    идентифицируется хешем содержимого, поэтому изменить его нельзя: изменение даёт
    другой хеш, то есть другой слой.
  explanation: |
    Неизменяемость даёт и переиспользование, и кеш: одинаковые слои разных образов
    хранятся в одном экземпляре и не скачиваются заново. Она же объясняет главную
    ловушку размера — удаление файла в следующем слое не убирает его из предыдущего,
    и образ не худеет.
  ref: "https://docs.docker.com/build/guide/layers/"

- id: docker-images-003
  domain: docker
  subtopic: images
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем тег отличается от digest?
  answer: |
    Тег — изменяемая метка: его можно переназначить на другой образ. Digest —
    хеш содержимого, он неизменен и однозначно определяет конкретный образ.
  explanation: |
    Отсюда практический вывод: `app:1.2.3` не гарантирует одинакового содержимого
    в разное время и в разных местах, а `app@sha256:...` гарантирует. Именно поэтому
    для воспроизводимости и защиты от подмены в реестре в манифесты выносят digest,
    который обычно подставляет CI.
  ref: "https://docs.docker.com/engine/reference/commandline/pull/"

- id: docker-images-004
  domain: docker
  subtopic: images
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    В чём подвох перехода на alpine ради размера образа?
  answer: |
    Alpine использует musl вместо glibc. Часть бинарников и библиотек ведёт себя иначе
    или не работает вовсе, а у некоторых языков заметно меняется производительность
    работы с DNS и памятью.
  explanation: |
    Размер образа стоит того, чтобы за него бороться, но не любой ценой: типичные
    сюрпризы — падения на нативных расширениях Python, странная работа резолва,
    отсутствие привычных утилит при отладке. Часто разумнее slim-вариант на glibc
    или distroless: последний даёт минимальный размер и минимум уязвимостей,
    но требует отладки через ephemeral-контейнеры.
  ref: "https://docs.docker.com/build/building/best-practices/"

- id: docker-images-005
  domain: docker
  subtopic: images
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое контекст сборки и зачем нужен `.dockerignore`?
  answer: |
    Контекст — каталог, который целиком отправляется демону перед сборкой.
    `.dockerignore` исключает из него лишнее: `.git`, `node_modules`, локальные артефакты.
  explanation: |
    Без него сборка сначала долго передаёт сотни мегабайт, которые не нужны, а потом
    ещё и ломает кеш: любое изменение в исключённых файлах меняет контекст.
    Отдельный риск безопасности — попадание в образ через `COPY .` того, что
    не собирались публиковать: файлов окружения, ключей, истории git.
  ref: "https://docs.docker.com/build/building/context/"

- id: docker-images-006
  domain: docker
  subtopic: images
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое multi-arch образ и как один тег работает на amd64 и arm64?
  answer: |
    За тегом стоит manifest list — список образов под разные архитектуры. Клиент
    при скачивании выбирает подходящий вариант по своей платформе.
  explanation: |
    Механизм стал повседневным с распространением arm — на ноутбуках Apple и в облаке.
    Отсюда типичная авария: образ, собранный локально на arm, падает на amd64-узлах
    с невнятной ошибкой формата. Решается сборкой под обе платформы в CI, а не
    на машине разработчика.
  ref: "https://docs.docker.com/build/building/multi-platform/"

- id: docker-images-007
  domain: docker
  subtopic: images
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Дали чужой образ без Dockerfile. Как понять, что внутри и как он собран?
  answer: |
    `docker history` покажет инструкции сборки послойно, `docker inspect` —
    entrypoint, переменные, порты и метки. Содержимое достаётся распаковкой слоёв
    через `docker save`, а состав пакетов — сканером или запросом SBOM.
  explanation: |
    История сборки восстанавливается почти полностью, и это работает в обе стороны:
    так же легко из чужого образа достаётся то, что туда попало по неосторожности —
    ключи, файлы окружения, история git. Отсюда практическое правило: считать
    опубликованный образ полностью читаемым и не полагаться на то, что удалённый
    в следующем слое файл исчез.
  ref: "https://docs.docker.com/build/attestations/"

- id: docker-images-008
  domain: docker
  subtopic: images
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что на самом деле означает тег `latest`?
  answer: |
    Ничего особенного: это обычный тег, который подставляется по умолчанию, если
    тег не указан. Он **не** означает «самая свежая версия» — его назначают вручную,
    и он может указывать на что угодно.
  explanation: |
    Отсюда обманчивость привычной строки `FROM ubuntu`: она означает `ubuntu:latest`,
    то есть то, что автор образа решил так пометить. В проде это даёт невоспроизводимые
    сборки и невозможность понять, что именно работало вчера, — поэтому теги пинят,
    а лучше используют digest.
  ref: "https://docs.docker.com/engine/reference/commandline/tag/"

- id: docker-images-009
  domain: docker
  subtopic: images
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Откуда берутся образы `<none>:<none>` в выводе `docker images`?
  answer: |
    Это dangling-образы: слои, потерявшие тег после пересборки под тем же именем.
    Старый образ остаётся без имени, но занимает место. Убираются
    `docker image prune`.
  explanation: |
    Появляются они при каждой пересборке с тем же тегом — тег переезжает на новый
    образ, а прежний остаётся сиротой. На машине сборки это главный источник
    расхода диска. Полезно различать: `prune` без флагов трогает только dangling,
    а `prune -a` удалит и все образы без запущенных контейнеров.
  ref: "https://docs.docker.com/reference/cli/docker/image/prune/"

- id: docker-images-010
  domain: docker
  subtopic: images
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Как доставлять образы в среду без доступа в интернет?
  answer: |
    Либо через внутренний реестр-зеркало, куда образы предварительно синхронизируются,
    либо переносом файлов: `docker save` в архив и `docker load` на месте.
  explanation: |
    Зеркало предпочтительнее: сохраняются digest и подписи, работают обычные
    манифесты без правок, и обновление образов остаётся управляемым процессом.
    Перенос архивами быстро становится неуправляемым — нет истории, легко привезти
    не ту версию, и каждая доставка ручная. Отдельная деталь: манифесты должны
    ссылаться на адрес зеркала, иначе узлы всё равно пойдут наружу.
  ref: "https://docs.docker.com/registry/recipes/mirror/"

- id: docker-images-011
  domain: docker
  subtopic: images
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает `docker system prune` и чем он опасен?
  answer: |
    Удаляет остановленные контейнеры, неиспользуемые сети, dangling-образы и кеш
    сборки. С флагом `-a` — вообще все образы без запущенных контейнеров,
    с `--volumes` — ещё и тома с данными.
  explanation: |
    Опасность в слове «неиспользуемый»: оно означает «нет **запущенного** контейнера»,
    а не «не нужен». На машине разработки это освобождает десятки гигабайт,
    на сервере — способно унести данные остановленного сервиса и заставить заново
    качать все образы. Отсюда практика — чистить точечными командами, а не общей.
  ref: "https://docs.docker.com/reference/cli/docker/system/prune/"

- id: docker-images-012
  domain: docker
  subtopic: images
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Сборка из одного и того же коммита даёт разные digest. Почему и что с этим делают?
  answer: |
    В слои попадают времена изменения файлов и метки времени сборки. Чтобы получить
    одинаковый результат, времена фиксируют — например через `SOURCE_DATE_EPOCH` —
    и убирают всё, что зависит от момента сборки.
  explanation: |
    Практическая ценность не в эстетике: одинаковый digest позволяет доказать,
    что образ в реестре собран именно из этого исходного кода, и сравнить сборку,
    сделанную независимо. Это основа проверяемой цепочки поставок — без
    воспроизводимости подпись подтверждает лишь то, что образ собрал ты,
    но не то, из чего.
  ref: "https://docs.docker.com/build/building/best-practices/"
