# docker / images
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: docker-images-001
  domain: docker
  subtopic: images
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем образ отличается от контейнера?
  answer: |
    Образ — неизменяемый шаблон из слоёв, лежащий на диске. Контейнер — запущенный
    экземпляр: те же слои только для чтения плюс тонкий слой записи и процесс.
  explanation: |
    Отношение то же, что между исполняемым файлом и процессом. Отсюда два следствия:
    из одного образа можно запустить сколько угодно контейнеров, и они разделят слои,
    экономя место; а всё, что контейнер записал в свой слой, исчезнет вместе с ним —
    для сохранения нужен том.
  ref: "https://docs.docker.com/get-started/overview/"

- id: docker-images-002
  domain: docker
  subtopic: images
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое слой образа и почему слои неизменяемы?
  answer: |
    Слой — набор изменений файловой системы от одной инструкции сборки. Он
    идентифицируется хешем содержимого, поэтому изменить его нельзя: изменение даёт
    другой хеш, то есть другой слой.
  explanation: |
    Неизменяемость даёт и переиспользование, и кеш: одинаковые слои разных образов
    хранятся в одном экземпляре и не скачиваются заново. Она же объясняет главную
    ловушку размера — удаление файла в следующем слое не убирает его из предыдущего,
    и образ не худеет.
  ref: "https://docs.docker.com/build/guide/layers/"

- id: docker-images-003
  domain: docker
  subtopic: images
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем тег отличается от digest?
  answer: |
    Тег — изменяемая метка: его можно переназначить на другой образ. Digest —
    хеш содержимого, он неизменен и однозначно определяет конкретный образ.
  explanation: |
    Отсюда практический вывод: `app:1.2.3` не гарантирует одинакового содержимого
    в разное время и в разных местах, а `app@sha256:...` гарантирует. Именно поэтому
    для воспроизводимости и защиты от подмены в реестре в манифесты выносят digest,
    который обычно подставляет CI.
  ref: "https://docs.docker.com/engine/reference/commandline/pull/"

- id: docker-images-004
  domain: docker
  subtopic: images
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    В чём подвох перехода на alpine ради размера образа?
  answer: |
    Alpine использует musl вместо glibc. Часть бинарников и библиотек ведёт себя иначе
    или не работает вовсе, а у некоторых языков заметно меняется производительность
    работы с DNS и памятью.
  explanation: |
    Размер образа стоит того, чтобы за него бороться, но не любой ценой: типичные
    сюрпризы — падения на нативных расширениях Python, странная работа резолва,
    отсутствие привычных утилит при отладке. Часто разумнее slim-вариант на glibc
    или distroless: последний даёт минимальный размер и минимум уязвимостей,
    но требует отладки через ephemeral-контейнеры.
  ref: "https://docs.docker.com/build/building/best-practices/"

- id: docker-images-005
  domain: docker
  subtopic: images
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое контекст сборки и зачем нужен `.dockerignore`?
  answer: |
    Контекст — каталог, который целиком отправляется демону перед сборкой.
    `.dockerignore` исключает из него лишнее: `.git`, `node_modules`, локальные артефакты.
  explanation: |
    Без него сборка сначала долго передаёт сотни мегабайт, которые не нужны, а потом
    ещё и ломает кеш: любое изменение в исключённых файлах меняет контекст.
    Отдельный риск безопасности — попадание в образ через `COPY .` того, что
    не собирались публиковать: файлов окружения, ключей, истории git.
  ref: "https://docs.docker.com/build/building/context/"

- id: docker-images-006
  domain: docker
  subtopic: images
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое multi-arch образ и как один тег работает на amd64 и arm64?
  answer: |
    За тегом стоит manifest list — список образов под разные архитектуры. Клиент
    при скачивании выбирает подходящий вариант по своей платформе.
  explanation: |
    Механизм стал повседневным с распространением arm — на ноутбуках Apple и в облаке.
    Отсюда типичная авария: образ, собранный локально на arm, падает на amd64-узлах
    с невнятной ошибкой формата. Решается сборкой под обе платформы в CI, а не
    на машине разработчика.
  ref: "https://docs.docker.com/build/building/multi-platform/"

- id: docker-images-007
  domain: docker
  subtopic: images
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Дали чужой образ без Dockerfile. Как понять, что внутри и как он собран?
  answer: |
    `docker history` покажет инструкции сборки послойно, `docker inspect` —
    entrypoint, переменные, порты и метки. Содержимое достаётся распаковкой слоёв
    через `docker save`, а состав пакетов — сканером или запросом SBOM.
  explanation: |
    История сборки восстанавливается почти полностью, и это работает в обе стороны:
    так же легко из чужого образа достаётся то, что туда попало по неосторожности —
    ключи, файлы окружения, история git. Отсюда практическое правило: считать
    опубликованный образ полностью читаемым и не полагаться на то, что удалённый
    в следующем слое файл исчез.
  ref: "https://docs.docker.com/build/attestations/"
