# docker / compose
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: docker-compose-001
  domain: docker
  subtopic: compose
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Что даёт compose поверх обычного `docker run`?
  answer: |
    Декларативное описание набора сервисов в одном файле: образы, сети, тома,
    переменные, зависимости. Одна команда поднимает весь стек, и конфигурация
    версионируется вместе с кодом.
  explanation: |
    Ключевое отличие — не удобство, а воспроизводимость: длинная команда `docker run`
    живёт в чьей-то истории оболочки, а `compose.yaml` лежит в репозитории и одинаков
    у всех. Дополнительно он сам создаёт пользовательскую сеть проекта, поэтому
    сервисы сразу видят друг друга по именам.
  ref: "https://docs.docker.com/compose/"

- id: docker-compose-002
  domain: docker
  subtopic: compose
  difficulty: middle
  source: core
  type: mcq
  verified: false
  prompt: |
    Приложение падает при старте, потому что база ещё не готова, хотя
    `depends_on` указан. Почему?
  options:
    a: "`depends_on` ждёт запуска контейнера, а не готовности сервиса внутри него"
    b: "`depends_on` работает только в swarm-режиме"
    c: "Порядок в `depends_on` обратный указанному"
    d: "`depends_on` игнорируется, если сервисы в разных сетях"
  answer: a
  explanation: |
    Запуск контейнера и готовность процесса внутри — разные события: база стартовала,
    но ещё инициализирует данные и не слушает порт. Решения два: условие
    `service_healthy` вместе с `healthcheck` у зависимости либо, что надёжнее,
    повторные попытки подключения в самом приложении. Второе полезно и в кластере,
    где порядок запуска не гарантируется вовсе.
  ref: "https://docs.docker.com/compose/how-tos/startup-order/"

- id: docker-compose-003
  domain: docker
  subtopic: compose
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему compose не используют в проде?
  answer: |
    Он привязан к одному хосту: нет планирования по узлам, нет автоматического
    восстановления после отказа машины, нет выката без даунтайма и масштабирования
    по нагрузке.
  explanation: |
    Разница та же, что между «сделать сейчас» и «поддерживать всегда»: compose
    описывает желаемое состояние, но приводит к нему только в момент запуска команды.
    Для одного сервера с некритичным сервисом этого достаточно, и тогда compose
    честнее кластера. Как только появляется требование переживать отказ узла,
    нужен оркестратор.
  ref: "https://docs.docker.com/compose/"
