# docker / buildkit
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: docker-buildkit-001
  domain: docker
  subtopic: buildkit
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что BuildKit даёт по сравнению со старым сборщиком?
  answer: |
    Параллельное выполнение независимых стадий, кеш-маунты для каталогов пакетных
    менеджеров, секреты, не попадающие в слои, и удалённый кеш, который можно
    переиспользовать между запусками CI.
  explanation: |
    Старый сборщик выполнял инструкции строго последовательно и знал только один вид
    кеша — слои. BuildKit строит граф зависимостей и потому распараллеливает
    multi-stage сборки. А кеш-маунт решает задачу, которую слоями решить нельзя:
    сохранить кеш загруженных пакетов между сборками, не оставляя его в образе.
  ref: "https://docs.docker.com/build/buildkit/"

- id: docker-buildkit-002
  domain: docker
  subtopic: buildkit
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    В CI каждая сборка идёт с нуля, потому что раннер одноразовый. Что делать?
  answer: |
    Использовать удалённый кеш: экспортировать его в реестр и импортировать
    в следующей сборке (`--cache-to` и `--cache-from`). Тогда чистый раннер
    получает результаты предыдущих сборок.
  explanation: |
    Проблема возникает из того, что кеш слоёв локален для демона, а одноразовые
    раннеры — норма в CI. Внешний кеш переносит его в общее хранилище. Тонкость:
    кеш тоже занимает место и требует политики хранения, а его «промах» стоит
    времени скачивания — поэтому кешируют дорогие шаги, а не всё подряд.
  ref: "https://docs.docker.com/build/cache/backends/"

- id: docker-buildkit-003
  domain: docker
  subtopic: buildkit
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Как собирать образы внутри Kubernetes, не монтируя сокет рантайма?
  answer: |
    Инструментами, которым демон не нужен: Kaniko, BuildKit в непривилегированном
    режиме, Buildah. Они собирают образ в обычном поде и пушат его в реестр.
  explanation: |
    Монтирование сокета рантайма в под сборки равносильно выдаче root на узле —
    а сборка почти всегда выполняет код из репозитория, то есть потенциально
    недоверенный. Именно поэтому «просто прокинуть docker.sock» — самый быстрый
    способ получить дыру, и именно поэтому появился целый класс безсокетных
    сборщиков.
  ref: "https://docs.docker.com/build/buildkit/"

- id: docker-buildkit-004
  domain: docker
  subtopic: buildkit
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что даёт `RUN --mount=type=cache` и чем это лучше кеша слоёв?
  answer: |
    Монтирует постоянный каталог кеша пакетного менеджера на время выполнения
    инструкции. Он переживает пересборки, но **не попадает в образ** —
    в отличие от всего, что оставил после себя обычный `RUN`.
  explanation: |
    Кеш слоёв решает другую задачу: он либо переиспользует инструкцию целиком, либо
    выполняет её с нуля. Кеш-маунт даёт промежуточный вариант — инструкция
    выполняется, но не скачивает заново уже загруженное. Отсюда типовое применение:
    каталоги `~/.m2`, `~/.cache/pip`, `/var/cache/apt` — экономия минут на каждой
    сборке без роста образа.
  ref: "https://docs.docker.com/build/cache/optimize/"

- id: docker-buildkit-005
  domain: docker
  subtopic: buildkit
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему в кластерах Kubernetes нет Docker, но образы Docker работают?
  answer: |
    Kubelet общается с рантаймом по CRI, и в проде это обычно containerd. Docker —
    инструмент сборки и управления, а формат образов стандартизован в OCI,
    поэтому запускать их может любой совместимый рантайм.
  explanation: |
    Отсюда практические следствия. На узле нет команды `docker` — смотреть контейнеры
    надо через `crictl`. Сборка образов в кластере не может опираться на демон
    Docker, потому что его там нет, — и это ещё одна причина существования
    безсокетных сборщиков.
  ref: "https://kubernetes.io/docs/concepts/architecture/cri/"
