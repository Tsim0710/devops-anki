# docker / volumes
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: docker-volumes-001
  domain: docker
  subtopic: volumes
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем named volume отличается от bind mount?
  answer: |
    Named volume управляется Docker: он живёт в его каталоге, переносим и не зависит
    от структуры хоста. Bind mount подключает **конкретный путь хоста** — удобно
    для разработки, но привязывает контейнер к машине.
  explanation: |
    Отсюда и распределение ролей: bind mount для локальной разработки, когда нужно
    видеть правки кода мгновенно; volume для данных, которые должны пережить
    пересоздание контейнера. Bind mount вдобавок приносит проблемы с правами,
    потому что владельцы файлов на хосте и в контейнере сравниваются по числам.
  ref: "https://docs.docker.com/storage/"

- id: docker-volumes-002
  domain: docker
  subtopic: volumes
  difficulty: junior
  source: core
  type: basic
  verified: false
  prompt: |
    Контейнер пересоздали, и данные пропали. Почему?
  answer: |
    Всё, что записано в слой контейнера, живёт ровно столько, сколько сам контейнер.
    Данные обязаны лежать в томе — иначе они исчезают при любом пересоздании,
    включая обновление образа.
  explanation: |
    Это следствие слоистой модели, а не ошибка: контейнер задуман одноразовым.
    Отсюда практическое правило — считать всё, что не в томе, потерянным, и заранее
    отвечать на вопрос, где хранится состояние. Ровно та же логика лежит в основе
    отношения Kubernetes к подам.
  ref: "https://docs.docker.com/storage/"

- id: docker-volumes-003
  domain: docker
  subtopic: volumes
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Приложение в контейнере не может писать в примонтированный каталог хоста.
    Что проверять?
  answer: |
    Числовые uid и gid: ядро сравнивает числа, а не имена. Процесс в контейнере
    работает под своим uid, а файлы на хосте принадлежат другому — совпадать должны
    именно идентификаторы.
  explanation: |
    Отсюда типичная картина: файлы, созданные контейнером, на хосте принадлежат
    «непонятно кому», и наоборот. Решения — запускать контейнер с нужным uid,
    выровнять права на каталоге или использовать named volume, где Docker готовит
    права сам. В Kubernetes ту же задачу решают `runAsUser` и `fsGroup`.
  ref: "https://docs.docker.com/storage/bind-mounts/"

- id: docker-volumes-004
  domain: docker
  subtopic: volumes
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Когда нужен tmpfs-том?
  answer: |
    Когда данные не должны попадать на диск: расшифрованные секреты, временные файлы
    с чувствительным содержимым, кеши, которым нужна скорость. Том живёт в памяти
    и исчезает вместе с контейнером.
  explanation: |
    Плата очевидна и о ней забывают: содержимое занимает оперативную память
    и учитывается в лимите контейнера — заполнил такой том, получил OOM. Причина
    при этом выглядит совершенно не связанной: приложение памяти не ест, утечки нет,
    а процесс убит. Точно так же ведёт себя `emptyDir` с `medium: Memory` в Kubernetes.
  ref: "https://docs.docker.com/storage/tmpfs/"
