# k8s / config-secrets
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki. Путь файла на группировку не влияет.

- id: k8s-config-secrets-001
  domain: k8s
  subtopic: config-secrets
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Какими двумя способами ConfigMap или Secret попадают в контейнер?
  answer: |
    Переменными окружения (`env` / `envFrom`) и файлами через том (`volumeMounts`).
    Выбор способа определяет главное — обновится ли значение без рестарта пода.
  explanation: |
    Это не вопрос вкуса: env впаивается в процесс при старте и не меняется никогда,
    а файлы в томе kubelet обновляет на живом поде. Отсюда практическое правило —
    скалярные настройки, которые всё равно требуют рестарта, можно через env;
    целые конфиг-файлы и то, что должно перечитываться на лету, — только томом.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-002
  domain: k8s
  subtopic: config-secrets
  difficulty: junior
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Secret шифрует свои данные?
  answer: |
    Нет. Значения хранятся в base64 — это кодирование, а не шифрование, и разворачивается
    одной командой. Шифрование в etcd включается отдельно администратором кластера.
  explanation: |
    Реальные отличия Secret от ConfigMap лежат в другом: он не светится в выводе по
    умолчанию, у него есть типы, kubelet держит его в tmpfs, и на него отдельно
    навешивается RBAC. То есть Secret — это про **разграничение доступа**, а не про
    криптографию. Кто может читать Secret'ы в namespace, тот видит их открытым текстом.
  ref: "https://kubernetes.io/docs/concepts/configuration/secret/"

- id: k8s-config-secrets-003
  domain: k8s
  subtopic: config-secrets
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает `envFrom` в отличие от `env` с `valueFrom`?
  answer: |
    `envFrom` втягивает **весь** ConfigMap или Secret целиком: каждый ключ становится
    переменной окружения с тем же именем. `env` + `valueFrom` берёт один конкретный ключ.
  explanation: |
    `envFrom` короче, но делает состав переменных неявным — по манифесту пода уже
    не видно, что именно в него приезжает, и добавление ключа в ConfigMap молча меняет
    окружение приложения. Плюс ключи, не подходящие под правила имён переменных,
    молча пропускаются. Для секретов явное перечисление обычно предпочтительнее.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-004
  domain: k8s
  subtopic: config-secrets
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем у Secret есть поле `type` и какие типы встречаются чаще всего?
  answer: |
    Тип задаёт ожидаемый набор ключей и позволяет Kubernetes использовать секрет
    по назначению. Чаще всего: `Opaque` (произвольные данные, по умолчанию),
    `kubernetes.io/tls` (ключи `tls.crt` и `tls.key`), `kubernetes.io/dockerconfigjson`
    (доступ к приватному registry).
  explanation: |
    Тип — это контракт: Ingress ждёт от TLS-секрета именно `tls.crt` и `tls.key`
    и с произвольным Opaque работать не станет, а `imagePullSecrets` требует
    dockerconfigjson. Плюс API валидирует состав ключей при создании, то есть ошибка
    ловится сразу, а не в момент, когда под не смог подтянуть образ.
  ref: "https://kubernetes.io/docs/concepts/configuration/secret/"

- id: k8s-config-secrets-005
  domain: k8s
  subtopic: config-secrets
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как под получает доступ к образу из приватного registry?
  answer: |
    Через `imagePullSecrets` в спеке пода (или в ServiceAccount, под которым он
    запускается) — ссылку на Secret типа `kubernetes.io/dockerconfigjson`.
  explanation: |
    Тянет образ **kubelet**, а не приложение, поэтому секрет нужен до старта контейнера
    и читается с узла. Прописывать его в ServiceAccount удобнее: тогда он автоматически
    применяется ко всем подам namespace и его не надо копировать в каждый манифест.
    Симптом отсутствия — `ImagePullBackOff` с ошибкой авторизации в событиях пода.
  ref: "https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/"

- id: k8s-config-secrets-006
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Ты поменял значение в ConfigMap. Под его использует. Когда изменение доедет?
  options:
    a: "Через env — сразу; через том — только после рестарта пода"
    b: "Через env — никогда без рестарта; через том — kubelet обновит файл с задержкой"
    c: "И то и другое обновится сразу, kubelet следит за обоими"
    d: "Ни то ни другое: ConfigMap читается один раз при создании пода"
  answer: b
  explanation: |
    Переменные окружения задаются процессу при `exec` и после этого физически
    неизменяемы — ни Kubernetes, ни кто-либо ещё не может подменить окружение живому
    процессу. Файлы в томе — это симлинки, которые kubelet периодически переставляет
    на новую версию, поэтому там обновление происходит, но не мгновенно.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-007
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Файл из ConfigMap обновился в томе. Значит ли это, что приложение подхватило
    новый конфиг?
  answer: |
    Нет. Обновился только файл на диске. Перечитает ли его приложение — целиком вопрос
    к приложению: умеет ли оно следить за файлом или перезагружаться по сигналу.
  explanation: |
    Это две независимые границы, и их постоянно склеивают в одну. Большинство сервисов
    читают конфиг один раз при старте, поэтому обновлённый файл лежит рядом
    и никем не замечен. Отсюда стандартный приём: аннотация с хешем конфига
    в pod-template — меняется конфиг, меняется аннотация, Deployment катит новые поды.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-008
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему файл, примонтированный через `subPath`, перестаёт обновляться?
  answer: |
    Потому что `subPath` монтирует **конкретный файл**, а не каталог. Механизм обновления
    работает через подмену симлинка внутри каталога тома — при `subPath` этой ссылки нет,
    и файл замерзает на версии, которая была при старте пода.
  explanation: |
    Ловушка в том, что `subPath` берут ровно там, где он ломает: чтобы положить один
    файл в каталог с чужим содержимым (`/etc/nginx/nginx.conf`) и не затереть остальное.
    Обходной путь — монтировать каталог целиком в отдельное место и делать симлинк
    самому, либо смириться и катить поды при смене конфига.
  ref: "https://kubernetes.io/docs/concepts/storage/volumes/"

- id: k8s-config-secrets-009
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что произойдёт с содержимым `/etc/nginx`, если примонтировать туда том с одним файлом?
  answer: |
    Всё, что было в этом каталоге в образе, станет недоступно: монтирование **закрывает
    каталог целиком**, оставляя видимым только содержимое тома.
  explanation: |
    Это обычная семантика mount в Linux, а не особенность Kubernetes: точка монтирования
    перекрывает то, что лежало под ней. Симптом — приложение не находит файлов, которые
    точно есть в образе. Решения два: `subPath` для подмены одного файла (ценой потери
    авто-обновления) или монтирование в пустой каталог.
  ref: "https://kubernetes.io/docs/concepts/storage/volumes/"

- id: k8s-config-secrets-010
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как заставить приложение увидеть новый конфиг, если оно читает его только при старте?
  answer: |
    Положить хеш конфига в аннотацию pod-template Deployment. Меняется ConfigMap →
    меняется аннотация → меняется pod-template → Deployment катит новые поды штатным
    rolling update.
  explanation: |
    Deployment реагирует только на изменение своего pod-template — правка ConfigMap
    для него невидима, поэтому сам по себе выкат не начнётся. Аннотация с хешем делает
    внешнее изменение видимым в шаблоне. В Helm это `checksum/config` в аннотациях,
    и такая строка есть почти в каждом приличном чарте.
  ref: "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/"

- id: k8s-config-secrets-011
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Под завис в `ContainerCreating`. Как это связано с ConfigMap и Secret?
  answer: |
    Скорее всего под ссылается на несуществующий ConfigMap или Secret. Планирование
    прошло, узел выбран, но kubelet не может смонтировать том и ждёт — бесконечно,
    пока объект не появится.
  explanation: |
    Ждать, а не падать, — сознательное решение: объект может появиться через секунду,
    и убивать под из-за гонки при развёртывании неправильно. Цена в том, что симптом
    молчаливый: в логах пусто, потому что контейнер даже не стартовал. Причина всегда
    видна в `kubectl describe pod`, в событиях, прямым текстом.
  ref: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/"

- id: k8s-config-secrets-012
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    В `env.valueFrom.configMapKeyRef` опечатка в имени ключа. Что будет с подом?
  answer: |
    Под **не запустится**: kubelet не сможет собрать окружение и остановится
    с `CreateContainerConfigError`. Дефолт не подставляется.
  explanation: |
    Kubernetes не угадывает намерения: ссылка на несуществующий ключ — это ошибка
    конфигурации, а не повод стартовать с пустым значением. Поведение можно смягчить
    флагом `optional: true` — тогда переменная просто не появится, и ответственность
    за отсутствующее значение переходит приложению.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-013
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что даёт `immutable: true` у ConfigMap и Secret?
  answer: |
    Запрещает изменять `data` — объект можно только удалить и создать заново. Взамен
    kubelet перестаёт следить за ним и снимает нагрузку с apiserver.
  explanation: |
    В большом кластере каждый под с примонтированным ConfigMap держит watch на apiserver;
    на десятках тысяч подов это заметная нагрузка. Неизменяемость её убирает. Побочный
    эффект полезен сам по себе: конфиг перестаёт незаметно меняться под работающими
    подами, а новая версия требует нового объекта и явного выката.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-014
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Почему секреты лучше монтировать томом, чем прокидывать через `env`?
  answer: |
    Переменные окружения утекают слишком легко: они видны в `kubectl describe pod`,
    в дампах при краше, в логах стартующего приложения, наследуются дочерними процессами
    и попадают в системы отчётов об ошибках.
  explanation: |
    Файл в томе доступен только процессу, который его открыл, лежит в tmpfs
    (то есть не попадает на диск узла) и обновляется без рестарта пода. Окружение же
    по своей природе глобально для процесса и путешествует вниз по дереву процессов —
    ровно то поведение, которого от секрета не хочется.
  ref: "https://kubernetes.io/docs/concepts/configuration/secret/"

- id: k8s-config-secrets-015
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    ConfigMap удалили, а под с ним продолжает работать. Почему и что сломается дальше?
  answer: |
    Работающий контейнер уже получил свои данные: env впаян в процесс, файлы тома лежат
    у kubelet локально. Сломается при **следующем** старте пода — новый под не сможет
    смонтировать том и зависнет в `ContainerCreating`.
  explanation: |
    Это классическая отложенная поломка: кластер выглядит здоровым ровно до первого
    выката, перепланирования или рестарта узла, а потом сервис не поднимается, и связь
    с давним удалением объекта уже неочевидна. Отсюда правило — состояние кластера
    держать в git, а не править объекты руками.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"

- id: k8s-config-secrets-016
  domain: k8s
  subtopic: config-secrets
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что даёт шифрование Secret'ов at rest в etcd и от чего оно **не** защищает?
  answer: |
    Защищает от чтения секретов из файлов или бэкапов etcd — данные лежат
    зашифрованными. Не защищает от того, у кого есть доступ к API: apiserver
    расшифровывает их прозрачно, и `kubectl get secret` вернёт открытый текст.
  explanation: |
    Это ровно один слой из четырёх, на которых держится защита: RBAC (кто может читать),
    шифрование at rest (что лежит на диске), доступ к узлам (kubelet держит секреты
    в tmpfs) и способ доставки в под (файл против env). Ни один из них не заменяет
    остальные, а без первого шифрование почти бесполезно.
  ref: "https://kubernetes.io/docs/tasks/administer-cluster/encrypt-data/"

- id: k8s-config-secrets-017
  domain: k8s
  subtopic: config-secrets
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему токен ServiceAccount в поде теперь короткоживущий и что такое `audience`?
  answer: |
    Токен монтируется как projected volume, kubelet сам его продлевает, а при удалении
    пода он становится невалидным. `audience` ограничивает, **кому** токен предъявляется:
    выданный для внешнего сервиса не подойдёт к apiserver.
  explanation: |
    Раньше токен был вечным Secret'ом: утёк один раз — действителен всегда, отозвать
    можно только пересозданием ServiceAccount. Привязка ко времени и к аудитории
    превращает утечку из катастрофы в инцидент с ограниченным сроком. Тот же механизм
    лежит в основе federation с облачным IAM — под получает токен с audience облака
    и меняет его на облачные права без единого статического ключа.
  ref: "https://kubernetes.io/docs/concepts/security/service-accounts/"

- id: k8s-config-secrets-018
  domain: k8s
  subtopic: config-secrets
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужны External Secrets или Secrets Store CSI, если Secret уже есть в кластере?
  answer: |
    Чтобы источником правды был внешний менеджер секретов (Vault, облачный Secret
    Manager), а кластер получал значения оттуда. Это даёт ротацию, аудит доступа
    и единое хранилище на все окружения — и позволяет не держать секреты в git.
  explanation: |
    Родной Secret решает задачу доставки, но не жизненного цикла: он не умеет ни
    ротироваться сам, ни рассказать, кто и когда его читал. Отсюда же вечная проблема
    GitOps — манифест Secret нельзя положить в репозиторий как есть. Два подхода
    различаются механикой: External Secrets синхронизирует внешнее хранилище в обычный
    Secret, CSI-драйвер монтирует значения в под напрямую, не создавая объект в API.
  ref: "https://kubernetes.io/docs/concepts/storage/volumes/"

- id: k8s-config-secrets-019
  domain: k8s
  subtopic: config-secrets
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Есть ли ограничение на размер ConfigMap и Secret?
  answer: |
    Да, 1 MiB на объект. Ограничение идёт от etcd, который не рассчитан на хранение
    крупных значений.
  explanation: |
    Отсюда правило: ConfigMap — для конфигурации, а не для данных. Попытка положить
    туда датасет, сертификаты пачкой или бинарник упрётся в отказ при создании либо,
    что хуже, раздует etcd и замедлит весь кластер — ведь каждое изменение объекта
    рассылается всем, кто на него подписан. Крупное содержимое кладут в том,
    в образ или во внешнее хранилище.
  ref: "https://kubernetes.io/docs/concepts/configuration/configmap/"
