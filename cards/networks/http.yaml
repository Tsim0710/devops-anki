# networks / http
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: networks-http-001
  domain: networks
  subtopic: http
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Из чего состоит HTTP-запрос и HTTP-ответ?
  answer: |
    Запрос: метод и путь, заголовки, необязательное тело. Ответ: статус-код,
    заголовки, тело. Заголовки — это метаданные, тело — сами данные.
  explanation: |
    Разделение объясняет возможности L7-балансировщиков и прокси: они читают
    стартовую строку и заголовки, чтобы принять решение о маршрутизации, не трогая
    тело. Оно же объясняет, почему `Host` обязателен в HTTP/1.1 — без него сервер
    не знает, какой из размещённых на нём сайтов запрашивают.
  ref: "sources/networks.md#M10"

- id: networks-http-002
  domain: networks
  subtopic: http
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что означают классы статус-кодов 2xx, 3xx, 4xx, 5xx?
  answer: |
    2xx — успех; 3xx — перенаправление, нужно сходить ещё куда-то; 4xx — ошибка
    на стороне клиента (запрос неверен или не разрешён); 5xx — сервер не смог
    обработать корректный запрос.
  explanation: |
    Граница между 4xx и 5xx — это граница ответственности, и потому она важнее
    остальных: 4xx означает «чини запрос», 5xx — «чини сервер». Отсюда практический
    смысл мониторинга по классам: рост 5xx — инцидент, рост 4xx — чаще смена
    поведения клиентов или чужой сканер.
  ref: "sources/networks.md#M10"

- id: networks-http-003
  domain: networks
  subtopic: http
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем `401` отличается от `403`?
  answer: |
    `401 Unauthorized` — ты не представился или представился неверно, аутентификация
    не пройдена. `403 Forbidden` — тебя опознали, но прав на это действие нет.
  explanation: |
    Разница указывает, куда идти чинить: в первом случае — к учётным данным, токену
    или сессии, во втором — к правам доступа. Ровно ту же пару смыслов имеют ответы
    apiserver Kubernetes, и вопрос на собеседовании часто задают именно для проверки
    этого различения.
  ref: "sources/networks.md#M10"

- id: networks-http-004
  domain: networks
  subtopic: http
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Прокси вернул `504`, а не `502`. Что это говорит об upstream?
  options:
    a: "Upstream не ответил вовремя — соединение установилось, ответа не дождались"
    b: "Upstream вернул некорректный ответ или разорвал соединение"
    c: "Upstream недоступен: соединение вообще не установилось"
    d: "Кончились свободные соединения в пуле прокси"
  answer: a
  explanation: |
    `504 Gateway Timeout` — истёк таймаут ожидания: сервер жив и принял запрос,
    но не успел, значит смотреть надо на медленные запросы, блокировки в базе,
    насыщение пула. `502 Bad Gateway` — ответ получен, но негодный: не тот протокол,
    обрыв, мусор. Первый уводит в производительность, второй в конфигурацию.
  ref: "sources/networks.md#M10"

- id: networks-http-005
  domain: networks
  subtopic: http
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем `301` опасен по сравнению с `302`?
  answer: |
    `301` — постоянный редирект, и браузеры кешируют его надолго, иногда до очистки
    данных сайта. Ошибочный `301` продолжает уводить пользователей и после того,
    как его убрали с сервера.
  explanation: |
    Отменить его на стороне сервера нельзя — решение уже принято на клиенте.
    Отсюда практика: во время миграций и экспериментов ставят `302`, а `301` включают
    только когда переезд окончателен. Побочный эффект приятный — поисковые системы
    переносят вес страницы именно по `301`.
  ref: "sources/networks.md#M10"

- id: networks-http-006
  domain: networks
  subtopic: http
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как работает пара `ETag` и код `304`?
  answer: |
    Сервер отдаёт `ETag` — метку версии ресурса. При следующем запросе клиент
    присылает её в `If-None-Match`, и если ресурс не изменился, сервер отвечает
    `304 Not Modified` **без тела**.
  explanation: |
    Экономится трафик, но не круговой обмен: запрос всё равно уходит. Поэтому `304`
    и `Cache-Control: max-age` решают разные задачи — второй позволяет вообще
    не ходить на сервер. Отсюда типовая связка: длинный `max-age` для файлов
    с версией в имени и валидация по `ETag` для остального.
  ref: "sources/networks.md#M10"

- id: networks-http-007
  domain: networks
  subtopic: http
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем `no-cache` отличается от `no-store` в `Cache-Control`?
  answer: |
    `no-cache` разрешает **хранить** копию, но требует каждый раз проверять
    её актуальность у сервера. `no-store` запрещает хранить вообще — ни в браузере,
    ни на промежуточных прокси.
  explanation: |
    Названия обманчивы, и их путают постоянно: запрещает кеширование именно `no-store`.
    Разница практическая — для страницы с личными данными нужен `no-store`, иначе
    копия останется в кеше браузера на общем компьютере или на прокси.
    Для часто меняющегося, но не секретного контента правильный выбор — `no-cache`.
  ref: "sources/networks.md#M10"

- id: networks-http-008
  domain: networks
  subtopic: http
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делают флаги cookie `Secure`, `HttpOnly` и `SameSite`?
  answer: |
    `Secure` — отправлять только по HTTPS. `HttpOnly` — скрыть от JavaScript.
    `SameSite` — ограничить отправку при переходах с чужих сайтов
    (`Strict`, `Lax`, `None`).
  explanation: |
    Каждый флаг закрывает свой класс атак: `Secure` — перехват по открытому каналу,
    `HttpOnly` — кражу через XSS, `SameSite` — подделку межсайтовых запросов.
    Важная деталь: `SameSite=None` обязан идти вместе с `Secure`, иначе современные
    браузеры такую cookie отвергнут.
  ref: "sources/networks.md#M10"

- id: networks-http-009
  domain: networks
  subtopic: http
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Браузер пишет «заблокировано политикой CORS». Где ошибка и где чинить?
  answer: |
    Ошибку показывает **браузер**, а чинится она на **сервере**: он должен вернуть
    заголовок `Access-Control-Allow-Origin` с разрешённым источником. Сам запрос
    при этом обычно доходит и выполняется.
  explanation: |
    CORS — защита пользователя браузером, а не защита сервера: `curl` тех же
    ограничений не имеет и работает. Отсюда типовое расхождение «из консоли работает,
    из фронта нет». Стоит помнить и про предварительный запрос `OPTIONS`: нестандартные
    заголовки или методы вызывают его, и он тоже должен получить корректный ответ.
  ref: "sources/networks.md#M10"

- id: networks-http-010
  domain: networks
  subtopic: http
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое origin и считается ли поддомен тем же origin?
  answer: |
    Origin — это тройка «схема + хост + порт». Поддомен `api.example.com` — **другой**
    origin относительно `example.com`, как и переход с HTTP на HTTPS или смена порта.
  explanation: |
    Строгость определения и есть причина большинства неожиданных срабатываний CORS:
    визуально «тот же сайт» с точки зрения браузера совершенно другой источник.
    Cookie при этом живут по другим правилам — по домену, а не по origin, — и это
    вторая половина путаницы.
  ref: "sources/networks.md#M10"

- id: networks-http-011
  domain: networks
  subtopic: http
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что HTTP/2 дал сверх 1.1 и какое ограничение осталось?
  answer: |
    Мультиплексирование: много параллельных запросов в одном соединении, плюс сжатие
    заголовков и бинарный формат. Осталась блокировка на уровне TCP — потеря одного
    пакета тормозит **все** потоки в соединении.
  explanation: |
    Проблема переехала уровнем ниже: HTTP/2 устранил очередь на уровне приложения,
    но TCP по-прежнему обязан доставить байты по порядку, и дырка в потоке
    останавливает всё. Именно это и стало причиной появления HTTP/3.
  ref: "sources/networks.md#M10"

- id: networks-http-012
  domain: networks
  subtopic: http
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    На чём работает HTTP/3 и что это меняет?
  answer: |
    На QUIC поверх **UDP**, а не TCP. Потоки независимы, поэтому потеря пакета
    тормозит только свой поток; рукопожатие и TLS объединены, что экономит круговые
    обмены; соединение переживает смену IP клиента.
  explanation: |
    Последнее особенно заметно на мобильных: переход с Wi-Fi на сотовую сеть
    не разрывает сессию, потому что соединение опознаётся идентификатором, а не
    четвёркой адресов. Практическая ловушка при диагностике — увидев UDP в дампе,
    не спешить объявлять это HTTP/3: на UDP работают DNS, QUIC, VPN и многое другое.
  ref: "sources/networks.md#M10"

- id: networks-http-013
  domain: networks
  subtopic: http
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что означает `429` и чем правильный ответ на него отличается от простого повтора?
  answer: |
    `429 Too Many Requests` — превышен лимит. Правильная реакция — прочитать
    `Retry-After` и подождать указанное время, а при его отсутствии повторять
    с экспоненциальной задержкой и случайным разбросом.
  explanation: |
    Немедленный повтор усугубляет ситуацию, а синхронные повторы множества клиентов
    дают лавину в одни и те же моменты — отсюда необходимость случайного разброса.
    Это тот же ретрай-шторм, что в service mesh: механизм устойчивости без ограничения
    превращается в средство самоусиления отказа.
  ref: "sources/networks.md#M10"

- id: networks-http-014
  domain: networks
  subtopic: http
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    WebSocket не устанавливается через прокси, хотя обычные запросы проходят.
    Почему?
  answer: |
    WebSocket начинается с обычного HTTP-запроса с заголовками `Upgrade`
    и `Connection`. Прокси обязан их пропустить и перейти в режим туннеля;
    многие по умолчанию этого не делают и вырезают заголовки.
  explanation: |
    Отсюда и характер симптома: соединение не «висит», а возвращает обычный ответ
    вместо переключения протокола. Вторая половина проблемы — таймауты: после
    апгрейда соединение долгое и малоактивное, поэтому прокси с коротким временем
    простоя рвёт его через минуту, и это выглядит как нестабильность приложения.
  ref: "sources/networks.md#M10"

- id: networks-http-015
  domain: networks
  subtopic: http
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Какие HTTP-запросы можно безопасно повторять при таймауте, а какие нет?
  answer: |
    Безопасно — идемпотентные: `GET`, `PUT`, `DELETE`, `HEAD`. Небезопасно — `POST`:
    он может создать второй объект, потому что таймаут не означает, что запрос
    не выполнился.
  explanation: |
    Ключевая мысль: отсутствие ответа ничего не говорит о том, что произошло
    на сервере — запрос мог отработать, а потеряться уже ответ. Отсюда стандартное
    решение для небезопасных операций — ключ идемпотентности, который клиент
    передаёт с запросом, а сервер использует, чтобы распознать повтор. Автоматические
    ретраи на балансировщике настраивают с оглядкой ровно на это.
  ref: "sources/networks.md#M10"

- id: networks-http-016
  domain: networks
  subtopic: http
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что делает HSTS и почему список preload считают операцией без обратного хода?
  answer: |
    Заголовок велит браузеру ходить на домен **только** по HTTPS в течение заданного
    срока. Preload зашивает домен прямо в браузеры, и удаление из списка расходится
    месяцами, вместе с их обновлениями.
  explanation: |
    Механизм закрывает окно уязвимости при первом заходе по HTTP, но требование
    становится жёстким: сломанный или просроченный сертификат нельзя обойти
    даже вручную — страница просто недоступна. Поэтому HSTS включают с малого срока,
    наращивают его постепенно, и только потом рассматривают preload, помня,
    что поддомены тоже попадут под правило.
  ref: "sources/networks.md#M9"
