- id: networks-proxy-cdn-001
  domain: networks
  subtopic: proxy-cdn
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем forward proxy отличается от reverse proxy?
  answer: |
    Forward стоит на стороне **клиента** и представляет его перед миром: через него
    выходят в интернет, на нём фильтруют и логируют. Reverse стоит на стороне
    **сервера** и представляет его перед клиентами: они вообще не знают,
    что за ним стоит.
  explanation: |
    Различие в том, чьи интересы обслуживает посредник и кто о нём знает. Клиент
    настраивает forward proxy у себя явно; про reverse proxy он не подозревает —
    для него это и есть сервер. Отсюда и типовые применения: корпоративный контроль
    исходящего трафика против терминации TLS, балансировки и кеширования на входе.
  ref: "sources/networks.md#M11"

- id: networks-proxy-cdn-002
  domain: networks
  subtopic: proxy-cdn
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает CDN?
  answer: |
    Держит копии контента на серверах, физически близких к пользователю, и отдаёт
    их вместо обращения к origin. Запрос за первой копией идёт к origin,
    дальше отвечает край сети.
  explanation: |
    Выигрыш в первую очередь по задержке, а не по полосе: скорость света задаёт
    минимальный RTT, и никакой канал этого не обойдёт — помогает только сокращение
    расстояния. Второй эффект не менее важен: origin перестаёт быть узким местом,
    потому что до него доходит малая доля запросов.
  ref: "sources/networks.md#M11"

- id: networks-proxy-cdn-003
  domain: networks
  subtopic: proxy-cdn
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Как работает anycast и что определяет, кто ответит?
  answer: |
    Один и тот же IP анонсируется по BGP из множества точек. Отвечает та, до которой
    маршрут «ближе» **по метрике маршрутизации** — то есть по политике провайдеров,
    а не по географии.
  explanation: |
    Отсюда наблюдаемые странности: из Москвы можно попасть в точку присутствия
    во Франкфурте, потому что так проложены маршруты у твоего провайдера. Anycast
    даёт заодно устойчивость — падение точки означает исчезновение её анонса,
    и трафик автоматически перетекает в соседнюю. На нём работают публичные DNS и CDN.
  ref: "sources/networks.md#M11"

- id: networks-proxy-cdn-004
  domain: networks
  subtopic: proxy-cdn
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Кто решает, сколько CDN будет держать копию, и как её сбросить принудительно?
  answer: |
    Решает **origin** заголовками `Cache-Control` и `ETag` — CDN им подчиняется.
    Принудительно копия сбрасывается инвалидацией через API или панель CDN.
  explanation: |
    Отсюда правило эксплуатации: поведение кеша настраивается на своей стороне,
    а не «в CDN». И отсюда же стандартный приём против инвалидаций — версия в имени
    файла: новый URL просто не имеет копии, поэтому не нужно ничего сбрасывать,
    а старые версии остаются доступными для тех, у кого закеширована старая страница.
  ref: "sources/networks.md#M11"

- id: networks-proxy-cdn-005
  domain: networks
  subtopic: proxy-cdn
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему сайт за CDN может отдавать разным пользователям разное содержимое,
    хотя origin один?
  answer: |
    Потому что копии в разных точках присутствия обновляются независимо. Пока
    у одного края копия свежая, у другого может лежать старая — до истечения её
    срока или инвалидации.
  explanation: |
    Это делает выкат статики распределённым во времени и объясняет жалобы вида
    «у меня старая версия, а у коллеги новая». Практический вывод — не считать
    выкат завершённым в момент обновления origin и не смешивать в одном ответе
    то, что кешируется, и то, что персонально: последнее закрывают заголовком `Vary`
    или отключением кеширования.
  ref: "sources/networks.md#M11"

- id: networks-proxy-cdn-006
  domain: networks
  subtopic: proxy-cdn
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Включил VPN — и сайт стал открываться медленнее и на чужом языке. Почему?
  answer: |
    Точка выхода VPN определила и географию, и маршрут: DNS отдал адрес ближайшей
    к **ней** точки CDN, а anycast увёл трафик туда же. Плюс добавился крюк
    до самого VPN-сервера.
  explanation: |
    Здесь сходятся три механизма: геопривязка по адресу клиента, выбор ближайшей точки
    присутствия и маршрутизация anycast. Все три опираются на то, откуда пришёл
    запрос, — а VPN меняет именно это. Поэтому «VPN замедляет интернет» обычно
    означает не узкий туннель, а разъехавшуюся географию.
  ref: "sources/networks.md#M11"

- id: networks-proxy-cdn-007
  domain: networks
  subtopic: proxy-cdn
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое origin shielding и какую проблему он решает?
  answer: |
    Промежуточный слой кеша между краевыми точками и origin: за недостающим объектом
    идут не все края независимо, а один shield. Origin получает один запрос
    вместо сотни.
  explanation: |
    Проблема возникает при инвалидации или истечении срока: все точки присутствия
    одновременно обнаруживают, что копии нет, и синхронно бьют в origin — небольшой
    внутренний вариант того же эффекта, что толпа клиентов после сброса кеша.
    Это ровно та же логика, что coalescing запросов в приложении: много одинаковых
    промахов схлопываются в один поход к источнику.
  ref: "sources/networks.md#M11"
