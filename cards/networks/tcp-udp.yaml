# networks / tcp-udp
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: networks-tcp-udp-001
  domain: networks
  subtopic: tcp-udp
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Из чего состоит трёхэтапное рукопожатие TCP?
  answer: |
    `SYN` от клиента → `SYN-ACK` от сервера → `ACK` от клиента. После этого соединение
    установлено, и обе стороны знают начальные номера последовательностей друг друга.
  explanation: |
    Три шага, а не два, нужны потому, что синхронизироваться должны **обе** стороны:
    каждая объявляет свой начальный номер и должна получить подтверждение. В том же
    `SYN` едет и объявление MSS — максимального размера сегмента, который сторона
    готова принять.
  ref: "sources/networks.md#M6"

- id: networks-tcp-udp-002
  domain: networks
  subtopic: tcp-udp
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что конкретно означает «TCP надёжен», а UDP нет?
  answer: |
    TCP нумерует байты, подтверждает получение, переспрашивает потерянное,
    восстанавливает порядок и управляет скоростью отправки. UDP просто отправляет
    датаграмму: ни подтверждений, ни повторов, ни порядка.
  explanation: |
    «Надёжность» — это конкретный набор механизмов, а не свойство канала: сеть теряет
    пакеты одинаково для обоих протоколов, разница в том, кто разбирается с потерей.
    Отсюда и область UDP: там, где повтор бесполезен или вреден — голос, видео,
    DNS-запрос, — проще переспросить самому, чем ждать восстановления.
  ref: "sources/networks.md#M6"

- id: networks-tcp-udp-003
  domain: networks
  subtopic: tcp-udp
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что означает состояние сокета `LISTEN`?
  answer: |
    Что процесс занял порт и готов принимать входящие соединения на конкретном адресе.
    Смотрится через `ss -ltnp` — там же видно, какой процесс и на каком адресе слушает.
  explanation: |
    Ключевая деталь — **на каком адресе**: `127.0.0.1:8080` доступен только с самого
    хоста, `0.0.0.0:8080` — со всех интерфейсов. Это одна из самых частых причин
    «порт открыт, но снаружи не отвечает», особенно в контейнерах, где localhost
    контейнера и localhost узла — разные вещи.
  ref: "sources/networks.md#M6"

- id: networks-tcp-udp-004
  domain: networks
  subtopic: tcp-udp
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Соединение отвечает `connection refused` немедленно. Что это доказывает?
  options:
    a: "Пакет доехал до хоста, но на этом порту никто не слушает"
    b: "Пакет не дошёл: его отбросили правилами по дороге"
    c: "Приложение приняло соединение и разорвало его"
    d: "Не разрешилось DNS-имя"
  answer: a
  explanation: |
    `Refused` — это активный отказ: ядро получателя ответило `RST`, потому что сокета
    в состоянии `LISTEN` на этом порту нет. Значит вся сеть до хоста исправна,
    и искать надо процесс: не запущен, слушает другой порт или только на `127.0.0.1`.
    Противоположный симптом — таймаут — означает тишину, то есть потерю пакета
    по дороге.
  ref: "sources/networks.md#M6"

- id: networks-tcp-udp-005
  domain: networks
  subtopic: tcp-udp
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем нужно состояние `TIME_WAIT` и сколько оно длится?
  answer: |
    Сторона, закрывшая соединение первой, держит четвёрку занятой примерно две минуты
    (2×MSS; в Linux порядка 60 секунд). Это гарантирует, что запоздавшие пакеты
    старого соединения не попадут в новое с той же четвёркой.
  explanation: |
    Побочный эффект важнее самой цели: сервер или клиент, открывающий и закрывающий
    тысячи коротких соединений в секунду, накапливает десятки тысяч записей
    `TIME_WAIT` и может исчерпать эфемерные порты. Лечится это не отключением
    механизма, а переиспользованием соединений — keep-alive и пулами.
  ref: "sources/networks.md#M6"

- id: networks-tcp-udp-006
  domain: networks
  subtopic: tcp-udp
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как объявляется MSS и почему он важен при туннелях?
  answer: |
    Каждая сторона объявляет свой MSS в `SYN` при установке соединения. Он выводится
    из MTU интерфейса, и если реальный путь имеет MTU меньше — например из-за обёртки
    туннеля — крупные сегменты не пройдут.
  explanation: |
    Опасность в том, что рукопожатие проходит успешно: `SYN` и `ACK` маленькие
    и пролезают всегда. Ломается передача данных — соединение устанавливается
    и зависает на первом крупном ответе. Отсюда и подпись симптома: мелкие запросы
    работают, крупные виснут без ошибки.
  ref: "sources/networks.md#M6"

- id: networks-tcp-udp-007
  domain: networks
  subtopic: tcp-udp
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое окно TCP и зачем понадобилось window scaling?
  answer: |
    Окно — сколько байт можно отправить, не дожидаясь подтверждения. Исходное поле
    в заголовке ограничено 64 КБ, чего мало для быстрых каналов с большой задержкой,
    поэтому появился множитель — window scaling.
  explanation: |
    Ограничение упирается в произведение полосы на задержку: на канале 100 Мбит/с
    с RTT 200 мс за время ожидания подтверждения «в полёте» должно быть куда больше
    64 КБ, иначе отправитель простаивает. Отсюда классический симптом медленного
    VPN или межконтинентального копирования при формально широком канале.
  ref: "sources/networks.md#M6"

- id: networks-tcp-udp-008
  domain: networks
  subtopic: tcp-udp
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как по дампу `tcpdump` понять, что произошло с попыткой соединения?
  answer: |
    `SYN` без ответа — пакет не дошёл или его отбросили (таймаут). `SYN` и в ответ
    `RST` — доехал, но порт закрыт. `SYN → SYN-ACK → ACK` — соединение установлено,
    и проблема выше, в приложении или в TLS.
  explanation: |
    Три сигнатуры делят пространство причин на три непересекающиеся области ещё
    до чтения логов приложения. Это самый быстрый способ понять, чья зона
    ответственности: сеть, хост или приложение — и он же самый убедительный аргумент
    в спорах «у нас всё работает».
  ref: "sources/networks.md#M6"

- id: networks-tcp-udp-009
  domain: networks
  subtopic: tcp-udp
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Почему DNS работает по UDP, но иногда переключается на TCP?
  answer: |
    UDP дешевле: запрос и ответ помещаются в одну датаграмму без рукопожатия.
    На TCP переходят, когда ответ не влезает в допустимый размер — тогда сервер
    ставит флаг усечения, и клиент повторяет запрос по TCP.
  explanation: |
    Так же работают передача зоны и запросы с большими ответами вроде DNSSEC. Знать
    это практично: файрвол, открывший только UDP/53, ломает ровно те запросы,
    у которых ответ велик — и симптом выглядит как «часть доменов не резолвится»,
    что уводит поиск совсем в другую сторону.
  ref: "sources/networks.md#M7"

- id: networks-tcp-udp-010
  domain: networks
  subtopic: tcp-udp
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое SYN flood и как от него защищаются?
  answer: |
    Атака полуоткрытыми соединениями: злоумышленник шлёт `SYN` и не отвечает `ACK`,
    заполняя очередь ожидающих. Защита — SYN cookies: сервер не хранит состояние
    до завершения рукопожатия, а кодирует его в номере последовательности.
  explanation: |
    Атака бьёт по асимметрии затрат: отправить `SYN` дёшево, а сервер обязан
    зарезервировать запись и ждать. SYN cookies убирают саму причину, устраняя
    хранение состояния. Тот же принцип встречается везде, где дешёвый запрос
    заставляет дорогую сторону что-то помнить.
  ref: "sources/networks.md#M6"

- id: networks-tcp-udp-011
  domain: networks
  subtopic: tcp-udp
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Соединение «оборвалось», но ни одна сторона не отправляла `FIN`. Как такое бывает?
  answer: |
    Промежуточное устройство — NAT или файрвол — выкинуло запись о соединении
    по таймауту простоя. Обе стороны считают соединение живым, но первый же пакет
    после паузы уходит в никуда или получает `RST`.
  explanation: |
    Именно поэтому долгие соединения — к базе, вебсокеты, туннели — требуют
    keepalive: периодический пустой пакет обновляет запись в таблице устройства.
    Симптом характерный: соединение работает, потом простой, потом мгновенная
    ошибка при первой же операции — и в логах это выглядит как случайный сбой сети.
  ref: "sources/networks.md#M6"

- id: networks-tcp-udp-012
  domain: networks
  subtopic: tcp-udp
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Приложение отдаёт данные мелкими порциями, и latency скачет.
    При чём тут алгоритм Nagle?
  answer: |
    Nagle придерживает мелкие сегменты, накапливая их до полного, а на другой стороне
    delayed ACK придерживает подтверждение. Вместе они дают паузы в десятки
    миллисекунд на пустом месте.
  explanation: |
    Каждый механизм по отдельности разумен: один экономит пакеты, другой — трафик
    подтверждений. Вместе получается ожидание друг друга. Отсюда `TCP_NODELAY`
    в интерактивных протоколах и играх. Общая мораль: оптимизации под пропускную
    способность и под задержку тянут в разные стороны, и выбирать надо осознанно.
  ref: "sources/networks.md#M6"
