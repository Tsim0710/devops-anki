# networks / ethernet-arp
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: networks-ethernet-arp-001
  domain: networks
  subtopic: ethernet-arp
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает ARP и как выглядит обмен?
  answer: |
    Переводит IP в MAC внутри одного L2-сегмента. Запрос уходит **широковещательно**
    («у кого адрес 10.0.0.5?»), ответ приходит **юникастом** от владельца адреса.
    Результат кладётся в ARP-кеш.
  explanation: |
    Без ARP кадр невозможно собрать: чтобы отправить пакет, нужен MAC получателя,
    а приложение оперирует только IP. Асимметрия запроса и ответа логична — спрашивать
    приходится у всех, потому что неизвестно, кто владелец, а отвечать нужно только
    спросившему.
  ref: "sources/networks.md#M3"

- id: networks-ethernet-arp-002
  domain: networks
  subtopic: ethernet-arp
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как устроен MAC-адрес?
  answer: |
    48 бит, обычно записывается шестью байтами в hex. Первые три байта — OUI,
    идентификатор производителя; остальные три назначает сам производитель.
  explanation: |
    Практическая польза от OUI — по началу адреса видно, чьё это железо или гипервизор,
    что помогает опознать неизвестное устройство в дампе. Второе важное свойство:
    MAC постоянен и принадлежит железу, тогда как IP арендуется. Отсюда и работает
    закрепление адреса за устройством в DHCP — оно делается именно по MAC.
  ref: "sources/networks.md#M3"

- id: networks-ethernet-arp-003
  domain: networks
  subtopic: ethernet-arp
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем switch отличается от хаба?
  answer: |
    Switch запоминает, за каким портом какой MAC, и отправляет кадр **только** в нужный
    порт. Хаб повторяет любой кадр во все порты сразу.
  explanation: |
    Отсюда два следствия. Производительность: у хаба все устройства делят одну среду
    и мешают друг другу, у switch каждый порт независим. Безопасность: на хабе любой
    сосед видит чужой трафик, поэтому хабы исчезли не только из-за скорости.
    Таблицу MAC switch строит сам, запоминая адрес источника входящих кадров.
  ref: "sources/networks.md#M3"

- id: networks-ethernet-arp-004
  domain: networks
  subtopic: ethernet-arp
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Хост `10.0.1.5/24` отправляет пакет на `8.8.8.8`. Чей MAC он спросит по ARP?
  options:
    a: "MAC своего шлюза по умолчанию"
    b: "MAC хоста 8.8.8.8"
    c: "Ничей — для внешних адресов ARP не используется"
    d: "MAC DNS-сервера, который резолвил имя"
  answer: a
  explanation: |
    Решение «свой или чужой» принимается **по маске**: `8.8.8.8` не попадает
    в `10.0.1.0/24`, значит пакет надо отдать шлюзу. ARP работает только в пределах
    своего L2-сегмента, и спрашивать MAC удалённого хоста бессмысленно — запрос туда
    не дойдёт. В кадре при этом будет MAC шлюза, а IP останется `8.8.8.8`:
    ровно та пара, которую путают, глядя на дамп.
  ref: "sources/networks.md#M3"

- id: networks-ethernet-arp-005
  domain: networks
  subtopic: ethernet-arp
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем broadcast отличается от flooding?
  answer: |
    Broadcast — это **намерение отправителя**: кадр с адресом `ff:ff:ff:ff:ff:ff`,
    предназначенный всем. Flooding — **поведение switch**: он рассылает кадр во все
    порты, потому что не знает, за каким портом искомый MAC.
  explanation: |
    Разные слои принятия решения: в первом случае «всем» решил отправитель, во втором —
    коммутатор от незнания. Flooding прекращается, как только адресат ответит и switch
    выучит его порт. Различать полезно при разборе всплесков трафика: широковещательный
    шторм и постоянный flooding из-за переполненной MAC-таблицы лечатся по-разному.
  ref: "sources/networks.md#M3"

- id: networks-ethernet-arp-006
  domain: networks
  subtopic: ethernet-arp
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему два хоста в разных подсетях не видят друг друга по ARP, даже будучи
    в одном физическом сегменте?
  answer: |
    Потому что каждый по своей маске считает другого **чужим** и вместо ARP к нему
    отправляет пакет шлюзу. Физическая связность есть, а логического решения
    отправить ARP-запрос не возникает.
  explanation: |
    Это показывает, что граница сети — понятие логическое, а не физическое: её задаёт
    маска на интерфейсе, а не провод. Отсюда типовой сюрприз при перенастройке
    адресации: хосты стоят в одном коммутаторе и перестают видеть друг друга,
    хотя «ничего не трогали, кроме маски».
  ref: "sources/networks.md#M3"

- id: networks-ethernet-arp-007
  domain: networks
  subtopic: ethernet-arp
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    В дампе второй MAC не совпадает с MAC сервера назначения. Что это значит?
  answer: |
    Что это MAC **роутера** — ближайшего хопа, а не конечного получателя. Так и должно
    быть, если адресат за пределами твоей подсети.
  explanation: |
    Пара «IP назначения и MAC назначения» в кадре относится к разным участникам:
    IP — конечный, MAC — следующий по пути. Понимание этого сразу снимает вопрос
    «почему адреса не сходятся» и, наоборот, позволяет заметить настоящую аномалию:
    если адресат в твоей же подсети, а MAC чужой — это признак перехвата.
  ref: "sources/networks.md#M3"

- id: networks-ethernet-arp-008
  domain: networks
  subtopic: ethernet-arp
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое gratuitous ARP и где он применяется?
  answer: |
    Незапрошенный ARP-ответ, которым хост объявляет всем своё соответствие IP и MAC.
    Применяется при переезде виртуального адреса: новый владелец VIP рассылает такой
    ответ, чтобы соседи обновили кеш немедленно.
  explanation: |
    Без него переключение на резервный узел ждало бы истечения ARP-кеша у каждого
    соседа — от секунд до минут простоя. На этом механизме держатся keepalived, VRRP
    и failover виртуальных адресов вообще. Обратная сторона — тот же приём лежит
    в основе ARP-спуфинга: протокол не проверяет, имеет ли право отправитель
    делать такое заявление.
  ref: "sources/networks.md#M3"

- id: networks-ethernet-arp-009
  domain: networks
  subtopic: ethernet-arp
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что даёт VLAN и что такое access-порт против trunk-порта?
  answer: |
    VLAN режет один физический коммутатор на несколько независимых
    широковещательных доменов. Access-порт принадлежит одному VLAN и отдаёт кадры
    без метки, trunk несёт несколько VLAN сразу с метками 802.1Q.
  explanation: |
    Ценность в том, что логическое разделение перестаёт требовать отдельного железа:
    бухгалтерия и продакшн живут в одном коммутаторе, не видя широковещания друг друга.
    Трафик между VLAN обязан пройти через маршрутизацию — то есть точку, где можно
    поставить правила. Отсюда VLAN и стал базовым инструментом сегментации сети.
  ref: "sources/networks.md#M3"

- id: networks-ethernet-arp-010
  domain: networks
  subtopic: ethernet-arp
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Как работает ARP-спуфинг и что его делает возможным?
  answer: |
    Атакующий рассылает ARP-ответы, объявляя свой MAC для чужого IP — обычно для шлюза.
    Соседи обновляют кеш и начинают слать трафик через него. Возможно это потому,
    что в ARP **нет никакой аутентификации**: ответу верят на слово.
  explanation: |
    Протокол проектировался для доверенной среды, и добавить проверку задним числом
    некуда. Отсюда меры всегда внешние: динамическая проверка ARP на коммутаторах,
    статические записи для критичных адресов, сегментация — и шифрование поверх,
    которое делает перехват бесполезным. Это же аргумент за mTLS внутри кластера:
    доверие не должно следовать из факта нахождения в одной сети.
  ref: "sources/networks.md#M3"

- id: networks-ethernet-arp-011
  domain: networks
  subtopic: ethernet-arp
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что произойдёт, если MAC-таблица коммутатора переполнится?
  answer: |
    Он начнёт рассылать неизвестные кадры во все порты — то есть деградирует
    до поведения хаба. Производительность падает, а чужой трафик становится виден
    всем соседям.
  explanation: |
    На этом построена атака MAC-flooding: генератор случайных адресов исчерпывает
    таблицу, и коммутатор превращается в средство прослушивания. Защита —
    ограничение числа изучаемых адресов на порт. В обычной эксплуатации тот же
    симптом появляется в очень крупных плоских сегментах, и это один из аргументов
    за то, чтобы не строить L2-сети неограниченного размера.
  ref: "sources/networks.md#M3"

- id: networks-ethernet-arp-012
  domain: networks
  subtopic: ethernet-arp
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему сервис не восстановился сразу после переезда виртуального IP,
    хотя новый узел уже принял адрес?
  answer: |
    У соседей и роутера в ARP-кеше остался старый MAC, и трафик продолжает идти
    на мёртвый узел до истечения записи. Лечится рассылкой gratuitous ARP при захвате
    адреса — её и делают корректные реализации failover.
  explanation: |
    Симптом характерный: новый узел считает, что всё хорошо, старый молчит, а трафик
    просто не приходит — и выглядит это как проблема приложения, а не сети. Проверяется
    мгновенно, `arp -a` на клиенте покажет старое соответствие. Тот же класс задержки
    объясняет, почему при переключениях всегда смотрят не только на состояние узлов,
    но и на то, узнала ли об этом сеть.
  ref: "sources/networks.md#M3"
