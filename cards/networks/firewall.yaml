- id: networks-firewall-001
  domain: networks
  subtopic: firewall
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем stateful-файрвол отличается от stateless?
  answer: |
    Stateful помнит установленные соединения и пропускает ответный трафик
    автоматически. Stateless смотрит на каждый пакет отдельно, поэтому обратное
    направление приходится разрешать правилом вручную.
  explanation: |
    Отсюда разный объём конфигурации: для stateful достаточно разрешить исходящее
    соединение, для stateless нужны два правила и знание, на какие порты придут
    ответы, — а порт источника эфемерный и заранее неизвестен. Именно поэтому
    в stateless-правилах приходится открывать целые диапазоны.
  ref: "sources/networks.md#M16"

- id: networks-firewall-002
  domain: networks
  subtopic: firewall
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем Security Group отличается от NACL в AWS?
  answer: |
    SG вешается на инстанс, **stateful**, и содержит только разрешающие правила.
    NACL применяется к подсети, **stateless**, умеет и разрешать, и запрещать,
    и правила в нём обрабатываются по номерам до первого совпадения.
  explanation: |
    Это два независимых рубежа, и трафик проходит оба: NACL на границе подсети,
    SG на входе в инстанс. Отсюда практический порядок разбора «не доходит трафик» —
    проверять надо оба, а не только тот, который настраивал ты.
  ref: "sources/networks.md#M16"

- id: networks-firewall-003
  domain: networks
  subtopic: firewall
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Почему в Security Group нет запрещающих правил?
  options:
    a: "Так устроена её модель: всё запрещено по умолчанию, правила только разрешают"
    b: "Потому что она stateful — запреты несовместимы с отслеживанием соединений"
    c: "Запреты есть, но доступны только через NACL того же VPC"
    d: "Потому что правила SG не имеют порядка обработки"
  answer: a
  explanation: |
    Это две **независимые** характеристики, и связывать их причинно — распространённая
    ошибка. Stateful относится к тому, как обрабатывается обратный трафик; «только
    allow» — к модели правил, где итог есть объединение разрешений, как в RBAC
    Kubernetes. Отсутствие порядка обработки — следствие той же модели: при чистом
    объединении порядок не нужен.
  ref: "sources/networks.md#M16"

- id: networks-firewall-004
  domain: networks
  subtopic: firewall
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Через какие цепочки netfilter проходит транзитный пакет и где делается NAT?
  answer: |
    `PREROUTING` → решение о маршрутизации → `FORWARD` → `POSTROUTING`. DNAT делается
    в `PREROUTING` (до выбора маршрута), SNAT и MASQUERADE — в `POSTROUTING`
    (перед самой отправкой).
  explanation: |
    Порядок не произволен: подменять назначение нужно **до** того, как ядро решит,
    куда отправлять пакет, иначе маршрут выберется по старому адресу. Источник,
    наоборот, подменяют в последний момент, когда исходящий интерфейс уже известен, —
    именно поэтому MASQUERADE и может подставить его адрес.
  ref: "sources/networks.md#M16"

- id: networks-firewall-005
  domain: networks
  subtopic: firewall
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает WAF и чего он не делает?
  answer: |
    Разбирает HTTP и фильтрует по содержимому: инъекции, подозрительные пути,
    аномальные заголовки, лимиты частоты. Не защищает от объёмных атак на канал
    и не заменяет сетевой файрвол.
  explanation: |
    Разные слои и разные угрозы: сетевой файрвол решает «кому вообще можно
    подключаться», WAF — «что можно просить». Отсюда и требование к размещению:
    WAF обязан стоять после терминации TLS, иначе разбирать ему нечего, —
    ровно поэтому его ставят на L7-балансировщик или CDN.
  ref: "sources/networks.md#M16"

- id: networks-firewall-006
  domain: networks
  subtopic: firewall
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Какие бывают типы DDoS и чем они отличаются по способу защиты?
  answer: |
    Объёмные — забивают канал, лечатся только фильтрацией у провайдера или в облаке
    очистки. Протокольные (SYN flood) — исчерпывают ресурсы стека, лечатся SYN
    cookies и лимитами. Прикладные — дорогие «легитимные» запросы, лечатся
    на уровне приложения и WAF.
  explanation: |
    Классификация определяет, кто в принципе может помочь: против объёмной атаки
    настройки на своём сервере бесполезны — канал забит до него. Прикладная атака,
    наоборот, невидима для сетевых средств, потому что каждый отдельный запрос
    выглядит нормальным, и отличается только совокупная стоимость.
  ref: "sources/networks.md#M16"

- id: networks-firewall-007
  domain: networks
  subtopic: firewall
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что означает zero-trust применительно к сети?
  answer: |
    Отказ от доверия по местоположению: нахождение внутри периметра больше не даёт
    прав. Каждый запрос аутентифицируется и авторизуется независимо, обычно
    через криптографическую идентичность.
  explanation: |
    Модель появилась потому, что периметр перестал существовать — облака,
    удалённая работа, подрядчики, — а взлом одного узла внутри давал доступ ко всему.
    Практическое воплощение это mTLS между сервисами и политики по идентичности:
    именно то, что делает service mesh, и то же самое, что identity-based
    политики в Cilium.
  ref: "sources/networks.md#M16"

- id: networks-firewall-008
  domain: networks
  subtopic: firewall
  difficulty: senior
  source: [theory, core]
  type: basic
  verified: false
  prompt: |
    Не путать: IP forwarding и port forwarding — что есть что?
  answer: |
    IP forwarding — разрешение хосту пересылать **транзитные** пакеты, то есть
    работать роутером (`net.ipv4.ip_forward`). Port forwarding — правило DNAT,
    переписывающее адрес и порт назначения, чтобы попасть на внутренний сервис.
  explanation: |
    Названия похожи, а слои разные: первое про то, разрешён ли транзит вообще,
    второе про подмену адреса конкретного соединения. При пробросе порта нужны
    обычно оба: без DNAT пакет пойдёт не туда, без форвардинга он будет отброшен
    как транзитный. Отсюда классическое «правило написал, а не работает».
  ref: "sources/networks.md#M16"

- id: networks-firewall-009
  domain: networks
  subtopic: firewall
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Правило разрешает трафик, но соединение всё равно не проходит. Что проверять
    в цепочке рубежей?
  answer: |
    Все рубежи по порядку: NACL подсети, Security Group инстанса, локальный файрвол
    ОС, правила контейнерной среды. Плюс маршрут в обратную сторону — асимметрия
    ломает stateful-фильтрацию.
  explanation: |
    Рубежей обычно больше, чем помнит настраивающий, и каждый может молча отбросить
    пакет. Диагностика начинается с различения таймаута и отказа: тишина указывает
    на фильтрацию, `refused` — на то, что пакет доехал и порт закрыт. Это первое,
    что отсекает половину гипотез.
  ref: "sources/networks.md#M16"
