# networks / diagnostics
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: networks-diagnostics-001
  domain: networks
  subtopic: diagnostics
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Какие ступени проходит запрос и в каком порядке их проверять?
  answer: |
    Имя → адрес (DNS) → маршрут до адреса → TCP-соединение → TLS-рукопожатие →
    HTTP-ответ. Проверять снизу вверх, не перескакивая: каждая ступень —
    предусловие следующей.
  explanation: |
    Лестница экономит больше, чем знание любой отдельной команды: она говорит,
    **где** ты сейчас находишься и какой инструмент уместен. Классическая потеря
    времени — разбирать заголовки ответа, когда имя не резолвится, или крутить
    настройки TLS, когда соединение вообще не устанавливается.
  ref: "sources/networks.md#M18"

- id: networks-diagnostics-002
  domain: networks
  subtopic: diagnostics
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как читать вывод `curl -v` по ступеням?
  answer: |
    Строка про резолв имени — DNS. `Trying <IP>...` и `Connected to` — TCP.
    Строки `TLS handshake`, сведения о сертификате — TLS. Строки с `>` и `<` —
    сам HTTP-обмен.
  explanation: |
    Одна команда покрывает всю лестницу, и место обрыва видно сразу: остановилось
    на резолве — DNS; висит после `Trying` — пакет не доходит; ошибка сертификата —
    TLS; дошло до `<` — сеть отработала, дальше вопрос к приложению. Это самый
    быстрый способ определить, чья зона ответственности.
  ref: "sources/networks.md#M18"

- id: networks-diagnostics-003
  domain: networks
  subtopic: diagnostics
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем нужен `nc` (netcat), если есть `curl`?
  answer: |
    Чтобы проверить **чистое TCP-соединение**, без HTTP и TLS: `nc -vz host port`
    отвечает только на вопрос, устанавливается ли соединение. Годится для любого
    порта, не только веб.
  explanation: |
    Разделение полезно, когда `curl` ругается непонятно: если `nc` соединяется,
    транспорт исправен, и проблема выше — в TLS или в протоколе. Для базы данных,
    брокера или произвольного сервиса это вообще единственный простой способ
    отделить сеть от приложения.
  ref: "sources/networks.md#M18"

- id: networks-diagnostics-004
  domain: networks
  subtopic: diagnostics
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Соединение к сервису висит и отваливается по таймауту. Какая проверка
    даст больше всего информации первой?
  options:
    a: "`tcpdump` на обоих концах: видно, доходит ли SYN и есть ли ответ"
    b: "Перезапустить приложение и посмотреть, изменится ли поведение"
    c: "Проверить нагрузку на сервере — возможно, он перегружен"
    d: "Увеличить таймаут клиента и повторить запрос"
  answer: a
  explanation: |
    Хорошая проверка — та, результат которой при разных гипотезах разный. Дамп сразу
    делит пространство причин: `SYN` не виден на той стороне — теряется по дороге;
    виден, но ответа нет — фильтрует получатель или проблема в обратном маршруте;
    ответ уходит, но не приходит — асимметрия. Остальные варианты подтверждают
    догадку, но ничего не различают.
  ref: "sources/networks.md#M18"

- id: networks-diagnostics-005
  domain: networks
  subtopic: diagnostics
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем отличаются latency, bandwidth и throughput?
  answer: |
    Latency — задержка одного обмена (RTT). Bandwidth — теоретическая ёмкость канала.
    Throughput — реально достигнутая скорость передачи, которая от задержки зависит
    не меньше, чем от ёмкости.
  explanation: |
    Смешение этих величин порождает вечное «канал широкий, а качается медленно».
    Причина в том, что TCP отправляет данные окнами и ждёт подтверждений: при большом
    RTT отправитель простаивает, и ёмкость остаётся невыбранной. Отсюда и смысл
    window scaling, и то, что расширение канала не ускоряет передачу через океан.
  ref: "sources/networks.md#M18"

- id: networks-diagnostics-006
  domain: networks
  subtopic: diagnostics
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему по средней задержке нельзя судить о качестве связи?
  answer: |
    Среднее прячет хвост: при девяноста быстрых обменах и десяти очень медленных
    оно выглядит приемлемо, а каждый десятый пользователь ждёт. Смотреть надо
    перцентили — p95 и p99.
  explanation: |
    Пользователь ощущает свой запрос, а не среднее по системе, и жалобы приходят
    именно из хвоста. Перцентили вдобавок раньше показывают деградацию: p99 растёт,
    когда начинают заполняться очереди и буферы, задолго до того, как сдвинется
    среднее значение.
  ref: "sources/networks.md#M18"

- id: networks-diagnostics-007
  domain: networks
  subtopic: diagnostics
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему потеря даже одного процента пакетов так сильно бьёт по скорости TCP?
  answer: |
    Потому что TCP считает потерю признаком перегрузки и **резко сокращает окно**,
    а затем наращивает его медленно. Плюс на восстановление уходит время, кратное RTT.
  explanation: |
    Ущерб непропорционален: один процент потерь на длинном маршруте способен срезать
    пропускную способность в разы. Отсюда и практический вывод — «канал не загружен,
    значит с сетью всё в порядке» неверно: смотреть надо на потери и ретрансмиссии,
    а не только на утилизацию.
  ref: "sources/networks.md#M18"

- id: networks-diagnostics-008
  domain: networks
  subtopic: diagnostics
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Как проверить, что проблема именно в MTU?
  answer: |
    Отправить пакет заданного размера с запретом фрагментации:
    `ping -M do -s 1472 <host>` (1472 + 28 байт заголовков = 1500). Если мелкие
    проходят, а этот нет — MTU по пути меньше.
  explanation: |
    Проверка различающая: она отделяет «сеть не работает» от «сеть не пропускает
    крупное». Подбирая размер, можно найти реальный MTU пути и понять, где именно
    вставлена обёртка. Симптом, ради которого это делают, характерен — рукопожатие
    проходит, а передача данных зависает.
  ref: "sources/networks.md#M18"

- id: networks-diagnostics-009
  domain: networks
  subtopic: diagnostics
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Не путать: MTU и MSS, ISN и SNI — что из этого что?
  answer: |
    MTU — размер всего пакета на L3. MSS — объём **данных** TCP на L4, примерно
    на 40 байт меньше. ISN — начальный номер последовательности TCP. SNI — имя домена
    в открытой части TLS-рукопожатия.
  explanation: |
    Две пары похожих сокращений с разных слоёв, и путаница в них уводит диагностику
    в сторону. Практическое различение простое: MTU и MSS отвечают за размер и всплывают
    при зависании крупных передач; ISN живёт в TCP и касается защиты от подделки
    соединений; SNI живёт в TLS и касается выбора сертификата и блокировок по имени.
  ref: "sources/networks.md#M18"

- id: networks-diagnostics-010
  domain: networks
  subtopic: diagnostics
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Не путать: MASQUERADE и NAT — это две разные вещи?
  answer: |
    Нет. MASQUERADE — это **подвид SNAT**, то есть частный случай NAT, где подставляется
    текущий адрес исходящего интерфейса. Перечислять их через запятую как равные
    сущности неверно.
  explanation: |
    Ошибка типа «зонтик и подвид»: одно понятие включает другое. Такие склейки заметны
    на собесе сразу и выдают заученность вместо понимания. Правильная иерархия:
    NAT — общее понятие; SNAT и DNAT — по тому, какой адрес подменяется;
    MASQUERADE — вариант SNAT с автоматическим выбором адреса.
  ref: "sources/networks.md#M18"

- id: networks-diagnostics-011
  domain: networks
  subtopic: diagnostics
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    «Работает у меня, не работает у клиента». С чего начать, чтобы не спорить?
  answer: |
    С фиксации различий, а не ощущений: какой адрес вернул резолвер каждому, откуда
    идёт трафик, какая версия TLS и какие заголовки. Дальше воспроизвести условия
    клиента — с его сети, его резолвером, его клиентским приложением.
  explanation: |
    Почти всегда разница объективна: другая точка присутствия CDN, другой резолвер,
    другой корневой сертификат, старый кеш, IPv6 вместо IPv4. Спор возникает
    из-за того, что стороны сравнивают выводы, а не входные данные. Один общий
    артефакт — `curl -v` с обеих сторон — обычно закрывает вопрос за минуту.
  ref: "sources/networks.md#M18"

- id: networks-diagnostics-012
  domain: networks
  subtopic: diagnostics
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Соединение устанавливается, но первый крупный ответ никогда не приходит.
    Назови главного подозреваемого и почему именно его.
  answer: |
    MTU по пути. Рукопожатие состоит из маленьких пакетов и проходит всегда, а первый
    полноразмерный сегмент не влезает и молча отбрасывается. Ошибки нет, потому что
    отбрасывающий узел не обязан о ней сообщать.
  explanation: |
    Подпись настолько характерна, что по ней можно ставить диагноз до всякой проверки:
    «мелкое ходит, крупное виснет» = обёртка съела MTU. Источник почти всегда один —
    туннель, VPN или overlay-сеть, добавленные между узлами. Подтверждается
    `ping -M do` с подбором размера, лечится MTU на интерфейсе или clamping MSS.
  ref: "sources/networks.md#M18"

- id: networks-diagnostics-013
  domain: networks
  subtopic: diagnostics
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Какие проверки различают гипотезы лучше всего? Назови пары «симптом → вывод».
  answer: |
    Таймаут против `refused` — пакет потерян против «порт закрыт». `NXDOMAIN` против
    тишины DNS — имени нет против резолвер недоступен. `502` против `504` — плохой
    ответ против отсутствия ответа. Мелкое ходит, крупное виснет — MTU.
  explanation: |
    Каждая пара делит пространство причин примерно пополам одним действием — в этом
    и ценность. Общий принцип: гипотезу проверяют тем, что её **отличает**,
    а не тем, что её подтверждает. Подтверждение легко найти всегда, различающий
    признак — только если гипотеза верна.
  ref: "sources/networks.md#M18"
