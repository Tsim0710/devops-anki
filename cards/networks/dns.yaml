# networks / dns
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: networks-dns-001
  domain: networks
  subtopic: dns
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как устроена иерархия резолва имени?
  answer: |
    Корневые серверы знают, кто отвечает за зону верхнего уровня (`.com`), те знают
    авторитативные серверы домена, а уже те дают ответ. Рекурсивный резолвер проходит
    цепочку за клиента и кеширует результат.
  explanation: |
    Система построена на **делегировании**, а не на едином реестре: никто не хранит
    все имена мира, каждый уровень лишь указывает на следующий. Отсюда и устойчивость,
    и то, что смена авторитативных серверов домена — операция на уровне регистратора,
    а не правка записи. Увидеть цепочку целиком можно через `dig +trace`.
  ref: "sources/networks.md#M7"

- id: networks-dns-002
  domain: networks
  subtopic: dns
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что означают типы записей `A`, `AAAA`, `CNAME`, `MX`, `TXT`, `NS`?
  answer: |
    `A` — адрес IPv4, `AAAA` — адрес IPv6, `CNAME` — псевдоним на другое имя,
    `MX` — почтовый сервер, `TXT` — произвольный текст (SPF, подтверждение владения),
    `NS` — кто авторитативен для зоны.
  explanation: |
    Практически важен `CNAME`: он указывает на **имя**, а не на адрес, поэтому
    добавляет ещё один шаг резолва и не может стоять на вершине зоны рядом
    с другими записями. Именно поэтому у корня домена вместо него используют
    специальные записи провайдера — на этом спотыкаются, подключая CDN.
  ref: "sources/networks.md#M7"

- id: networks-dns-003
  domain: networks
  subtopic: dns
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое TTL у DNS-записи?
  answer: |
    Срок, в течение которого **копию** ответа можно держать в кеше. Это не таймер
    смены адреса и не обещание, что через TTL секунд адрес изменится.
  explanation: |
    Формулировка «срок копии» снимает главное заблуждение. Практический смысл в том,
    что при переезде сервиса TTL надо снизить **заранее**: пока старое значение
    разошлось по кешам с суточным сроком, никакая правка зоны на это не повлияет.
    Снижают за сутки-двое до переезда, возвращают после.
  ref: "sources/networks.md#M7"

- id: networks-dns-004
  domain: networks
  subtopic: dns
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Как по выводу `dig` понять, что ответ пришёл из кеша, а не от авторитативного
    сервера?
  options:
    a: "TTL дробный, то есть меньше исходного максимума — он уже отсчитывается"
    b: "По строке Query time: маленькое значение означает кеш"
    c: "По флагу aa в заголовке ответа"
    d: "Определить нельзя, вывод одинаков"
  answer: a
  explanation: |
    Резолвер отдаёт **остаток** TTL: полное значение приходит только от авторитативного
    источника, а всё, что меньше, уже полежало в кеше. `Query time` обманчив — он
    измеряет сеть до резолвера, а тот может быть рядом и при этом ходить за ответом
    далеко. Флаг `aa` виден только при прямом обращении к авторитативному серверу.
  ref: "sources/networks.md#M7"

- id: networks-dns-005
  domain: networks
  subtopic: dns
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Один и тот же домен у тебя и у коллеги резолвится в разные адреса. Это поломка?
  answer: |
    Нет, обычное поведение: авторитативный сервер отвечает с учётом географии
    и нагрузки, а адрес может быть anycast-адресом ближайшей точки CDN. Скачущий TTL
    при повторных запросах — признак флота серверов за одним адресом.
  explanation: |
    Отсюда практическое следствие для диагностики: «у меня не открывается, а у него
    открывается» не доказывает проблему на клиенте — вы можете просто ходить в разные
    точки присутствия. Сравнивать надо не ощущения, а конкретные адреса,
    которые вернул резолвер каждому.
  ref: "sources/networks.md#M7"

- id: networks-dns-006
  domain: networks
  subtopic: dns
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему DNS-кеш нельзя путать с таблицей маршрутов?
  answer: |
    Это разные слои: DNS отвечает «какой адрес у имени», маршрутизация — «как дойти
    до адреса». Успешный резолв ничего не говорит о достижимости, а рабочий маршрут —
    о том, что имя разрешится.
  explanation: |
    Разделение этих двух вопросов — основа диагностики: сначала выясняем, какой адрес
    вернулся, потом — доходит ли до него трафик. Их смешение порождает бесполезные
    выводы вроде «пинг по имени не идёт, значит DNS сломан», хотя имя могло
    разрешиться прекрасно, а пакет умереть на файрволе.
  ref: "sources/networks.md#M7"

- id: networks-dns-007
  domain: networks
  subtopic: dns
  difficulty: middle
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое негативное кеширование?
  answer: |
    Кеширование **отрицательного** ответа: если имени не существует, резолвер запоминает
    и этот факт на время, заданное в записи `SOA` зоны.
  explanation: |
    Отсюда неприятный эффект при добавлении новой записи: если кто-то успел спросить
    имя до того, как оно появилось, он будет получать `NXDOMAIN` ещё какое-то время
    после публикации. Симптом выглядит как «запись не применилась», хотя зона в порядке —
    проверяется прямым запросом к авторитативному серверу в обход кеша.
  ref: "sources/networks.md#M7"

- id: networks-dns-008
  domain: networks
  subtopic: dns
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем DNSSEC отличается от DoH и DoT по решаемой задаче?
  answer: |
    DNSSEC **подписывает** ответы: гарантирует подлинность и целостность,
    но передаёт их открытым текстом. DoH и DoT **шифруют** канал до резолвера:
    прячут запросы от наблюдателя, но не доказывают подлинность самого ответа.
  explanation: |
    Это ортогональные свойства, и их постоянно смешивают. Шифрование не мешает
    резолверу отдать подделанный ответ — оно лишь скрывает диалог. Подпись не мешает
    провайдеру видеть, какие домены ты спрашиваешь. Полная защита требует обоих,
    и именно поэтому их внедряют независимо друг от друга.
  ref: "sources/networks.md#M7"

- id: networks-dns-009
  domain: networks
  subtopic: dns
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Переехали на новый сервер, у большинства работает, у части клиентов — старый адрес
    вторые сутки. Причины?
  answer: |
    Кеш выше по цепочке: резолвер провайдера, корпоративный резолвер, кеш операционной
    системы или самого приложения. Плюс возможен большой TTL, отданный до правки зоны.
  explanation: |
    Ключевой момент — уровней кеширования много, и твоя правка авторитативной зоны
    ни на один из них не действует принудительно. Отсюда единственный надёжный
    подход при переездах: снижать TTL заранее и держать старый сервер работающим,
    пока идёт разъезд кешей, а не выключать его сразу после смены записи.
  ref: "sources/networks.md#M7"

- id: networks-dns-010
  domain: networks
  subtopic: dns
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему `dig` показывает правильный адрес, а приложение стучится на старый?
  answer: |
    Приложение резолвит не через ту же цепочку или кеширует само: JVM исторически
    держит результат бессрочно, у HTTP-клиентов бывает свой пул с запомненными
    адресами, а контейнер может использовать другой resolv.conf.
  explanation: |
    Это классическая ловушка «инструмент проверяет не то, что делает приложение».
    Проверять надо изнутри того же окружения и, если возможно, тем же рантаймом.
    А лечится это не в DNS-инфраструктуре, а в настройках кеша самого клиента —
    менять там TTL бесполезно.
  ref: "sources/networks.md#M7"
