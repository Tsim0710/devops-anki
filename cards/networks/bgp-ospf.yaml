- id: networks-bgp-ospf-001
  domain: networks
  subtopic: bgp-ospf
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое автономная система (AS)?
  answer: |
    Сеть или группа сетей под единым административным управлением с общей политикой
    маршрутизации: провайдер, крупная компания, облако. У каждой AS есть свой номер.
  explanation: |
    Понятие задаёт границу, по которой делятся протоколы маршрутизации: **внутри** AS
    работают IGP вроде OSPF, **между** AS — BGP. Интернет с этой точки зрения — это
    примерно сто тысяч автономных систем, договорившихся обмениваться маршрутами,
    а не единая сеть с центром.
  ref: "sources/networks.md#M4"

- id: networks-bgp-ospf-002
  domain: networks
  subtopic: bgp-ospf
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Где применяется OSPF, а где BGP?
  answer: |
    OSPF — **внутри** автономной системы: быстро находит кратчайший путь по метрике.
    BGP — **между** автономными системами: выбирает путь по политике, а не по скорости.
  explanation: |
    Разница целей объясняет разницу поведения. Внутри своей сети ты доверяешь всем
    участникам и хочешь оптимальности — отсюда OSPF, где каждый роутер знает полную
    топологию. Между чужими сетями оптимальность недостижима и не нужна: важнее,
    с кем у тебя договор и через кого выгоднее пускать трафик.
  ref: "sources/networks.md#M4"

- id: networks-bgp-ospf-003
  domain: networks
  subtopic: bgp-ospf
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что означает «BGP — это про политику, а не про кратчайший путь»?
  answer: |
    Что выбор маршрута определяется договорённостями и настройками — предпочтением
    определённых соседей, длиной AS_PATH, локальными предпочтениями — а не задержкой
    или пропускной способностью. BGP вообще не измеряет качество канала.
  explanation: |
    Отсюда наблюдаемые странности: трафик между двумя соседними городами может уйти
    через другую страну, потому что так дешевле по договору между провайдерами.
    И отсюда же понятно, почему «интернет выбирает быстрый путь» — миф: он выбирает
    путь, который кто-то согласился пропустить.
  ref: "sources/networks.md#M4"

- id: networks-bgp-ospf-004
  domain: networks
  subtopic: bgp-ospf
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как OSPF выбирает путь и что происходит при отказе канала?
  answer: |
    Каждый роутер знает полную топологию области и считает кратчайший путь по метрике
    (обычно обратно пропорциональной скорости канала). При отказе соседи рассылают
    обновление, все пересчитывают деревья — сходимость занимает секунды.
  explanation: |
    Знание полной топологии — сильная сторона и одновременно ограничение: пересчёт
    тем дороже, чем больше сеть, поэтому её режут на области. Сравни с BGP, где
    роутер не знает топологию вовсе, а видит только список путей от соседей, —
    отсюда и куда более медленная сходимость.
  ref: "sources/networks.md#M4"

- id: networks-bgp-ospf-005
  domain: networks
  subtopic: bgp-ospf
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Что произошло с Facebook в 2021 году с точки зрения маршрутизации?
  answer: |
    В ходе плановой работы их сеть **отозвала BGP-анонсы** собственных префиксов.
    Мир перестал знать маршруты к ним — и сервисы пропали из интернета целиком,
    хотя серверы работали.
  explanation: |
    Урок в том, что доступность в интернете — это не работоспособность серверов,
    а наличие маршрута к ним. Второй урок про связность инструментов: внутренние
    системы компании зависели от той же сети, поэтому пропал и доступ к средствам
    восстановления. Отсюда требование к контурам управления — не зависеть
    от управляемой ими системы.
  ref: "sources/networks.md#M4"

- id: networks-bgp-ospf-006
  domain: networks
  subtopic: bgp-ospf
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое перехват маршрута (BGP hijacking) и почему он в принципе возможен?
  answer: |
    Чужая AS анонсирует префикс, который ей не принадлежит — обычно более длинный,
    поэтому он выигрывает по longest prefix match. Возможно потому, что BGP построен
    на **доверии**: анонсам соседа верят, если не настроена фильтрация.
  explanation: |
    Протокол проектировался для небольшого числа знакомых друг с другом сетей,
    и проверки происхождения в нём изначально не было. Современные меры внешние:
    фильтры на основе реестров и криптографическая валидация происхождения маршрутов.
    Это ровно тот же сюжет, что с ARP и DHCP, только в масштабе интернета.
  ref: "sources/networks.md#M4"

- id: networks-bgp-ospf-007
  domain: networks
  subtopic: bgp-ospf
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем BGP нужен в кластере Kubernetes на bare-metal?
  answer: |
    Чтобы объявить сети кластера остальной сети: MetalLB в BGP-режиме анонсирует
    адреса сервисов, а CNI вроде Calico — маршруты до pod-подсетей. Так трафик
    доходит без overlay-инкапсуляции.
  explanation: |
    Это и есть практический смысл выбора «native routing вместо overlay»: сеть узнаёт
    о внутренних подсетях кластера через настоящий протокол маршрутизации, поэтому
    не нужны обёртки, а вместе с ними исчезает и расход MTU. Плата — необходимость
    договариваться с сетевой командой и настраивать BGP-пиринг.
  ref: "sources/networks.md#M4"

- id: networks-bgp-ospf-008
  domain: networks
  subtopic: bgp-ospf
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему сходимость BGP измеряется минутами, а OSPF — секундами?
  answer: |
    OSPF рассылает изменение всем и каждый пересчитывает известную ему топологию.
    BGP топологии не знает: он передаёт векторы путей от соседа к соседу, и новость
    расходится по цепочке с задержками, а таймеры намеренно сглаживают колебания.
  explanation: |
    Медленность здесь — сознательный размен на устойчивость: сеть из ста тысяч AS
    не выдержала бы мгновенной реакции на каждое мигание канала, поэтому применяется
    подавление флапающих маршрутов. Отсюда практический вывод: аварийное переключение
    внешнего канала не бывает мгновенным, и в план восстановления это закладывается.
  ref: "sources/networks.md#M4"
