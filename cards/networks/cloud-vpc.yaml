- id: networks-cloud-vpc-001
  domain: networks
  subtopic: cloud-vpc
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает подсеть в VPC публичной?
  answer: |
    Не имя и не флаг, а **маршрут**: в её таблице маршрутизации есть запись
    `0.0.0.0/0` через Internet Gateway. Подсеть без такого маршрута приватная,
    как её ни назови.
  explanation: |
    Это самая частая путаница в облачных сетях: «публичная подсеть» — не свойство
    объекта, а следствие конфигурации маршрутов. Отсюда и порядок разбора «инстанс
    не выходит в интернет»: сначала смотрят таблицу маршрутов подсети, а не файрвол
    и не сам инстанс.
  ref: "sources/networks.md#M17"

- id: networks-cloud-vpc-002
  domain: networks
  subtopic: cloud-vpc
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем инстансу в публичной подсети нужен ещё и публичный адрес?
  answer: |
    Маршрут через IGW даёт путь наружу, но обратно пакет вернуться не может,
    если у инстанса нет публичного адреса. IGW выполняет трансляцию между приватным
    и публичным адресом.
  explanation: |
    Два условия работают только вместе: маршрут отвечает за «куда», публичный адрес —
    за «как вернуться». Отсюда типовой симптом: подсеть настроена правильно,
    инстанс всё равно молчит — потому что адрес ему не выдали, и обратного пути
    физически нет.
  ref: "sources/networks.md#M17"

- id: networks-cloud-vpc-003
  domain: networks
  subtopic: cloud-vpc
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как инстанс в приватной подсети выходит в интернет?
  answer: |
    Через NAT Gateway, размещённый в **публичной** подсети: таблица маршрутов
    приватной подсети направляет `0.0.0.0/0` на него, а он уже выходит наружу
    через IGW. Входящие соединения при этом невозможны.
  explanation: |
    Асимметрия здесь и есть смысл конструкции: наружу можно, внутрь нельзя — то же
    свойство, что даёт домашний роутер. Практическая деталь, о которой забывают:
    NAT Gateway тарифицируется и за час работы, и за объём трафика, поэтому большой
    исходящий поток из приватных подсетей становится заметной статьёй расхода.
  ref: "sources/networks.md#M17"

- id: networks-cloud-vpc-004
  domain: networks
  subtopic: cloud-vpc
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    VPC A связан пирингом с B, B связан с C. Пойдёт ли трафик из A в C?
  options:
    a: "Нет: пиринг не транзитивен, нужна прямая связь или Transit Gateway"
    b: "Да, если в таблицах маршрутов A и C прописать нужные подсети"
    c: "Да, пиринг транзитивен по умолчанию"
    d: "Да, но только для приватных адресов"
  answer: a
  explanation: |
    Нетранзитивность — фундаментальное свойство пиринга, а не ограничение настройки:
    B не пересылает чужой трафик между своими партнёрами. Поэтому число связей растёт
    квадратично с числом сетей, и ровно для этого существует Transit Gateway —
    единая точка, к которой подключаются все и через которую маршрутизация
    становится транзитивной.
  ref: "sources/networks.md#M17"

- id: networks-cloud-vpc-005
  domain: networks
  subtopic: cloud-vpc
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему два VPC с пересекающимися CIDR нельзя соединить пирингом?
  answer: |
    Потому что маршрутизация станет неоднозначной: один и тот же адрес принадлежал бы
    обеим сторонам, и роутер не смог бы решить, куда отправлять пакет. Облако
    запрещает такой пиринг на этапе создания.
  explanation: |
    Отсюда практическое требование планировать адресацию **до** создания сетей:
    поменять CIDR существующего VPC нельзя, и единственный выход при пересечении —
    пересоздание либо трансляция адресов на стыке. Та же логика запрещает пересечение
    pod-подсети кластера с адресами VPC.
  ref: "sources/networks.md#M17"

- id: networks-cloud-vpc-006
  domain: networks
  subtopic: cloud-vpc
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что даёт PrivateLink по сравнению с пирингом?
  answer: |
    Доступ к **конкретному сервису**, а не связывание сетей: у тебя появляется
    интерфейс с приватным адресом в твоей подсети, ведущий к чужому сервису.
    Сети при этом не соединяются, и CIDR могут пересекаться.
  explanation: |
    Разница в единице доступа: пиринг открывает сеть сети, PrivateLink — точку входа.
    Отсюда два преимущества: трафик не выходит в интернет, и радиус доступа минимален —
    поставщик не получает маршрута в твою сеть. Это тот же принцип наименьших
    привилегий, только в сетевом измерении.
  ref: "sources/networks.md#M17"

- id: networks-cloud-vpc-007
  domain: networks
  subtopic: cloud-vpc
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем доступ через агента управления (SSM, IAP) лучше bastion-хоста?
  answer: |
    Не нужен ни открытый порт, ни публичный адрес: соединение инициирует **агент
    изнутри**. Доступ управляется правами облака, а не ключами SSH, и сессии
    логируются централизованно.
  explanation: |
    Bastion — это дверь, которую надо охранять: её видно из интернета, её сканируют,
    её ключи надо раздавать и отзывать. Агент переворачивает направление соединения
    и тем самым убирает саму дверь. Отзыв доступа при этом становится изменением
    роли в IAM, а не поиском ключа по машинам.
  ref: "sources/networks.md#M17"

- id: networks-cloud-vpc-008
  domain: networks
  subtopic: cloud-vpc
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем в site-to-site VPN между офисом и облаком нужен BGP?
  answer: |
    Чтобы стороны обменивались маршрутами автоматически: добавили подсеть — она
    появилась у соседа сама. Плюс при двух туннелях BGP обеспечивает переключение
    на живой без вмешательства человека.
  explanation: |
    Альтернатива — статические маршруты, которые молча устаревают: добавили сеть,
    забыли прописать, и «половина ресурсов недоступна». Это ровно тот случай,
    когда динамическая маршрутизация оправдана появлением второго пути:
    при единственном туннеле BGP не даёт почти ничего, кроме сложности.
  ref: "sources/networks.md#M17"

- id: networks-cloud-vpc-009
  domain: networks
  subtopic: cloud-vpc
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    NAT Gateway создан, маршрут на него прописан, инстанс всё равно не выходит
    наружу. Самая частая причина?
  answer: |
    NAT Gateway поставлен **в приватную подсеть**. Он создаётся успешно и выглядит
    исправным, но у него самого нет маршрута на IGW, то есть выхода наружу.
    Стоять он обязан в публичной подсети.
  explanation: |
    Ошибка живучая, потому что облако её не отвергает: объект валиден, статус
    зелёный, и подозрение падает на файрвол или на приложение. Проверяется одним
    взглядом — в какой подсети лежит сам шлюз и есть ли в её таблице маршрут на IGW.
    Логика та же, что с публичной подсетью: «публичность» это свойство маршрута,
    и она нужна не только инстансам, но и самому NAT-шлюзу.
  ref: "sources/networks.md#M17"

- id: networks-cloud-vpc-010
  domain: networks
  subtopic: cloud-vpc
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему стоит считать межзональный трафик внутри VPC?
  answer: |
    Он тарифицируется, а зоны разнесены физически — добавляется и задержка. При
    интенсивном обмене между сервисами счёт за внутренний трафик легко превышает
    стоимость самих машин.
  explanation: |
    Ловушка в том, что архитектурно правильное решение — размазать реплики по зонам
    ради отказоустойчивости — напрямую увеличивает межзональный обмен. Отсюда
    и появляются механизмы вроде маршрутизации с учётом топологии в Kubernetes:
    держать трафик в своей зоне, пока это возможно, и уходить в соседнюю только
    при нехватке бэкендов.
  ref: "sources/networks.md#M17"
