# networks / load-balancing
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: networks-load-balancing-001
  domain: networks
  subtopic: load-balancing
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем L4-балансировщик отличается от L7?
  answer: |
    L4 видит только адреса и порты: он раскидывает **соединения**, не заглядывая
    внутрь. L7 разбирает протокол — читает домен, путь, заголовки — и потому может
    маршрутизировать по содержимому запроса.
  explanation: |
    Формулировка «вскрывает конверт или нет» точно передаёт суть. Отсюда все различия:
    L4 работает с любым протоколом и дёшев, но не умеет раздавать по путям
    и не различает запросы внутри соединения. L7 умеет всё это, но обязан
    терминировать соединение, а значит и TLS, и стоит дороже на каждый запрос.
  ref: "sources/networks.md#M12"

- id: networks-load-balancing-002
  domain: networks
  subtopic: load-balancing
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Какие бывают алгоритмы балансировки и когда какой уместен?
  answer: |
    Round robin — по кругу, подходит для одинаковых запросов и одинаковых бэкендов.
    Least connections — тому, у кого меньше активных соединений, лучше при разной
    длительности запросов. Hash по IP или URL — для привязки к конкретному бэкенду.
    Weighted — когда серверы разной мощности.
  explanation: |
    Выбор диктует разброс стоимости запросов: при равномерных запросах round robin
    ничем не хуже и проще, при разбросе от миллисекунд до минут он копит очередь
    на одном сервере, пока другие простаивают. Хеширование по URL — отдельный случай:
    оно нужно не для равномерности, а чтобы повысить попадания в кеш бэкенда.
  ref: "sources/networks.md#M12"

- id: networks-load-balancing-003
  domain: networks
  subtopic: load-balancing
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое SSL termination?
  answer: |
    Расшифровка TLS на балансировщике: до него трафик зашифрован, дальше к бэкендам
    идёт по HTTP или по новому TLS-соединению. Сертификаты живут в одном месте.
  explanation: |
    Без терминации L7-маршрутизация невозможна в принципе — нельзя прочитать путь
    в зашифрованном потоке. Плата — участок за балансировщиком становится доверенной
    зоной, и если это не так (публичное облако, чужая сеть), трафик до бэкенда
    шифруют заново. Третий вариант, passthrough, отдаёт TLS бэкенду целиком,
    но тогда балансировщик снова видит только адреса и порты.
  ref: "sources/networks.md#M12"

- id: networks-load-balancing-004
  domain: networks
  subtopic: load-balancing
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Приложение за балансировщиком видит в качестве адреса клиента адрес самого
    балансировщика. Как вернуть реальный IP?
  options:
    a: "Читать `X-Forwarded-For` на L7 или включить PROXY protocol на L4"
    b: "Отключить SSL termination — тогда адрес сохранится"
    c: "Никак: на L7 реальный IP теряется безвозвратно"
    d: "Включить sticky sessions"
  answer: a
  explanation: |
    Балансировщик, терминирующий соединение, открывает к бэкенду **своё** соединение,
    поэтому источником становится он. Решения два и они на разных уровнях: на L7
    исходный адрес передаётся заголовком, на L4 — отдельным протоколом PROXY,
    который сообщает адрес до начала данных. Заголовку при этом можно верить
    только от известных прокси: клиент способен подставить его сам.
  ref: "sources/networks.md#M12"

- id: networks-load-balancing-005
  domain: networks
  subtopic: load-balancing
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем активная проверка здоровья отличается от пассивной?
  answer: |
    Активная — балансировщик сам периодически стучится в бэкенд по заданному пути.
    Пассивная — он наблюдает за реальным трафиком и выводит бэкенд из ротации
    после серии ошибок или таймаутов.
  explanation: |
    Активная замечает беду до того, как её увидит пользователь, но проверяет
    искусственный запрос. Пассивная судит по настоящей нагрузке, но узнаёт о проблеме
    ценой уже пострадавших запросов. Поэтому в проде их сочетают, а не выбирают.
  ref: "sources/networks.md#M12"

- id: networks-load-balancing-006
  domain: networks
  subtopic: load-balancing
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Приложение зависло, но health check продолжает отвечать `200`. Что не так
    с проверкой?
  answer: |
    Она поверхностная: отвечает веб-сервер или отдельный обработчик, не касающийся
    того, что сломалось. Проверка должна затрагивать критичные зависимости —
    хотя бы соединение с базой и состояние пула потоков.
  explanation: |
    Обратная крайность не менее опасна: если проверка ходит во внешнюю базу,
    её недоступность разом выведет из ротации **все** бэкенды и превратит частичную
    деградацию в полный отказ. Отсюда и практика — проверять собственную
    работоспособность глубоко, а чужую доступность отражать в метриках, а не
    в критерии ротации.
  ref: "sources/networks.md#M12"

- id: networks-load-balancing-007
  domain: networks
  subtopic: load-balancing
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Партнёр требует внести ваш исходящий адрес в белый список, а сервис должен
    видеть реальный IP клиента и работать по произвольному TCP. ALB или NLB?
  answer: |
    NLB. Он даёт **статические** адреса, которые можно занести в белый список,
    сохраняет исходный IP клиента без заголовков и не ограничен HTTP.
    У ALB адреса меняются, а source IP теряется при терминации.
  explanation: |
    Каждое из трёх требований по отдельности уже исключает ALB, и это типичный вид
    задачи на собесе: выбор диктуют не возможности, а ограничения. Обратная ситуация
    так же однозначна — как только нужен разбор путей, доменов или WAF, вариантов
    кроме ALB нет, и тогда реальный IP приходится передавать заголовком.
  ref: "sources/networks.md#M12"

- id: networks-load-balancing-008
  domain: networks
  subtopic: load-balancing
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое sticky sessions и почему это считается костылём?
  answer: |
    Привязка клиента к одному бэкенду — по IP или по cookie. Костыль потому,
    что превращает бэкенды в неравноценные: при выводе одного из них его клиенты
    теряют сессии, а нагрузка перестаёт распределяться равномерно.
  explanation: |
    Потребность в привязке — это симптом состояния, хранящегося в памяти процесса.
    Правильное лечение — вынести сессии во внешнее хранилище, после чего любой
    бэкенд сможет обслужить любого клиента. Привязка по IP вдобавок разваливается
    на клиентах за общим NAT и на мобильных, где адрес меняется.
  ref: "sources/networks.md#M12"

- id: networks-load-balancing-009
  domain: networks
  subtopic: load-balancing
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что произойдёт, если health check слишком чувствительный?
  answer: |
    Флаппинг: бэкенд выводится из ротации при кратковременном всплеске задержки,
    нагрузка переезжает на оставшихся, те тоже начинают отвечать медленнее —
    и выводятся следующими. Частичная перегрузка превращается в каскадный отказ.
  explanation: |
    Механизм самоусиления тот же, что у ретрай-штормов: реакция на перегрузку
    увеличивает перегрузку. Отсюда параметры проверки — несколько неудач подряд
    до вывода, ещё больше успехов до возврата, и обязательный нижний предел
    на число живых бэкендов, при котором балансировщик перестаёт кого-либо исключать.
  ref: "sources/networks.md#M12"

- id: networks-load-balancing-010
  domain: networks
  subtopic: load-balancing
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему `X-Forwarded-For` нельзя доверять без оговорок?
  answer: |
    Это обычный заголовок, и клиент может отправить его сам. Прокси **дописывают**
    свои значения в список, поэтому доверять можно лишь той части, которую добавили
    твои собственные посредники — обычно крайнему правому адресу.
  explanation: |
    Иначе получается дыра: злоумышленник подставляет чужой адрес и обходит ограничение
    по IP или отравляет логи и аудит. Правильная настройка всегда включает список
    доверенных прокси, и именно поэтому на L4 предпочитают PROXY protocol —
    он передаётся вне пользовательских данных и подделать его клиенту нечем.
  ref: "sources/networks.md#M12"

- id: networks-load-balancing-011
  domain: networks
  subtopic: load-balancing
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Балансировщик распределяет равномерно, а один бэкенд всё равно перегружен.
    Гипотезы?
  answer: |
    Долгие соединения: HTTP/2 или gRPC закрепились за ним и балансировка на коннект
    их не трогает. Либо запросы неравноценны, а алгоритм round robin. Либо привязка
    сессий. Либо сам бэкенд деградировал и просто медленнее остальных.
  explanation: |
    Первая причина самая частая в современных стеках и самая контринтуитивная:
    счётчик соединений одинаков у всех, а объём работы внутри них — нет. Отличить
    гипотезы помогает сравнение метрик: равное число соединений при разной загрузке
    указывает на содержимое соединений, а не на распределение.
  ref: "sources/networks.md#M12"

- id: networks-load-balancing-012
  domain: networks
  subtopic: load-balancing
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Периодические `502` без всякой нагрузки. Как это связано с таймаутом простоя
    балансировщика?
  answer: |
    Балансировщик закрывает простаивающее соединение раньше, чем бэкенд, и попадает
    в гонку: он отправляет запрос в соединение, которое бэкенд в этот момент уже
    закрывает. Лечится тем, что **keep-alive на бэкенде делают длиннее**, чем
    таймаут простоя балансировщика.
  explanation: |
    Ошибки редкие, непредсказуемые и не воспроизводятся под нагрузкой — потому что
    нужны именно простаивающие соединения. Порядок настройки контринтуитивен:
    привычка «сделать таймауты одинаковыми» гонку не убирает, нужен именно запас
    на стороне, которая закрывает соединение последней.
  ref: "sources/networks.md#M12"

- id: networks-load-balancing-013
  domain: networks
  subtopic: load-balancing
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Долгоживущее gRPC-соединение рвётся через несколько минут простоя. Что настроить?
  answer: |
    Keepalive на уровне gRPC: периодические служебные кадры удерживают соединение
    живым для промежуточных устройств — балансировщиков, NAT, файрволов, — у которых
    свой таймаут простоя.
  explanation: |
    Это тот же класс проблемы, что обрыв TCP-соединения по таймауту conntrack:
    приложение считает соединение живым, а посредник давно выбросил запись о нём.
    Особенность gRPC в том, что соединение действительно долгое и часто малоактивное,
    поэтому попадает под таймауты чаще прочих. Слишком частый keepalive при этом
    сервер может отвергнуть — интервал согласуют с обеих сторон.
  ref: "sources/networks.md#M12"
