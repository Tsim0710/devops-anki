- id: networks-vpn-tunnels-001
  domain: networks
  subtopic: vpn-tunnels
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Из чего состоит туннель и обязательно ли он шифрует?
  answer: |
    Туннель — это **инкапсуляция**: готовый пакет кладётся внутрь другого пакета.
    Шифрование опционально: GRE и VXLAN не шифруют вовсе, IPsec и WireGuard добавляют
    криптографию поверх.
  explanation: |
    Разделение важно, потому что слова «туннель» и «VPN» употребляют как синонимы.
    Инкапсуляция решает задачу связности — доставить пакеты чужой сети через
    промежуточную. Шифрование решает задачу приватности. Overlay-сети кластера
    используют первое без второго, и это осознанный выбор ради скорости.
  ref: "sources/networks.md#M15"

- id: networks-vpn-tunnels-002
  domain: networks
  subtopic: vpn-tunnels
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что видит провайдер, когда ты работаешь через VPN?
  answer: |
    Адрес VPN-сервера, объём трафика и его тайминги. Не видит: куда ты ходишь внутри
    туннеля, какие домены запрашиваешь и что передаёшь.
  explanation: |
    Приватность здесь смещается, а не появляется: провайдер перестаёт видеть
    назначения, но их видит владелец VPN-сервера. Объём и тайминги при этом остаются
    открытыми всегда, и по ним можно делать выводы о характере активности —
    инкапсуляция скрывает содержимое, но не факт и не форму обмена.
  ref: "sources/networks.md#M15"

- id: networks-vpn-tunnels-003
  domain: networks
  subtopic: vpn-tunnels
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает `AllowedIPs` в конфигурации WireGuard?
  answer: |
    Сразу две вещи: определяет, **какие адреса маршрутизируются** в этот peer,
    и служит фильтром на приёме — пакет с чужим адресом источника, пришедший
    от этого ключа, отбрасывается.
  explanation: |
    Это и есть crypto-routing: соответствие «ключ ↔ разрешённые адреса» заменяет
    и таблицу маршрутов, и правила доступа. Отсюда типичная ошибка при настройке —
    `AllowedIPs` шире, чем нужно, и peer получает право отправлять трафик от чужого
    имени. И отсюда же `0.0.0.0/0` как способ завернуть в туннель весь трафик.
  ref: "sources/networks.md#M15"

- id: networks-vpn-tunnels-004
  domain: networks
  subtopic: vpn-tunnels
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Почему WireGuard быстрее OpenVPN?
  options:
    a: "Он компактен и работает в ядре, без переключений в пользовательское пространство"
    b: "Он умеет больше протоколов и режимов, поэтому лучше оптимизирован"
    c: "Он работает по TCP, а OpenVPN по UDP"
    d: "Он не шифрует служебный трафик"
  answer: a
  explanation: |
    Скорость здесь следствие **малости**, а не богатства возможностей — интуиция
    «мощнее, значит быстрее» тут работает наоборот. Кодовая база в тысячи строк
    вместо десятков тысяч, фиксированный набор криптографии без согласования
    и исполнение в ядре дают и производительность, и меньшую поверхность атаки.
    Работает WireGuard, кстати, только по UDP.
  ref: "sources/networks.md#M15"

- id: networks-vpn-tunnels-005
  domain: networks
  subtopic: vpn-tunnels
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему внутри туннеля обязательно уменьшать MTU?
  answer: |
    Обёртка занимает место: у WireGuard порядка шестидесяти байт. Если внутри туннеля
    оставить MTU 1500, готовый пакет не влезет в кадр внешней сети и будет отброшен
    или фрагментирован.
  explanation: |
    Симптом всегда один и тот же: рукопожатие проходит, мелкие запросы работают,
    а первый крупный ответ виснет без ошибки. Поэтому MTU интерфейса туннеля задают
    явно (обычно 1420), а там, где до него не добраться, правят MSS на лету —
    приём, который в сетевых конфигурациях называют MSS clamping.
  ref: "sources/networks.md#M15"

- id: networks-vpn-tunnels-006
  domain: networks
  subtopic: vpn-tunnels
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем split tunnel отличается от full tunnel?
  answer: |
    Full заворачивает **весь** трафик в туннель. Split — только адреса из заданного
    списка, остальное идёт напрямую через обычный канал.
  explanation: |
    Split быстрее и не грузит VPN-шлюз, но создаёт два одновременных пути наружу,
    и по второму утекает всё, что не попало в список, — включая DNS-запросы
    и трафик по IPv6. Full медленнее и дороже, зато поведение предсказуемо.
    Отсюда правило: split уместен для доступа к внутренним ресурсам, а не как
    средство приватности.
  ref: "sources/networks.md#M15"

- id: networks-vpn-tunnels-007
  domain: networks
  subtopic: vpn-tunnels
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему WireGuard хорошо переживает смену сети на телефоне?
  answer: |
    Он не хранит понятия сессии: peer опознаётся по **ключу**, а адрес и порт
    обновляются при первом же корректно расшифрованном пакете с нового адреса.
    Переподключаться не нужно.
  explanation: |
    Это следствие того, что состояние привязано к криптографической идентичности,
    а не к четвёрке адресов. Классические VPN на TCP при смене сети рвут соединение
    и переустанавливают его заново, что заметно пользователю. Тот же принцип —
    идентификатор вместо адресов — лежит в основе устойчивости QUIC к роумингу.
  ref: "sources/networks.md#M15"

- id: networks-vpn-tunnels-008
  domain: networks
  subtopic: vpn-tunnels
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Туннель поднят, `ping` до внутреннего адреса идёт, а по имени ресурс
    не открывается. Где искать?
  answer: |
    В DNS: туннель завернул маршруты, но резолвер остался прежним, и внутренние имена
    некому разрешать. Нужно отдавать внутренний DNS вместе с конфигурацией туннеля.
  explanation: |
    Это то же разделение слоёв «имя → адрес → маршрут»: маршрутизация починена,
    разрешение имён нет. Обратный случай тоже встречается — резолвер внутренний,
    а маршрута до него нет, и тогда виснет вообще всё. Проверяется по порядку:
    сначала `dig` внутреннего имени, потом `ping` полученного адреса.
  ref: "sources/networks.md#M15"
