# networks / routing
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: networks-routing-001
  domain: networks
  subtopic: routing
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что лежит в строке таблицы маршрутизации?
  answer: |
    Сеть назначения с маской, следующий хоп (шлюз) или пометка «подключена напрямую»,
    исходящий интерфейс и метрика. По этой таблице хост решает, куда отдать пакет.
  explanation: |
    Таблица есть у каждого хоста, а не только у роутеров — просто у обычной машины
    она короткая: своя подсеть напрямую и всё остальное через шлюз. Понимание этого
    снимает вопрос «где смотреть, почему пакет ушёл не туда»: `ip route get <адрес>`
    прямо показывает выбранное решение, не заставляя гадать.
  ref: "sources/networks.md#M4"

- id: networks-routing-002
  domain: networks
  subtopic: routing
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое маршрут по умолчанию и как он записывается?
  answer: |
    `0.0.0.0/0` — маска нулевой длины, под которую подходит любой адрес. Это запись
    «всё, для чего нет более точного маршрута, отдавай сюда».
  explanation: |
    Он работает как последняя строка в списке правил именно из-за нулевой длины
    префикса: при выборе по самому длинному совпадению он проигрывает любому другому
    маршруту. Отсюда и типовая структура таблицы: несколько конкретных маршрутов
    плюс дефолт, а не перечисление всего интернета.
  ref: "sources/networks.md#M4"

- id: networks-routing-003
  domain: networks
  subtopic: routing
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает TTL в IP-заголовке?
  answer: |
    Считает **хопы**: каждый роутер уменьшает значение на единицу, и при нуле пакет
    уничтожается, а отправителю уходит ICMP `Time Exceeded`. Это защита
    от бесконечных петель маршрутизации.
  explanation: |
    Ошибочная петля в таблицах маршрутизации без TTL означала бы пакет, циркулирующий
    вечно и забивающий канал. Побочный эффект механизма оказался полезнее самой защиты:
    на нём построен `traceroute`, который отправляет пакеты с нарастающим TTL и по
    приходящим ICMP-ответам восстанавливает путь.
  ref: "sources/networks.md#M4"

- id: networks-routing-004
  domain: networks
  subtopic: routing
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    В таблице есть маршруты `0.0.0.0/0`, `10.0.0.0/8` и `10.0.5.0/24`.
    Куда пойдёт пакет на `10.0.5.7`?
  options:
    a: "По `10.0.5.0/24` — выигрывает самый длинный совпавший префикс"
    b: "По `0.0.0.0/0` — маршрут по умолчанию имеет приоритет"
    c: "По `10.0.0.0/8` — он был добавлен раньше"
    d: "По маршруту с наименьшей метрикой, длина префикса роли не играет"
  answer: a
  explanation: |
    Правило longest prefix match: из всех подходящих маршрутов выбирается самый
    **конкретный**, и только среди равных по длине сравниваются метрики. Порядок
    добавления не имеет значения вовсе. Отсюда практический приём — чтобы увести
    часть трафика в другой канал, добавляют более длинный префикс, не трогая дефолт.
  ref: "sources/networks.md#M4"

- id: networks-routing-005
  domain: networks
  subtopic: routing
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    `ping` до сервера не проходит, а `ssh` работает. Что это означает?
  answer: |
    Что сеть в порядке, а ICMP где-то фильтруется. `ping` проверяет доступность
    по ICMP, `ssh` — по TCP на порт 22, и это разные протоколы с разными правилами
    на файрволах.
  explanation: |
    Отсюда важный вывод для диагностики: **`ping` не является тестом связности** —
    его отсутствие ничего не доказывает, потому что ICMP массово режут. Проверять
    надо тем протоколом и портом, который реально нужен: `curl`, `nc`, `telnet`.
    Обратное тоже верно — успешный `ping` не значит, что нужный порт открыт.
  ref: "sources/networks.md#M4"

- id: networks-routing-006
  domain: networks
  subtopic: routing
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему значение TTL в ответе не равно числу строк в выводе `traceroute`?
  answer: |
    Потому что это разные величины. TTL в пришедшем пакете — остаток от начального
    значения отправителя. `traceroute` же сам наращивает TTL от единицы и считает
    строки по числу полученных ICMP-ответов.
  explanation: |
    Путаница возникает из-за общего механизма. Практическая польза от TTL в ответе
    другая: по остатку можно прикинуть расстояние до отправителя и заметить аномалию —
    например, что ответы приходят с разной дистанции, а значит балансируются между
    разными хостами.
  ref: "sources/networks.md#M4"

- id: networks-routing-007
  domain: networks
  subtopic: routing
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем статическая маршрутизация отличается от динамической и где какая уместна?
  answer: |
    Статическая — маршруты прописаны руками, не меняются сами и не реагируют на отказ
    канала. Динамическая — роутеры обмениваются информацией протоколом (OSPF, BGP)
    и пересчитывают пути автоматически.
  explanation: |
    Граница проходит по числу путей и по цене простоя: пока путь один, динамика
    не даёт ничего, кроме сложности. Как только появляется резервный канал, статика
    становится опасной — при отказе основного пути никто не переключится, и трафик
    будет уходить в никуда, пока человек не вмешается.
  ref: "sources/networks.md#M4"

- id: networks-routing-008
  domain: networks
  subtopic: routing
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое control plane и data plane применительно к роутеру?
  answer: |
    Control plane **решает**, куда что отправлять: строит таблицу маршрутов, общается
    с соседями по протоколам. Data plane **пересылает** пакеты по уже готовой таблице,
    как можно быстрее.
  explanation: |
    Разделение объясняет наблюдаемое поведение при сбоях: падение процесса
    маршрутизации не рвёт трафик мгновенно — таблица остаётся, и пересылка идёт
    дальше, просто перестаёт обновляться. Ровно та же архитектура работает
    в Kubernetes: kube-proxy это control plane сервисной сети, а пакеты идут
    через ядро.
  ref: "sources/networks.md#M4"

- id: networks-routing-009
  domain: networks
  subtopic: routing
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое асимметричная маршрутизация и почему она ломает связь,
    хотя оба пути рабочие?
  answer: |
    Это когда ответ возвращается не тем путём, каким шёл запрос. Ломает она не
    маршрутизацию, а **stateful-устройства** на пути: файрвол или NAT, не видевший
    начала соединения, считает ответ незапрошенным и отбрасывает его.
  explanation: |
    Симптом коварен тем, что каждый путь по отдельности исправен, и трассировка
    в обе стороны выглядит нормально. Отсюда правило проектирования: там, где стоит
    что-то с состоянием, трафик обязан ходить симметрично — либо через одно устройство,
    либо с синхронизацией таблиц соединений между узлами.
  ref: "sources/networks.md#M4"

- id: networks-routing-010
  domain: networks
  subtopic: routing
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Хост имеет два интерфейса в разных сетях. Почему ответ может уйти
    не в тот интерфейс?
  answer: |
    Потому что выбор исходящего интерфейса делается по **таблице маршрутизации
    для адреса назначения**, а не по тому, откуда пришёл запрос. Ответ уйдёт через
    дефолтный маршрут, даже если запрос пришёл в другой интерфейс.
  explanation: |
    Это создаёт асимметрию на ровном месте, и на многодомных хостах она обычна.
    Решается policy-based routing: отдельная таблица маршрутов и правило «пакеты
    с этим адресом источника — по этой таблице». Тот же механизм нужен виртуалкам
    с двумя сетями в облаке, где обратный трафик иначе уходит не в тот шлюз.
  ref: "sources/networks.md#M4"

- id: networks-routing-011
  domain: networks
  subtopic: routing
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему `ip route get 8.8.8.8` полезнее, чем чтение всей таблицы маршрутов?
  answer: |
    Потому что он показывает **результат решения** для конкретного адреса: выбранный
    маршрут, интерфейс, шлюз и адрес источника — с учётом всех правил и таблиц,
    включая policy-based routing.
  explanation: |
    Читая таблицу глазами, легко ошибиться в применении longest prefix match и вовсе
    не заметить дополнительные таблицы, которые вступают в игру по правилам. Команда
    делает то же, что сделало бы ядро с настоящим пакетом, и потому отвечает
    на вопрос точно. Это тот же принцип, что `kubectl auth can-i` вместо чтения ролей.
  ref: "sources/networks.md#M4"
