# networks / ipv6
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: networks-ipv6-001
  domain: networks
  subtopic: ipv6
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как сокращается запись адреса IPv6?
  answer: |
    Ведущие нули в каждой группе опускаются, а **одна** самая длинная цепочка нулевых
    групп заменяется на `::`. Поэтому `::1` — это loopback, а `::` — «любой адрес».
  explanation: |
    Ограничение «одна цепочка» существенно: два `::` в адресе сделали бы запись
    неоднозначной, ведь восстановить, сколько нулей в каждой, стало бы невозможно.
    Практически из сокращений полезнее всего узнавать типы адресов по началу:
    `fe80::` — link-local, `fc00::/7` — приватные, `2000::/3` — глобальные.
  ref: "sources/networks.md#M8"

- id: networks-ipv6-002
  domain: networks
  subtopic: ipv6
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое SLAAC и чем он отличается от DHCP?
  answer: |
    Stateless Address Autoconfiguration: хост слышит анонс роутера с префиксом сети
    и **сам** формирует себе адрес. Сервер, раздающий и учитывающий адреса,
    при этом не нужен.
  explanation: |
    Разница в том, кто владеет учётом: в DHCP сервер помнит, кому что выдал,
    в SLAAC такого учёта нет вовсе. Отсюда практическое неудобство — сопоставить
    адрес с устройством задним числом сложнее, поэтому в корпоративных сетях
    нередко используют DHCPv6 вместе со SLAAC.
  ref: "sources/networks.md#M8"

- id: networks-ipv6-003
  domain: networks
  subtopic: ipv6
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое link-local адрес в IPv6 и когда он есть у интерфейса?
  answer: |
    Адрес из `fe80::/10`, действующий только в пределах своего сегмента. Он появляется
    на интерфейсе **всегда**, автоматически, даже если никакой другой адрес не выдан.
  explanation: |
    На нём держится вся служебная механика IPv6: обнаружение соседей, анонсы роутера,
    сам SLAAC. Поэтому «интерфейс без адреса» в IPv6 не бывает, и наличие только
    `fe80::` — это не признак неисправности, а нормальное состояние сегмента
    без глобальной адресации.
  ref: "sources/networks.md#M8"

- id: networks-ipv6-004
  domain: networks
  subtopic: ipv6
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое Happy Eyeballs и когда он работает?
  answer: |
    Стратегия dual-stack клиента: он пробует IPv6 и IPv4 почти одновременно,
    с небольшой форой для v6, и берёт то соединение, которое установилось первым.
    Работает при **каждом** соединении, а не только при отказе.
  explanation: |
    Механизм появился потому, что «предпочитать v6» без страховки давало многосекундные
    зависания там, где v6 объявлен, но не работает. Отсюда важное следствие для
    диагностики: клиент мог уехать по IPv6 незаметно для тебя, и разбирать проблему
    только по IPv4-пути бессмысленно.
  ref: "sources/networks.md#M8"

- id: networks-ipv6-005
  domain: networks
  subtopic: ipv6
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему в IPv6 нет NAT и что заменило «щит» из приватных адресов?
  answer: |
    Адресов хватает, и каждый хост может иметь глобальный адрес — трансляция не нужна.
    Роль защиты берёт на себя **файрвол**: по умолчанию входящие соединения
    запрещены, исходящие разрешены.
  explanation: |
    Это делает явным то, что в IPv4 было побочным эффектом: NAT никогда не был
    средством защиты, просто отсутствие трансляции мешало входящим соединениям.
    Отсюда практический риск при включении IPv6 — хост, который в IPv4 был закрыт
    «по умолчанию», в IPv6 оказывается доступен из интернета напрямую.
  ref: "sources/networks.md#M8"

- id: networks-ipv6-006
  domain: networks
  subtopic: ipv6
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему в IPv6 отказались от broadcast?
  answer: |
    Его заменил multicast: служебные сообщения адресуются конкретным группам —
    «всем узлам сегмента», «всем роутерам». Устройства, не входящие в группу,
    пакет не обрабатывают.
  explanation: |
    Broadcast заставлял **каждое** устройство сегмента поднимать пакет до обработки,
    даже когда он его не касался. Multicast снимает эту нагрузку. На нём же построен
    аналог ARP — Neighbor Discovery, который спрашивает не «всех», а группу,
    вычисленную из искомого адреса.
  ref: "sources/networks.md#M8"

- id: networks-ipv6-007
  domain: networks
  subtopic: ipv6
  difficulty: senior
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    VPN поднят, но часть трафика идёт мимо туннеля, и гео-блок срабатывает.
    Как это связано с IPv6?
  answer: |
    У домена есть запись `AAAA`, у клиента рабочий IPv6, а туннель заворачивает
    **только IPv4**. Happy Eyeballs предпочитает v6, и соединение уходит напрямую,
    минуя VPN, со своим настоящим адресом.
  explanation: |
    Утечка не выглядит как поломка: VPN подключён, интерфейс поднят, часть сайтов
    даже видит нужную страну. Проверяется просто — сравнить, какой адрес видит
    внешний сервис, и посмотреть, есть ли у домена `AAAA`. Лечится либо заворачиванием
    IPv6 в туннель, либо его отключением на время VPN.
  ref: "sources/networks.md#M8"

- id: networks-ipv6-008
  domain: networks
  subtopic: ipv6
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что даёт egress-only internet gateway в облаке и зачем он нужен именно в IPv6?
  answer: |
    Разрешает хостам с глобальными IPv6-адресами выходить в интернет, но запрещает
    входящие соединения. Это замена NAT-шлюзу, роль которого в IPv4 играл сам факт
    приватной адресации.
  explanation: |
    В IPv4 приватный адрес автоматически означал недостижимость снаружи, и NAT-шлюз
    решал обе задачи сразу. В IPv6 адрес глобален, поэтому «выпустить наружу»
    и «не пускать внутрь» приходится разделять явно. Забыть об этом — значит выставить
    внутренние машины в интернет, ничего специально не открывая.
  ref: "sources/networks.md#M8"
