# networks / dhcp
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: networks-dhcp-001
  domain: networks
  subtopic: dhcp
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Из каких четырёх шагов состоит получение адреса по DHCP?
  answer: |
    **DORA**: Discover (клиент ищет сервер, широковещательно) → Offer (сервер предлагает
    адрес) → Request (клиент просит именно этот адрес, тоже широковещательно) →
    Ack (сервер подтверждает аренду).
  explanation: |
    Первый шаг обязан быть широковещательным по простой причине: у клиента ещё нет
    ни своего адреса, ни адреса сервера — обратиться точечно не к кому. Кроме адреса
    в Ack приезжают маска, шлюз, DNS-серверы и срок аренды, то есть вся базовая
    конфигурация сети сразу.
  ref: "sources/networks.md#M3"

- id: networks-dhcp-002
  domain: networks
  subtopic: dhcp
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Клиент не получил адрес по DHCP. Как отличить «запрос не долетел до сервера»
    от «сервер отказал»?
  answer: |
    Смотреть, был ли **Offer**. Дошёл Discover и пришёл Offer, но аренды нет — проблема
    на стороне выбора или подтверждения. Offer'а нет вовсе — запрос не доехал:
    не работает сервер, не настроен релей, режется broadcast.
  explanation: |
    Это та же логика «ответ против тишины», что с `connection refused` и таймаутом:
    наличие любого ответа доказывает, что путь до собеседника есть, и сразу отсекает
    половину гипотез. Проверяется дампом на интерфейсе клиента по портам 67 и 68 —
    видно, на каком именно шаге DORA обмен оборвался.
  ref: "sources/networks.md#M3"

- id: networks-dhcp-003
  domain: networks
  subtopic: dhcp
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему шаг Request отправляется широковещательно, хотя клиент уже знает,
    какой сервер ему ответил?
  answer: |
    Чтобы сообщить **остальным** DHCP-серверам, что их предложения отклонены,
    и они вернули свои адреса в пул. Точечный запрос оставил бы чужие адреса
    зарезервированными впустую.
  explanation: |
    В сети может быть несколько серверов, и каждый на Discover придержал свой адрес.
    Широковещательный Request решает задачу освобождения одним сообщением, без
    отдельного протокола отказа. Это же объясняет, зачем в Request явно указывается
    идентификатор выбранного сервера — иначе адресаты не поняли бы, кого выбрали.
  ref: "sources/networks.md#M3"

- id: networks-dhcp-004
  domain: networks
  subtopic: dhcp
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Broadcast не проходит через роутер. Как тогда работает DHCP, если сервер
    в другой подсети?
  answer: |
    Через DHCP-релей: роутер или выделенный агент принимает широковещательный запрос,
    заворачивает его в юникаст и пересылает серверу, а ответ отдаёт обратно клиенту.
  explanation: |
    Релей заодно сообщает серверу, из какой подсети пришёл запрос, — иначе тот
    не смог бы выбрать правильный пул адресов. Отсюда типичная поломка при добавлении
    новой подсети: релей не настроен, клиенты получают link-local адреса,
    и симптом выглядит как «сеть не работает» ровно в одном сегменте.
  ref: "sources/networks.md#M3"

- id: networks-dhcp-005
  domain: networks
  subtopic: dhcp
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое срок аренды и когда клиент начинает её продлевать?
  answer: |
    Время, на которое адрес закреплён за клиентом. Продление начинается примерно
    на половине срока: клиент **юникастом** обращается к своему серверу, и обмен
    сокращается до Request и Ack.
  explanation: |
    Раннее продление даёт запас: если сервер не отвечает, у клиента остаётся половина
    срока на повторные попытки и на поиск другого сервера, прежде чем адрес истечёт.
    Отсюда и практический смысл длины аренды: короткая позволяет быстро переиспользовать
    адреса в динамичной сети, длинная снижает нагрузку и переживает падение сервера.
  ref: "sources/networks.md#M3"

- id: networks-dhcp-006
  domain: networks
  subtopic: dhcp
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как закрепить за устройством постоянный адрес, не настраивая его вручную?
  answer: |
    Резервированием на DHCP-сервере по **MAC-адресу**: сервер всегда выдаёт этому
    MAC один и тот же IP. Настройки клиента при этом не меняются.
  explanation: |
    Работает потому, что MAC постоянен и принадлежит железу, а IP арендуется —
    привязка идёт к неизменной величине. Преимущество перед статикой на клиенте
    в том, что конфигурация остаётся в одном месте: маска, шлюз и DNS можно поменять
    централизованно, не обходя устройства.
  ref: "sources/networks.md#M3"

- id: networks-dhcp-007
  domain: networks
  subtopic: dhcp
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Чем опасен посторонний DHCP-сервер в сети и как с этим борются?
  answer: |
    Он может раздать свой адрес как шлюз и как DNS — и весь трафик клиентов пойдёт
    через него. Протокол не аутентифицирует сервер, клиент принимает первое пришедшее
    предложение. Борются на коммутаторах, разрешая ответы DHCP только с доверенных
    портов.
  explanation: |
    Чаще это не атака, а случайность: принесённый роутер с включённым по умолчанию
    DHCP кладёт сегмент за минуты. Симптом характерный — часть клиентов получает
    адреса из неизвестного диапазона. Общая мораль та же, что с ARP: протоколы
    локальной сети построены на доверии, и защищают их внешние механизмы.
  ref: "sources/networks.md#M3"

- id: networks-dhcp-008
  domain: networks
  subtopic: dhcp
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Устройство после перезагрузки получило другой IP, хотя аренда ещё не истекла.
    Почему так бывает?
  answer: |
    Клиент не сохранил прежнюю аренду и начал с Discover, а сервер уже отдал этот
    адрес другому — либо пул мал и переиспользуется быстро, либо изменился
    идентификатор клиента, по которому сервер его узнаёт.
  explanation: |
    Последнее — неочевидная причина: сервер опознаёт клиента не только по MAC,
    но и по client identifier, который некоторые системы формируют по-своему.
    Смена образа или сетевой конфигурации меняет идентификатор, и для сервера
    это уже другой клиент. Отсюда практика: там, где адрес важен, его резервируют,
    а не полагаются на устойчивость аренды.
  ref: "sources/networks.md#M3"
