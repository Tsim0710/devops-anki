# networks / nat
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: networks-nat-001
  domain: networks
  subtopic: nat
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Зачем существует NAT?
  answer: |
    Чтобы много хостов с приватными адресами выходили в интернет через один публичный.
    Появился как ответ на нехватку адресов IPv4 и заодно скрыл внутреннюю адресацию.
  explanation: |
    Ключевое слово — «заодно»: сокрытие адресов побочный эффект, а не защита. NAT
    не проверяет содержимое и не решает, кому можно, а кому нет; ощущение безопасности
    даёт тот факт, что снаружи нельзя инициировать соединение — но это следствие
    отсутствия трансляции, а не политика.
  ref: "sources/networks.md#M5"

- id: networks-nat-002
  domain: networks
  subtopic: nat
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем SNAT отличается от DNAT?
  answer: |
    SNAT переписывает **источник** — так внутренние хосты выходят наружу под общим
    адресом. DNAT переписывает **назначение** — так внешний запрос попадает
    на внутренний сервер. Проброс порта это DNAT.
  explanation: |
    Направление подмены задаёт, кто инициатор: SNAT нужен для исходящих соединений,
    DNAT — для входящих. В Kubernetes встречаются оба: `-p 8080:80` у Docker и NodePort
    это DNAT, а выход подов в интернет через адрес узла — SNAT. Обратный путь в обоих
    случаях обеспечивает таблица трансляций.
  ref: "sources/networks.md#M5"

- id: networks-nat-003
  domain: networks
  subtopic: nat
  difficulty: middle
  source: [theory, interview]
  type: basic
  verified: false
  prompt: |
    Как NAT понимает, какому внутреннему хосту вернуть ответ?
  answer: |
    По таблице соединений (conntrack): при первом пакете он запоминает исходную
    четвёрку `srcIP:srcPort → dstIP:dstPort` и её подменённый вариант. Ответ ищется
    в таблице и переписывается обратно.
  explanation: |
    Отсюда следует, что NAT принципиально **stateful** — без памяти о соединении
    ответ вернуть некуда. И отсюда два практических вывода: таблица конечна и может
    переполниться, а перезапуск устройства или переезд на другой узел без переноса
    таблицы обрывает все установленные соединения разом.
  ref: "sources/networks.md#M5"

- id: networks-nat-004
  domain: networks
  subtopic: nat
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое эфемерные порты и как они связаны с NAT?
  answer: |
    Диапазон портов, из которого хост берёт порт источника для исходящих соединений
    (в Linux обычно 32768–60999). NAT использует их для различения соединений разных
    внутренних хостов под одним публичным адресом.
  explanation: |
    Именно поэтому один адрес обслуживает тысячи клиентов: уникальна вся четвёрка,
    а не адрес. Отсюда же потолок: число одновременных соединений к **одному и тому же**
    сервису с одного публичного адреса ограничено размером диапазона, и на крупных
    NAT это становится реальным пределом.
  ref: "sources/networks.md#M5"

- id: networks-nat-005
  domain: networks
  subtopic: nat
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое CGNAT и почему из-за него телефон «не виден» снаружи?
  answer: |
    Carrier-Grade NAT — трансляция на стороне провайдера: абоненты получают приватные
    адреса, а наружу выходят через общий пул. Входящее соединение установить нельзя —
    трансляции для него не существует.
  explanation: |
    Отсюда несколько знакомых следствий: проброс порта на домашнем роутере перестаёт
    работать, P2P-соединения требуют посредника, а бан по IP задевает сразу многих
    абонентов одного провайдера. Это же объясняет, почему один и тот же публичный адрес
    в логах может принадлежать сотням разных пользователей.
  ref: "sources/networks.md#M5"

- id: networks-nat-006
  domain: networks
  subtopic: nat
  difficulty: middle
  source: theory
  type: mcq
  verified: false
  prompt: |
    Соединения массово рвутся, в логах ядра — сообщения о переполнении таблицы
    conntrack. Что произошло?
  options:
    a: "Кончились записи в таблице соединений, новые соединения отбрасываются"
    b: "Закончились публичные IP-адреса в пуле NAT"
    c: "Маршрут до внешней сети стал недоступен"
    d: "Превышен MTU, и пакеты фрагментируются"
  answer: a
  explanation: |
    Таблица соединений конечна, и каждое соединение — включая незакрытые и висящие
    в ожидании таймаута — занимает в ней запись. Переполнение проявляется массовым
    и внезапным отказом новых соединений при полностью исправной сети. Лечится
    увеличением размера таблицы, сокращением таймаутов и, главное, поиском того,
    кто создаёт соединения и не закрывает их.
  ref: "sources/networks.md#M5"

- id: networks-nat-007
  domain: networks
  subtopic: nat
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как настроить доступ снаружи к сервису во внутренней сети?
  answer: |
    Пробросом порта — это DNAT вручную: правило «пакеты на публичный адрес и порт
    переписывать на внутренний адрес и порт». Обратный путь обеспечит запись
    в таблице соединений.
  explanation: |
    Проброс — это то же самое, что делает `Service type: NodePort` и `docker run -p`,
    только заданное явно. Отсюда и общий класс ошибок: правило есть, а сервис
    недоступен, потому что приложение слушает `127.0.0.1` вместо `0.0.0.0` —
    трансляция отработала, но отдавать пакет некому.
  ref: "sources/networks.md#M5"

- id: networks-nat-008
  domain: networks
  subtopic: nat
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Почему NAT ломает P2P-соединения и что такое NAT traversal?
  answer: |
    Оба участника за NAT, и ни один не может инициировать входящее соединение —
    трансляции нет, пока изнутри не ушёл пакет. NAT traversal обходит это: стороны
    одновременно шлют пакеты наружу, открывая трансляции навстречу друг другу,
    с помощью внешнего посредника.
  explanation: |
    Успех зависит от того, насколько предсказуемо NAT выбирает внешний порт: если он
    выделяет разный порт для каждого нового назначения, угадать его снаружи нельзя,
    и приходится гонять трафик через ретранслятор. Отсюда практика голосовых
    и игровых сервисов — держать серверы-посредники на случай, когда прямое
    соединение не установилось.
  ref: "sources/networks.md#M5"

- id: networks-nat-009
  domain: networks
  subtopic: nat
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему NAT нельзя считать средством защиты?
  answer: |
    Он не принимает решений о доступе: не различает разрешённое и запрещённое,
    не смотрит содержимое, не защищает от исходящих соединений вредоноса. Всё,
    что он даёт, — отсутствие входящих соединений как побочный эффект отсутствия
    трансляции.
  explanation: |
    Практическое подтверждение: заражённая машина за NAT свободно выходит наружу
    и получает команды по установленному ею же соединению. Именно поэтому в IPv6,
    где адресов хватает и NAT не нужен, защита не исчезла — её всегда выполнял
    файрвол, а не трансляция адресов.
  ref: "sources/networks.md#M5"

- id: networks-nat-010
  domain: networks
  subtopic: nat
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Из внутренней сети обращение к своему же сервису по внешнему адресу
    не работает. Что это за случай?
  answer: |
    Hairpin NAT (NAT loopback): пакет уходит на публичный адрес и должен вернуться
    в ту же сеть. Многие устройства такой разворот не поддерживают, и соединение
    не устанавливается, хотя снаружи всё работает.
  explanation: |
    Симптом характерный и сбивающий с толку: коллеги снаружи заходят нормально,
    а из офиса или из того же кластера — нет. Причина в том, что трансляция должна
    подменить и источник, и назначение сразу, иначе ответ пойдёт напрямую и не совпадёт
    с ожиданиями клиента. Обычное решение — разрешение внутреннего имени в приватный
    адрес отдельной DNS-зоной.
  ref: "sources/networks.md#M5"
