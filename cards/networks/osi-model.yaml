# networks / osi-model
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: networks-osi-model-001
  domain: networks
  subtopic: osi-model
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Какая единица данных и какой адрес живут на каждом из четырёх уровней TCP/IP?
  answer: |
    Application — данные, адрес это имя или URL. Transport — сегмент (TCP)
    или датаграмма (UDP), адрес — **порт**. Internet — пакет, адрес — **IP**.
    Link — кадр (frame), адрес — **MAC**.
  explanation: |
    Три уровня адресации существуют потому, что отвечают на разные вопросы: MAC —
    «кому передать прямо сейчас, в этом сегменте», IP — «куда доставить в итоге»,
    порт — «какому процессу отдать на месте». Отсюда и разделение труда устройств:
    switch читает MAC, роутер — IP, L4-балансировщик видит IP и порт,
    L7-балансировщик читает уже HTTP.
  ref: "sources/networks.md#M1"

- id: networks-osi-model-002
  domain: networks
  subtopic: osi-model
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое инкапсуляция и как выглядит готовый кадр изнутри?
  answer: |
    Добавление заголовка своего уровня при движении вниз по стеку. Матрёшка:
    `ETH[ IP[ TCP[ HTTP ] ] ]`. На приёме заголовки снимаются в обратном порядке —
    это декапсуляция.
  explanation: |
    Каждый уровень работает только со своим заголовком и считает содержимое
    непрозрачным грузом — именно поэтому смена Wi-Fi на кабель ничего не меняет
    для TCP и HTTP. Практическая польза модели видна в `tcpdump`: вывод читается
    ровно по этим слоям, от MAC к IP, портам и флагам.
  ref: "sources/networks.md#M1"

- id: networks-osi-model-003
  domain: networks
  subtopic: osi-model
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое 4-tuple и что он однозначно определяет?
  answer: |
    Четвёрка `srcIP:srcPort → dstIP:dstPort`. Она однозначно определяет **соединение**:
    именно по ней ядро понимает, какому сокету принадлежит пришедший пакет.
  explanation: |
    Отсюда объясняется многое сразу. Один сервер держит тысячи соединений на порту 80,
    потому что различаются они не портом назначения, а всей четвёркой. Клиент берёт
    случайный эфемерный порт как обратный адрес. И на той же четвёрке держится NAT:
    чтобы вернуть ответ, трансляция обязана помнить всю четвёрку, а не один адрес.
  ref: "sources/networks.md#M1"

- id: networks-osi-model-004
  domain: networks
  subtopic: osi-model
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем порт назначения отличается по смыслу от порта источника?
  answer: |
    Порт назначения — «куда я стучусь», он общеизвестен (80 — HTTP, 443 — HTTPS).
    Порт источника — свой, выбирается случайно из эфемерного диапазона и служит
    обратным адресом для ответа.
  explanation: |
    Асимметрия объясняет вид дампа: исходящее соединение выглядит как
    `клиент:51423 → сервер:443`, а ответ — зеркально. Она же объясняет, почему
    на клиенте нечего «открывать» в файрволе для исходящих соединений: ответ
    возвращается на порт, который уже занят установленным соединением, и stateful
    файрвол пропускает его как часть известного потока.
  ref: "sources/networks.md#M1"

- id: networks-osi-model-005
  domain: networks
  subtopic: osi-model
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Пакет идёт от твоего ноутбука к серверу через пять роутеров. Что меняется
    на каждом хопе?
  options:
    a: "MAC-адреса источника и назначения; IP остаются прежними"
    b: "IP-адреса; MAC остаются прежними"
    c: "И MAC, и IP меняются на каждом хопе"
    d: "Ничего: заголовки переписывает только NAT"
  answer: a
  explanation: |
    MAC локален — он отвечает на вопрос «кому передать в этом сегменте», и на каждом
    участке пути участники разные, поэтому оба MAC переписываются. IP глобален,
    он говорит «куда в итоге», и меняться не должен — иначе ответ некуда возвращать.
    Исключение ровно одно: NAT, который переписывает IP осознанно и обязан помнить
    трансляцию, чтобы вернуть ответ.
  ref: "sources/networks.md#M1"

- id: networks-osi-model-006
  domain: networks
  subtopic: osi-model
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое MTU и MSS, и как они связаны?
  answer: |
    MTU — максимальный полезный груз кадра, в Ethernet 1500 байт. MSS — максимальный
    кусок данных в TCP-сегменте: `MTU − 40` (20 байт заголовка IP + 20 TCP) ≈ 1460.
    MSS объявляется в SYN при установке соединения.
  explanation: |
    Разделение решает задачу заранее: TCP сам нарезает поток так, чтобы IP не пришлось
    фрагментировать пакеты постфактум. Фрагментация дорога и хрупка — потеря одного
    фрагмента убивает весь пакет, а многие сети её просто отбрасывают. Отсюда правило:
    любая обёртка (VXLAN, VPN, туннель) уменьшает доступный MTU, и об этом надо
    сказать явно.
  ref: "sources/networks.md#M1"

- id: networks-osi-model-007
  domain: networks
  subtopic: osi-model
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    На каком уровне работают switch, router, L4-балансировщик и L7-балансировщик?
  answer: |
    Switch — L2, решает по MAC. Router — L3, по IP. L4-балансировщик видит IP и порт.
    L7-балансировщик читает содержимое: HTTP-заголовки, URL, домен.
  explanation: |
    Уровень определяет и возможности, и цену: чем выше, тем больше устройство понимает
    и тем дороже обработка каждого пакета. Отсюда практические следствия — L4 не умеет
    раздавать по путям и не различает домены, зато дёшев и работает с любым протоколом;
    L7 умеет всё это, но обязан терминировать соединение и разбирать протокол.
  ref: "sources/networks.md#M1"

- id: networks-osi-model-008
  domain: networks
  subtopic: osi-model
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Как читается строка `tcpdump`: где источник, где назначение?
  answer: |
    Формат всегда **источник > назначение**, на каждом уровне:
    `srcMAC > dstMAC`, затем `srcIP.srcPort > dstIP.dstPort`, затем флаги TCP.
  explanation: |
    Знание порядка снимает половину трудностей чтения дампа: направление пакета видно
    сразу, без размышлений. Флаг `-e` добавляет уровень MAC — он нужен, чтобы увидеть,
    что второй MAC в кадре принадлежит роутеру, а не серверу назначения: типичный
    момент, где путаются, глядя на IP и MAC как на пару адресов одного участника.
  ref: "sources/networks.md#M1"

- id: networks-osi-model-009
  domain: networks
  subtopic: osi-model
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Зачем нужны две модели — OSI на семь уровней и TCP/IP на четыре?
  answer: |
    OSI — учебная и терминологическая: она даёт общий язык («проблема на L7»,
    «L4-балансировщик»). TCP/IP описывает то, что реально реализовано в стеке.
    Уровни 5–7 OSI в практике слиты в один Application.
  explanation: |
    Путаница возникает, когда семиуровневую модель пытаются найти в коде: сессионного
    и представительского уровней как отдельных сущностей в стеке нет. При этом OSI
    остаётся полезной именно как словарь — «L7-политика», «L3-связность»,
    «L2-сегмент» понятны всем и точно указывают на слой проблемы.
  ref: "sources/networks.md#M1"

- id: networks-osi-model-010
  domain: networks
  subtopic: osi-model
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Почему инкапсуляция делает возможным туннелирование?
  answer: |
    Потому что каждый уровень считает содержимое непрозрачным грузом. Готовый
    IP-пакет можно положить внутрь другого IP-пакета как обычные данные — снаружи
    это выглядит рядовым трафиком, а внутри едет целая сеть.
  explanation: |
    На этом стоят VPN, VXLAN и GRE: overlay-сеть не требует ничего от нижележащей,
    кроме доставки пакетов между двумя точками. Плата всегда одна и та же — размер
    обёртки съедает MTU, и незаданный явно MTU внутри туннеля даёт классическую
    поломку «мелкое ходит, крупное виснет».
  ref: "sources/networks.md#M1"
