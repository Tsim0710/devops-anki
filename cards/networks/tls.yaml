# networks / tls
# Многострочные поля — только | (literal). Значения с двоеточием — в кавычках.
# id вечен: он же GUID заметки в Anki.

- id: networks-tls-001
  domain: networks
  subtopic: tls
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что происходит в `ClientHello` и `ServerHello`?
  answer: |
    Клиент присылает поддерживаемые версии TLS и шифронаборы, случайное число
    и **SNI** — имя запрашиваемого домена. Сервер выбирает версию и набор, отдаёт
    свой сертификат и своё случайное число.
  explanation: |
    Первые сообщения идут открытым текстом — шифровать ещё нечем, ключ не выработан.
    Отсюда два практических следствия: имя домена в SNI видно наблюдателю,
    и именно по нему сервер выбирает, какой из своих сертификатов предъявить,
    когда на одном адресе живут десятки доменов.
  ref: "sources/networks.md#M9"

- id: networks-tls-002
  domain: networks
  subtopic: tls
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое цепочка доверия сертификатов?
  answer: |
    Сертификат сервера подписан промежуточным центром, тот — корневым. Корневые
    сертификаты уже лежат в хранилище операционной системы или браузера. Клиент
    проверяет подписи по цепочке до известного ему корня.
  explanation: |
    Доверие переносится по подписи, а не по факту получения сертификата. Отсюда
    и смысл самоподписанного сертификата: он валиден криптографически, но замыкается
    сам на себя и ни к какому известному корню не ведёт — поэтому клиент его отвергает.
  ref: "sources/networks.md#M9"

- id: networks-tls-003
  domain: networks
  subtopic: tls
  difficulty: junior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что делает `curl -k` и почему это опасно вне отладки?
  answer: |
    Отключает проверку сертификата: соединение остаётся зашифрованным, но клиент
    больше не убеждается, что говорит с тем, с кем думает. Защита от перехвата
    исчезает полностью.
  explanation: |
    Шифрование без аутентификации бесполезно против активного посредника: он
    установит с тобой свой шифрованный канал и будет читать всё в открытую.
    Отсюда правило — `-k` уместен только чтобы **подтвердить**, что проблема именно
    в сертификате, и никогда как способ «починить» ошибку в скрипте.
  ref: "sources/networks.md#M9"

- id: networks-tls-004
  domain: networks
  subtopic: tls
  difficulty: middle
  source: [theory, interview]
  type: mcq
  verified: false
  prompt: |
    Что в TLS обеспечивает шифрование, а что — аутентификацию сервера?
  options:
    a: "Шифрование даёт обмен ключами (ECDHE), аутентификацию — сертификат"
    b: "И то и другое обеспечивает сертификат"
    c: "Шифрование даёт сертификат, аутентификацию — обмен ключами"
    d: "И то и другое обеспечивает выбранный шифронабор"
  answer: a
  explanation: |
    Это две независимые задачи, и их постоянно смешивают. Обмен ключами даёт общий
    секрет, которого не знает наблюдатель, — но сам по себе он прекрасно работает
    и с посредником. Сертификат доказывает, что публичный ключ принадлежит именно
    этому домену. Отсюда и понятно, почему `curl -k` оставляет шифрование, убирая
    только вторую половину.
  ref: "sources/networks.md#M9"

- id: networks-tls-005
  domain: networks
  subtopic: tls
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Браузер открывает сайт нормально, а `curl` ругается на сертификат. Причина?
  answer: |
    Скорее всего сервер не отдаёт **промежуточный** сертификат. Браузеры умеют
    догружать недостающее звено сами, `curl` и большинство библиотек — нет.
  explanation: |
    Симптом коварен тем, что «у меня в браузере работает» создаёт ложное ощущение
    исправности, а ломаются при этом интеграции и мобильные клиенты. Проверяется
    через `openssl s_client -showcerts`: в правильно настроенном сервере цепочка
    приходит целиком, до корня. Чинится на сервере, добавлением полной цепочки в конфиг.
  ref: "sources/networks.md#M9"

- id: networks-tls-006
  domain: networks
  subtopic: tls
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Что провайдер или DPI видит в HTTPS-соединении?
  answer: |
    Адрес назначения, порт, объёмы и тайминги трафика и **имя домена в SNI**.
    Не видит: путь URL, заголовки, тело запроса и ответа.
  explanation: |
    Отсюда и техника блокировок по SNI: содержимое читать не нужно, достаточно имени
    в открытой части рукопожатия. Это же объясняет, зачем разрабатывают шифрование SNI —
    закрыть последнее, что осталось открытым. И это же ставит границу приватности:
    HTTPS скрывает содержание разговора, но не факт обращения к сайту.
  ref: "sources/networks.md#M9"

- id: networks-tls-007
  domain: networks
  subtopic: tls
  difficulty: middle
  source: theory
  type: basic
  verified: false
  prompt: |
    Чем TLS 1.3 лучше 1.2 с практической точки зрения?
  answer: |
    Рукопожатие короче — один круговой обмен вместо двух, значит соединение
    устанавливается быстрее. Выброшены устаревшие шифронаборы, и больше часть
    рукопожатия шифруется.
  explanation: |
    Экономия одного RTT заметна при большом числе коротких соединений и на длинных
    маршрутах — на межконтинентальном канале это сотня миллисекунд на каждое
    соединение. Сокращение списка шифронаборов не менее важно: значительная часть
    исторических уязвимостей TLS была не в протоколе, а в возможности договориться
    на слабый вариант.
  ref: "sources/networks.md#M9"

- id: networks-tls-008
  domain: networks
  subtopic: tls
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как работает корпоративный MITM-прокси и почему он не ломает браузер?
  answer: |
    Прокси терминирует TLS у себя и выпускает сертификаты на лету своим внутренним
    центром. Работает это лишь потому, что корневой сертификат этого центра
    **заранее установлен** на устройства сотрудников.
  explanation: |
    Это доказательство от противного: перехват возможен только там, где кто-то
    добавил доверие. Без установленного корня браузер немедленно ругается,
    и в этом ценность модели. Отсюда же понятно, почему pinning ломает такие прокси:
    приложение доверяет не хранилищу системы, а конкретному сертификату.
  ref: "sources/networks.md#M9"

- id: networks-tls-009
  domain: networks
  subtopic: tls
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Как устроен выпуск сертификата по ACME и почему валидация ломается
    при принудительном HTTPS?
  answer: |
    Центр проверяет, что домен твой: либо кладёшь файл по пути
    `/.well-known/acme-challenge/` и он забирает его **по HTTP**, либо публикуешь
    запись в DNS. Редирект всего HTTP на HTTPS ломает первый способ.
  explanation: |
    Парадокс в том, что чем строже настроен вход, тем вернее не выпускается
    сертификат. Отсюда два выхода: исключить путь challenge из редиректа или
    перейти на DNS-валидацию — она не зависит от веб-сервера вовсе и потому
    единственная годится для wildcard-сертификатов.
  ref: "sources/networks.md#M9"

- id: networks-tls-010
  domain: networks
  subtopic: tls
  difficulty: senior
  source: theory
  type: basic
  verified: false
  prompt: |
    Что такое mTLS и чем он отличается от обычного TLS?
  answer: |
    Взаимная аутентификация: сертификат предъявляет не только сервер, но и клиент.
    Сервер проверяет его по своему центру и по нему же определяет, кто именно
    к нему пришёл.
  explanation: |
    Обычный TLS отвечает на вопрос «тот ли это сервер», mTLS добавляет «а кто клиент»,
    и заменяет собой пароли и токены между сервисами. На этом стоит zero-trust:
    доверие следует из криптографической идентичности, а не из того, что запрос
    пришёл из внутренней сети. Ровно это и делает service mesh автоматически.
  ref: "sources/networks.md#M9"

- id: networks-tls-011
  domain: networks
  subtopic: tls
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Сертификат истёк вчера, но часть клиентов продолжает работать. Почему?
  answer: |
    Они держат уже установленные соединения — срок проверяется при рукопожатии,
    а не постоянно. Плюс возможны клиенты с отключённой проверкой или с собственным
    хранилищем, где лежит старая копия.
  explanation: |
    Отсюда характерная динамика инцидента: сначала «всё работает», потом отказы
    нарастают по мере переподключений, и связь с истечением сертификата теряется
    во времени. Тот же механизм объясняет, почему истёкший сертификат иногда
    обнаруживают не сразу, а по нарастающему потоку жалоб.
  ref: "sources/networks.md#M9"

- id: networks-tls-012
  domain: networks
  subtopic: tls
  difficulty: senior
  source: core
  type: basic
  verified: false
  prompt: |
    Что такое OCSP stapling и какую проблему отзыва сертификатов он решает?
  answer: |
    Сервер сам периодически получает у центра подтверждение, что его сертификат
    не отозван, и прикладывает его к рукопожатию. Клиенту не нужно ходить
    к центру самому.
  explanation: |
    Без stapling проверка отзыва создаёт две беды: задержку на каждое первое
    соединение и утечку приватности — центр видит, кто и на какие сайты заходит.
    Поэтому браузеры массово стали её пропускать, и отзыв фактически перестал
    работать. Отсюда же практический вывод индустрии — короткие сроки жизни
    сертификатов надёжнее механизма отзыва.
  ref: "sources/networks.md#M9"
