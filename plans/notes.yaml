# Текстовая часть карт покрытия. Таблицы и цифры генерируются из build/manifest.json,
# здесь только то, что руками: на чём держится домен и что нашли аудиты.
# Регенерация: python tools/coverage.py

k8s:
  title: Kubernetes
  pillars: |
    - **Адрес объекта против его идентичности.** GUID заметки считается из `id`,
      а Kubernetes связывает состояние с конфигурацией по адресу — отсюда вся
      механика `moved`, `state mv` и ключей `for_each`, и отсюда же правило
      «id вечен».
    - **Кто актор.** Половина вопросов сводится к тому, кто именно выполняет
      действие: kubelet рестартит контейнер, контроллер пересоздаёт под, scheduler
      только пишет `nodeName`, endpoints-контроллер убирает адрес из EndpointSlice.
    - **Брони против факта.** Scheduler, quota и autoscaling считают `requests`,
      а не потребление; kubelet вытесняет по факту. Из этого расхождения растут
      и `Pending` на пустом узле, и OOM при свободной памяти.
    - **Декларация против исполнения.** Объект принят ≠ механизм работает:
      Ingress без контроллера, PVC без StorageClass, HPA без metrics-server
      создаются молча и не делают ничего.
  audit: |
    - `ingress-006` и `ingress-013` обе проверяли таксономию кодов ответа.
      Вторая переформулирована в диагностический сценарий.
    - `crd-operators-003` и `packaging-gitops-014` обе объясняли `no matches for kind`.
      Вторая переписана на поведение Helm с каталогом `crds/`.
    - `cluster-networking-009` и `troubleshooting-012` обе про зависший
      `ContainerCreating`. Первая переформулирована в узловой сценарий.
    - `observability-012` и сетевая карта про среднее против перцентилей —
      сетевая переписана на джиттер.
    - `pod-security-022` и докеровская карта про подпись и SBOM — докеровская
      переписана на разбор чужого образа.
  notes: |
    **Расхождение конспекта с документацией.** `sources/k8s.md`, M4: «Нативный
    sidecar (1.36 stable)». По официальным докам — стабилен с **1.33**, доступен
    с 1.28. Карта написана по докам, конспект не тронут.

networks:
  title: Сети
  pillars: |
    - **Слои и их границы.** MAC меняется на каждом хопе, IP — нет; MTU это L3,
      MSS это L4; ISN живёт в TCP, SNI в TLS. Половина ошибок мышления —
      это спутанные слои.
    - **Ответ против тишины.** `refused` против таймаута, `NXDOMAIN` против
      отсутствия ответа, `502` против `504`. Каждая пара делит пространство причин
      пополам одним действием — это основной приём диагностики.
    - **Состояние на пути.** NAT, файрвол и балансировщик помнят соединения,
      поэтому асимметричный маршрут ломает связь при двух исправных путях,
      а переполнение таблицы даёт массовый отказ при живой сети.
    - **Имя, адрес и маршрут — три разных слоя.** Успешный резолв ничего
      не говорит о достижимости, рабочий маршрут — о разрешении имён.
  audit: |
    - `dhcp-002` и `ipv4-addressing-004` обе про значение адреса `169.254.x.x`.
      Карта DHCP переписана в сценарий «дошёл ли Offer».
    - `load-balancing-007` дублировала `load-balancing-001`: ALB против NLB —
      это L4 против L7 под именами AWS. Переписана в задачу выбора по ограничениям.
    - `cloud-vpc-009` повторяла `cloud-vpc-003`. Переписана в конкретный отказ:
      NAT Gateway, поставленный в приватную подсеть.
  notes: |
    **Раздел «мои личные грабли» из конспекта** дал самые ценные карты —
    различители, которых нет в документации: инверсия причины у скорости
    WireGuard, MASQUERADE как подвид SNAT, MTU против MSS и ISN против SNI,
    IP forwarding против port forwarding, ложная причинность «в SG нет deny,
    потому что она stateful».

    **Связки с k8s** сознательные, это не дубли: сетевые карты объясняют
    механизм, кубовые — его проявление в кластере. MTU и overlay, балансировка
    на коннект и залипание gRPC, потеря source IP, zero-trust и mTLS,
    namespace и pause-контейнер.

terraform:
  title: Terraform
  pillars: |
    - **Адрес ресурса** — связь между кодом и состоянием. Из него растёт вся боль
      рефакторинга: переименование, перенос в модуль, смена ключа `for_each` —
      для Terraform это другой ресурс.
    - **План как разница трёх источников**: конфигурация, состояние, реальность.
      Отсюда читаются и дрейф, и `forces replacement`.
    - **Состояние хранит секреты открытым текстом.** Отсюда требования к backend
      и то, что `sensitive` ничего не шифрует, а только прячет в выводе.
    - **Декларация без петли.** В отличие от Kubernetes, Terraform приводит мир
      к описанию только в момент запуска — поэтому дрейф существует как отдельное
      понятие.
  audit: |
    - `variables-outputs-009` повторяла `backends-005` про описание нескольких
      окружений. Переписана на `optional()` в типах объектов.

ansible:
  title: Ansible
  pillars: |
    - **Идемпотентность как критерий качества.** Второй прогон обязан дать
      `changed=0`. Из этого следует всё остальное: почему `command` и `shell`
      неидемпотентны, зачем `creates` и `changed_when`, почему `lineinfile` хрупок.
    - **Приоритет переменных с известными краями.** `defaults` роли ниже всего,
      `-e` выше всего. Середину не запоминают, а проверяют командой.
    - **Отсутствие состояния.** Удаление задачи из плейбука ничего не удаляет
      на сервере — прямая противоположность Terraform.
    - **Императивность.** Порядок задаёшь ты, отката не существует, промежуточное
      состояние после сбоя — норма, с которой работают через `block`/`rescue`.
  audit: |
    - `roles-007` и `roles-010` дословно повторяли `terraform-modules-005` и `-007`
      про границу абстракции и её обновление. Переписаны на специфику Ansible:
      раскладка ветвлений по дистрибутивам и имена handlers как часть публичного
      интерфейса роли.

linux:
  title: Linux
  pillars: |
    - **На чём стоят кубер и контейнеры.** PID 1 и его обязанности, namespaces
      против cgroups, что не изолировано (ядро, время, sysctl), overlayfs
      как механика образов, OOM killer и `oom_score_adj`, из которого растут
      QoS-классы.
    - **Сигналы как основа graceful shutdown.** `SIGTERM` перехватывается,
      `SIGKILL` нет — отсюда `docker stop`, `terminationGracePeriodSeconds`
      и требование к `exec` в entrypoint-скрипте.
    - **Ресурсы, которые кончаются молча.** Inode при свободном диске, файловые
      дескрипторы из-за сокетов, таблица соседей на крупных узлах, таблица
      процессов при fork-бомбе.
    - **Показатели, которые врут.** Load average с учётом iowait, `free`
      со страничным кешем, `%iowait` при занятом процессоре.
  audit: |
    - Пара `pod-security-004` (`drop: ALL`) и `permissions-003` (capabilities)
      оставлена сознательно: концепт и его применение, стимулы называют разные
      системы.

docker:
  title: Docker
  pillars: |
    - **Слои неизменяемы.** Отсюда и кеш, и экономия места, и то, что удаление
      файла в следующем слое не уменьшает образ и не прячет секрет.
    - **Тег изменчив, digest — нет.** Из этого растут невоспроизводимые сборки,
      расхождения между узлами и подмена содержимого под знакомым именем.
    - **PID 1 и форма инструкции.** Shell-форма `CMD` теряет `SIGTERM`,
      и приложение умирает жёстко — при том что манифест выглядит корректным.
    - **Изоляция обеспечивается ядром, а не виртуализацией.** Отсюда root внутри
      равен root снаружи, доступ к сокету рантайма равен root на узле,
      а `--privileged` снимает защиту целиком.
  audit: |
    - `docker-networking-002` и `networks-container-networking-003` совпадали
      на 0.93 — обе про встроенный DNS в пользовательских сетях. Весь
      `docker/networking` переписан на специфику Docker: `host.docker.internal`,
      сетевые алиасы, обход ufw при публикации порта.
    - `volumes-005` повторяла `k8s-config-secrets-009` про перекрытие каталога
      монтированием. Переписана на копирование в пустой named volume.
  notes: |
    Базовая механика контейнерных сетей — netns, veth, мост, `-p` как DNAT,
    overlay и MTU — живёт в домене `networks`, подтема `container-networking`.
    Здесь только то, что специфично для Docker как инструмента.

cicd:
  title: CI/CD
  pillars: |
    - **Артефакт собирается один раз** и переезжает по окружениям. Пересборка
      перед продом означает, что в прод едет не то, что тестировали.
    - **Job идут на разных машинах.** Отсюда artifacts, `needs` и то,
      что общей файловой системы нет.
    - **Конвейер исполняет чужой код рядом с секретами.** Отсюда
      `pull_request_target` как вектор кражи, пиннинг действий по SHA,
      OIDC вместо долгоживущих ключей, запрет self-hosted раннеров
      на публичных репозиториях.
    - **Критерий выката.** Rolling update смотрит на готовность подов, canary —
      на поведение под трафиком. Без анализа метрик canary это просто
      медленный выкат.
  audit: |
    - Три пары от 0.60 — совпадение тематических слов при разном содержании,
      правок не потребовалось.
  notes: |
    Argo CD описан как инструмент: `Application`, `Synced` против `Healthy`,
    `prune` и `selfHeal`, sync waves, `ignoreDifferences`, `ApplicationSet`,
    `AppProject`, health для CRD. Принципы GitOps — в `k8s/packaging-gitops`,
    здесь они не дублируются.
