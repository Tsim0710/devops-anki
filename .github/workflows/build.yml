name: build

on:
  push:
    branches: [main]
    paths:
      - 'cards/**'
      - 'taxonomy.yaml'
      - 'schema.json'
      - 'build.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'cards/**'
      - 'taxonomy.yaml'
      - 'schema.json'
      - 'build.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: install deps
        run: pip install -r requirements.txt

      # Жёсткий fail: карта без обязательных полей, с левым difficulty,
      # с subtopic не из словаря или с переиспользованным id колоду не покидает.
      - name: validate
        run: python build.py --validate

      - name: tests
        run: pytest tests/ -q

      - name: build apkg
        run: python build.py

      - uses: actions/upload-artifact@v4
        with:
          name: devops-apkg
          path: |
            build/devops.apkg
            build/manifest.json
          retention-days: 30

      # Релиз только по тегу — иначе через месяц в репо триста релизов.
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/devops.apkg
          generate_release_notes: true
