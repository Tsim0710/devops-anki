name: build

on:
  push:
    branches: [main]
    paths:
      - 'cards/**'
      - 'taxonomy.yaml'
      - 'schema.json'
      - 'build.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'cards/**'
      - 'taxonomy.yaml'
      - 'schema.json'
      - 'build.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

# Публикация страницы не должна наезжать сама на себя при частых пушах.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: install deps
        run: pip install -r requirements.txt

      # Жёсткий fail: карта без обязательных полей, с левым difficulty,
      # с subtopic не из словаря или с переиспользованным id колоду не покидает.
      - name: validate
        run: python build.py --validate

      - name: tests
        run: pytest tests/ -q

      - name: build apkg
        run: python build.py

      # Тренажёр на GitHub Pages: всегда последняя собранная версия, без логина.
      - name: подготовить страницу
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp build/index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

      - uses: actions/upload-artifact@v4
        with:
          name: devops-apkg
          path: |
            build/devops.apkg
            build/manifest.json
          retention-days: 30

      # Релиз только по тегу — иначе через месяц в репо триста релизов.
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/devops.apkg
          generate_release_notes: true

  # Выкладывает тренажёр на https://<owner>.github.io/devops-anki/
  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
